<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Dock: status, reply box and usage</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; box-sizing: border-box; background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 14px; line-height: 1.55">
<sc-if value="{{showNow}}" hint-placeholder-val="{{ false }}"><dc-import name="StatusBand" state="{{state}}" phone="{{phone}}" detail="{{nowDetail}}" hint-size="100%,58px"></dc-import></sc-if>
<sc-if value="{{showCrit}}" hint-placeholder-val="{{ false }}"><dc-import name="StatusBand" state="crit" phone="{{phone}}" hint-size="100%,58px"></dc-import></sc-if>

<sc-if value="{{aLine}}" hint-placeholder-val="{{ true }}">
<div role="status" aria-live="polite" style="border-top: 1px solid {{line}}; background: #0f0f0f">
<button type="button" aria-expanded="{{openStr}}" style="width: 100%; min-height: {{rowH}}; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 {{padX}}; border: 0; background: transparent; color: #fafafa; font-family: inherit; font-size: {{fs}}; line-height: 1.4; text-align: left; white-space: nowrap; cursor: pointer">
<span aria-hidden="true" style="flex: none; width: 7px; height: 7px; border-radius: {{dotRadius}}; background: {{dotColor}}"></span>
<span style="flex: none; font-weight: 700; color: {{labelColor}}">{{label}}</span>
<span aria-hidden="true" style="flex: none; color: #71717a">·</span>
<span style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; color: #a1a1aa; font-family: {{font}}; font-size: {{fsDetail}}">{{detail}}</span>
<span aria-hidden="true" style="flex: none; color: #a1a1aa">{{chev}}</span>
</button>
<sc-if value="{{aOpen}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; padding: 0 {{padX}} 10px; padding-left: calc({{padX}} + 15px); color: #d4d4d8; font-size: {{fsDetail}}; white-space: pre-line">{{full}}</p></sc-if>
</div>
</sc-if>

<div style="position: relative; padding-top: {{cPad}}">
<sc-if value="{{cChip}}" hint-placeholder-val="{{ false }}">
<button type="button" aria-expanded="{{openStr}}" aria-label="{{label}}: {{full}}" style="position: absolute; top: 14px; left: {{cLeft}}; z-index: 2; transform: translateY(-50%); height: {{hitH}}; max-width: {{chipMax}}; display: flex; align-items: center; padding: 0; border: 0; background: transparent; font-family: inherit; cursor: pointer">
<span style="min-width: 0; height: 24px; box-sizing: border-box; display: flex; align-items: center; gap: 6px; padding: 0 10px; border: 1px solid {{chipLine}}; background: #141414; color: #fafafa; font-size: 12px; line-height: 1; white-space: nowrap">
<span aria-hidden="true" style="flex: none; width: 7px; height: 7px; border-radius: {{dotRadius}}; background: {{dotColor}}"></span>
<span style="flex: none; font-weight: 700; color: {{labelColor}}">{{label}}</span>
<span aria-hidden="true" style="flex: none; color: #71717a">·</span>
<span style="min-width: 0; overflow: hidden; text-overflow: ellipsis; color: #a1a1aa; font-family: {{font}}">{{detail}}</span>
<span aria-hidden="true" style="flex: none; color: #a1a1aa">{{chev}}</span>
</span>
</button>
</sc-if>
<sc-if value="{{cOpen}}" hint-placeholder-val="{{ false }}">
<div role="dialog" aria-label="{{label}}" style="position: absolute; bottom: calc(100% - 2px); left: {{cLeft}}; z-index: 3; width: {{popW}}; box-sizing: border-box; padding: 10px 12px; border: 1px solid #2a2a2a; background: #1f1f1f; box-shadow: 0 12px 36px rgb(0 0 0 / 24%); color: #d4d4d8; font-size: 13px; white-space: pre-line">{{full}}</div>
</sc-if>

<sc-if value="{{desk}}" hint-placeholder-val="{{ true }}">
<form style="box-sizing: border-box; width: min(712px, calc(100% - 48px)); margin: 0 auto 6px; border: 1px solid #3f3f46; background: #141414">
<textarea aria-label="Message" rows="2" placeholder="Message session" style="display: block; width: 100%; min-height: 54px; box-sizing: border-box; padding: 12px 14px 4px; border: 0; outline: none; background: transparent; color: #fafafa; font-family: inherit; font-size: 14px; line-height: 1.6; resize: none"></textarea>
<div style="display: flex; align-items: center; gap: 12px; padding: 6px 8px 8px 14px; color: #a1a1aa; font-size: 11.5px">
<span>↵ Send · ⇧↵ / ⌥↵ New line · Esc Interrupt</span>
<span style="margin-left: auto">⌥↑ / ⌥↓ My messages</span>
<button type="submit" aria-label="Send message" style="width: 32px; height: 32px; display: grid; place-items: center; padding: 0; border: 0; background: #fafafa; color: #141414; opacity: 0.5"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 7-7 7 7"></path><path d="M12 19V5"></path></svg></button>
</div>
</form>
<div style="box-sizing: border-box; width: min(712px, calc(100% - 48px)); margin: 0 auto; padding-bottom: 12px; display: flex; align-items: center; gap: 10px">
<sc-if value="{{bStatus}}" hint-placeholder-val="{{ false }}">
<span role="status" aria-live="polite" title="{{full}}" style="flex: 0 1 auto; max-width: 42%; min-width: 0; display: flex; align-items: center; gap: 6px; font-size: 11.5px; line-height: 1.55; white-space: nowrap">
<span aria-hidden="true" style="flex: none; width: 7px; height: 7px; border-radius: {{dotRadius}}; background: {{dotColor}}"></span>
<span style="flex: none; font-weight: 700; color: {{labelColor}}">{{label}}</span>
<span style="min-width: 0; overflow: hidden; text-overflow: ellipsis; color: #a1a1aa; font-family: {{font}}">{{detail}}</span>
</span>
<span aria-hidden="true" style="flex: none; color: #3f3f46; font-size: 11.5px">|</span>
</sc-if>
<div style="flex: 1; min-width: 0"><dc-import name="SessionUsage" engine="claude" hint-size="100%,18px"></dc-import></div>
</div>
</sc-if>

<sc-if value="{{phoneV}}" hint-placeholder-val="{{ false }}">
<form style="display: grid; grid-template-columns: 1fr 44px; gap: 8px; padding: 10px 12px 6px; border-top: 1px solid #2a2a2a; background: #141414">
<textarea aria-label="Message" rows="1" placeholder="Message session" style="min-height: 44px; box-sizing: border-box; padding: 10px 12px; border: 1px solid #3f3f46; background: #0a0a0a; color: #fafafa; font-family: inherit; font-size: 16px; resize: none; outline: none"></textarea>
<button type="submit" aria-label="Send message" style="width: 44px; height: 44px; display: grid; place-items: center; padding: 0; border: 0; background: #fafafa; color: #141414"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 7-7 7 7"></path><path d="M12 19V5"></path></svg></button>
</form>
<div style="padding: 0 14px max(24px, env(safe-area-inset-bottom)); background: #141414">
<sc-if value="{{bStatus}}" hint-placeholder-val="{{ false }}">
<div role="status" aria-live="polite" style="display: flex; align-items: center; gap: 6px; min-height: 20px; font-size: 12px; line-height: 1.55; white-space: nowrap">
<span aria-hidden="true" style="flex: none; width: 7px; height: 7px; border-radius: {{dotRadius}}; background: {{dotColor}}"></span>
<span style="flex: none; font-weight: 700; color: {{labelColor}}">{{label}}</span>
<span aria-hidden="true" style="flex: none; color: #71717a">·</span>
<span style="min-width: 0; overflow: hidden; text-overflow: ellipsis; color: #a1a1aa; font-family: {{font}}; font-size: 11.5px">{{detail}}</span>
</div>
</sc-if>
<dc-import name="SessionUsage" engine="claude" phone="{{ true }}" hint-size="100%,36px"></dc-import>
</div>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"option":{"editor":"enum","options":["now","a","b","c"],"default":"a"},"state":{"editor":"enum","options":["working","compacting","background","crit","question","permission","waiting"],"default":"waiting"},"phone":{"editor":"boolean","default":false},"open":{"editor":"boolean","default":false},"$preview":{"width":760,"height":260}}'>
class Component extends DCLogic {
  renderVals() {
    const opt = this.props.option ?? 'a';
    const st = this.props.state ?? 'waiting';
    const phone = this.props.phone ?? false;
    const open = this.props.open ?? false;
    const mono = "'JetBrains Mono', monospace";
    const sans = 'inherit';
    const reason = 'example/app: PR 41 (設定画面の文言をそろえる + 古い翻訳キーを消す) を merge してください';
    const T = {
      working: { kind: 'low', tone: 'working', label: 'Working · 1m 12s', detail: 'Bash  cargo test -p ledger', font: mono },
      compacting: { kind: 'low', tone: 'working', label: 'Compacting…', detail: '古い会話を要約しています', font: sans },
      background: { kind: 'low', tone: 'working', label: 'Background tasks (2)', detail: 'ベンチマークを回す · 4m 10s', full: 'ベンチマークを回す · 4m 10s\n依存の更新を確かめる · 1m 02s', font: sans },
      crit: { kind: 'crit', tone: 'warning', label: 'Waiting for your review', detail: 'crit · PR #318 · 4m', font: sans },
      question: { kind: 'ask', tone: 'warning', label: 'Question', detail: '既定の保存期間は 30 日でよいですか?', font: sans },
      permission: { kind: 'ask', tone: 'warning', label: 'Permission', detail: 'Bash  pnpm run migrate', font: mono },
      waiting: { kind: 'low', tone: 'neutral', label: 'Waiting', detail: reason, font: sans }
    }[st] || {};
    const now = opt === 'now';
    const small = !now && T.kind !== 'crit';
    const warn = T.tone === 'warning';
    const deskLeft = 'max(24px, calc((100% - 712px) / 2))';
    return {
      state: st,
      phone,
      nowDetail: st === 'waiting' ? reason : '',
      showNow: now,
      showCrit: !now && T.kind === 'crit',
      aLine: small && opt === 'a',
      aOpen: opt === 'a' && T.kind === 'low' && open,
      cChip: small && opt === 'c',
      cOpen: opt === 'c' && T.kind === 'low' && open,
      cPad: small && opt === 'c' ? '14px' : '0px',
      bStatus: small && opt === 'b',
      desk: !phone,
      phoneV: phone,
      openStr: open ? 'true' : 'false',
      // ask states jump back to the card in the conversation instead of expanding.
      chev: T.kind === 'ask' ? '↑' : open ? '▾' : '›',
      label: T.label || '',
      detail: T.detail || '',
      full: T.full || T.detail || '',
      font: T.font || sans,
      line: warn ? '#fbbf24' : '#2a2a2a',
      chipLine: warn ? '#fbbf24' : '#3f3f46',
      labelColor: warn ? '#fbbf24' : '#fafafa',
      dotColor: warn ? '#fbbf24' : T.tone === 'working' ? '#60a5fa' : '#a1a1aa',
      dotRadius: T.tone === 'working' ? '50%' : '0',
      rowH: phone ? '44px' : '32px',
      padX: phone ? '12px' : deskLeft,
      fs: phone ? '14px' : '13px',
      fsDetail: phone ? '12.5px' : '12px',
      cLeft: phone ? '8px' : `calc(${deskLeft} + 8px)`,
      hitH: phone ? '44px' : '28px',
      chipMax: phone ? 'calc(100% - 16px)' : '440px',
      popW: phone ? 'calc(100% - 16px)' : '440px'
    };
  }
}
</script>
</body>
</html>
