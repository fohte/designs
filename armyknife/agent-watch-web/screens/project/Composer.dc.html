<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Composer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<form aria-label="{{formLabel}}" style="{{root}}">
<div style="{{boxStyle}}">
<sc-if value="{{hasImages}}" hint-placeholder-val="{{ false }}"><ul aria-label="Attachments" style="{{listStyle}}"><sc-for list="{{imgs}}" as="i" hint-placeholder-count="1"><li style="position: relative; flex: none"><svg width="{{thumb}}" height="{{thumb}}" viewBox="0 0 64 64" role="img" aria-label="{{i.name}}" style="display: block; outline: 1px solid #3f3f46; outline-offset: -1px"><rect width="64" height="64" fill="#27272a"></rect><rect x="8" y="10" width="48" height="5" fill="#71717a"></rect><rect x="8" y="22" width="34" height="4" fill="#52525b"></rect><rect x="8" y="31" width="42" height="4" fill="#52525b"></rect><rect x="8" y="44" width="20" height="9" fill="#a1a1aa"></rect></svg><button type="button" aria-label="Remove {{i.name}}" style="{{xStyle}}"><span aria-hidden="true" style="{{xFace}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></span></button></li></sc-for></ul></sc-if>
<sc-if value="{{isField}}" hint-placeholder-val="{{ true }}"><textarea aria-label="Message" placeholder="{{placeholder}}" value="{{msg}}" style="{{taStyle}}"></textarea></sc-if>
<sc-if value="{{isCombo}}" hint-placeholder-val="{{ false }}"><div style="{{comboRow}}"><sc-if value="{{cmd}}" hint-placeholder-val="{{ false }}"><span style="flex: none; height: 24px; display: inline-flex; align-items: center; padding: 0 8px; background: #2a2a2e; font-size: 12px">› New session</span></sc-if><sc-if value="{{hasDir}}" hint-placeholder-val="{{ true }}"><span style="flex: none; max-width: 100%; height: 24px; box-sizing: border-box; display: inline-flex; align-items: center; gap: 6px; padding: 0 8px; background: #2a2a2e; font-family: 'JetBrains Mono', monospace; font-size: 12px; white-space: nowrap"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"></path></svg>{{dir}}</span></sc-if><span role="combobox" aria-label="{{fieldLabel}}" aria-expanded="true" style="flex: 1 1 160px; min-width: 0"><span style="{{comboText}}">{{msg}}</span><span aria-hidden="true" style="display: inline-block; width: 1px; height: 18px; margin-left: 1px; vertical-align: -3px; background: #fafafa"></span></span></div></sc-if>
<div style="display: flex; align-items: center; gap: 8px">
<button type="button" aria-label="Attach files" title="Attach files" style="{{plusStyle}}"><svg width="{{icon}}" height="{{icon}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></button>
<span style="flex: 1 1 0; min-width: 0; padding-left: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{hint}}</span>
<sc-if value="{{hasHint2}}" hint-placeholder-val="{{ false }}"><span style="flex: none">{{hint2}}</span></sc-if>
<sc-if value="{{sendOn}}" hint-placeholder-val="{{ true }}"><button type="submit" aria-label="{{sendLabel}}" style="{{sendStyle}}"><svg width="{{icon}}" height="{{icon}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 7-7 7 7"></path><path d="M12 19V5"></path></svg></button></sc-if><sc-if value="{{sendOff}}" hint-placeholder-val="{{ false }}"><button type="submit" disabled aria-label="{{sendLabel}}" style="{{sendStyle}}"><svg width="{{icon}}" height="{{icon}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 7-7 7 7"></path><path d="M12 19V5"></path></svg></button></sc-if>
</div>
</div>
<sc-if value="{{hasStatus}}" hint-placeholder-val="{{ false }}"><p role="status" style="{{statusStyle}}">{{status}}</p></sc-if>
</form>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"form":{"editor":"enum","options":["pc","phone"],"default":"pc"},"place":{"editor":"enum","options":["conversation","new"],"default":"conversation"},"cmd":{"editor":"boolean","default":false},"dir":{"editor":"text","default":"example/notification-service"},"fieldLabel":{"editor":null},"images":{"editor":"int","default":1},"msg":{"editor":"text","default":"この画面の通知の文言を直して"},"placeholder":{"editor":"text","default":"Message the session"},"rows":{"editor":"int","default":2},"send":{"editor":"enum","options":["on","dim","off"],"default":"on"},"hint":{"editor":"text","default":""},"hint2":{"editor":"text","default":""},"status":{"editor":"text","default":""},"$preview":{"width":712,"height":200}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const phone = (p.form ?? 'pc') === 'phone';
    const conv = (p.place ?? 'conversation') === 'conversation';
    const n = Number(p.images ?? 1);
    const msg = p.msg ?? 'この画面の通知の文言を直して';
    // send: on = can send; dim = nothing to send yet, or the session is starting; off = a new session without a directory.
    const send = p.send ?? 'on';
    const status = p.status ?? '';
    const hint = phone ? '' : (p.hint ?? '');
    const hint2 = phone ? '' : (p.hint2 ?? '');
    const btn = phone ? 44 : 36;
    const lh = phone ? 24 : 22;
    const rows = Number(p.rows ?? 2);
    const dir = p.dir ?? 'example/notification-service';
    return {
      formLabel: conv ? 'Message' : 'First message',
      fieldLabel: p.fieldLabel ?? 'First message',
      root: "position: relative; box-sizing: border-box; margin: 0; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; line-height: 1.55",
      boxStyle: 'box-sizing: border-box; display: flex; flex-direction: column; gap: ' + (phone ? '6px' : '4px') + '; padding: ' + (phone ? '12px 8px 8px' : '14px 10px 10px') + '; border: 1px solid #3f3f46; background: #141414; color: #a1a1aa; font-size: 11.5px',
      hasImages: n > 0,
      imgs: Array.from({ length: n }, (_, i) => ({ name: 'screenshot-' + (i + 1) + '.png' })),
      listStyle: 'display: flex; flex-wrap: wrap; gap: 12px; margin: 0; padding: 4px 6px; list-style: none',
      thumb: phone ? '72' : '64',
      // The × sits on the thumbnail's top-right corner; on iPhone its 44px target reaches past the 24px face.
      xStyle: 'position: absolute; top: ' + (phone ? '-15px' : '-5px') + '; right: ' + (phone ? '-15px' : '-5px') + '; width: ' + (phone ? '44px' : '24px') + '; height: ' + (phone ? '44px' : '24px') + '; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #0a0a0a',
      xFace: 'width: 24px; height: 24px; box-sizing: border-box; display: grid; place-items: center; border: 2px solid #141414; background: #fafafa',
      isField: conv,
      isCombo: !conv,
      placeholder: p.placeholder ?? 'Message the session',
      msg,
      taStyle: 'display: block; width: 100%; height: ' + (rows * lh + 8) + 'px; box-sizing: border-box; padding: 4px 8px; border: 0; outline: none; background: transparent; color: #fafafa; font-family: inherit; font-size: ' + (phone ? '16px' : '14px') + '; line-height: ' + lh + 'px; resize: none; white-space: pre-wrap',
      comboRow: 'min-height: ' + (phone ? '40px' : '36px') + '; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 2px 8px; color: #fafafa',
      cmd: p.cmd ?? false,
      hasDir: !!dir,
      dir,
      comboText: 'white-space: pre-wrap; overflow-wrap: anywhere; font-size: ' + (phone ? '16px' : '15px') + (msg ? '' : '; color: #71717a'),
      icon: phone ? '22' : '18',
      plusStyle: 'flex: none; width: ' + btn + 'px; height: ' + btn + 'px; display: grid; place-items: center; padding: 0; border: 0; background: #2a2a2e; color: #d4d4d8',
      hint,
      hasHint2: !!hint2,
      hint2,
      sendLabel: conv ? 'Send message' : 'Start session',
      sendOn: send !== 'off',
      sendOff: send === 'off',
      sendStyle: 'flex: none; width: ' + btn + 'px; height: ' + btn + 'px; display: grid; place-items: center; padding: 0; border: 0; ' + (send === 'off' ? 'background: #2a2a2e; color: #71717a' : 'background: #fafafa; color: #0a0a0a; opacity: ' + (send === 'dim' ? '0.5' : '1')),
      hasStatus: !!status,
      status,
      statusStyle: 'margin: 6px 0 0; font-size: ' + (phone ? '12.5px' : '11.5px') + '; color: #8b8b94; text-align: ' + (phone ? 'center' : 'right')
    };
  }
}
</script>
</body>
</html>
