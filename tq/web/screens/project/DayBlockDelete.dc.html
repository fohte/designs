<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Day view, delete time block confirmation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #0a0a0a; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif">
<dc-import name="DayDesktop" view="week" connected="true" popover="preview" hint-size="1440px,900px"></dc-import>
<div style="position: absolute; inset: 0; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px)"></div>
<div role="alertdialog" aria-labelledby="delete-block-title" aria-describedby="delete-block-desc" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 384px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; padding: 16px; background: #0a0a0a; box-shadow: 0 0 0 1px rgba(250, 250, 250, 0.1); font-size: 14px; line-height: 20px; color: #fafafa">
<div style="display: flex; flex-direction: column; gap: 8px">
<h2 id="delete-block-title" style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 500">Delete time block</h2>
<p id="delete-block-desc" style="margin: 0; color: #71717a">Are you sure you want to delete this time block? This action cannot be undone.</p>
</div>
<div style="margin: 0 -16px -16px; display: flex; justify-content: flex-end; gap: 8px; padding: 16px; border-top: 1px solid #2a2a2a; background: rgba(20, 20, 20, 0.5)">
<button type="button" style="height: 32px; padding: 0 10px; border: 1px solid #2a2a2a; background: #0a0a0a; color: #fafafa; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 500">Cancel</button>
<button type="button" style="height: 32px; padding: 0 10px; border: 1px solid #2a2a2a; background: transparent; color: #a1a1aa; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 500">Delete</button>
</div>
<button type="button" aria-label="Close" style="position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #fafafa"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
