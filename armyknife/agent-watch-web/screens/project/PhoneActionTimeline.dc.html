<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Phone: result lines in the timeline</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; background: #0a0a0a">
<dc-import name="PhoneChat" state="code" merge-state="merged" timeline="{{ timeline }}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      timeline: [
        { line: { result: 'merged', pr: 2050, time: '12:03' } },
        { you: '続けて、再送の上限を設定ファイルで変えられるようにして。', time: '12:05' },
        { text: '上限を retry.limit から読むようにして PR #2052 を作りました。' },
        { line: { result: 'merged', pr: 2052, time: '12:31' } },
        { you: 'ありがとう。失敗したときのログも見ておいて。', time: '12:34' },
        { text: '失敗したときのログを見ています。' }
      ]
    };
  }
}
</script>
</body>
</html>
