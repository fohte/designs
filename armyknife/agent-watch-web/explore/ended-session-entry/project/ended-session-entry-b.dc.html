<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Ended session entry · b</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; overflow: hidden; background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif">
<div style="flex: none; width: 240px"><dc-import name="Nav" view="inbox" hint-size="240px,900px"></dc-import></div>
<div style="flex: none; width: 460px; border-right: 1px solid #2a2a2a"><dc-import name="InboxList" filter="none" current="{{current}}" hint-size="460px,900px"></dc-import></div>
<section aria-label="Conversation with 通知の再送処理を見直す" style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<header style="flex: none; padding: 14px 24px 0; border-bottom: 1px solid #2a2a2a">
<div style="font-size: 12px; color: #8b8b94"><span style="font-family: 'JetBrains Mono', monospace">claude</span> · <span style="font-family: 'JetBrains Mono', monospace">P1 #2048</span> 通知の信頼性を上げる · <span style="font-family: 'JetBrains Mono', monospace">example/service</span></div>
<h1 style="margin: 2px 0 12px; font-size: 16px; font-weight: 700">通知の再送処理を見直す</h1>
</header>
<div style="flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end; padding-bottom: 120px"><dc-import name="MentionThread" phone="{{ false }}" hover="{{ true }}" hint-size="100%,560px"></dc-import></div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return { current: 0 }; }
}
</script>
</body>
</html>
