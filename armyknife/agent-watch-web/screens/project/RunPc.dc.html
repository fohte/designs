<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Run command on PC</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; display: flex; overflow: hidden; background: #0a0a0a; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif">
<div style="flex: none; width: 240px"><dc-import name="Nav" view="inbox" activity="{{ activity }}" activity-open="{{ open }}" hint-size="240px,900px"></dc-import></div>
<div style="flex: none; width: 460px; border-right: 1px solid #2a2a2a"><dc-import name="InboxList" filter="none" current="{{ one }}" hint-size="460px,900px"></dc-import></div>
<div style="flex: 1; min-width: 0"><dc-import name="Conversation" variant="review" bang="{{ bang }}" bang-highlight="{{ highlight }}" action-line="{{ line }}" hint-size="100%,900px"></dc-import></div>
<sc-if value="{{hasToast}}" hint-placeholder-val="{{ true }}"><div style="position: absolute; z-index: 10; left: 16px; bottom: 16px; width: 360px"><dc-import name="ToastStack" items="{{ toasts }}" hint-size="100%,150px"></dc-import></div></sc-if>
<sc-if value="{{open}}" hint-placeholder-val="{{ false }}"><div style="position: absolute; z-index: 10; left: 248px; bottom: 148px; width: 400px"><dc-import name="Activity" items="{{ rows }}" hint-size="100%,520px"></dc-import></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["running","succeeded","failed","timedOut","output","activity"],"default":"running"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    // output: Show output was pressed; the toast is gone and the result message is outlined.
    const state = this.props.state ?? 'running';
    const cmd = 'a agent todo add --title "差分を crit で見る"';
    const session = '配信チェックの PR を確認する';
    const result = { running: 'running', succeeded: 'succeeded', timedOut: 'timedOut' }[state] ?? 'commandFailed';
    const main = { result, cmd, session, exit: 1 };
    const rows = [
      { result: 'running', cmd: 'a agent proposal add --title "通知の文言を選ぶ"', session: '通知の文言を決める', time: '12:05' },
      { result: 'timedOut', cmd: 'a agent todo add --title "実機で音を確かめる"', session: '通知の音を選べるようにする', time: '12:04' },
      { ...main, time: '12:03' },
      { result: 'succeeded', cmd: 'a agent todo add --title "ログの保存期間を決める"', session: '配信ログの保存期間を決める', time: '12:01' }
    ];
    const open = state === 'activity';
    const tone = state === 'running' ? 'running' : state === 'succeeded' ? 'idle' : 'failure';
    return {
      one: 1, open,
      bang: { activity: 'failed', output: 'failed' }[state] ?? state,
      highlight: state === 'output',
      activity: open ? { count: '2', tone: 'failure' } : { count: tone === 'idle' ? '' : '1', tone },
      line: { ...main, time: state === 'running' ? '' : '12:03' },
      hasToast: !open && state !== 'output', toasts: [main],
      rows
    };
  }
}
</script>
</body>
</html>
