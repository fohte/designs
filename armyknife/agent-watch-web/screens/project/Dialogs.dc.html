<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Confirmation dialogs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: grid; grid-template-columns: 1fr 1fr; background: rgba(0, 0, 0, 0.55); color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 14px; line-height: 1.55">

<div style="display: grid; place-items: center; padding: 16px; background: #050505">
<div style="width: min(100%, 34rem)"><dc-import name="ConfirmDialog" form="panel" head="Run agent command?" body="Review the command and working directory before it runs." action="Run command" details="{{ bangDetails }}" hint-size="100%,330px"></dc-import></div>
</div>

<div style="display: grid; place-items: center; padding: 16px; background: #050505; border-left: 1px solid #2a2a2a">
<div style="width: min(100%, 320px)"><dc-import name="ConfirmDialog" form="modal" head="Merge this pull request?" body="Merge PR #2049 using the confirmed head commit?" code="3f9c2a1e8b7d4c6f0a5e9d2b1c8f7a6e5d4c3b2a" action="Confirm merge" hint-size="100%,160px"></dc-import></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      bangDetails: [
        { term: 'Working directory', value: '~/src/example/service' },
        { term: 'Command', value: 'cargo test -p service\ncargo clippy', block: true }
      ]
    };
  }
}
</script>
</body>
</html>
