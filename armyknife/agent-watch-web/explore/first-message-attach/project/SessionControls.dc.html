<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>SessionControls</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="{{rootStyle}}">
<button type="button" aria-haspopup="menu" style="{{btn}}">Claude Code ▾</button>
<button type="button" aria-haspopup="dialog" aria-label="Model and reasoning effort" aria-expanded="false" style="{{btn}}"><sc-if value="{{icon}}" hint-placeholder-val="{{ true }}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="16" height="16" x="4" y="4" rx="2"></rect><rect width="6" height="6" x="9" y="9" rx="1"></rect><path d="M15 2v2"></path><path d="M15 20v2"></path><path d="M2 15h2"></path><path d="M2 9h2"></path><path d="M20 15h2"></path><path d="M20 9h2"></path><path d="M9 2v2"></path><path d="M9 20v2"></path></svg></sc-if><span style="color: #a1a1aa">atlas-5</span><span aria-hidden="true" style="color: #71717a">·</span><span style="color: #a1a1aa">high</span><span style="font-size: 11px; color: #8b8b94">default</span> ▾</button>
<button type="button" aria-pressed="{{worktree}}" style="{{wtBtn}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="6" x2="6" y1="3" y2="15"></line><circle cx="18" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><path d="M18 9a9 9 0 0 1-9 9"></path></svg> New worktree</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"form":{"editor":"enum","options":["pc","phone"],"default":"pc"},"worktree":{"editor":"boolean","default":false},"wrap":{"editor":"boolean","default":true},"icon":{"editor":"boolean","default":false},"chip":{"editor":"boolean","default":false},"pad":{"editor":"text","default":"0"},"$preview":{"width":420,"height":44}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const phone = (p.form ?? 'pc') === 'phone';
    const wrap = p.wrap ?? true;
    const worktree = p.worktree ?? false;
    // Phone controls are 44px tall: they are touch targets.
    // chip: small rounded pills that match the rounded composer box of 1-1 B.
    const chip = p.chip ?? false;
    const btn = chip
      ? 'flex: none; height: ' + (phone ? '44px' : '28px') + '; display: inline-flex; align-items: center; gap: 6px; padding: 0 ' + (phone ? '14px' : '11px') + '; border: 1px solid #2a2a2a; border-radius: 999px; background: #1f1f1f; color: #d4d4d8; font-family: inherit; font-size: ' + (phone ? '13px' : '12px') + '; white-space: nowrap'
      : 'flex: none; height: ' + (phone ? '44px' : '30px') + '; display: inline-flex; align-items: center; gap: 6px; padding: 0 ' + (phone ? '12px' : '10px') + '; border: 1px solid #3f3f46; background: transparent; color: #fafafa; font-family: inherit; font-size: ' + (phone ? '14px' : '12.5px') + '; white-space: nowrap';
    return {
      // icon: show the model's chip icon on phone too.
      icon: !phone || (p.icon ?? false),
      worktree,
      // pad: inline padding inside the scroll area, so a row pulled out to the screen edges still starts aligned with the content.
      rootStyle: "font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; color: #fafafa; line-height: 1.55; display: flex;" + ' flex-wrap: ' + (wrap ? 'wrap' : 'nowrap') + '; align-items: center; gap: 6px; min-width: 0' + (wrap ? '' : '; overflow-x: auto; scrollbar-width: none; padding: 0 ' + (p.pad ?? '0')),
      btn,
      wtBtn: btn + (worktree ? '; border-color: #60a5fa; color: #60a5fa' + (chip ? '; background: rgb(96 165 250 / 12%)' : '') : '')
    };
  }
}
</script>
</body>
</html>
