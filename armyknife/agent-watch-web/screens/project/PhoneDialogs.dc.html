<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Phone: confirmation dialogs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 673px; box-sizing: border-box; display: flex; flex-direction: column; background: #050505; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 15px; line-height: 1.55">

<div style="display: flex; flex-direction: column; justify-content: flex-end; padding-top: 64px; background: rgba(0, 0, 0, 0.55)">
<dc-import name="ConfirmDialog" form="sheet" head="Run agent command?" body="Review the command and working directory before it runs." action="Run command" details="{{ bangDetails }}" hint-size="100%,380px"></dc-import>
</div>

<div style="display: flex; flex-direction: column; justify-content: flex-end; padding-top: 64px; border-top: 1px solid #2a2a2a; background: rgba(0, 0, 0, 0.55)">
<dc-import name="ConfirmDialog" form="sheet" head="Merge this pull request?" body="Merge PR #2049 using the confirmed head commit?" code="3f9c2a1e8b7d4c6f0a5e9d2b1c8f7a6e5d4c3b2a" action="Confirm merge" hint-size="100%,220px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":673}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      bangDetails: [
        { term: 'Working directory', value: '~/src/example/service' },
        { term: 'Command', value: 'cargo test -p service\ncargo clippy', block: true }
      ]
    };
  }
}
</script>
</body>
</html>
