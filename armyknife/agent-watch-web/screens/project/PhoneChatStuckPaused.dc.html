<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Phone: paused session resumed by a message hasn't started</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; background: #0a0a0a">
<dc-import name="PhoneChat" state="review" stuck="closed" timeline="{{ timeline }}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      timeline: [{ you: '再送の上限を 5 回にして、PR の説明にも書いておいて。', time: '14:40' }]
    };
  }
}
</script>
</body>
</html>
