<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Desktop, every state</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<section style="width: 1640px; height: 1600px; box-sizing: border-box; padding: 32px 40px; overflow: hidden; background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 14px; line-height: 1.55">
<h1 style="margin: 0; font-size: 18px; font-weight: 700">{{heading}}</h1>
<p style="margin: 6px 0 0; color: #a1a1aa; font-size: 13px">Each frame is the bottom 300px of the conversation column, so the space the status takes shows as lost conversation.</p>
<div style="display: grid; grid-template-columns: 760px 760px; gap: 32px 40px; margin-top: 24px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
<div style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-size: 13px; font-weight: 700">{{r.title}}</h2>
<dc-import name="Desk" option="{{option}}" state="{{r.key}}" hint-size="760px,300px"></dc-import>
</div>
</sc-for>
</div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"option":{"editor":"enum","options":["now","a","b","c"],"default":"a"},"$preview":{"width":1640,"height":1600}}'>
class Component extends DCLogic {
  renderVals() {
    const option = this.props.option ?? 'a';
    const heading = {
      now: 'Current · desktop',
      a: 'A · one-line band · desktop',
      b: 'B · status in the usage line · desktop',
      c: 'C · chip on the reply box · desktop'
    }[option];
    return {
      option,
      heading,
      rows: [
        { key: 'working', title: 'Working' },
        { key: 'compacting', title: 'Compacting' },
        { key: 'background', title: 'Background tasks' },
        { key: 'crit', title: 'Review in crit' },
        { key: 'question', title: 'Question' },
        { key: 'permission', title: 'Permission' },
        { key: 'waiting', title: 'Other waiting (reason from the session)' }
      ]
    };
  }
}
</script>
</body>
</html>
