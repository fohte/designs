<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Agent session indicator and rows</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 720px; height: 300px; box-sizing: border-box; display: flex; align-items: flex-start; gap: 32px; padding: 24px; background: #0a0a0a; color: #fafafa; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace">

<div style="flex: none; display: flex; flex-direction: column; gap: 16px; font-size: 10px; line-height: 14px; color: #52525b">
<div>SessionIndicator</div>
<div style="display: flex; align-items: center; gap: 8px">
<span tabindex="0" role="img" aria-label="Agent session active" style="position: relative; width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; color: #ef4444"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8V4H8"></path><rect width="16" height="12" x="4" y="8" rx="2"></rect><path d="M2 14h2"></path><path d="M20 14h2"></path><path d="M15 13v2"></path><path d="M9 13v2"></path></svg><span style="position: absolute; right: 0; bottom: 0; display: flex; padding: 1px; background: #0a0a0a"><svg width="8" height="8" viewBox="0 0 24 24" fill="#ef4444" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"></polygon></svg></span></span>
<span>active</span>
</div>
<div style="display: flex; align-items: center; gap: 8px">
<span tabindex="0" role="img" aria-label="Agent sessions ended" style="position: relative; width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; color: #71717a"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8V4H8"></path><rect width="16" height="12" x="4" y="8" rx="2"></rect><path d="M2 14h2"></path><path d="M20 14h2"></path><path d="M15 13v2"></path><path d="M9 13v2"></path></svg><span style="position: absolute; right: 0; bottom: 0; display: flex; padding: 1px; background: #0a0a0a"><svg width="8" height="8" viewBox="0 0 24 24" fill="none" stroke="#71717a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"></rect></svg></span></span>
<span>none active</span>
</div>
</div>

<div style="flex: none; display: flex; flex-direction: column; gap: 8px">
<div style="font-size: 10px; line-height: 14px; color: #52525b">hover / focus → preview card</div>
<div style="width: 448px; box-sizing: border-box; background: #0a0a0a; box-shadow: 0 0 0 1px rgba(250, 250, 250, 0.1); font-size: 14px">
<div style="padding: 6px 12px; border-bottom: 1px solid #2a2a2a; font-size: 10px; line-height: 14px; letter-spacing: 0.1em; color: #52525b">SESSIONS (3)</div>

<div style="display: flex; align-items: center; gap: 8px; padding: 4px 14px; border-bottom: 1px solid #2a2a2a">
<span aria-hidden="true" style="flex: none; width: 8px; height: 8px; border-radius: 9999px; background: #ef4444"></span>
<div style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px">
<div style="flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
<span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; line-height: 16px; color: #fafafa">~/work/sample-app</span>
<div style="flex: 1; min-width: 0; font-size: 12px; line-height: 16px; color: #71717a"><button type="button" style="width: 100%; min-height: 32px; display: flex; align-items: center; padding: 6px 4px; margin: 0 -4px; border: 0; border-bottom: 1px solid transparent; background: transparent; color: inherit; font: inherit; text-align: left; cursor: text"><span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">テストの失敗を直す</span></button></div>
<span style="flex: none; height: 16px; box-sizing: border-box; display: inline-flex; align-items: center; padding: 0 4px; border: 1px solid #2a2a2a; color: #71717a; font-size: 10px; line-height: 14px">work</span>
</div>
<span style="flex: none; margin-left: auto; font-size: 12px; line-height: 16px; color: #71717a">5m ago</span>
<span style="flex: none; font-size: 12px; line-height: 16px; color: #71717a">45m</span>
</div>
<button type="button" aria-label="Focus session" title="Open: hammerspoon://cc-focus?session=…" style="flex: none; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; padding: 0; border: 0; background: transparent; color: #71717a"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" x2="20" y1="19" y2="19"></line></svg></button>
</div>

<div style="display: flex; align-items: center; gap: 8px; padding: 4px 14px; border-bottom: 1px solid #2a2a2a">
<span aria-hidden="true" style="flex: none; width: 8px; height: 8px; box-sizing: border-box; border-radius: 9999px; border: 1px solid #71717a"></span>
<div style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px">
<div style="flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
<span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; line-height: 16px; color: #fafafa">~/work/sample-app</span>
<div style="flex: 1; min-width: 0; font-size: 12px; line-height: 16px; color: #52525b"><button type="button" style="width: 100%; min-height: 32px; display: flex; align-items: center; padding: 6px 4px; margin: 0 -4px; border: 0; border-bottom: 1px solid transparent; background: transparent; color: inherit; font: inherit; text-align: left; cursor: text"><span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">no label</span></button></div>
<span style="flex: none; height: 16px; box-sizing: border-box; display: inline-flex; align-items: center; padding: 0 4px; border: 1px solid #2a2a2a; color: #71717a; font-size: 10px; line-height: 14px">work</span>
</div>
<span style="flex: none; margin-left: auto; font-size: 12px; line-height: 16px; color: #71717a">2h ago</span>
<span style="flex: none; font-size: 12px; line-height: 16px; color: #71717a">1h20m</span>
</div>
<button type="button" aria-label="Resume session" title="Copied" style="flex: none; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; padding: 0; border: 0; background: transparent; color: #71717a"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></button>
</div>

<div style="display: flex; align-items: center; gap: 8px; padding: 4px 14px; border-bottom: 1px solid #2a2a2a">
<span aria-hidden="true" style="flex: none; width: 8px; height: 8px; box-sizing: border-box; border-radius: 9999px; border: 1px solid #71717a"></span>
<div style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; opacity: 0.55">
<div style="flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
<span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; line-height: 16px; color: #fafafa">~/src/blog</span>
<div style="flex: 1; min-width: 0; font-size: 12px; line-height: 16px; color: #71717a"><button type="button" style="width: 100%; min-height: 32px; display: flex; align-items: center; padding: 6px 4px; margin: 0 -4px; border: 0; border-bottom: 1px solid transparent; background: transparent; color: inherit; font: inherit; text-align: left; cursor: text"><span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">記事の下書きを整える</span></button></div>
<span style="flex: none; height: 16px; box-sizing: border-box; display: inline-flex; align-items: center; padding: 0 4px; border: 1px solid #2a2a2a; color: #71717a; font-size: 10px; line-height: 14px">personal</span>
</div>
<span style="flex: none; margin-left: auto; font-size: 12px; line-height: 16px; color: #71717a">3d ago</span>
<span style="flex: none; font-size: 12px; line-height: 16px; color: #71717a">30m</span>
</div>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":720,"height":300}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
