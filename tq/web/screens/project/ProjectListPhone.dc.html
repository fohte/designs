<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Projects, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif">
<main style="flex: 1; min-height: 0; overflow-y: auto">

<div style="height: 40px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 1px solid #2a2a2a; background: #0a0a0a">
<h2 style="margin: 0; display: inline-flex; align-items: baseline; gap: 8px; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px"><span aria-hidden="true" style="font-weight: 700; color: #ef4444">##</span><span style="font-weight: 500; color: #fafafa">projects</span></h2>
<div role="group" aria-label="Project filter" style="margin-left: 10px; display: inline-flex; padding: 2px; border: 1px solid #2a2a2a; background: #141414">
<button type="button" aria-pressed="{{activeOn}}" style="padding: 4px 10px; border: 0; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 12px; line-height: 16px; font-weight: 500; {{activeStyle}}">active</button>
<button type="button" aria-pressed="{{allOn}}" style="padding: 4px 10px; border: 0; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 12px; line-height: 16px; font-weight: 500; {{allStyle}}">all</button>
</div>
<a href="ProjectFormModalPhone.dc.html" style="margin-left: auto; height: 24px; box-sizing: border-box; display: inline-flex; align-items: center; padding: 0 8px; border: 1px solid #71717a; background: #1f1f1f; color: #fafafa; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500; text-decoration: none; white-space: nowrap">+ new</a>
</div>

<sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
<sc-if value="{{r.linked}}" hint-placeholder-val="{{true}}">
<a href="ProjectDetailPhone.dc.html" style="display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-bottom: 1px solid #2a2a2a; color: inherit; text-decoration: none">
<span style="display: flex; align-items: center; gap: 8px">
<span aria-hidden="true" style="flex: none; width: 7px; height: 7px; box-sizing: border-box; {{r.mark}}"></span>
<span style="font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 14px; line-height: 20px; font-weight: 500; color: #fafafa">{{r.title}}</span>
<span style="flex: none; display: inline-flex; align-items: center; padding: 2px 6px; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px; {{r.chip}}">{{r.status}}</span>
<span style="margin-left: auto; flex: none; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px; color: #71717a">{{r.count}}</span>
</span>
<span style="display: block; height: 2px; background: #1f1f1f"><span style="display: block; height: 100%; width: {{r.pct}}; background: {{r.fill}}"></span></span>
</a>
</sc-if>
<sc-if value="{{r.plain}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-bottom: 1px solid #2a2a2a; color: inherit; text-decoration: none">
<span style="display: flex; align-items: center; gap: 8px">
<span aria-hidden="true" style="flex: none; width: 7px; height: 7px; box-sizing: border-box; {{r.mark}}"></span>
<span style="font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 14px; line-height: 20px; font-weight: 500; color: #fafafa">{{r.title}}</span>
<span style="flex: none; display: inline-flex; align-items: center; padding: 2px 6px; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px; {{r.chip}}">{{r.status}}</span>
<span style="margin-left: auto; flex: none; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px; color: #71717a">{{r.count}}</span>
</span>
<span style="display: block; height: 2px; background: #1f1f1f"><span style="display: block; height: 100%; width: {{r.pct}}; background: {{r.fill}}"></span></span>
</div>
</sc-if>
</sc-for>

</main>
<dc-import name="TabBar" view="none" hint-size="100%,53px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"filter":{"editor":"enum","options":["all","active"],"default":"all"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const filter = this.props.filter ?? 'all';
    const on = 'background: #0a0a0a; color: #fafafa';
    const off = 'background: transparent; color: #71717a';
    const marks = {
      active: 'background: #fafafa',
      completed: 'background: #52525b',
      paused: 'border: 1px solid #71717a',
      archived: 'border: 1px solid #71717a'
    };
    const all = [
      ['庭のリフォーム', 'active', 3, 8],
      ['確定申告の準備', 'paused', 0, 4],
      ['キッチン改装', 'completed', 12, 12],
      ['旧ブログの移行', 'archived', 5, 9],
      ['英語の学び直し', 'active', 7, 20],
      ['写真の整理', 'active', 14, 16],
      ['引っ越し', 'active', 0, 0]
    ];
    const rows = all
      .filter((p) => filter === 'all' || p[1] === 'active')
      .map(([title, status, done, total]) => ({
        title, status,
        // The detail screen depicts only this project.
        linked: title === '庭のリフォーム', plain: title !== '庭のリフォーム',
        mark: marks[status],
        chip: status === 'active' ? 'border: 1px solid #71717a; color: #fafafa' : 'border: 1px solid #2a2a2a; color: #52525b',
        fill: status === 'active' ? '#fafafa' : '#71717a',
        pct: (total === 0 ? 0 : Math.round(done / total * 100)) + '%',
        count: done + '/' + total
      }));
    return {
      rows,
      activeOn: filter === 'active' ? 'true' : 'false',
      allOn: filter === 'all' ? 'true' : 'false',
      activeStyle: filter === 'active' ? on : off,
      allStyle: filter === 'all' ? on : off
    };
  }
}
</script>
</body>
</html>
