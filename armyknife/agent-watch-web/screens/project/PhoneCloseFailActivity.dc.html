<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Phone: close failed in Activity</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; background: #0a0a0a">
<dc-import name="PhoneDrawer" activity="{{ activity }}" activity-open="{{ true }}" activity-items="{{ items }}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const checks = { path: '~/src/example/service/.worktrees/retry-backoff', files: ['src/retry.ts', 'src/retry.test.ts', 'src/backoff.ts', 'src/config.ts'], branch: 'feature/retry-backoff', merged: false, reason: 'PR #64 is still open', processes: ['48213 node'] };
    return {
      activity: { count: '1', tone: 'failure' },
      items: [
        { result: 'closeFailed', session: '通知の再送処理を見直す', checks, time: '12:03' },
        { result: 'merged', pr: 2041, session: '再送のログを整える', time: '11:40' }
      ]
    };
  }
}
</script>
</body>
</html>
