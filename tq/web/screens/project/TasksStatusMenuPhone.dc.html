<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Tasks status filter as a bottom sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: #0a0a0a; color: #fafafa; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace">
<dc-import name="TasksPhone" hint-size="390px,844px"></dc-import>
<div style="position: absolute; inset: 0; z-index: 50; background: rgba(0,0,0,.4); backdrop-filter: blur(4px)"></div>
<div role="dialog" aria-label="Status" style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 51; max-height: 85%; overflow-y: auto; padding-bottom: 20px; background: #141414; box-shadow: 0 25px 50px -12px rgba(0,0,0,.25), 0 0 0 1px #222222">
<div style="position: sticky; top: 0; height: 48px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #2a2a2a; background: #141414">
<span style="font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif; font-size: 16px; line-height: 24px; font-weight: 600; color: #fafafa">Status</span>
<button type="button" aria-label="Close" style="width: 28px; height: 28px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #fafafa"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
</div>
<div style="display: flex; flex-direction: column; gap: 20px; padding: 16px 16px 0">
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 8px"><span style="position: relative; width: 16px; height: 16px; flex: none"><input id="smp-status-todo" type="checkbox" checked="{{ true }}" onChange="{{noop}}" style="appearance: none; position: absolute; inset: 0; margin: 0; border: 1px solid #ef4444; background: #ef4444"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 1px; top: 1px; pointer-events: none"><path d="M20 6 9 17l-5-5"></path></svg></span><label for="smp-status-todo" style="font-size: 14px; line-height: 20px; color: #fafafa">Todo</label></div>
<div style="display: flex; align-items: center; gap: 8px"><span style="position: relative; width: 16px; height: 16px; flex: none"><input id="smp-status-completed" type="checkbox" checked="{{ true }}" onChange="{{noop}}" style="appearance: none; position: absolute; inset: 0; margin: 0; border: 1px solid #ef4444; background: #ef4444"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 1px; top: 1px; pointer-events: none"><path d="M20 6 9 17l-5-5"></path></svg></span><label for="smp-status-completed" style="font-size: 14px; line-height: 20px; color: #fafafa">Completed</label></div>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { noop: () => {} };
  }
}
</script>
</body>
</html>
