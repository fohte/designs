<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Now: merge band above the composer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 2612px; height: 936px; display: flex; gap: 24px; background: #0a0a0a; color: #a1a1aa; font-family: 'Helvetica Neue', Arial, 'Hiragino Sans', sans-serif; font-size: 12.5px">
<section style="width: 880px; flex: none; display: flex; flex-direction: column; gap: 16px"><h2 style="margin: 0; height: 20px; font-size: 12.5px; font-weight: 700">PC · マージできる PR が 8 つ、1 つは失敗</h2><div style="height: 900px; overflow: hidden"><dc-import name="Conversation" variant="review" merge-state="failed" action-line="{{ line }}" band-prs="{{ eight }}" hint-size="880px,900px"></dc-import></div></section>
<section style="width: 390px; flex: none; display: flex; flex-direction: column; gap: 16px"><h2 style="margin: 0; height: 20px; font-size: 12.5px; font-weight: 700">iPhone · 同じ 8 つ</h2><div style="height: 844px; overflow: hidden"><dc-import name="PhoneChat" h="844px" state="review" merge-state="failed" action-line="{{ line }}" band-prs="{{ eight }}" hint-size="390px,844px"></dc-import></div></section>
<section style="width: 880px; flex: none; display: flex; flex-direction: column; gap: 16px"><h2 style="margin: 0; height: 20px; font-size: 12.5px; font-weight: 700">PC · マージできる PR が 1 つ</h2><div style="height: 900px; overflow: hidden"><dc-import name="Conversation" variant="review" hint-size="880px,900px"></dc-import></div></section>
<section style="width: 390px; flex: none; display: flex; flex-direction: column; gap: 16px"><h2 style="margin: 0; height: 20px; font-size: 12.5px; font-weight: 700">iPhone · マージできる PR が 1 つ</h2><div style="height: 844px; overflow: hidden"><dc-import name="PhoneChat" h="844px" state="review" hint-size="390px,844px"></dc-import></div></section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2612,"height":936}}'>
class Component extends DCLogic {
  renderVals() {
    const reason = 'Base branch was modified. Retry to merge again';
    const t = ['再送キューの上限を設定に出す', '再送の待ち時間を指数的に伸ばす', '失敗した通知をログに残す', '通知の送信先を設定で切り替える', '再送のテストを足す', '古い再送ジョブを消す', '配信メトリクスを記録する', '再送の手順書を更新する'];
    return {
      line: { result: 'mergeFailed', pr: 2054, reason, time: '12:03' },
      eight: t.map((title, i) => ({ num: 2051 + i, title, state: i === 3 ? 'failed' : 'idle', reason }))
    };
  }
}
</script>
</body>
</html>
