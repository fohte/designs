<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Phone: Board</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<main style="position: relative; width: 100%; height: 100vh; overflow: hidden; box-sizing: border-box; display: flex; flex-direction: column; background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 15px; line-height: 1.55">
<sc-if value="{{showTop}}" hint-placeholder-val="{{ true }}">
<header style="flex: none; display: flex; align-items: center; gap: 4px; padding: 8px 8px 0 16px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700"><span style="margin-right: 7px; color: #ef4444">&gt;</span>agent watch</span>
<span style="margin-left: 10px; display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: #8b8b94"><span style="width: 6px; height: 6px; border-radius: 50%; background: #a1a1aa"></span>Connected · 22:00</span>
<button type="button" aria-label="Open navigation" style="margin-left: auto; width: 36px; height: 36px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #d4d4d8"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16"></path><path d="M4 12h16"></path><path d="M4 19h16"></path></svg></button>
<button type="button" aria-label="New session" style="width: 36px; height: 36px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #d4d4d8"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></button>
<button type="button" aria-label="Jump to" style="width: 36px; height: 36px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #d4d4d8"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 21-4.34-4.34"></path><circle cx="11" cy="11" r="8"></circle></svg></button>
</header>
<div style="flex: none; display: flex; align-items: center; gap: 8px; margin: 4px 8px 0 16px">
<h1 style="margin: 0; font-size: 26px; font-weight: 700">Board</h1>
<button type="button" aria-pressed="{{hideQuietStr}}" style="margin-left: auto; min-height: 44px; display: inline-flex; align-items: center; gap: 8px; padding: 0 8px; border: 0; background: transparent; color: #a1a1aa; font-family: inherit; font-size: 12.5px"><span aria-hidden="true" style="width: 14px; height: 14px; box-sizing: border-box; display: grid; place-items: center; border: 1px solid {{checkBorder}}; background: {{checkBg}}; color: #0a0a0a; font-size: 11px; line-height: 1">{{checkMark}}</span>Hide quiet projects (2)</button>
</div>
<div style="flex: none; margin: 0 16px 8px; font-size: 12.5px; color: #8b8b94">Projects that need you come first</div>
</sc-if>

<sc-if value="{{isA}}" hint-placeholder-val="{{ false }}">
<div style="flex: none; overflow: hidden; border-bottom: 1px solid #2a2a2a">
<div role="tablist" aria-label="Projects" style="display: flex; width: max-content; margin-left: {{stripShift}}; padding: 0 8px">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<button type="button" role="tab" aria-selected="{{t.selectedStr}}" style="flex: none; height: 44px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; border: 0; border-bottom: 2px solid {{t.underline}}; background: transparent; color: {{t.color}}; font-family: inherit; font-size: 14px; font-weight: {{t.weight}}">{{t.name}}<sc-if value="{{t.hasCount}}" hint-placeholder-val="{{ true }}"><span style="font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: #fbbf24">{{t.count}}</span></sc-if></button>
</sc-for>
</div>
</div>
<div role="tabpanel" style="flex: 1; min-height: 0; overflow: hidden">
<dc-import name="PhoneBoardColumn" col="{{ current }}" form="tab" hint-size="100%,600px"></dc-import>
</div>
</sc-if>

<sc-if value="{{isB}}" hint-placeholder-val="{{ false }}">
<div style="flex: 1; min-height: 0; overflow: hidden">
<sc-for list="{{sections}}" as="c" hint-placeholder-count="3">
<dc-import name="PhoneBoardColumn" col="{{ c }}" form="section" hint-size="100%,320px"></dc-import>
</sc-for>
</div>
</sc-if>

<sc-if value="{{isC}}" hint-placeholder-val="{{ true }}">
<div aria-hidden="true" style="flex: none; height: 14px; display: flex; justify-content: center; align-items: center; gap: 6px">
<sc-for list="{{dots}}" as="d" hint-placeholder-count="4"><span style="width: 6px; height: 6px; background: {{d.color}}"></span></sc-for>
</div>
<div style="flex: 1; min-height: 0; overflow: hidden; padding: 6px 0 16px">
<div style="height: 100%; display: flex; align-items: flex-start; gap: 10px; margin-left: {{trackShift}}">
<sc-for list="{{cards}}" as="c" hint-placeholder-count="2">
<div style="flex: none; width: 300px; max-height: 100%; overflow: hidden"><dc-import name="PhoneBoardColumn" col="{{ c }}" form="card" hint-size="300px,600px"></dc-import></div>
</sc-for>
</div>
</div>
</sc-if>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"option":{"editor":"enum","options":["a","b","c"],"default":"c"},"view":{"editor":"enum","options":["top","more","quiet"],"default":"top"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    // view: top = as opened. more = moved on to the third project (A: its tab, B: scrolled down to it, C: swiped to it). quiet = Hide quiet projects off, at the end of the board.
    const option = this.props.option ?? 'c';
    const view = this.props.view ?? 'top';
    const hideQuiet = view !== 'quiet';
    const cols = this.columns().filter((c) => !(hideQuiet && c.quiet));
    const at = view === 'more' ? 2 : view === 'quiet' ? 4 : 0;
    const tabs = cols.map((c, i) => ({
      name: c.name, count: c.needs.length, hasCount: c.needs.length > 0,
      selectedStr: i === at ? 'true' : 'false',
      underline: i === at ? '#fafafa' : 'transparent', color: i === at ? '#fafafa' : '#a1a1aa', weight: i === at ? 700 : 400
    }));
    return {
      isA: option === 'a', isB: option === 'b', isC: option === 'c',
      // B scrolls the whole page, so its top bar leaves the screen once scrolled.
      showTop: !(option === 'b' && view !== 'top'),
      hideQuietStr: hideQuiet ? 'true' : 'false',
      checkBorder: hideQuiet ? '#fafafa' : '#52525b', checkBg: hideQuiet ? '#fafafa' : 'transparent', checkMark: hideQuiet ? '✓' : '',
      tabs, current: cols[at], stripShift: view === 'quiet' ? '-188px' : '0',
      sections: option === 'b' && view !== 'top' ? cols.slice(view === 'more' ? 2 : 3) : cols,
      cards: cols, trackShift: (16 - at * 310) + 'px',
      dots: cols.map((c, i) => ({ color: i === at ? '#fafafa' : '#3f3f46' }))
    };
  }
  columns() {
    const col = (name, needs, working, more, done, quiet) => ({
      name, repos: 'example/' + name, needs, working, more, done, quiet: !!quiet,
      need: needs.length ? needs.length + ' need action' : 'Nothing needed',
      needColor: needs.length ? '#fbbf24' : '#8b8b94',
      needWeight: needs.length ? 700 : 400,
      hasNeeds: needs.length > 0, hasWorking: working.length > 0, hasMore: more !== '', hasDone: done !== ''
    });
    const n = (repo, status, age, title, role, engine, taskRef, taskTitle) => ({ status, unread: true, age, title, role, engine, taskRef, taskTitle, repo });
    const w = (repo, age, title, role, engine, taskRef, taskTitle) => ({ status: 'Working', age, title, role, engine, taskRef, taskTitle, repo });
    return [
      col('service', [
        n('service', 'Question', '8s', '通知の再送処理を見直す', 'development', 'claude', 'P1 #2048', '通知の信頼性を上げる'),
        n('service', 'Error', '4m', '統合テストの失敗を直す', 'debug-flow', 'claude', 'P1 #2052', 'テストを安定させる'),
        n('service', 'Approve', '6m', 'ステージングの設定を書き換える', 'development', 'codex', 'P2 #2053', '新しい設定を段階的に公開する')
      ], [w('service', '30s', '再送の記録を残す', 'development', 'codex', 'P1 #2048', '通知の信頼性を上げる')], '', '送信キューを分ける and 2 more'),
      col('web-app', [
        n('web-app', 'Review', '2m', '配信チェックの PR を確認する', '', 'codex', 'P2 #2050', '配信チェックを入れる'),
        { ...n('web-app', 'Plan', '5m', '段階的な公開の計画を立てる', 'PM', 'claude', 'P2 #2054', '新しい設定を段階的に公開する'), unread: false }
      ], [w('web-app', '1m', '設定画面の文言を直す', 'design', 'claude', 'P3 #2056', '設定画面を作り直す')], '', 'ログイン画面を直す'),
      col('observability', [
        n('observability', 'Proposal', '12m', 'アラートの送り先を決める', 'designer', 'claude', 'P2 #2051', '監視を整える')
      ], [
        w('observability', '18s', '配信メトリクスを追加する', 'development', 'codex', 'P3 #2055', '監視を整える'),
        w('observability', '2m', '配信ログの保存期間を決める', 'research', 'codex', 'P2 #2051', '監視を整える'),
        w('observability', '5m', 'ダッシュボードの遅延を調べる', 'debug-flow', 'codex', 'P3 #2057', '監視を整える')
      ], '1 more', ''),
      col('handbook', [], [], '', 'セットアップ手順を更新する'),
      col('infra', [], [], '', '', true),
      col('design-tokens', [], [], '', '', true)
    ];
  }
}
</script>
</body>
</html>
