<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Checkbox</title>
</head>
<body>
<div class="fui-row" style="gap:20px">
  <label class="fui-check-label"><span class="fui-checkbox" role="checkbox" aria-checked="false"><svg class="fui-icon fui-icon--check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><svg class="fui-icon fui-icon--minus" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></span>Unchecked</label>
  <label class="fui-check-label"><span class="fui-checkbox" role="checkbox" aria-checked="true" data-checked><svg class="fui-icon fui-icon--check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><svg class="fui-icon fui-icon--minus" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></span>Checked</label>
  <label class="fui-check-label"><span class="fui-checkbox" role="checkbox" aria-checked="mixed" data-indeterminate><svg class="fui-icon fui-icon--check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><svg class="fui-icon fui-icon--minus" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></span>Indeterminate</label>
  <label class="fui-check-label"><span class="fui-checkbox is-focus" role="checkbox" aria-checked="false"><svg class="fui-icon fui-icon--check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><svg class="fui-icon fui-icon--minus" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></span>Focus</label>
</div>
<div class="fui-row" style="gap:20px">
  <label class="fui-check-label"><span class="fui-checkbox" role="checkbox" aria-checked="false" aria-disabled="true" data-disabled><svg class="fui-icon fui-icon--check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><svg class="fui-icon fui-icon--minus" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></span>Disabled</label>
  <label class="fui-check-label"><span class="fui-checkbox" role="checkbox" aria-checked="true" aria-disabled="true" data-checked data-disabled><svg class="fui-icon fui-icon--check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><svg class="fui-icon fui-icon--minus" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></span>Disabled, checked</label>
  <label class="fui-check-label"><span class="fui-checkbox" role="checkbox" aria-checked="false" aria-invalid="true"><svg class="fui-icon fui-icon--check" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><svg class="fui-icon fui-icon--minus" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></span>Invalid</label>
</div>
</body>
</html>
