<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Close failed: more actions</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; box-sizing: border-box; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; line-height: 1.55">

<sc-if value="{{isPopover}}" hint-placeholder-val="{{ true }}">
<div role="menu" aria-label="More actions" style="display: flex; flex-direction: column; padding: 4px 0; border: 1px solid #3f3f46; background: #1f1f1f; box-shadow: 0 12px 36px rgb(0 0 0 / 30%); font-size: 12.5px">
<sc-if value="{{terminal}}" hint-placeholder-val="{{ true }}"><button type="button" role="menuitem" style="min-height: 30px; padding: 0 12px; border: 0; background: transparent; color: #fafafa; font-family: inherit; font-size: inherit; text-align: left">Open in terminal</button></sc-if>
<button type="button" role="menuitem" aria-haspopup="dialog" style="min-height: 30px; padding: 0 12px; border: 0; border-top: {{sep}}; background: transparent; color: #f87171; font-family: inherit; font-size: inherit; text-align: left">Discard changes and close…</button>
</div>
</sc-if>

<sc-if value="{{isSheet}}" hint-placeholder-val="{{ false }}">
<section role="dialog" aria-modal="true" aria-label="More actions" style="display: flex; flex-direction: column; padding: 14px 0 max(30px, env(safe-area-inset-bottom)); border-top: 1px solid #3f3f46; background: #1f1f1f; box-shadow: 0 -12px 36px rgb(0 0 0 / 30%); font-size: 14px">
<div style="display: flex; align-items: center; gap: 8px; min-width: 0; padding: 0 16px 10px; font-size: 13px"><span aria-hidden="true" style="flex: none; width: 7px; height: 7px; background: #f87171"></span><span style="flex: none; color: #f87171">Close failed</span><span style="min-width: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{session}}</span></div>
<div role="menu" aria-label="More actions" style="display: flex; flex-direction: column; border-top: 1px solid #2a2a2a">
<sc-if value="{{terminal}}" hint-placeholder-val="{{ true }}"><button type="button" role="menuitem" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 16px; border: 0; background: transparent; color: #fafafa; font-family: inherit; font-size: 15px; text-align: left"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #a1a1aa"><path d="m4 17 6-6-6-6"></path><path d="M12 19h8"></path></svg>Open in terminal</button></sc-if>
<button type="button" role="menuitem" aria-haspopup="dialog" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 16px; border: 0; border-top: 6px solid #141414; background: transparent; color: #f87171; font-family: inherit; font-size: 15px; text-align: left"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M3 6h18"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>Discard changes and close…</button>
</div>
<div style="padding: 10px 16px 0"><button type="button" style="width: 100%; min-height: 44px; border: 1px solid #3f3f46; background: transparent; color: #fafafa; font-family: inherit; font-size: 13px">Cancel</button></div>
</section>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"form":{"editor":"enum","options":["popover","sheet"],"default":"popover"},"terminal":{"editor":"boolean","default":true},"session":{"editor":"text","default":"通知の再送処理を見直す"},"$preview":{"width":240,"height":80}}'>
class Component extends DCLogic {
  renderVals() {
    const form = this.props.form ?? 'popover';
    const terminal = this.props.terminal ?? true;
    // The Activity row already shows Open in terminal, so its menu holds only the discard.
    return {
      isPopover: form === 'popover', isSheet: form === 'sheet',
      terminal, sep: terminal ? '1px solid #2a2a2a' : '0',
      session: this.props.session ?? '通知の再送処理を見直す'
    };
  }
}
</script>
</body>
</html>
