<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Link pull request to a checklist item on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0a0a0a; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif">
<dc-import name="TaskDetailPhone" hint-size="390px,844px"></dc-import>
<div style="position: absolute; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px)">
<div role="dialog" aria-modal="true" aria-labelledby="pr-title" style="position: relative; width: 358px; box-sizing: border-box; display: grid; gap: 16px; padding: 16px; background: #0a0a0a; box-shadow: 0 0 0 1px rgba(250,250,250,0.1); color: #fafafa; font-size: 14px; line-height: 20px">
<div style="display: grid; gap: 8px">
<h2 id="pr-title" style="margin: 0; font-size: 16px; line-height: 1; font-weight: 500">Link pull request</h2>
<p style="margin: 0; color: #71717a">Paste a pull request URL for “ステージングで確認する”.</p>
</div>
<input type="text" aria-label="Pull request URL" value="{{url}}" placeholder="https://github.com/owner/repo/pull/123" style="width: 100%; height: 32px; box-sizing: border-box; padding: 4px 10px; border: 1px solid #ef4444; box-shadow: 0 0 0 3px rgba(239,68,68,0.2); background: transparent; color: #fafafa; font-family: inherit; font-size: 16px; outline: none">
<sc-if value="{{pending}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; color: #71717a">Linking pull request...</p>
</sc-if>
<div style="display: flex; flex-direction: column-reverse; gap: 8px; margin: 0 -16px -16px; padding: 16px; border-top: 1px solid #2a2a2a; background: rgba(20,20,20,0.5)">
<button type="button" style="height: 32px; padding: 0 10px; border: 1px solid #2a2a2a; background: #0a0a0a; color: #fafafa; font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 500">Cancel</button>
<button type="button" disabled="{{disabled}}" style="height: 32px; padding: 0 10px; border: 1px solid #71717a; background: #1f1f1f; color: #fafafa; font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 500; opacity: {{opacity}}">Link</button>
</div>
<button type="button" aria-label="Close" style="position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #fafafa"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["empty","filled","pending"],"default":"filled"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.props.state ?? 'filled';
    const off = s !== 'filled';
    return {
      url: s === 'empty' ? '' : 'https://github.com/example-org/web/pull/215',
      pending: s === 'pending',
      disabled: off,
      opacity: off ? 0.5 : 1,
    };
  }
}
</script>
</body>
</html>
