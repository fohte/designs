<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Phone: Inbox</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<main style="width: 100%; min-height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 15px; line-height: 1.55">
<header style="display: flex; align-items: center; gap: 4px; padding: 8px 8px 0 16px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700"><span style="margin-right: 7px; color: #ef4444">&gt;</span>agent watch</span>
<span style="margin-left: 10px; display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: #8b8b94"><span style="width: 6px; height: 6px; border-radius: 50%; background: #a1a1aa"></span>Connected · 22:00</span>
<button type="button" aria-label="Open navigation" style="margin-left: auto; width: 36px; height: 36px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #d4d4d8"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16"></path><path d="M4 12h16"></path><path d="M4 19h16"></path></svg></button>
<button type="button" aria-label="New session" style="width: 36px; height: 36px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #d4d4d8"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></button>
<button type="button" aria-label="Jump to" style="width: 36px; height: 36px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #d4d4d8"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 21-4.34-4.34"></path><circle cx="11" cy="11" r="8"></circle></svg></button>
</header>
<h1 style="margin: 4px 16px 6px; font-size: 26px; font-weight: 700">Inbox</h1>
<div style="height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 16px; font-size: 10.5px; color: #8b8b94"><span>Filter by project, kind, tq task, repo</span><kbd style="padding: 0 5px; border: 1px solid #3f3f46; font-family: 'JetBrains Mono', monospace">/</kbd></div>
<div style="height: 36px; display: flex; align-items: center; gap: 6px; padding: 0 16px; overflow: hidden">
<span style="flex: none; height: 26px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; background: #1f1f1f; font-size: 12.5px; white-space: nowrap"><span style="color: #fbbf24">★</span>通知の再送処理を見直す</span>
<span style="flex: none; height: 26px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; background: #1f1f1f; font-size: 12.5px; white-space: nowrap"><span style="color: #fbbf24">★</span>配信ログの保存期間を決める</span>
</div>
<h2 style="display: flex; align-items: center; gap: 8px; margin: 8px 0 0; padding: 0 16px 6px; font-size: 13px; font-weight: 700">Needs action <span style="font-family: 'JetBrains Mono', monospace; color: #fbbf24">6</span></h2>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
<div style="display: grid; grid-template-columns: 8px 1fr; gap: 12px; padding: 10px 16px; border-bottom: 1px solid #1f1f1f">
<span style="width: 8px; height: 8px; margin-top: 8px; background: {{r.dot}}"></span>
<div style="min-width: 0">
<div style="display: flex; gap: 8px"><strong style="flex: 1; min-width: 0; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.title}}</strong><span style="font-size: 12.5px; color: #8b8b94">{{r.age}}</span></div>
<div style="font-size: 13.5px; color: #d4d4d8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><span style="color: {{r.dot}}">{{r.kind}}</span> · {{r.preview}}</div>
<div style="font-size: 12px; color: #8b8b94; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><span style="font-family: 'JetBrains Mono', monospace; color: #a1a1aa">{{r.task}}</span> · {{r.repo}}</div>
</div>
</div>
</sc-for>
<div style="height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid #1f1f1f; font-size: 13px"><span>◷ Later</span><span style="font-family: 'JetBrains Mono', monospace; color: #8b8b94">2</span><span style="margin-left: auto; color: #8b8b94">in 2h ›</span></div>
<div style="height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid #1f1f1f; font-size: 13px"><span>In progress</span><span style="font-family: 'JetBrains Mono', monospace; color: #60a5fa">5</span><span style="margin-left: auto; color: #52525b">›</span></div>
<div style="height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid #1f1f1f; font-size: 13px"><span>Done</span><span style="font-family: 'JetBrains Mono', monospace; color: #8b8b94">3</span><span style="color: #a1a1aa">◇ 2 to review ›</span><button type="button" style="margin-left: auto; height: 28px; padding: 0 10px; border: 1px solid #2a2a2a; background: transparent; color: #d4d4d8; font-family: inherit; font-size: 12px">Close all</button></div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const r = (kind, dot, title, age, preview, task, repo) => ({ kind, dot, title, age, preview, task, repo });
    return {
      rows: [
        r('Question', '#fbbf24', '通知の再送処理を見直す', '8s', '再試行は 3 回で止めてよいですか?', 'P1 #2048 通知の信頼性を上げる', 'service'),
        r('Review', '#fbbf24', '配信チェックの PR を確認する', '2m', 'PR #2049 を見てください', 'P2 #2050 配信チェックを入れる', 'web-app'),
        r('Error', '#f87171', '統合テストの失敗を直す', '4m', 'テストが 2 件失敗しました', 'P1 #2052 テストを安定させる', 'service'),
        r('Proposal', '#fbbf24', 'アラートの送り先を決める', '12m', '2 つの案から選んでください', 'P2 #2051 監視を整える', 'observability')
      ]
    };
  }
}
</script>
</body>
</html>
