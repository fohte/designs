<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Close failure · E · modal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; display: flex; overflow: hidden; background: #0a0a0a; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif">
<div style="flex: none; width: 240px"><dc-import name="Nav" view="inbox" activity="{{ activity }}" hint-size="240px,900px"></dc-import></div>
<div style="flex: none; width: 460px; border-right: 1px solid #2a2a2a"><dc-import name="InboxList" filter="none" current="{{ one }}" hint-size="460px,900px"></dc-import></div>
<div style="flex: 1; min-width: 0"><dc-import name="Conversation" variant="review" done="{{ true }}" hint-size="100%,900px"></dc-import></div>
<div style="position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0, 0, 0, 0.55)">
<div style="width: 440px"><dc-import name="ConfirmDialog" form="modal" head="Close failed" body="Uncommitted changes are left in the worktree. Commit or move them, or close the session and keep the worktree." code="~/src/example/web-app/.worktrees/delivery-check" action="Close and keep worktree" keys="↵ Close and keep worktree · Esc Cancel" session="{{ session }}" hint-size="100%,200px"></dc-import></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      one: 1,
      activity: { count: '1', tone: 'failure' },
      session: { state: 'Done', dot: '#a1a1aa', round: false, color: '#a1a1aa', title: '配信チェックの PR を確認する' }
    };
  }
}
</script>
</body>
</html>
