<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>SortControl</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="display: inline-flex; align-items: center; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; line-height: 1">
<sc-if value="{{isMenu}}" hint-placeholder-val="{{ true }}">
<button type="button" aria-haspopup="menu" aria-expanded="{{openStr}}" style="height: {{h}}; display: inline-flex; align-items: center; gap: 5px; padding: 0 {{padX}}; border: 1px solid {{border}}; background: {{bg}}; color: #8b8b94; font-family: inherit; font-size: {{size}}; white-space: nowrap"><span>Sort</span><span style="color: #fafafa">{{label}}</span><svg width="{{icon}}" height="{{icon}}" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
</sc-if>
<sc-if value="{{isSegment}}" hint-placeholder-val="{{ false }}">
<div style="display: inline-flex; align-items: center; gap: 8px">
<span id="sort-label" style="font-size: {{size}}; color: #8b8b94">Sort</span>
<div role="radiogroup" aria-labelledby="sort-label" style="display: flex; border: 1px solid #3f3f46">
<sc-for list="{{options}}" as="o" hint-placeholder-count="3">
<button type="button" role="radio" aria-checked="{{o.checked}}" style="height: {{segH}}; padding: 0 {{segPad}}; border: 0; border-left: {{o.sep}}; background: {{o.bg}}; color: {{o.color}}; font-family: inherit; font-size: {{size}}; white-space: nowrap">{{o.label}}</button>
</sc-for>
</div>
</div>
</sc-if>
<sc-if value="{{isFilterbar}}" hint-placeholder-val="{{ false }}">
<button type="button" aria-haspopup="menu" aria-expanded="{{openStr}}" aria-label="{{aria}}" style="height: {{h}}; display: inline-flex; align-items: center; gap: 6px; padding: 0 {{padX}}; border: 1px solid #2a2a2a; background: {{fbBg}}; color: #d4d4d8; font-family: inherit; font-size: {{size}}; white-space: nowrap"><svg width="{{icon}}" height="{{icon}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 16-4 4-4-4"></path><path d="M17 20V4"></path><path d="m3 8 4-4 4 4"></path><path d="M7 4v16"></path></svg><span>{{label}}</span></button>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"form":{"editor":"enum","options":["pc","phone"],"default":"pc"},"kind":{"editor":"enum","options":["menu","segment","filterbar"],"default":"menu"},"value":{"editor":"enum","options":["priority","updated","project"],"default":"priority"},"open":{"editor":"boolean","default":false},"$preview":{"width":240,"height":44}}'>
class Component extends DCLogic {
  renderVals() {
    const phone = (this.props.form ?? 'pc') === 'phone';
    const kind = this.props.kind ?? 'menu';
    const value = this.props.value ?? 'priority';
    const open = this.props.open ?? false;
    const names = { priority: 'Priority', updated: 'Updated', project: 'Project' };
    const keys = ['priority', 'updated', 'project'];
    return {
      isMenu: kind === 'menu', isSegment: kind === 'segment', isFilterbar: kind === 'filterbar',
      label: names[value], openStr: open ? 'true' : 'false', aria: 'Sort: ' + names[value],
      // The phone's controls take the header buttons' 36 px; the filter bar's sits beside its 44 px field.
      h: phone ? (kind === 'filterbar' ? '44px' : '36px') : (kind === 'filterbar' ? '28px' : '26px'),
      padX: phone ? '12px' : '8px', size: phone ? '13.5px' : '12px', icon: phone ? '15' : '13',
      border: open ? '#3f3f46' : 'transparent', bg: open ? '#1f1f1f' : 'transparent',
      fbBg: open ? '#1f1f1f' : '#141414',
      segH: phone ? '34px' : '24px', segPad: phone ? '11px' : '9px',
      options: keys.map((k, i) => ({
        label: names[k], checked: k === value ? 'true' : 'false',
        bg: k === value ? '#fafafa' : 'transparent', color: k === value ? '#0a0a0a' : '#d4d4d8',
        sep: i === 0 ? '0' : '1px solid #3f3f46'
      }))
    };
  }
}
</script>
</body>
</html>
