<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Priority select and checklist item actions open</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 900px; overflow: hidden; background: #0a0a0a">
<dc-import name="TaskDetail" height="{{h}}" scroll="{{scroll}}" open="priority" menu="checklist" hint-size="1440px,900px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    // Scrolled so the last item of the first checklist sits mid-screen; the sidebar is sticky.
    return { h: 900, scroll: 400 };
  }
}
</script>
</body>
</html>
