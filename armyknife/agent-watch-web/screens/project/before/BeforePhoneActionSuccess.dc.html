<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Before Phone: merge succeeded</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; background: #0a0a0a">
<dc-import name="BeforePhoneChat" state="review" merge-state="merged" activity="{{ activity }}" toasts="{{ toasts }}" action-line="{{ line }}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      activity: { count: '', tone: 'idle' },
      line: { result: 'merged', pr: 64, time: '12:03' },
      toasts: [{ result: 'merged', pr: 64, session: '通知の再送処理を見直す' }]
    };
  }
}
</script>
</body>
</html>
