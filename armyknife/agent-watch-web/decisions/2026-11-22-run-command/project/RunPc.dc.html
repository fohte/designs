<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Run command on PC</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; display: flex; overflow: hidden; background: #0a0a0a; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif">
<div style="flex: none; width: 240px"><dc-import name="Nav" view="inbox" activity="{{ activity }}" activity-open="{{ open }}" hint-size="240px,900px"></dc-import></div>
<div style="flex: none; width: 460px; border-right: 1px solid #2a2a2a"><dc-import name="InboxList" filter="none" current="{{ one }}" hint-size="460px,900px"></dc-import></div>
<div style="flex: 1; min-width: 0"><dc-import name="Conversation" variant="review" bang="{{ bang }}" bang-highlight="{{ highlight }}" action-line="{{ line }}" hint-size="100%,900px"></dc-import></div>
<sc-if value="{{isDialog}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; z-index: 20; inset: 0; display: grid; place-items: center; padding: 16px; background: rgb(0 0 0 / 55%)">
<div style="width: min(100%, 34rem)"><dc-import name="ConfirmDialog" form="panel" head="Run agent command?" body="Review the command and working directory before it runs." action="Run command" pending="{{ true }}" pending-label="Running command…" details="{{ details }}" hint-size="100%,360px"></dc-import></div>
</div>
</sc-if>
<sc-if value="{{hasToast}}" hint-placeholder-val="{{ true }}"><div style="position: absolute; z-index: 10; left: 16px; bottom: 16px; width: 360px"><dc-import name="ToastStack" items="{{ toasts }}" hint-size="100%,150px"></dc-import></div></sc-if>
<sc-if value="{{open}}" hint-placeholder-val="{{ false }}"><div style="position: absolute; z-index: 10; left: 248px; bottom: 148px; width: 400px"><dc-import name="Activity" items="{{ rows }}" hint-size="100%,520px"></dc-import></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"opt":{"editor":"enum","options":["current","a","b","c"],"default":"a"},"state":{"editor":"enum","options":["running","succeeded","failed","timedOut","activity"],"default":"running"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const opt = this.props.opt ?? 'a';
    const state = this.props.state ?? 'running';
    const cmd = 'a agent todo add --title "差分を crit で見る"';
    const session = '配信チェックの PR を確認する';
    // Per option: the toast's second line and a failure's buttons.
    const O = { a: { sub: 'command', fail: 'retryDetails' }, b: { sub: 'session', fail: 'details' }, c: { sub: 'command', fail: 'output' } }[opt] ?? {};
    const result = { running: 'running', succeeded: 'succeeded', failed: 'commandFailed', timedOut: 'timedOut', activity: 'commandFailed' }[state];
    const main = { result, cmd, session, exit: 1, ...O };
    const tail = 'error: no tq task is linked to this session';
    // Option C keeps the output in the conversation, so its rows carry none.
    const out = opt === 'c' ? {} : { output: tail, outputLabel: 'stderr · last lines' };
    const rows = [
      { result: 'running', cmd: 'a agent proposal add --title "通知の文言を選ぶ"', session: '通知の文言を決める', time: '12:05', ...O },
      { result: 'timedOut', cmd: 'a agent todo add --title "実機で音を確かめる"', session: '通知の音を選べるようにする', time: '12:04', ...O, ...(opt === 'c' ? {} : { output: 'waiting for the tq server to respond…', outputLabel: 'stderr · last lines' }) },
      { ...main, time: '12:03', ...out },
      { result: 'succeeded', cmd: 'a agent todo add --title "ログの保存期間を決める"', session: '配信ログの保存期間を決める', time: '12:01', ...O }
    ];
    const isDialog = opt === 'current';
    const open = state === 'activity';
    const bang = isDialog ? 'running' : ({ activity: 'failed' }[state] ?? state);
    const tone = state === 'running' ? 'running' : state === 'succeeded' ? 'idle' : 'failure';
    return {
      one: 1, isDialog, open,
      bang, highlight: opt === 'c' && state === 'failed',
      activity: isDialog ? { count: '', tone: 'empty' } : open ? { count: '2', tone: 'failure' } : { count: tone === 'idle' ? '' : '1', tone },
      line: isDialog ? null : { ...main, time: state === 'running' ? '' : '12:03' },
      hasToast: !isDialog && !open, toasts: [main],
      rows,
      details: [
        { term: 'Working directory', value: '~/src/example/web-app' },
        { term: 'Command', value: cmd, block: true }
      ]
    };
  }
}
</script>
</body>
</html>
