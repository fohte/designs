<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>A: phone, empty Activity open</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; background: #0a0a0a">
<dc-import name="PhoneDrawer" activity="{{ activity }}" activity-open="{{ open }}" activity-items="{{ items }}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { activity: { count: '', tone: 'empty' }, open: true, items: [] };
  }
}
</script>
</body>
</html>
