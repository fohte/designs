<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Phone: session status panel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 100%; height: 100vh; overflow: hidden; background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 15px; line-height: 1.55">

<section aria-label="{{sectionLabel}}" style="position: absolute; inset: 0; display: flex; flex-direction: column; background: #0f0f0f">

<header style="flex: none; display: grid; grid-template-columns: {{headCols}}; align-items: center; column-gap: 4px; padding: 6px {{headPadR}} 6px {{headPadL}}; border-bottom: 1px solid {{headBorder}}">
<sc-if value="{{tabbed}}" hint-placeholder-val="{{ true }}"><button type="button" aria-label="Back to the conversation" style="width: 44px; height: 44px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #d4d4d8"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button></sc-if>
<sc-if value="{{tabbed}}" hint-placeholder-val="{{ true }}"><div style="min-width: 0; display: flex; flex-direction: column"><h1 style="margin: 0; font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Session status</h1><span style="font-size: 12.5px; color: #a1a1aa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">通知の再送処理を見直す</span></div></sc-if>
<sc-if value="{{full}}" hint-placeholder-val="{{ false }}"><div style="min-width: 0; display: flex; flex-direction: column"><h1 style="margin: 0; font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{webName}}</h1><span style="font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #a1a1aa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{webUrl}}</span></div>
<a href="{{webUrl}}" target="_blank" rel="noopener noreferrer" aria-label="Open in a new tab" style="width: 44px; height: 44px; display: grid; place-items: center; color: #a1a1aa"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"></path><path d="M10 14 21 3"></path><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path></svg></a>
<button type="button" aria-label="Close web UI" style="width: 44px; height: 44px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #d4d4d8"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></sc-if>
</header>

<sc-if value="{{hasPrs}}" hint-placeholder-val="{{ false }}"><section aria-labelledby="pr-list-title" style="flex: none; display: flex; flex-direction: column; padding: 4px 0 8px; border-bottom: 1px solid #2a2a2a; color: #d4d4d8; font-size: 14px">
<h2 id="pr-list-title" style="margin: 0 16px 2px; color: #fafafa; font-size: 13px; font-weight: 700">Pull requests</h2>
<sc-for list="{{prGroups}}" as="g" hint-placeholder-count="3">
<h3 style="margin: 0; padding: 6px 16px 0; color: #8b8b94; font-size: 12.5px; font-weight: 400">{{g.name}}</h3>
<sc-for list="{{g.rows}}" as="r" hint-placeholder-count="1">
<div style="min-height: 52px; box-sizing: border-box; display: grid; grid-template-columns: 7px 1fr auto; align-items: center; column-gap: 12px; padding: 4px 16px; color: #fafafa"><span role="img" aria-label="{{r.ci}}" title="{{r.ci}}" style="width: 7px; height: 7px; background: {{r.dot}}"></span><a href="#" style="min-width: 0; display: grid; color: inherit; text-decoration: none"><span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><span style="font-family: 'JetBrains Mono', monospace; font-size: 13px">#{{r.num}}</span> {{r.title}}</span><span style="font-size: 12.5px; color: #a1a1aa"><span style="font-family: 'JetBrains Mono', monospace">{{r.repo}}</span> · <span style="color: {{r.metaColor}}">{{r.meta}}</span></span></a><sc-if value="{{r.showMerge}}" hint-placeholder-val="{{ false }}"><dc-import name="MergeButton" state="{{r.mergeState}}" num="{{ r.num }}" form="phone" hint-size="72px,44px"></dc-import></sc-if><sc-if value="{{r.showWhy}}" hint-placeholder-val="{{ false }}"><span style="color: #8b8b94; font-size: 12.5px; white-space: nowrap">{{r.why}}</span></sc-if></div>
</sc-for>
</sc-for>
</section></sc-if>

<sc-if value="{{tabbed}}" hint-placeholder-val="{{ true }}"><dc-import name="StatusTabs" tab="{{tab}}" size="phone" canvas-tab="{{canvasTab}}" linked="{{linked}}" tasks="{{tasks}}" many="{{many}}" hint-size="100%,45px"></dc-import></sc-if>
<div style="position: relative; flex: 1; min-height: 0"><dc-import name="StatusBody" tab="{{tab}}" size="phone" linked="{{linked}}" tasks="{{tasks}}" full="{{full}}" draft="{{draft}}" many="{{many}}" view="{{view}}" stage="{{stage}}" look="{{look}}" hint-size="100%,742px"></dc-import></div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"canvasTab":{"editor":"boolean","default":false},"tab":{"editor":"enum","options":["running","tasks","tree","review","decisions","crit","canvas"],"default":"running"},"linked":{"editor":"boolean","default":false},"tasks":{"editor":"enum","options":["one","many"],"default":"one"},"full":{"editor":"boolean","default":false},"draft":{"editor":"int","min":0,"max":4,"default":1},"many":{"editor":"boolean","default":false},"view":{"editor":"enum","options":["preview","edit"],"default":"preview"},"stage":{"editor":"int","min":0,"max":2,"default":0},"look":{"editor":"enum","options":["","raw","a","b","c"],"default":""},"prs":{"editor":"boolean","default":true},"mergeState":{"editor":"enum","options":["idle","merging","merged","alreadyMerged","queued","failed"],"default":"idle"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    // A full-screen page pushed over the conversation; the back button returns to it.
    // The tabs and their contents are StatusTabs and StatusBody, the same parts the PC's StatusPanel imports.
    const tab = this.props.tab ?? 'running';
    const canvas = tab === 'canvas';
    // full: only the web UI, pushed over the conversation by a web UI link; the × returns to the conversation.
    const full = this.props.full ?? false;
    // prs: the session's PRs head the panel (every drawn session has PRs; false for one without). The web UI page (full) has no panel, so no list. mergeState: the merge on #64, the same PR as the conversation's merge band.
    const mergeState = this.props.mergeState ?? 'idle';
    const merged64 = mergeState === 'merged' || mergeState === 'alreadyMerged';
    return {
      tab, full,
      hasPrs: !full && (this.props.prs ?? true),
      prGroups: [
        { name: 'This branch', rows: [{ num: 2050, title: '再送処理を retry() にまとめる', repo: 'example/service', dot: '#fbbf24', ci: 'CI running', meta: 'Open', metaColor: '#a1a1aa', showMerge: false, showWhy: true, why: 'CI running' }] },
        { name: 'Opened elsewhere', rows: [{ num: 64, title: '再送キューの上限を設定に出す', repo: 'example/infra', dot: merged64 ? '#52525b' : '#4ade80', ci: merged64 ? 'Merged' : 'CI passed', meta: merged64 ? 'Merged' : 'Open', metaColor: '#a1a1aa', showMerge: true, showWhy: false, why: '', mergeState }] },
        { name: 'Merged', rows: [{ num: 2041, title: '再送のログを整える', repo: 'example/service', dot: '#52525b', ci: 'Merged', meta: '✓ Merged', metaColor: '#8b8b94', showMerge: false, showWhy: false, why: '' }] }
      ],
      draft: this.props.draft ?? 1, many: this.props.many ?? false, view: this.props.view ?? 'preview', stage: this.props.stage ?? 0, look: this.props.look ?? '',
      canvasTab: this.props.canvasTab ?? false,
      linked: this.props.linked ?? false,
      // tasks many: opened from the conversation's +3; the tasks that are not primary are emphasized so the one to switch to stands out.
      tasks: this.props.tasks ?? 'one',
      tabbed: !full,
      sectionLabel: full ? (canvas ? 'canvas' : 'crit') : 'Session status',
      headPadR: full ? '4px' : '16px',
      headPadL: full ? '16px' : '0',
      headCols: full ? '1fr auto auto' : '44px 1fr auto',
      headBorder: full ? '#2a2a2a' : 'transparent',
      webName: canvas ? 'canvas' : 'crit',
      webUrl: canvas ? 'http://127.0.0.1:4720/design/k3x9/#page-options' : 'http://127.0.0.1:3000/review/example'
    };
  }
}
</script>
</body>
</html>
