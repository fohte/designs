<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Tasks list states on phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1250px; height: 844px; overflow: hidden; display: flex; gap: 40px; background: #000000">
<div style="flex: none; width: 390px"><dc-import name="TasksPhone" state="loading" hint-size="390px,844px"></dc-import></div>
<div style="flex: none; width: 390px"><dc-import name="TasksPhone" state="empty" hint-size="390px,844px"></dc-import></div>
<div style="flex: none; width: 390px"><dc-import name="TasksPhone" state="more" hint-size="390px,844px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1250,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
