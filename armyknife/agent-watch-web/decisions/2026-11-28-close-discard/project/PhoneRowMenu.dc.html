<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Phone: Inbox row actions sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<section role="dialog" aria-modal="true" aria-label="Session actions" style="width: 100%; box-sizing: border-box; display: flex; flex-direction: column; padding: 14px 0 max(30px, env(safe-area-inset-bottom)); border-top: 1px solid #3f3f46; background: #1f1f1f; box-shadow: 0 -12px 36px rgb(0 0 0 / 30%); color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 14px; line-height: 1.55">
<div style="display: flex; align-items: center; gap: 8px; min-width: 0; padding: 0 16px 10px; font-size: 13px"><span aria-hidden="true" style="flex: none; width: 7px; height: 7px; border-radius: {{s.radius}}; background: {{s.dot}}"></span><span style="flex: none; color: {{s.color}}">{{s.state}}</span><span style="min-width: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.title}}</span></div>
<div role="menu" aria-label="Session actions" style="display: flex; flex-direction: column; border-top: 1px solid #2a2a2a">
<button type="button" role="menuitem" aria-haspopup="dialog" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 16px; border: 0; background: transparent; color: #fafafa; font-family: inherit; font-size: 15px; text-align: left"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #a1a1aa"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path></svg><span style="flex: 1">Later</span><span aria-hidden="true" style="color: #71717a">›</span></button>
<button type="button" role="menuitem" aria-haspopup="dialog" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 16px; border: 0; border-top: 6px solid #141414; background: transparent; color: #f87171; font-family: inherit; font-size: 15px; text-align: left"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg>Close session…</button>
</div>
<div style="padding: 10px 16px 0"><button type="button" style="width: 100%; min-height: 44px; border: 1px solid #3f3f46; background: transparent; color: #fafafa; font-family: inherit; font-size: 13px">Cancel</button></div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"session":{"editor":null},"$preview":{"width":390,"height":250}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.props.session ?? { state: 'Review', dot: '#fbbf24', round: false, color: '#fbbf24', title: '配信チェックの PR を確認する' };
    return { s: { ...s, radius: s.round ? '50%' : '0' } };
  }
}
</script>
</body>
</html>
