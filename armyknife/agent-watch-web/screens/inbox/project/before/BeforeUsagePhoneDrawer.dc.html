<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Phone: navigation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 100%; height: 100vh; overflow: hidden; background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 14px; line-height: 1.55">
<dc-import name="BeforeUsagePhoneInbox" hint-size="100%,844px"></dc-import>
<div style="position: absolute; inset: 0; background: rgba(0, 0, 0, 0.45)"></div>
<nav role="dialog" aria-modal="true" aria-label="Navigation" style="position: absolute; top: 0; bottom: 0; left: 0; width: 320px; max-width: 86%; box-sizing: border-box; display: flex; flex-direction: column; padding: 8px 12px; background: #0f0f0f; box-shadow: 8px 0 24px rgba(0, 0, 0, 0.5)">
<div style="height: 48px; display: flex; align-items: center; padding: 0 4px; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700"><span style="margin-right: 7px; color: #ef4444">&gt;</span>agent watch</div>
<div role="group" aria-label="Views" style="display: grid; grid-template-columns: 1fr 1fr; height: 36px; box-sizing: border-box; margin-bottom: 12px; padding: 2px; background: #1a1a1a">
<button type="button" aria-pressed="true" style="border: 0; background: #3f3f46; color: #fafafa; font-family: inherit; font-size: 13px; font-weight: 700">Inbox <span style="font-family: 'JetBrains Mono', monospace; color: #fbbf24">6</span></button>
<button type="button" aria-pressed="false" style="border: 0; background: transparent; color: #a1a1aa; font-family: inherit; font-size: 13px">Board</button>
</div>
<h2 style="height: 26px; display: flex; align-items: center; margin: 0; padding: 0 4px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; color: #8b8b94">VIEWS</h2>
<div style="height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 4px; color: #d4d4d8"><span style="flex: 1">web-app のレビュー</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #fbbf24">3</span></div>
<div style="height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 4px; color: #d4d4d8"><span style="flex: 1">Errors</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #f87171">1</span></div>
<h2 style="height: 26px; display: flex; align-items: center; margin: 12px 0 0; padding: 0 4px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; color: #8b8b94">Starred</h2>
<sc-for list="{{starred}}" as="s" hint-placeholder-count="2">
<div style="margin: 0 -8px"><dc-import name="BeforeUsageSessionRow" s="{{ s }}" density="compact" hint-size="100%,69px"></dc-import></div>
</sc-for>
<h2 style="height: 26px; display: flex; align-items: center; margin: 14px 0 0; padding: 0 4px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; color: #8b8b94">PM</h2>
<sc-for list="{{pm}}" as="s" hint-placeholder-count="2">
<div style="margin: 0 -8px"><dc-import name="BeforeUsageSessionRow" s="{{ s }}" density="compact" hint-size="100%,69px"></dc-import></div>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      starred: [
        { status: 'Question', unread: true, title: '通知の再送処理を見直す', age: '8s', role: 'development', engine: 'claude', taskRef: 'P1 #2048', taskTitle: '通知の信頼性を上げる', repo: 'example/service' },
        { status: 'Working', title: '配信ログの保存期間を決める', age: '2m', role: 'research', engine: 'codex', taskRef: 'P2 #2051', taskTitle: '監視を整える', repo: 'example/observability' }
      ],
      pm: [
        { status: 'Plan', title: '段階的な公開を進める', age: '5m', role: 'PM', engine: 'claude', taskRef: 'P2 #2052', taskTitle: '新しい設定を段階的に公開する', repo: 'example/web-app' },
        { status: 'Working', title: '通知まわりの改修', age: '12m', role: 'PM', engine: 'claude', taskRef: 'P1 #2048', taskTitle: '通知の信頼性を上げる', repo: 'example/service' }
      ]
    };
  }
}
</script>
</body>
</html>
