<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Withdrawn to-do or proposal card, reduced to its state and title</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<article aria-label="{{label}}" style="box-sizing: border-box; width: 100%; border: 1px solid #3f3f46; padding: 14px; background: #0a0a0a; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: {{fs}}; line-height: 1.55"><h2 style="margin: 0 0 4px; color: #a1a1aa; font-size: {{headFs}}; font-weight: 700">{{head}}<sc-if value="{{hasNote}}" hint-placeholder-val="{{ true }}"><span style="font-weight: 400"> · {{note}}</span></sc-if></h2><h3 style="margin: 0; color: #a1a1aa; font-size: 17px; font-weight: 700">{{title}}</h3></article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"kind":{"editor":"enum","options":["todo","proposal"],"default":"todo"},"form":{"editor":"enum","options":["pc","phone"],"default":"pc"},"title":{"editor":"text","default":"通知の音を実機で確かめる"},"note":{"editor":"text","default":"session ended 14:32"},"$preview":{"width":672,"height":80}}'>
class Component extends DCLogic {
  renderVals() {
    const proposal = (this.props.kind ?? 'todo') === 'proposal';
    const phone = (this.props.form ?? 'pc') === 'phone';
    // note: why it was withdrawn, after the state. The server withdraws what is still unanswered when the session ends.
    const note = this.props.note ?? 'session ended 14:32';
    return {
      label: proposal ? 'Proposal, withdrawn' : 'User task, withdrawn',
      head: proposal ? 'Proposal · withdrawn' : 'To-do · withdrawn',
      note, hasNote: !!note,
      title: this.props.title ?? '通知の音を実機で確かめる',
      fs: phone ? '15px' : '14px', headFs: phone ? '12.5px' : '12px'
    };
  }
}
</script>
</body>
</html>
