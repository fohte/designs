<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Close failure · E · phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0a0a0a">
<dc-import name="PhoneChat" state="review" done="{{ true }}" activity="{{ activity }}" hint-size="390px,844px"></dc-import>
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; background: rgba(0, 0, 0, 0.55)">
<dc-import name="ConfirmDialog" form="sheet" head="Close failed" body="Uncommitted changes are left in the worktree. Commit or move them, or close the session and keep the worktree." code="~/src/example/service/.worktrees/retry-backoff" action="Close and keep worktree" session="{{ session }}" hint-size="100%,280px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      activity: { count: '1', tone: 'failure' },
      session: { state: 'Done', dot: '#a1a1aa', round: false, color: '#a1a1aa', title: '通知の再送処理を見直す' }
    };
  }
}
</script>
</body>
</html>
