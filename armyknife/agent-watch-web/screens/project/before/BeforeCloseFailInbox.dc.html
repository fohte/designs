<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Close failed from the Inbox</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; display: flex; overflow: hidden; background: #0a0a0a; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif">
<div style="flex: none; width: 240px"><dc-import name="BeforeNav" view="inbox" activity="{{ activity }}" hint-size="240px,900px"></dc-import></div>
<div style="flex: none; width: 460px; border-right: 1px solid #2a2a2a"><dc-import name="BeforeInboxList" filter="none" current="{{ zero }}" close="failed" close-reason="Left in the worktree: 2 running processes" hint-size="460px,900px"></dc-import></div>
<div style="flex: 1; min-width: 0"><dc-import name="BeforeConversation" variant="question" hint-size="100%,900px"></dc-import></div>
<div style="position: absolute; z-index: 10; right: 24px; bottom: 224px; width: 360px"><dc-import name="BeforeToastStack" items="{{ toasts }}" hint-size="100%,220px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const checks = { path: '~/src/example/observability/.worktrees/alert-routing', files: [], branch: 'feature/alert-routing', merged: true, processes: ['48213 node', '48250 vite'] };
    return {
      zero: 0,
      activity: { count: '1', tone: 'failure' },
      toasts: [{ result: 'closeFailed', session: 'アラートの送り先を決める', checks }]
    };
  }
}
</script>
</body>
</html>
