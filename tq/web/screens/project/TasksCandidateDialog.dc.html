<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Task search dialog</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
input::placeholder{color:#71717a}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif">
<dc-import name="TasksDesktop" firstRow="plain" hint-size="1440px,900px"></dc-import>
<div style="position: absolute; inset: 0; z-index: 50; background: rgba(0,0,0,.4); backdrop-filter: blur(4px)"></div>
<div role="dialog" aria-labelledby="candidate-title" style="position: absolute; left: 50%; top: 50%; z-index: 51; transform: translate(-50%, -50%); width: 384px; box-sizing: border-box; display: grid; gap: 16px; padding: 16px; background: #0a0a0a; box-shadow: 0 0 0 1px #222222; font-size: 14px; line-height: 20px">
<h2 id="candidate-title" style="margin: 0; font-size: 16px; line-height: 1; font-weight: 500">{{title}}</h2>
<input type="text" aria-label="Search tasks" placeholder="Search tasks..." value="{{query}}" onChange="{{noop}}" style="width: 100%; height: 32px; box-sizing: border-box; padding: 0 10px; border: 1px solid #ef4444; box-shadow: 0 0 0 1px rgba(239,68,68,.5); background: transparent; color: #fafafa; font: inherit; font-size: 14px; outline: none">
<div style="max-height: 288px; overflow-y: auto; color: #fafafa">
<sc-if value="{{isMove}}" hint-placeholder-val="{{ true }}">
<div role="listbox" aria-label="Tasks" style="display: flex; flex-direction: column">
<button type="button" role="option" aria-selected="true" style="width: 100%; min-height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border: 0; background: #1f1f1f; color: #fafafa; font: inherit; text-align: left"><span style="flex: none; color: #52525b">#46</span><span style="min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">エラーレスポンスの形式をそろえる</span></button>
<button type="button" role="option" aria-selected="false" style="width: 100%; min-height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border: 0; background: transparent; color: #fafafa; font: inherit; text-align: left"><span style="flex: none; color: #52525b">#61</span><span style="min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">エラー画面の文言を見直す</span><span style="margin-left: auto; flex: none; font-size: 12px; line-height: 16px; color: #52525b">← #12</span></button>
<button type="button" role="option" aria-selected="false" style="width: 100%; min-height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border: 0; background: transparent; color: #fafafa; font: inherit; text-align: left"><span style="flex: none; color: #52525b">#62</span><span style="min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">エラーログの通知先を決める</span></button>
</div>
</sc-if>
<sc-if value="{{isLink}}" hint-placeholder-val="{{ false }}">
<div style="padding: 32px 16px; text-align: center; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px; color: #52525b">Type to search tasks</div>
</sc-if>
<sc-if value="{{isDuplicate}}" hint-placeholder-val="{{ false }}">
<div style="padding: 32px 16px; text-align: center; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px; color: #52525b">no results for "{{query}}"</div>
</sc-if>
</div>
<sc-if value="{{isDuplicate}}" hint-placeholder-val="{{ false }}">
<div style="border-top: 1px solid #2a2a2a">
<button type="button" style="width: 100%; min-height: 36px; display: flex; align-items: center; padding: 0 12px; border: 0; background: transparent; font: inherit"><span style="width: 100%; text-align: center; color: #71717a">Close without linking</span></button>
</div>
</sc-if>
<button type="button" aria-label="Close" style="position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #fafafa"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["move","link","duplicate"],"default":"move"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const mode = this.props.mode ?? 'move';
    const titles = { move: 'Move #37 under', link: 'Link existing task', duplicate: 'Duplicate of' };
    const queries = { move: 'エラー', link: '', duplicate: 'ケーブル' };
    return {
      title: titles[mode],
      query: queries[mode],
      isMove: mode === 'move',
      isLink: mode === 'link',
      isDuplicate: mode === 'duplicate',
      noop: () => {},
    };
  }
}
</script>
</body>
</html>
