<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Phone: results after moving to another session</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; background: #0a0a0a">
<dc-import name="PhoneChat" activity="{{ activity }}" toasts="{{ toasts }}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      activity: { count: '1', tone: 'failure' },
      toasts: [
        { result: 'closed', session: 'アラートの送り先を決める' },
        { result: 'mergeFailed', pr: 2049, session: '配信チェックの PR を確認する', reason: 'Head branch was updated after you confirmed. Confirm the new head to merge.' }
      ]
    };
  }
}
</script>
</body>
</html>
