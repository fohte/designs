<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Status line</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; height: 24px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 0 12px; border-top: 1px solid #2a2a2a; background: #141414; color: #52525b; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px; white-space: nowrap">
<span><span style="color: #ef4444">&gt;</span> <span style="color: #a1a1aa">{{path}}</span></span>
<span style="color: #2a2a2a">|</span>
<span>12 todo · 4 queued</span>
<div style="margin-left: auto; display: flex; gap: 14px">
<span><span style="color: #a1a1aa">⌘K</span> search</span>
<span><span style="color: #a1a1aa">n</span> new</span>
<span><span style="color: #a1a1aa">g t</span> goto</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"path":{"editor":"text","default":"/tasks"},"$preview":{"width":1240,"height":40}}'>
class Component extends DCLogic {
  renderVals() {
    return { path: this.props.path ?? '/tasks' };
  }
}
</script>
</body>
</html>
