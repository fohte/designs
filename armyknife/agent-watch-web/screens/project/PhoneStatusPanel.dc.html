<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Phone: session status panel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 100%; height: 100vh; overflow: hidden; background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 15px; line-height: 1.55">

<section aria-label="{{sectionLabel}}" style="position: absolute; inset: 0; display: flex; flex-direction: column; background: #0f0f0f">

<header style="flex: none; display: grid; grid-template-columns: {{headCols}}; align-items: center; column-gap: 4px; padding: 6px {{headPadR}} 6px {{headPadL}}; border-bottom: 1px solid {{headBorder}}">
<sc-if value="{{tabbed}}" hint-placeholder-val="{{ true }}"><button type="button" aria-label="Back to the conversation" style="width: 44px; height: 44px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #d4d4d8"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button></sc-if>
<sc-if value="{{tabbed}}" hint-placeholder-val="{{ true }}"><div style="min-width: 0; display: flex; flex-direction: column"><h1 style="margin: 0; font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Session status</h1><span style="font-size: 12.5px; color: #a1a1aa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">通知の再送処理を見直す</span></div></sc-if>
<sc-if value="{{full}}" hint-placeholder-val="{{ false }}"><div style="min-width: 0; display: flex; flex-direction: column"><h1 style="margin: 0; font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{webName}}</h1><span style="font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #a1a1aa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{webUrl}}</span></div>
<a href="{{webUrl}}" target="_blank" rel="noopener noreferrer" aria-label="Open in a new tab" style="width: 44px; height: 44px; display: grid; place-items: center; color: #a1a1aa"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"></path><path d="M10 14 21 3"></path><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path></svg></a>
<button type="button" aria-label="Close web UI" style="width: 44px; height: 44px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #d4d4d8"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></sc-if>
</header>

<sc-if value="{{tabbed}}" hint-placeholder-val="{{ true }}"><dc-import name="StatusTabs" tab="{{tab}}" size="phone" canvas-tab="{{canvasTab}}" linked="{{linked}}" tasks="{{tasks}}" hint-size="100%,45px"></dc-import></sc-if>
<div style="position: relative; flex: 1; min-height: 0"><dc-import name="StatusBody" tab="{{tab}}" size="phone" linked="{{linked}}" tasks="{{tasks}}" full="{{full}}" preview="{{preview}}" hint-size="100%,742px"></dc-import></div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"canvasTab":{"editor":"boolean","default":false},"tab":{"editor":"enum","options":["running","tasks","tree","review","decisions","crit","canvas"],"default":"running"},"linked":{"editor":"boolean","default":false},"tasks":{"editor":"enum","options":["one","many"],"default":"one"},"full":{"editor":"boolean","default":false},"preview":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    // A full-screen page pushed over the conversation; the back button returns to it.
    // The tabs and their contents are StatusTabs and StatusBody, the same parts the PC's StatusPanel imports.
    const tab = this.props.tab ?? 'running';
    const canvas = tab === 'canvas';
    // full: only the web UI, pushed over the conversation by a web UI link; the × returns to the conversation.
    const full = this.props.full ?? false;
    return {
      tab, full, preview: this.props.preview ?? false,
      canvasTab: this.props.canvasTab ?? false,
      linked: this.props.linked ?? false,
      // tasks many: opened from the conversation's +3; the tasks that are not primary are emphasized so the one to switch to stands out.
      tasks: this.props.tasks ?? 'one',
      tabbed: !full,
      sectionLabel: full ? (canvas ? 'canvas' : 'crit') : 'Session status',
      headPadR: full ? '4px' : '16px',
      headPadL: full ? '16px' : '0',
      headCols: full ? '1fr auto auto' : '44px 1fr auto',
      headBorder: full ? '#2a2a2a' : 'transparent',
      webName: canvas ? 'canvas' : 'crit',
      webUrl: canvas ? 'http://127.0.0.1:4720/design/k3x9/#page-options' : 'http://127.0.0.1:3000/review/example'
    };
  }
}
</script>
</body>
</html>
