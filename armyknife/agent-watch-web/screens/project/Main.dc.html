<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>agent watch: spec summary</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 3900px; box-sizing: border-box; padding: 72px 96px; display: flex; flex-direction: column; gap: 40px; background: #0a0a0a; color: #d4d4d8; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 15px; line-height: 1.7">
<header>
<div style="font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700; color: #fafafa"><span style="margin-right: 10px; color: #ef4444">&gt;</span>agent watch</div>
<h1 style="margin: 12px 0 0; font-size: 32px; font-weight: 700; color: #fafafa">いまの画面の仕様</h1>
<p style="margin: 8px 0 0; color: #a1a1aa">Claude Code と Codex のセッションを見張り、返事を待っているものに答えるための画面です。この canvas は fohte/armyknife の agent-watch-web のいまのコードに合わせて描いています。</p>
</header>
<div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px 40px">
<sc-for list="{{sections}}" as="s" hint-placeholder-count="10">
<section style="display: flex; flex-direction: column; gap: 8px; padding-top: 16px; border-top: 1px solid #2a2a2a">
<h2 style="margin: 0; font-size: 17px; font-weight: 700; color: #fafafa">{{s.title}}</h2>
<sc-for list="{{s.items}}" as="i" hint-placeholder-count="3">
<p style="margin: 0; font-size: 14px">{{i}}</p>
</sc-for>
</section>
</sc-for>
</div>
</div>
</x-dc>
