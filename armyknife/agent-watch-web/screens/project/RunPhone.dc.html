<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Run command on iPhone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0a0a0a; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif">
<sc-if value="{{chat}}" hint-placeholder-val="{{ true }}"><dc-import name="PhoneChat" state="review" activity="{{ activity }}" bang="{{ bang }}" bang-highlight="{{ highlight }}" toasts="{{ toasts }}" action-line="{{ line }}" hint-size="390px,844px"></dc-import></sc-if>
<sc-if value="{{open}}" hint-placeholder-val="{{ false }}"><dc-import name="PhoneDrawer" activity="{{ activity }}" activity-open="{{ open }}" activity-items="{{ rows }}" hint-size="390px,844px"></dc-import></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["running","succeeded","failed","timedOut","output","activity"],"default":"running"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    // output: Show output was pressed; the toast is gone, so the line at the conversation's end shows and the result message is outlined.
    const state = this.props.state ?? 'running';
    const cmd = 'a agent todo add --title "差分を crit で見る"';
    const session = '通知の再送処理を見直す';
    const result = { running: 'running', succeeded: 'succeeded', timedOut: 'timedOut' }[state] ?? 'commandFailed';
    const main = { result, cmd, session, exit: 1 };
    const rows = [
      { result: 'running', cmd: 'a agent proposal add --title "通知の文言を選ぶ"', session: '通知の文言を決める', time: '12:05' },
      { result: 'timedOut', cmd: 'a agent todo add --title "実機で音を確かめる"', session: '通知の音を選べるようにする', time: '12:04' },
      { ...main, time: '12:03' },
      { result: 'succeeded', cmd: 'a agent todo add --title "ログの保存期間を決める"', session: '配信ログの保存期間を決める', time: '12:01' }
    ];
    const open = state === 'activity';
    return {
      open, chat: !open,
      bang: state === 'output' ? 'failed' : state,
      highlight: state === 'output',
      activity: { count: '2', tone: 'failure' },
      line: { ...main, time: state === 'running' ? '' : '12:03' },
      toasts: open || state === 'output' ? [] : [main],
      rows
    };
  }
}
</script>
</body>
</html>
