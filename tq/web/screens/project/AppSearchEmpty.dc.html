<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Search palette, empty query and no results</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #0a0a0a; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif">
<dc-import name="AppBackdrop" hint-size="1440px,900px"></dc-import>
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0, 0, 0, 0.5)"></div>

<div role="dialog" aria-modal="true" aria-label="Search" style="position: absolute; top: 135px; left: 400px; width: 640px; max-height: 480px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; border: 1px solid #2a2a2a; background: #141414; color: #fafafa">

<div style="flex: none; height: 48px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid #2a2a2a">
<span aria-hidden="true" style="font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 14px; line-height: 20px; font-weight: 700; color: #ef4444">›</span>
<span style="max-width: 128px; display: inline-flex"><span style="height: 20px; box-sizing: border-box; display: inline-flex; align-items: center; gap: 4px; padding: 2px 6px; border: 1px solid #71717a; color: #fafafa; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px"><span style="max-width: 96px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">context:personal</span><button type="button" aria-label="Remove context:personal scope" style="display: flex; padding: 0; border: 0; background: transparent; color: #71717a"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></span></span>
<input type="text" aria-label="Search tasks" placeholder="Search tasks..." value="{{inputValue}}" style="flex: 1; min-width: 0; height: 32px; box-sizing: border-box; padding: 4px; border: 0; border-bottom: 1px solid transparent; background: transparent; color: #fafafa; font-family: inherit; font-size: 14px; outline: none">
<span style="min-width: 44px; box-sizing: border-box; display: inline-flex; justify-content: center; padding: 2px 6px; border: 1px solid #2a2a2a; border-radius: 4px; background: #141414; color: #fafafa; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px">Esc</span>
</div>

<div role="listbox" aria-label="Search results" style="flex: 1; min-height: 0; overflow-y: auto; padding: 8px 0">
<sc-if value="{{isInitial}}" hint-placeholder-val="{{ true }}">
<div style="padding: 32px 16px; text-align: center; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px; color: #52525b">Type to search tasks</div>
</sc-if>
<sc-if value="{{isNoResults}}" hint-placeholder-val="{{ false }}">
<div style="padding: 32px 16px; text-align: center; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px; color: #52525b">no results for "倉庫の契約"</div>
</sc-if>
<sc-if value="{{isRecent}}" hint-placeholder-val="{{ false }}">
<div role="group" aria-label="Recently viewed">
<div style="padding: 4px 16px; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px; letter-spacing: 0.1em; color: #52525b">Recently viewed</div>
<div role="option" aria-selected="true" style="min-height: 36px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: #1f1f1f; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace"><span style="flex: none; width: 48px; font-size: 10px; line-height: 14px; color: #71717a">#221</span><span style="min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; line-height: 20px">引っ越し業者の見積もりを 3 社から取る</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-left: auto"><path d="M20 6 9 17l-5-5"></path></svg></div>
<div role="option" aria-selected="false" style="min-height: 36px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 12px; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace"><span style="flex: none; width: 48px; font-size: 10px; line-height: 14px; color: #71717a">#198</span><span style="min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; line-height: 20px">ブログのビルドを高速化する</span></div>
<div role="option" aria-selected="false" style="min-height: 36px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 12px; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace"><span style="flex: none; width: 48px; font-size: 10px; line-height: 14px; color: #71717a">#187</span><span style="min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; line-height: 20px">積読の新書を 1 冊読み終える</span></div>
<div role="option" aria-selected="false" style="min-height: 36px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 12px; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace"><span style="flex: none; width: 48px; font-size: 10px; line-height: 14px; color: #71717a">Project</span><span style="min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; line-height: 20px">引っ越し準備</span></div>
<div role="option" aria-selected="false" style="min-height: 36px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 12px; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace"><span style="flex: none; width: 48px; font-size: 10px; line-height: 14px; color: #71717a">Project</span><span style="min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; line-height: 20px">個人サイト改修</span></div>
</div>
</sc-if>
</div>

<div style="flex: none; min-height: 36px; box-sizing: border-box; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 16px; border-top: 1px solid #2a2a2a; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px; color: #3f3f46">
<span style="min-width: 44px; box-sizing: border-box; display: inline-flex; justify-content: center; padding: 2px 6px; border: 1px solid #2a2a2a; border-radius: 4px; background: #141414; color: #fafafa">↑↓</span><span>navigate</span>
<span style="min-width: 44px; box-sizing: border-box; display: inline-flex; justify-content: center; padding: 2px 6px; border: 1px solid #2a2a2a; border-radius: 4px; background: #141414; color: #fafafa">Tab</span><span>filter / autocomplete</span>
<span style="min-width: 44px; box-sizing: border-box; display: inline-flex; justify-content: center; padding: 2px 6px; border: 1px solid #2a2a2a; border-radius: 4px; background: #141414; color: #fafafa">Enter</span><span>open</span>
<span style="min-width: 44px; box-sizing: border-box; display: inline-flex; justify-content: center; padding: 2px 6px; border: 1px solid #2a2a2a; border-radius: 4px; background: #141414; color: #fafafa">Esc</span><span>close</span>
<sc-if value="{{inputEmpty}}" hint-placeholder-val="{{ true }}">
<span style="min-width: 44px; box-sizing: border-box; display: inline-flex; justify-content: center; padding: 2px 6px; border: 1px solid #2a2a2a; border-radius: 4px; background: #141414; color: #fafafa">?</span><span>help</span>
<span style="min-width: 44px; box-sizing: border-box; display: inline-flex; justify-content: center; padding: 2px 6px; border: 1px solid #2a2a2a; border-radius: 4px; background: #141414; color: #fafafa">Backspace</span><span>clear context</span>
</sc-if>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["initial","recent","noResults"],"default":"initial"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const state = this.props.state ?? 'initial';
    return {
      isInitial: state === 'initial',
      isRecent: state === 'recent',
      isNoResults: state === 'noResults',
      inputEmpty: state !== 'noResults',
      inputValue: state === 'noResults' ? '倉庫の契約' : ''
    };
  }
}
</script>
</body>
</html>
