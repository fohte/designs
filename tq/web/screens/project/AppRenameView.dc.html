<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Rename view dialog</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #0a0a0a; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif">
<dc-import name="AppBackdrop" hint-size="1440px,900px"></dc-import>
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(4px)"></div>
<div role="dialog" aria-modal="true" aria-labelledby="rename-view-title" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 384px; box-sizing: border-box; display: grid; gap: 16px; padding: 16px; background: #0a0a0a; box-shadow: 0 0 0 1px rgba(250, 250, 250, 0.1); color: #fafafa; font-size: 14px; line-height: 20px">
<div style="display: flex; flex-direction: column; gap: 8px"><h2 id="rename-view-title" style="margin: 0; font-size: 16px; line-height: 1; font-weight: 500">Rename view</h2></div>
<input type="text" aria-label="View name" value="今週やる" style="width: 100%; height: 32px; box-sizing: border-box; padding: 4px 10px; border: 1px solid #ef4444; box-shadow: 0 0 0 1px rgba(239, 68, 68, 0.5); background: #141414; color: #fafafa; font-family: inherit; font-size: 14px; outline: none">
<sc-if value="{{isError}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; font-size: 14px; line-height: 20px; color: #ef4444">A view with this name already exists</p></sc-if>
<div style="margin: 0 -16px -16px; display: flex; justify-content: flex-end; gap: 8px; padding: 16px; border-top: 1px solid #2a2a2a; background: #0f0f0f">
<button type="button" style="height: 32px; display: inline-flex; align-items: center; padding: 0 10px; border: 1px solid #2a2a2a; background: #0a0a0a; color: #fafafa; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 500">Cancel</button>
<button type="button" style="height: 32px; display: inline-flex; align-items: center; padding: 0 10px; border: 1px solid #71717a; background: #1f1f1f; color: #fafafa; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 500">Save</button>
</div>
<button type="button" style="position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; padding: 0; border: 1px solid transparent; background: transparent; color: #fafafa"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap">Close</span></button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"error":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { isError: this.props.error ?? false };
  }
}
</script>
</body>
</html>
