<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>iPhone scene</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 15px; line-height: 1.55">
<sc-if value="{{isInbox}}" hint-placeholder-val="{{ false }}"><dc-import name="PhoneInbox" wait="{{i.wait}}" sheet="{{i.sheet}}" later-until="{{ i.laterUntil }}" swipe="{{ i.swipe }}" activity="{{ activity }}" hint-size="390px,844px"></dc-import></sc-if>
<sc-if value="{{isChat}}" hint-placeholder-val="{{ true }}"><dc-import name="PhoneChat" state="{{c.state}}" menu-open="{{ c.menuOpen }}" menu-wait="{{ c.menuWait }}" wait="{{ c.wait }}" toasts="{{ toasts }}" timeline="{{ c.timeline }}" resumed="{{ c.resumed }}" activity="{{ activity }}" hint-size="390px,844px"></dc-import></sc-if>
<sc-if value="{{isDrawer}}" hint-placeholder-val="{{ false }}"><dc-import name="PhoneDrawer" activity="{{ activity }}" activity-open="{{ true }}" activity-items="{{ activityItems }}" hint-size="390px,844px"></dc-import></sc-if>

<sc-if value="{{isPaletteCmd}}" hint-placeholder-val="{{ false }}">
<main style="position: absolute; inset: 0; display: flex; flex-direction: column; background: #0a0a0a">
<header style="flex: none; min-height: 50px; display: flex; align-items: center; gap: 8px; padding: 8px 8px 6px 16px; border-bottom: 1px solid #2a2a2a"><span aria-hidden="true" style="color: #8b8b94">⌕</span><input aria-label="Jump to" value="&gt;until" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: #fafafa; font-family: inherit; font-size: 16px"><button type="button" style="height: 44px; padding: 0 8px; border: 0; background: transparent; color: #d4d4d8; font-family: inherit; font-size: 16px">Cancel</button></header>
<div role="listbox" style="flex: 1; min-height: 0; padding: 4px 0">
<h2 style="height: 28px; display: flex; align-items: center; margin: 0; padding: 0 16px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; color: #8b8b94">COMMANDS</h2>
<div role="option" aria-selected="true" style="min-height: 60px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; padding: 6px 16px; background: #2a2a2e"><span>› Later until done…</span><span style="font-size: 12.5px; color: #a1a1aa">通知の再送処理を見直す · Block tq #2048 on tasks, issues or PRs</span></div>
<div role="option" aria-selected="false" style="min-height: 60px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; padding: 6px 16px"><span>› Later</span><span style="font-size: 12.5px; color: #a1a1aa">通知の再送処理を見直す · Bring it back at a time</span></div>
<div role="option" aria-selected="false" style="min-height: 60px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; padding: 6px 16px"><span>› Show blocked tq tasks</span><span style="font-size: 12.5px; color: #a1a1aa">tq #2048 · 2 sessions in Later</span></div>
</div>
</main>
</sc-if>

<sc-if value="{{isPalettePicker}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; background: #161616"><dc-import name="WaitPicker" form="phone" frame="palette" mode="{{p.mode}}" step="{{p.step}}" on-clear="{{ p.onClear }}" action="{{p.action}}" h="844px" hint-size="390px,844px"></dc-import></div>
</sc-if>

<sc-if value="{{isSheetPicker}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; z-index: 30; display: flex; flex-direction: column; justify-content: flex-end; background: rgba(0, 0, 0, 0.55)">
<dc-import name="WaitPicker" form="phone" frame="dialog" mode="{{p.mode}}" step="{{p.step}}" on-clear="{{ p.onClear }}" head="{{p.head}}" action="{{p.action}}" h="792px" hint-size="390px,792px"></dc-import>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"screen":{"editor":"enum","options":["inbox","chat","drawer","paletteCmd","palettePicker"],"default":"chat"},"inbox":{"editor":null},"chat":{"editor":null},"picker":{"editor":null},"sheetPicker":{"editor":"boolean","default":false},"toasts":{"editor":null},"activity":{"editor":null},"activityItems":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const sc = this.props.screen ?? 'chat';
    return {
      isInbox: sc === 'inbox', isChat: sc === 'chat', isDrawer: sc === 'drawer',
      isPaletteCmd: sc === 'paletteCmd', isPalettePicker: sc === 'palettePicker',
      // sheetPicker: the picker as a sheet over the screen (from the Later sheet or the ⋯ menu).
      isSheetPicker: this.props.sheetPicker ?? false,
      i: { wait: 'none', sheet: 'none', laterUntil: false, swipe: false, ...(this.props.inbox ?? {}) },
      c: { state: 'question', menuOpen: false, menuWait: false, wait: null, timeline: [], resumed: false, ...(this.props.chat ?? {}) },
      p: { mode: 'suggest', step: 'open', onClear: false, head: 'Wait for…', action: 'Wait', ...(this.props.picker ?? {}) },
      toasts: this.props.toasts ?? [],
      activity: this.props.activity ?? { count: 3, tone: 'idle' },
      activityItems: this.props.activityItems ?? []
    };
  }
}
</script>
</body>
</html>
