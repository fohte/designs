<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Compact merge summary above the composer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; box-sizing: border-box; display: flex; justify-content: {{justify}}; padding: {{pad}}; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: {{fs}}; line-height: 1.5">
<button type="button" aria-label="{{aria}}" style="width: {{btnW}}; min-height: {{h}}; box-sizing: border-box; display: inline-flex; align-items: center; gap: 8px; padding: 0 12px; border: 1px solid {{border}}; background: #141414; color: #fafafa; font-family: inherit; font-size: {{fs}}; text-align: left; white-space: nowrap">
<sc-if value="{{hasFailed}}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; align-items: center; gap: 6px; color: #f87171"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><line x1="12" x2="12" y1="8" y2="12"></line><line x1="12" x2="12.01" y1="16" y2="16"></line></svg>{{failedText}}</span></sc-if>
<sc-if value="{{hasMerging}}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; align-items: center; gap: 6px; color: #d4d4d8"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg>{{mergingText}}</span></sc-if>
<sc-if value="{{hasReady}}" hint-placeholder-val="{{ true }}"><span style="display: inline-flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 7px; height: 7px; background: #4ade80"></span>{{readyText}}</span></sc-if>
<span aria-hidden="true" style="margin-left: auto; padding-left: 4px; color: #8b8b94"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -2px"><path d="m18 15-6-6-6 6"></path></svg></span>
</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"ready":{"editor":"int","default":3},"merging":{"editor":"int","default":0},"failed":{"editor":"int","default":0},"form":{"editor":"enum","options":["pc","phone"],"default":"pc"},"$preview":{"width":760,"height":48}}'>
class Component extends DCLogic {
  renderVals() {
    // Counts of the session's merge entries that are out of view above. Pressing it scrolls up to the oldest of them.
    const phone = (this.props.form ?? 'pc') === 'phone';
    const ready = this.props.ready ?? 3, merging = this.props.merging ?? 0, failed = this.props.failed ?? 0;
    const readyText = ready + ' ready to merge', mergingText = merging + ' merging', failedText = failed + ' merge failed';
    return {
      hasReady: ready > 0, hasMerging: merging > 0, hasFailed: failed > 0, readyText, mergingText, failedText,
      aria: [failed && failedText, merging && mergingText, ready && readyText].filter(Boolean).join(', ') + '. Scroll to them',
      border: failed ? '#f87171' : '#3f3f46',
      justify: phone ? 'stretch' : 'flex-start',
      pad: phone ? '8px 12px 0' : '8px max(24px, calc((100% - 712px) / 2)) 0',
      btnW: phone ? '100%' : 'auto', h: phone ? '44px' : '30px',
      fs: phone ? '14px' : '12.5px'
    };
  }
}
</script>
</body>
</html>
