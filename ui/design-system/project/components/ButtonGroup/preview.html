<!-- @dsCard group="Actions" height=120 subtitle="static rendition" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ButtonGroup</title>
</head>
<body>
<div class="fui-row">
  <div class="fui-button-group" role="group" aria-label="Pages">
    <button class="fui-button fui-button--outline fui-button--icon-xs" type="button" aria-label="Previous"><svg class="fui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
    <button class="fui-button fui-button--outline fui-button--xs" type="button">Page 2 of 5</button>
    <button class="fui-button fui-button--outline fui-button--icon-xs" type="button" aria-label="Next"><svg class="fui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
  </div>
  <div class="fui-button-group" role="group" aria-label="View">
    <button class="fui-button fui-button--outline" type="button">Day</button>
    <button class="fui-button fui-button--outline is-focus" type="button">Week</button>
    <button class="fui-button fui-button--outline" type="button">Month</button>
  </div>
</div>
<div class="fui-row">
  <span class="fui-note">adjacent buttons drop their left border; a focused one rises above its neighbours</span>
</div>
</body>
</html>
