<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Edit schedule sheet on a phone, all events</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
input::placeholder{color:#71717a}
</style>
</helmet>
<div style="width: 390px; height: 1100px; position: relative; overflow: hidden; background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif">
<dc-import name="DayPhoneCalendar" hint-size="390px,844px"></dc-import>
<div style="position: absolute; inset: 0; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px)"></div>
<div role="dialog" aria-labelledby="schedule-edit-sheet-title" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding-bottom: 20px; background: #141414; box-shadow: 0 0 0 1px rgba(250, 250, 250, 0.1), 0 25px 50px -12px rgba(0, 0, 0, 0.25)">

<div style="height: 48px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #2a2a2a; background: #141414">
<h2 id="schedule-edit-sheet-title" style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 600">Edit Schedule</h2>
<button type="button" aria-label="Close" style="width: 28px; height: 28px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #fafafa"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
</div>

<div style="display: flex; flex-direction: column; gap: 16px; padding: 16px 20px 0">

<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px; letter-spacing: 0.1em; color: #52525b">APPLY TO</span>
<div role="group" aria-label="Apply to" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border: 1px solid #2a2a2a">
<button type="button" aria-pressed="false" style="min-height: 32px; padding: 0 4px; border: 0; background: transparent; color: #fafafa; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500">This event</button>
<button type="button" aria-pressed="false" style="min-height: 32px; padding: 0 4px; border: 0; background: transparent; color: #fafafa; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500">This and following</button>
<button type="button" aria-pressed="true" style="min-height: 32px; padding: 0 4px; border: 1px solid #2a2a2a; background: transparent; color: #a1a1aa; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500">All events</button>
</div>
</div>

<input type="text" aria-label="Schedule title" placeholder="Schedule title" value="ランニング" style="height: 32px; box-sizing: border-box; padding: 0; border: 0; border-bottom: 1px solid transparent; background: transparent; color: #fafafa; font-family: inherit; font-size: 16px; outline: none">
<div style="height: 1px; background: #2a2a2a"></div>

<div style="display: flex; flex-wrap: wrap; gap: 8px">
<button type="button" style="display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid #71717a; background: transparent; color: #fafafa; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M3 10h18"></path><path d="M8 14h.01"></path><path d="M12 14h.01"></path><path d="M16 14h.01"></path><path d="M8 18h.01"></path><path d="M12 18h.01"></path><path d="M16 18h.01"></path></svg>Start: 2026-08-04</button>
<button type="button" style="display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid #71717a; background: transparent; color: #fafafa; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>19:00</button>
<button type="button" style="display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid #71717a; background: transparent; color: #fafafa; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>20:00</button>
<button type="button" style="display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid #71717a; background: transparent; color: #fafafa; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m17 2 4 4-4 4"></path><path d="M3 11v-1a4 4 0 0 1 4-4h14"></path><path d="m7 22-4-4 4-4"></path><path d="M21 13v1a4 4 0 0 1-4 4H3"></path></svg>Repeat weekly</button>
<button type="button" style="display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid #71717a; background: transparent; color: #fafafa; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"></path><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"></path><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"></path></svg>Personal</button>
</div>

<div role="group" aria-label="Weekdays" style="display: flex; gap: 4px">
<button type="button" aria-label="Sunday" aria-pressed="false" style="width: 32px; height: 32px; padding: 0; border: 1px solid #2a2a2a; background: transparent; color: #a1a1aa; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 500">S</button>
<button type="button" aria-label="Monday" aria-pressed="false" style="width: 32px; height: 32px; padding: 0; border: 1px solid #2a2a2a; background: transparent; color: #a1a1aa; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 500">M</button>
<button type="button" aria-label="Tuesday" aria-pressed="true" style="width: 32px; height: 32px; padding: 0; border: 1px solid #71717a; background: #1f1f1f; color: #fafafa; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 500">T</button>
<button type="button" aria-label="Wednesday" aria-pressed="false" style="width: 32px; height: 32px; padding: 0; border: 1px solid #2a2a2a; background: transparent; color: #a1a1aa; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 500">W</button>
<button type="button" aria-label="Thursday" aria-pressed="true" style="width: 32px; height: 32px; padding: 0; border: 1px solid #71717a; background: #1f1f1f; color: #fafafa; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 500">T</button>
<button type="button" aria-label="Friday" aria-pressed="false" style="width: 32px; height: 32px; padding: 0; border: 1px solid #2a2a2a; background: transparent; color: #a1a1aa; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 500">F</button>
<button type="button" aria-label="Saturday" aria-pressed="true" style="width: 32px; height: 32px; padding: 0; border: 1px solid #71717a; background: #1f1f1f; color: #fafafa; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 500">S</button>
</div>

<div><button type="button" aria-expanded="false" style="height: 28px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; border: 0; background: transparent; color: #fafafa; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="21" x2="14" y1="4" y2="4"></line><line x1="10" x2="3" y1="4" y2="4"></line><line x1="21" x2="12" y1="12" y2="12"></line><line x1="8" x2="3" y1="12" y2="12"></line><line x1="21" x2="16" y1="20" y2="20"></line><line x1="12" x2="3" y1="20" y2="20"></line><line x1="14" x2="14" y1="2" y2="6"></line><line x1="8" x2="8" y1="10" y2="14"></line><line x1="16" x2="16" y1="18" y2="22"></line></svg>1–2/wk · max 1 in a row</button></div>

<div style="display: flex; flex-direction: column; gap: 8px">
<h3 style="margin: 0; display: flex; align-items: center; gap: 4px; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px; font-weight: 400; letter-spacing: 0.1em; color: #52525b"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M3 10h18"></path><path d="M8 14h.01"></path><path d="M12 14h.01"></path><path d="M16 14h.01"></path><path d="M8 18h.01"></path><path d="M12 18h.01"></path><path d="M16 18h.01"></path></svg>This week · Aug 30 – Sep 5</h3>
<div role="list" aria-label="Constraint violations" style="display: flex; flex-direction: column; gap: 6px">
<div role="listitem" style="display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid #261617; background: #261617; color: #f07178; font-size: 12px; line-height: 16px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><circle cx="12" cy="12" r="10"></circle><path d="m15 9-6 6"></path><path d="m9 9 6 6"></path></svg><span style="flex: 1">3 of max 2 this week</span><span style="flex: none; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px; letter-spacing: 0.1em">REQUIRED</span></div>
<div role="listitem" style="display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid #272116; background: #272116; color: #ffcb6b; font-size: 12px; line-height: 16px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg><span style="flex: 1">20:00–21:00 is outside 18:00–20:00</span><span style="flex: none; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px; letter-spacing: 0.1em">PREFERRED</span></div>
</div>
</div>

<div role="radiogroup" aria-label="Color" style="display: flex; align-items: center; gap: 6px">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#52525b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="margin-right: 2px"><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"></circle><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"></circle><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"></circle><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"></circle><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"></path></svg>
<button type="button" role="radio" aria-checked="false" aria-label="Indigo" style="width: 20px; height: 20px; padding: 0; border: 2px solid transparent; background: #6C63FF"></button>
<button type="button" role="radio" aria-checked="false" aria-label="Coral" style="width: 20px; height: 20px; padding: 0; border: 2px solid transparent; background: #FF6B6B"></button>
<button type="button" role="radio" aria-checked="false" aria-label="Turquoise" style="width: 20px; height: 20px; padding: 0; border: 2px solid transparent; background: #4ECDC4"></button>
<button type="button" role="radio" aria-checked="false" aria-label="Lemon" style="width: 20px; height: 20px; padding: 0; border: 2px solid transparent; background: #FFE66D"></button>
<button type="button" role="radio" aria-checked="true" aria-label="Mint" style="width: 20px; height: 20px; padding: 0; border: 2px solid #fafafa; background: #95E1D3; transform: scale(1.1)"></button>
<button type="button" role="radio" aria-checked="false" aria-label="Salmon" style="width: 20px; height: 20px; padding: 0; border: 2px solid transparent; background: #F38181"></button>
<button type="button" role="radio" aria-checked="false" aria-label="Lavender" style="width: 20px; height: 20px; padding: 0; border: 2px solid transparent; background: #AA96DA"></button>
<button type="button" role="radio" aria-checked="false" aria-label="Sky blue" style="width: 20px; height: 20px; padding: 0; border: 2px solid transparent; background: #A8D8EA"></button>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px; letter-spacing: 0.1em; color: #52525b">EXCEPTIONS</span>
<ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px">
<li style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; border: 1px solid #2a2a2a; font-size: 12px; line-height: 16px"><span>Sat 08-29 · skipped</span><button type="button" style="height: 24px; padding: 0 8px; border: 1px solid #2a2a2a; background: #0a0a0a; color: #fafafa; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500">Restore</button></li>
<li style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; border: 1px solid #2a2a2a; font-size: 12px; line-height: 16px"><span>Thu 09-03 · time changed</span><button type="button" style="height: 24px; padding: 0 8px; border: 1px solid #2a2a2a; background: #0a0a0a; color: #fafafa; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500">Restore</button></li>
</ul>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 8px"><button type="button" style="display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid #71717a; background: transparent; color: #fafafa; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>Remind: 15 min</button></div>

<div role="status" style="padding: 8px 12px; border-left: 2px solid #ef4444; background: #1f1f1f; font-size: 12px; line-height: 16px; color: #fafafa">All events: 3 occurrences will change.</div>

<div style="display: flex; align-items: center; gap: 8px">
<button type="button" aria-label="Delete schedule" style="flex: none; width: 48px; height: 48px; display: grid; place-items: center; padding: 0; border: 1px solid #2a2a2a; background: transparent; color: #a1a1aa"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path><line x1="10" x2="10" y1="11" y2="17"></line><line x1="14" x2="14" y1="11" y2="17"></line></svg></button>
<button type="submit" style="flex: 1; height: 48px; padding: 0 10px; border: 1px solid #71717a; background: #1f1f1f; color: #fafafa; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 500">Save</button>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
