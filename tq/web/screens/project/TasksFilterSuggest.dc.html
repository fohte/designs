<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Tasks filter input with suggestions</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #0a0a0a; color: #fafafa; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace">
<dc-import name="TasksDesktop" query="is:" focus="{{ true }}" firstRow="plain" hint-size="1440px,900px"></dc-import>
<div style="position: absolute; left: 904px; top: 84px; z-index: 50; width: 396px; border: 1px solid #2a2a2a; background: #141414; box-shadow: 0 4px 6px -1px rgba(0,0,0,.1), 0 2px 4px -2px rgba(0,0,0,.1)">
<div role="listbox" aria-label="Filter suggestions" style="display: flex; flex-direction: column; font-size: 14px; line-height: 20px">
<button type="button" role="option" aria-selected="true" style="width: 100%; min-height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border: 0; background: #1f1f1f; color: #fafafa; font: inherit; text-align: left"><span>is:todo</span><span style="color: #71717a">Todo</span></button>
<button type="button" role="option" aria-selected="false" style="width: 100%; min-height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border: 0; background: transparent; color: #fafafa; font: inherit; text-align: left"><span>is:completed</span><span style="color: #71717a">Completed</span></button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
