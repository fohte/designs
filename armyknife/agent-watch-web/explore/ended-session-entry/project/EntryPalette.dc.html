<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Command palette with a query</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div role="dialog" aria-label="Jump to" style="width: 680px; height: 660px; box-sizing: border-box; display: flex; flex-direction: column; background: #161616; border: 1px solid #3f3f46; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 13px; line-height: 1.55">
<div style="flex: none; height: 54px; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid #2a2a2a">
<span aria-hidden="true" style="color: #8b8b94; font-size: 16px">⌕</span>
<input aria-label="Jump to" value="配信" placeholder="Jump to a session, tq task or project, or type &gt; for commands" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: #fafafa; font-family: inherit; font-size: 15px">
<kbd style="padding: 1px 6px; border: 1px solid #3f3f46; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #a1a1aa">esc</kbd>
</div>
<div role="listbox" style="flex: 1; min-height: 0; overflow-y: auto; padding: 4px 0">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<h2 style="height: 28px; display: flex; align-items: center; gap: 8px; margin: 0; padding: 0 16px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; color: #8b8b94">{{g.title}}<span style="font-weight: 400; letter-spacing: 0; color: #8b8b94">{{g.sub}}</span></h2>
<sc-for list="{{g.items}}" as="it" hint-placeholder-count="2">
<sc-if value="{{it.isSession}}" hint-placeholder-val="{{ true }}">
<div role="option" aria-selected="{{it.selected}}"><dc-import name="SessionRow" s="{{ it }}" density="compact" hint-size="100%,69px"></dc-import></div>
</sc-if>
<sc-if value="{{it.isOther}}" hint-placeholder-val="{{ false }}">
<div role="option" aria-selected="{{it.selected}}" style="min-height: 44px; box-sizing: border-box; display: grid; grid-template-columns: 16px 1fr; align-items: center; gap: 12px; padding: 5px 16px; background: {{it.bg}}">
<span aria-hidden="true" style="color: #a1a1aa; text-align: center">{{it.glyph}}</span>
<div style="min-width: 0"><div style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fafafa">{{it.title}}</div><div style="font-size: 11.5px; color: #a1a1aa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.sub}}</div></div>
</div>
</sc-if>
</sc-for>
</sc-for>
</div>
<div style="flex: none; height: 36px; display: flex; align-items: center; gap: 14px; padding: 0 16px; border-top: 1px solid #2a2a2a; font-size: 11.5px; color: #8b8b94">
<span>{{openHint}}</span><span>⌘↵ Open beside</span><span>→ Actions</span><span>Tab Scope</span><span style="margin-left: auto; font-family: 'JetBrains Mono', monospace">#  task · @ project · &gt; command</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"option":{"editor":"enum","options":["current","a"],"default":"current"},"$preview":{"width":680,"height":660}}'>
class Component extends DCLogic {
  renderVals() {
    const a = (this.props.option ?? 'current') === 'a';
    const sel = (on) => ({ selected: on ? 'true' : 'false', bg: on ? '#2a2a2e' : 'transparent' });
    const ses = (on, status, title, age, role, engine, taskRef, taskTitle, repo) =>
      ({ isSession: true, isOther: false, pad: '6px 16px 7px', status, unread: false, title, age, role, engine, taskRef, taskTitle, repo, ...sel(on) });
    const groups = [
      { title: 'SESSIONS', sub: '', items: [
        ses(!a, 'Working', '配信メトリクスを追加する', '18s', 'development', 'codex', 'P3 #2055', '監視を整える', 'example/observability')
      ] },
      { title: 'TQ TASKS', sub: '', items: [
        { isOther: true, isSession: false, glyph: '#', title: '#2050 配信チェックを入れる', sub: 'P2 · 1 session', ...sel(false) }
      ] }
    ];
    if (a) groups.push({ title: 'ENDED', sub: 'Only while you type', items: [
      ses(true, 'Ended', '配信チェックの PR を確認する', 'Ended 14:32', '', 'codex', 'P2 #2050', '配信チェックを入れる', 'example/web-app'),
      ses(false, 'Ended', '配信ログの保存期間を決める', 'Ended Mon', 'research', 'claude', '', '', 'example/service')
    ] });
    return { groups, openHint: a ? '↵ Open, ended ones too' : '↵ Open' };
  }
}
</script>
</body>
</html>
