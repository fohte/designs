<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Quota</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<section aria-label="Quota" style="width: 100%; box-sizing: border-box; display: grid; gap: 8px; padding: 10px {{inset}} 12px; border-top: 1px solid #2a2a2a; background: #0f0f0f; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; line-height: 1.55">
<sc-for list="{{engines}}" as="e" hint-placeholder-count="2">
<div style="display: grid; gap: 3px"><span title="{{e.title}}" style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #d4d4d8">{{e.name}}</span>
<sc-for list="{{e.rows}}" as="r" hint-placeholder-count="2">
<div title="{{r.text}}" style="display: grid; grid-template-columns: 18px minmax(0, 1fr) 4ch 6ch 5ch; align-items: center; gap: 6px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8b8b94"><span>{{r.window}}</span><span role="meter" aria-label="{{e.name}} {{r.window}} quota used" aria-valuenow="{{r.used}}" aria-valuemin="0" aria-valuemax="100" aria-valuetext="{{r.text}}" style="position: relative; display: inline-block; width: 100%; height: 4px; background: #262626"><span style="position: absolute; inset: 0 auto 0 0; width: {{r.used}}%; background: {{r.color}}"></span><sc-if value="{{r.showFc}}" hint-placeholder-val="{{ true }}"><span style="position: absolute; top: -2px; bottom: -2px; left: {{r.pace}}%; width: 1px; background: #a1a1aa"></span></sc-if></span><span style="text-align: right; color: {{r.color}}">{{r.used}}%</span><span aria-hidden="true" style="white-space: nowrap; overflow: hidden; color: {{r.fcColor}}; font-weight: {{r.weight}}"><sc-if value="{{r.showFc}}" hint-placeholder-val="{{ true }}">→ {{r.fc}}%</sc-if></span><span style="text-align: right; white-space: nowrap">{{r.reset}}</span></div>
</sc-for>
</div>
</sc-for>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"phone":{"editor":"boolean","default":false},"$preview":{"width":240,"height":140}}'>
class Component extends DCLogic {
  renderVals() {
    // pace = elapsed share of the window in %; the forecast is used / elapsed, hidden under 5% elapsed.
    const row = (window, used, pace, reset) => {
      const fc = pace < 5 ? null : Math.round(used * 100 / pace);
      const st = fc === null ? null : fc < 100 ? 'on' : fc < 150 ? 'warn' : 'danger';
      const color = used >= 95 ? '#f87171' : used >= 80 ? '#fbbf24' : '#d4d4d8';
      const over = { warn: ', at or above quota pace', danger: ', well above quota pace' }[st] ?? '';
      return {
        window, used, pace, reset, color, fc,
        showFc: fc !== null,
        fcColor: { on: '#8b8b94', warn: '#fbbf24', danger: '#f87171' }[st] ?? '#8b8b94',
        weight: st === 'danger' ? 700 : 400,
        text: `${window}: ${used}% used, ` + (fc === null ? 'too early to forecast' : `projected ${fc}% at window end${over}`) + `, resets in ${reset}`
      };
    };
    return {
      inset: this.props.phone ? '4px' : '8px',
      engines: [
        { name: 'claude', title: 'Claude Code', rows: [row('5h', 41, 52, '2h10m'), row('7d', 76, 83, '1d14h')] },
        { name: 'codex', title: 'Codex', rows: [row('5h', 88, 64, '47m'), row('7d', 35, 40, '4d2h')] }
      ]
    };
  }
}
</script>
</body>
</html>
