<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Task detail loading on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif">
<main style="flex: 1; min-height: 0; overflow: hidden; display: grid; place-items: center">
<sc-if value="{{loading}}" hint-placeholder-val="{{ true }}">
<svg role="img" aria-label="Loading" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#71717a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg>
</sc-if>
<sc-if value="{{notFound}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; font-size: 16px; line-height: 24px; color: #71717a">Task not found</p>
</sc-if>
</main>
<dc-import name="TabBar" view="tasks" hint-size="100%,53px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["loading","not-found"],"default":"loading"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const state = this.props.state ?? 'loading';
    return { loading: state === 'loading', notFound: state === 'not-found' };
  }
}
</script>
</body>
</html>
