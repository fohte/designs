<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Close any session · command palette</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 13px; line-height: 1.55">
<dc-import name="CloseDesk" option="a" kind="working" view="header" hint-size="1440px,900px"></dc-import>
<div style="position: absolute; inset: 0; display: flex; justify-content: center; padding-top: 96px; box-sizing: border-box; background: rgba(0, 0, 0, 0.58)">
<div role="dialog" aria-label="Jump to" style="width: 680px; height: 300px; box-sizing: border-box; display: flex; flex-direction: column; background: #161616; border: 1px solid #3f3f46">
<div style="flex: none; height: 54px; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid #2a2a2a">
<span aria-hidden="true" style="color: #8b8b94; font-size: 16px">⌕</span>
<input aria-label="Jump to" value="&gt;close" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: #fafafa; font-family: inherit; font-size: 15px">
<kbd style="padding: 1px 6px; border: 1px solid #3f3f46; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #a1a1aa">esc</kbd>
</div>
<div role="listbox" style="flex: 1; min-height: 0; overflow-y: auto; padding: 4px 0">
<h2 style="height: 28px; display: flex; align-items: center; margin: 0; padding: 0 16px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; color: #8b8b94">COMMANDS</h2>
<div role="option" aria-selected="true" style="min-height: 44px; box-sizing: border-box; display: grid; grid-template-columns: 16px 1fr; align-items: center; gap: 12px; padding: 5px 16px; background: #2a2a2e">
<span aria-hidden="true" style="color: #a1a1aa; text-align: center">›</span>
<div style="min-width: 0"><div style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fafafa">Close this session</div><div style="font-size: 11.5px; color: #a1a1aa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">配信メトリクスを追加する · Working · Asks before closing</div></div>
</div>
<div role="option" aria-selected="false" style="min-height: 44px; box-sizing: border-box; display: grid; grid-template-columns: 16px 1fr; align-items: center; gap: 12px; padding: 5px 16px">
<span aria-hidden="true" style="color: #a1a1aa; text-align: center">›</span>
<div style="min-width: 0"><div style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fafafa">Close all done</div><div style="font-size: 11.5px; color: #a1a1aa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Close every done session</div></div>
</div>
</div>
<div style="flex: none; height: 36px; display: flex; align-items: center; gap: 14px; padding: 0 16px; border-top: 1px solid #2a2a2a; font-size: 11.5px; color: #8b8b94">
<span>↵ Run</span><span>Tab Scope</span><span style="margin-left: auto; font-family: 'JetBrains Mono', monospace">#  task · @ project · &gt; command</span>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
