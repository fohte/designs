<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Day view, board mode</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
input::placeholder{color:#71717a}
</style>
</helmet>
<div style="width: 1440px; height: 900px; overflow: hidden; display: flex; background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif">
<div style="flex: none; width: 200px"><dc-import name="Nav" view="calendar" hint-size="200px,900px"></dc-import></div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<main style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column">

<div style="flex: none; height: 40px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 1px solid #2a2a2a; background: #0a0a0a">
<h1 style="margin: 0; display: inline-flex; align-items: baseline; gap: 8px; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px"><span aria-hidden="true" style="font-weight: 700; color: #ef4444">##</span><span style="font-weight: 500; color: #fafafa">queue</span></h1>
<button type="button" aria-label="New task" style="width: 24px; height: 24px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #fafafa"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></button>
<button type="button" aria-label="New schedule" style="width: 24px; height: 24px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #fafafa"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 19h6"></path><path d="M16 2v4"></path><path d="M19 16v6"></path><path d="M21 12.598V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h8.5"></path><path d="M3 10h18"></path><path d="M8 2v4"></path></svg></button>
<button type="button" aria-label="Layout" aria-haspopup="menu" style="width: 20px; height: 20px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #71717a"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg></button>
</div>

<div style="flex: none; min-height: 48px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid #2a2a2a; background: #0a0a0a">
<span aria-hidden="true" style="font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 700; color: #ef4444">›</span>
<div style="flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; column-gap: 12px; row-gap: 8px">
<span style="display: inline-flex; align-items: center; gap: 4px; min-height: 20px; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px"><button type="button" style="display: inline-flex; align-items: center; gap: 4px; padding: 0; border: 0; background: transparent; font: inherit; color: #71717a"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"></path><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"></circle></svg>label:<span style="padding: 0 4px; border-radius: 3px; background: #181d27; color: #82aaff">home</span></button><button type="button" aria-label="Remove label filter" style="width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 0; background: transparent; color: #71717a"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></span>
<input type="text" aria-label="Filter query" placeholder="Filter…" style="flex: 1; min-width: 120px; height: 32px; box-sizing: border-box; padding: 0; border: 0; border-bottom: 1px solid transparent; background: transparent; color: #fafafa; font-family: inherit; font-size: 14px; outline: none">
</div>
</div>

<div style="flex: none; padding: 10px 0; border-bottom: 1px solid #2a2a2a">
<div style="display: flex; flex-direction: column; gap: 8px; padding: 0 12px">
<div style="display: flex; align-items: baseline; gap: 10px; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px"><span style="color: #fafafa">0</span><span style="color: #52525b">/</span><span style="color: #fafafa">1</span><span style="color: #52525b">done</span></div>
<div role="progressbar" aria-label="Queue progress" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100" style="height: 2px; background: #1f1f1f"><div style="width: 0%; height: 2px; background: #fafafa"></div></div>
</div>
</div>

<div style="flex: 1; min-height: 0; display: flex; overflow-x: auto">

<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; border-right: 1px solid #2a2a2a">
<div style="flex: none; height: 36px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid #2a2a2a; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px; letter-spacing: 0.1em; color: #52525b"><span>TODAY</span><span style="letter-spacing: 0">1</span><span style="margin-left: auto; letter-spacing: 0">09-01</span></div>
<div role="region" aria-label="today tasks" style="flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 8px">
<div style="border: 1px solid #2a2a2a; background: #141414; cursor: grab"><dc-import name="TaskRow" num="#240" title="歯医者の予約を取り直す" status="todo" priority="" labels="#home" project="" context="personal" due="" overdue="false" children="" expanded="false" waiting="false" depth="0" selected="false" hint-size="100%,57px"></dc-import></div>
</div>
</div>

<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; border-right: 1px solid #2a2a2a">
<div style="flex: none; height: 36px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid #2a2a2a; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px; letter-spacing: 0.1em; color: #52525b"><span>THIS WEEK</span><span style="letter-spacing: 0">1</span><span style="margin-left: auto; letter-spacing: 0">08-31 – 09-06</span></div>
<div role="region" aria-label="this week tasks" style="flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 8px">
<div style="border: 1px solid #2a2a2a; background: #141414; cursor: grab"><dc-import name="TaskRow" num="#226" title="引っ越しの見積もりを比較する" status="todo" priority="" labels="#home" project="" context="personal" due="Sep 2 → Sep 4" overdue="false" children="" expanded="false" waiting="false" depth="0" selected="false" hint-size="100%,57px"></dc-import></div>
</div>
</div>

<div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<div style="flex: none; height: 36px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; border-bottom: 1px solid #2a2a2a; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px; letter-spacing: 0.1em; color: #52525b"><span>CANDIDATES</span><span style="letter-spacing: 0">2</span></div>
<div role="region" aria-label="candidates tasks" style="flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 8px">
<div style="border: 1px solid #2a2a2a; background: #141414; cursor: grab"><dc-import name="DayExtrasRow" num="#205" title="保険の更新手続きをする" status="todo" labels="#home" project="" context="personal" due="→ Aug 31" overdue="true" extra="1d overdue" extra-tone="red" add="true" hint-size="100%,57px"></dc-import></div>
<div style="border: 1px solid #2a2a2a; background: #141414; cursor: grab"><dc-import name="DayExtrasRow" num="#250" title="確定申告の書類を揃える" status="todo" labels="#home" project="" context="personal" due="→ Sep 4" overdue="false" extra="due in 3d" extra-tone="muted" add="true" hint-size="100%,57px"></dc-import></div>
</div>
</div>

</div>
</main>
<dc-import name="StatusLine" path="/" hint-size="100%,24px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
