<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Merge and close failed</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; display: flex; overflow: hidden; background: #0a0a0a; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif">
<div style="flex: none; width: 240px"><dc-import name="Nav" view="inbox" activity="{{ activity }}" hint-size="240px,900px"></dc-import></div>
<div style="flex: none; width: 460px; border-right: 1px solid #2a2a2a"><dc-import name="InboxList" filter="none" current="{{ one }}" close="failed" hint-size="460px,900px"></dc-import></div>
<div style="flex: 1; min-width: 0"><dc-import name="Conversation" variant="review" merge-state="failed" action-line="{{ line }}" hint-size="100%,900px"></dc-import></div>
<div style="position: absolute; z-index: 10; left: 16px; bottom: 16px; width: 360px"><dc-import name="ToastStack" items="{{ toasts }}" hint-size="100%,300px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const mergeErr = 'Head branch was updated after you confirmed. Confirm the new head to merge.';
    const closeErr = 'The session did not stop within 10 s.';
    return {
      one: 1,
      activity: { count: '2', tone: 'failure' },
      line: { result: 'mergeFailed', pr: 2049, reason: mergeErr, time: '12:03' },
      toasts: [
        { result: 'mergeFailed', pr: 2049, session: '配信チェックの PR を確認する', reason: mergeErr },
        { result: 'closeFailed', session: 'アラートの送り先を決める', reason: closeErr }
      ]
    };
  }
}
</script>
</body>
</html>
