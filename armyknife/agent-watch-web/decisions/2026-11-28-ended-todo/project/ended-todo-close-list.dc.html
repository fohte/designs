<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>B: the dialog lists the to-dos and proposals closing withdraws</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; display: flex; overflow: hidden; background: #0a0a0a; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif">
<div style="flex: none; width: 240px"><dc-import name="Nav" view="inbox" hint-size="240px,900px"></dc-import></div>
<div style="flex: none; width: 460px; border-right: 1px solid #2a2a2a"><dc-import name="InboxList" filter="none" current="{{ zero }}" hint-size="460px,900px"></dc-import></div>
<div style="flex: 1; min-width: 0"><dc-import name="Conversation" variant="question" menu="confirming" hint-size="100%,900px"></dc-import></div>
<div style="position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0, 0, 0, 0.55)">
<div style="width: 380px"><dc-import name="ConfirmDialog" form="modal" head="Close without answering?" body="It is waiting for your answer to a question. Closing ends the session, and the question stays unanswered." items="{{ items }}" action="Close session" session="{{ session }}" hint-size="100%,260px"></dc-import></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      zero: 0,
      session: { state: 'Question', dot: '#fbbf24', round: false, color: '#fbbf24', title: '通知の再送処理を見直す' },
      items: [{ kind: 'To-do', title: '再送のログを本番で確かめる' }, { kind: 'Proposal', title: '再送の待ち時間' }]
    };
  }
}
</script>
</body>
</html>
