<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Phone vibe mode toggle</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; box-sizing: border-box; background: {{bg}}; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 13px; line-height: 1.45">
<sc-if value="{{isA}}" hint-placeholder-val="{{ true }}">
<button type="button" role="menuitemcheckbox" aria-checked="{{checkedStr}}" aria-disabled="{{disabledStr}}" style="width: 100%; min-height: 56px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 8px 14px; border: 0; border-top: 1px solid #2a2a2a; background: transparent; color: #fafafa; font-family: inherit; font-size: 13px; text-align: left">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: #a1a1aa"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"></path></svg>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; opacity: {{textOpacity}}"><span>Vibe mode</span><span style="font-size: 11.5px; color: #a1a1aa">{{sub}}</span></span>
<span aria-hidden="true" style="position: relative; flex: none; width: 34px; height: 20px; box-sizing: border-box; border: 1px {{trackStyle}} {{trackBorder}}; background: {{trackBg}}; opacity: {{switchOpacity}}"><span style="position: absolute; top: 3px; left: {{knobLeft}}; width: 12px; height: 12px; background: {{knobBg}}"></span></span>
</button>
</sc-if>
<sc-if value="{{isC}}" hint-placeholder-val="{{ false }}">
<button type="button" role="switch" aria-checked="{{checkedStr}}" aria-describedby="vibe-sub-c" aria-disabled="{{disabledStr}}" style="width: 100%; min-height: 56px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 8px 0; border: 0; background: transparent; color: #fafafa; font-family: inherit; font-size: 15px; text-align: left">
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; opacity: {{textOpacity}}"><span>Vibe mode</span><span id="vibe-sub-c" style="font-size: 12.5px; color: #a1a1aa">{{sub}}</span></span>
<span aria-hidden="true" style="position: relative; flex: none; width: 34px; height: 20px; box-sizing: border-box; border: 1px {{trackStyle}} {{trackBorder}}; background: {{trackBg}}; opacity: {{switchOpacity}}"><span style="position: absolute; top: 3px; left: {{knobLeft}}; width: 12px; height: 12px; background: {{knobBg}}"></span></span>
</button>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"opt":{"editor":"enum","options":["a","c"],"default":"a"},"state":{"editor":"enum","options":["on","onParent","inherited","off","blocked"],"default":"on"},"flipped":{"editor":"boolean","default":false},"bg":{"editor":null},"$preview":{"width":390,"height":64}}'>
class Component extends DCLogic {
  renderVals() {
    const opt = this.props.opt ?? 'a';
    const state = this.props.state ?? 'on';
    const flipped = this.props.flipped ?? false;
    const on = state === 'on' || state === 'onParent';
    const blocked = state === 'blocked';
    const checked = flipped ? !on : on;
    const parent = '通知まわりの改修';
    const subs = {
      on: 'On for this session',
      onParent: 'On here and in ' + parent + '. Turning it off here keeps it on.',
      inherited: 'Off here · still on, inherited from ' + parent,
      off: 'Off',
      blocked: 'Unavailable: example/legacy does not allow vibe mode'
    };
    const sub = flipped
      ? (state === 'onParent' ? 'Saving turns it off here. It stays on, inherited from ' + parent + '.' : on ? 'Saving turns it off' : 'Saving turns it on')
      : subs[state];
    return {
      isA: opt === 'a', isC: opt === 'c',
      bg: this.props.bg ?? '#1f1f1f',
      sub,
      checkedStr: checked ? 'true' : 'false',
      disabledStr: blocked ? 'true' : 'false',
      textOpacity: blocked ? 0.75 : 1,
      switchOpacity: blocked ? 0.5 : 1,
      trackStyle: blocked ? 'dashed' : 'solid',
      trackBorder: checked ? '#fafafa' : '#71717a',
      trackBg: checked ? '#fafafa' : 'transparent',
      knobLeft: checked ? '17px' : '3px',
      knobBg: checked ? '#0a0a0a' : '#a1a1aa'
    };
  }
}
</script>
</body>
</html>
