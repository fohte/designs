<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Inbox</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 900px; overflow: hidden; display: flex; background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif">
<div style="flex: none; width: 200px"><dc-import name="Nav" view="inbox" hint-size="200px,900px"></dc-import></div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<main style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column">
<header style="flex: none; height: 40px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 1px solid #2a2a2a; background: #0a0a0a">
<h1 style="margin: 0; display: inline-flex; align-items: baseline; gap: 8px; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px"><span style="font-weight: 700; color: #ef4444">##</span><span style="font-weight: 500; color: #fafafa">inbox</span></h1>
</header>
<div style="flex: 1; min-height: 0; display: flex; overflow-x: auto">
<sc-for list="{{columns}}" as="col" hint-placeholder-count="6">
<section aria-label="{{col.name}} tasks" style="flex: 1; min-width: 0; display: flex; flex-direction: column; border-right: {{col.border}}">
<div style="flex: none; height: 36px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; border-bottom: 1px solid #2a2a2a; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px; letter-spacing: 0.1em; color: #52525b"><h2 style="margin: 0; font: inherit; text-transform: uppercase">{{col.name}}</h2><span>{{col.count}}</span></div>
<div style="flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 8px; background: {{col.bg}}">
<sc-for list="{{col.cards}}" as="c" hint-placeholder-count="3">
<div style="flex: none; border: 1px solid #2a2a2a; background: #141414"><dc-import name="TaskRow" card="true" num="{{c.num}}" title="{{c.title}}" status="todo" priority="{{c.priority}}" labels="{{c.labels}}" project="{{c.project}}" context="{{c.context}}" due="{{c.due}}" overdue="{{c.overdue}}" children="{{c.children}}" checklist="{{c.checklist}}" github="{{c.github}}" githubState="{{c.githubState}}" expanded="false" waiting="{{c.waiting}}" blocker="{{c.blocker}}" followUp="{{c.followUp}}" depth="0" selected="false" hint-size="100%,57px"></dc-import></div>
</sc-for>
<sc-if value="{{col.empty}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; padding: 16px; text-align: center; font-size: 14px; line-height: 20px; color: #71717a">No tasks</p></sc-if>
</div>
</section>
</sc-for>
</div>
</main>
<dc-import name="StatusLine" path="/inbox" hint-size="100%,24px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const card = (c) => ({ priority: '', labels: '', project: '', context: 'personal', due: '', overdue: 'false', children: '', checklist: '', github: '', githubState: 'open', waiting: 'false', blocker: '', followUp: '', ...c });
    const columns = [
      { name: 'Now', cards: [
        card({ num: '#31', title: 'オンボーディングのチェックリストを書く', priority: 'Now', labels: '#docs', project: 'サイト改修', due: 'Mar 20 → Mar 28' }),
        card({ num: '#32', title: 'エクスポートのテストが不安定なのを直す', priority: 'Now', labels: '#dev/api', context: 'work', children: '1/3', github: 'api#58' }),
        card({ num: '#37', title: '認証トークンの更新手順を書く', priority: 'Now', context: 'work', due: '→ Mar 18', overdue: 'true' }),
      ] },
      { name: 'Next', cards: [
        card({ num: '#46', title: 'エラーレスポンスの形式をそろえる', priority: 'Next', project: '社内ツール', context: 'work', children: '2/5', checklist: '1/4' }),
        card({ num: '#51', title: '本棚の採寸をする', priority: 'Next', labels: '#home', project: '引っ越し準備' }),
      ] },
      { name: 'Normal', cards: [
        card({ num: '#54', title: 'API ドキュメントの例を直す', priority: 'Normal', labels: '#dev/api', context: 'work', due: '→ Apr 10' }),
        card({ num: '#57', title: '読みかけの本のメモを整理する', priority: 'Normal', labels: '#reading', project: '読書メモ', checklist: '2/5' }),
        card({ num: '#58', title: 'デプロイ手順の確認', priority: 'Normal', context: 'work', github: 'infra#112', githubState: 'merged' }),
      ] },
      { name: 'Inbox', cards: [
        card({ num: '#63', title: '粗大ごみの回収を申し込む', due: '→ Mar 26' }),
        card({ num: '#64', title: 'キーボードの設定を見直す' }),
        card({ num: '#65', title: 'チームの振り返りの議題を集める', context: 'work' }),
      ] },
      { name: 'Later', cards: [
        card({ num: '#34', title: '古いモックアップを整理する', priority: 'Later' }),
      ] },
      { name: 'Waiting', cards: [
        card({ num: '#33', title: 'API の利用上限の回答を待つ', priority: 'Now', context: 'work', waiting: 'true', blocker: 'サポートからの返信', followUp: 'Mar 30' }),
        card({ num: '#66', title: '業者からの見積もりを待つ', priority: 'Next', project: '引っ越し準備', waiting: 'true', blocker: '見積もりの返信', followUp: 'Mar 3' }),
      ] },
    ];
    return {
      columns: columns.map((col, i) => ({
        ...col,
        count: col.cards.length,
        empty: col.cards.length === 0,
        border: i === columns.length - 1 ? '0' : '1px solid #2a2a2a',
        bg: 'transparent',
      })),
    };
  }
}
</script>
</body>
</html>
