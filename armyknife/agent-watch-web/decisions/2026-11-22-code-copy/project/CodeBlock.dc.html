<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Code block in a message</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
.cc-scroll{scrollbar-width:none}
</style>
</helmet>
<div style="position: relative; width: 100%; min-width: 0; box-sizing: border-box; display: flex; flex-direction: column; border: 1px solid #262626; background: #131313; color: #e1e4e8; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif">
<sc-if value="{{header}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: {{headH}}; padding-left: 12px; border-bottom: 1px solid #262626; color: #a1a1aa; font-size: {{headFont}}">
<span style="font-family: 'JetBrains Mono', monospace">{{lang}}</span>
<button type="button" aria-label="{{aria}}" title="Copy code" style="min-height: {{headH}}; display: inline-flex; align-items: center; gap: 6px; padding: 0 {{headPad}}; border: 0; background: transparent; color: #d4d4d8; font-family: inherit; font-size: {{headFont}}"><sc-if value="{{copied}}" hint-placeholder-val="{{ false }}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>Copied</sc-if><sc-if value="{{idle}}" hint-placeholder-val="{{ true }}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg>Copy</sc-if></button>
</div>
</sc-if>
<div style="display: flex; min-width: 0">
<div style="position: relative; flex: 1; min-width: 0">
<div class="cc-scroll" ref="{{ scroller }}" style="overflow-x: auto">
<pre style="margin: 0; width: max-content; padding: 12px {{padR}} 12px 14px; font-family: 'JetBrains Mono', monospace; font-size: 12.25px; line-height: 20px; white-space: pre"><code><sc-for list="{{lines}}" as="l" hint-placeholder-count="3"><div style="min-height: 20px"><sc-for list="{{l.segs}}" as="s" hint-placeholder-count="2"><span style="color: {{s.c}}">{{s.t}}</span></sc-for></div></sc-for></code></pre>
</div>
<sc-if value="{{scrolled}}" hint-placeholder-val="{{ false }}"><div aria-hidden="true" style="position: absolute; left: {{thumbL}}; bottom: 3px; width: {{thumbW}}; height: 4px; border-radius: 2px; background: #71717a"></div></sc-if>
</div>
<sc-if value="{{column}}" hint-placeholder-val="{{ true }}">
<div style="flex: none; width: {{colW}}; box-sizing: border-box; padding: {{colPad}}">
<sc-if value="{{showIcon}}" hint-placeholder-val="{{ true }}">
<button type="button" aria-label="{{aria}}" title="Copy code" style="width: {{btn}}; height: {{btn}}; display: grid; place-items: center; padding: 0; border: 1px solid {{btnBorder}}; background: {{btnBg}}; color: #d4d4d8"><sc-if value="{{copied}}" hint-placeholder-val="{{ false }}"><svg width="{{icon}}" height="{{icon}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></sc-if><sc-if value="{{idle}}" hint-placeholder-val="{{ true }}"><svg width="{{icon}}" height="{{icon}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg></sc-if></button>
</sc-if>
</div>
</sc-if>
</div>
<sc-if value="{{cursor}}" hint-placeholder-val="{{ false }}">
<svg width="18" height="22" viewBox="0 0 18 22" aria-hidden="true" style="position: absolute; top: {{cursorTop}}; right: {{cursorRight}}; pointer-events: none"><path d="M1 1v17l4.5-4.2 3 6.6 3-1.4-3-6.4H15z" fill="#fafafa" stroke="#0a0a0a" stroke-width="1.4" stroke-linejoin="round"></path></svg>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":672,"height":140},"mode":{"editor":"enum","options":["none","icon","hover","header"],"default":"icon"},"code":{"editor":"enum","options":["cmd","ts","curl","err"],"default":"ts"},"phone":{"editor":"boolean","default":false},"hovered":{"editor":"boolean","default":false},"copied":{"editor":"boolean","default":false},"scrolled":{"editor":"boolean","default":false}}'>
class Component extends DCLogic {
  renderVals() {
    const K = '#f97583', S = '#9ecbff', F = '#b392f0', C = '#79b8ff', P = '#e1e4e8', V = '#ffab70', M = '#6a737d';
    const seg = (...xs) => ({ segs: xs.map(([t, c]) => ({ t, c: c ?? P })) });
    const CODE = {
      cmd: { lang: 'bash', lines: [seg(['bun', F], [' install']), seg(['bun', F], [' run test '], ['--filter', C], [' retry'])] },
      ts: { lang: 'ts', lines: [
        seg(['export', K], [' '], ['async', K], [' '], ['function', K], [' '], ['retry', F], ['<T>('], ['send', V], [': () '], ['=>', K], [' Promise<T>, '], ['limit', V], [' '], ['=', K], [' '], ['3', C], [') {']),
        seg(['  '], ['for', K], [' (', ], ['let', K], [' i '], ['=', K], [' '], ['1', C], ['; ; i'], ['++', K], [') {']),
        seg(['    '], ['try', K], [' { '], ['return', K], [' '], ['await', K], [' '], ['send', F], ['() } '], ['catch', K], [' (e) { '], ['if', K], [' (i '], ['>=', K], [' limit) '], ['throw', K], [' e }']),
        seg(['  }']),
        seg(['}'])
      ] },
      curl: { lang: 'bash', lines: [
        seg(['curl', F], [' '], ['-X', C], [' POST https://api.example.com/v1/notifications/resend '], ['-H', C], [' '], ['"Authorization: Bearer $EXAMPLE_TOKEN"', S], [' '], ['-d', C], [' '], ["'{\"id\":\"ntf_0001\",\"limit\":3}'", S]),
        seg(['echo', F], [' '], ['"exit: $?"', S])
      ] },
      err: { lang: 'text', lines: [
        seg(["TypeError: Cannot read properties of undefined (reading 'limit')"]),
        seg(['    at retry (src/notify/retry.ts:8:21)'])
      ] }
    }[this.props.code ?? 'ts'];
    const mode = this.props.mode ?? 'icon';
    const phone = this.props.phone ?? false;
    const hovered = this.props.hovered ?? false;
    const copied = this.props.copied ?? false;
    const scrolled = this.props.scrolled ?? false;
    const column = mode === 'icon' || mode === 'hover';
    // hover: phones have no hover, so the button is always shown there.
    const showIcon = mode === 'icon' || (mode === 'hover' && (phone || hovered || copied));
    return {
      lines: CODE.lines,
      lang: CODE.lang,
      header: mode === 'header',
      headH: phone ? '44px' : '30px',
      headPad: phone ? '14px' : '10px',
      headFont: phone ? '13px' : '11.5px',
      column,
      showIcon,
      colW: phone ? '52px' : '36px',
      colPad: phone ? '4px 4px 4px 4px' : '5px 5px 0 5px',
      btn: phone ? '44px' : '26px',
      icon: phone ? '16' : '13',
      btnBorder: hovered && !phone ? '#52525b' : '#2a2a2a',
      btnBg: hovered && !phone ? '#262626' : 'transparent',
      padR: column ? '8px' : '14px',
      copied,
      idle: !copied,
      aria: copied ? 'Code copied' : 'Copy code',
      cursor: hovered && !phone,
      cursorTop: mode === 'header' ? '19px' : '22px',
      cursorRight: '-10px',
      // The overlay scrollbar macOS and iOS show while scrolling; the screenshot cannot catch the native one.
      scrolled,
      thumbL: phone ? '40%' : '26%',
      thumbW: phone ? '26%' : '54%',
      scroller: (el) => { if (el && scrolled) el.scrollLeft = Math.round((el.scrollWidth - el.clientWidth) * 0.55); }
    };
  }
}
</script>
</body>
</html>
