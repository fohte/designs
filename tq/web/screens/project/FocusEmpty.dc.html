<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Focus view, empty queue or all done</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 900px; overflow: hidden">
<dc-import name="FocusDesktop" state="{{state}}" hint-size="1440px,900px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"allDone":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { state: this.props.allDone === true || String(this.props.allDone) === 'true' ? 'done' : 'empty' };
  }
}
</script>
</body>
</html>
