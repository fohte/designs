<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Desk: inbox with the conversation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; overflow: hidden; background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 14px; line-height: 1.55">
<div style="flex: none; width: 240px"><dc-import name="Nav" view="inbox" hint-size="240px,900px"></dc-import></div>
<div style="flex: none; width: 460px; border-right: 1px solid #2a2a2a"><dc-import name="InboxList" filter="none" hint-size="460px,900px"></dc-import></div>
<section aria-label="Conversation with 通知の再送処理を見直す" style="flex: 1; min-width: 0; height: 900px; display: flex; flex-direction: column">

<header style="flex: none; display: flex; flex-direction: column; padding: 10px 24px 0; border-bottom: 1px solid #2a2a2a">
<div style="display: flex; align-items: center; gap: 10px; min-width: 0; font-size: 12px; color: #8b8b94">
<a href="#" style="min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #d4d4d8; text-decoration: none"><span style="font-family: 'JetBrains Mono', monospace; font-weight: 700">P1 #2048</span> 通知の信頼性を上げる</a>
<a href="#" style="flex: none; font-family: 'JetBrains Mono', monospace; color: #8b8b94; text-decoration: none">example/service</a>
<div style="display: flex; align-items: center; gap: 6px; margin-left: auto">
<button type="button" aria-label="Open session status panel" title="Open session status panel" aria-expanded="false" style="min-width: 32px; height: 26px; display: inline-flex; align-items: center; justify-content: center; padding: 0 10px; border: 1px solid #2a2a2a; background: transparent; color: #d4d4d8"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M15 3v18"></path><path d="m10 15-3-3 3-3"></path></svg></button>
<button type="button" aria-label="Remove from Starred" title="Remove from Starred" aria-pressed="true" style="min-width: 26px; height: 26px; padding: 0 4px; border: 1px solid #2a2a2a; background: transparent; color: #fbbf24; font-size: 16px; line-height: 1">★</button>
</div>
</div>
<h1 style="margin: 2px 0 12px; font-size: 16px; font-weight: 700; color: #fafafa">通知の再送処理を見直す</h1>
</header>

<div aria-live="polite" style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end">
<dc-import name="Turn" option="{{option}}" state="{{state}}" phone="{{ false }}" hint-size="100%,640px"></dc-import>
</div>

<form style="flex: none; box-sizing: border-box; width: min(712px, calc(100% - 48px)); margin: 0 auto 6px; border: 1px solid #3f3f46; background: #141414">
<textarea aria-label="Message" rows="2" placeholder="Message 通知の再送処理を見直す" style="display: block; width: 100%; min-height: 54px; box-sizing: border-box; padding: 12px 14px 4px; border: 0; outline: none; background: transparent; color: #fafafa; font-family: inherit; font-size: 14px; line-height: 1.6; resize: none"></textarea>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 8px 8px 14px; color: #a1a1aa; font-size: 11.5px">
<span>↵ Send · ⇧↵ / ⌥↵ New line · Esc Interrupt</span>
<button type="submit" aria-label="Send message" style="width: 32px; height: 32px; display: grid; place-items: center; padding: 0; border: 0; background: #fafafa; color: #141414; opacity: 0.5"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 7-7 7 7"></path><path d="M12 19V5"></path></svg></button>
</div>
</form>
<div style="flex: none; box-sizing: border-box; width: min(712px, calc(100% - 48px)); margin: 0 auto 12px"><dc-import name="SessionUsage" engine="claude" hint-size="100%,18px"></dc-import></div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"option":{"editor":"enum","options":["current","a","b","c"],"default":"a"},"state":{"editor":"enum","options":["closed","open","more"],"default":"closed"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { option: this.props.option ?? 'a', state: this.props.state ?? 'closed' };
  }
}
</script>
</body>
</html>
