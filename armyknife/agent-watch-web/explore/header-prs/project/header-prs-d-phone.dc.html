<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Header PRs: D phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<main style="position: relative; width: 100%; height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 15px; line-height: 1.55">
<header style="flex: none; display: grid; grid-template-columns: 44px 1fr auto; align-items: center; column-gap: 4px; padding: max(6px, env(safe-area-inset-top)) 8px 0 0; border-bottom: 1px solid #2a2a2a">
<button type="button" aria-label="Back to Inbox" style="width: 44px; height: 44px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #d4d4d8"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
<h1 style="margin: 0; min-width: 0; font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">検索のインデックスを作り直す</h1>
<div style="display: flex; align-items: center; gap: 8px">
<button type="button" aria-label="Open session status panel" style="width: 44px; height: 44px; display: grid; place-items: center; padding: 0; border: 1px solid #3f3f46; background: transparent; color: #d4d4d8"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M15 3v18"></path><path d="m10 15-3-3 3-3"></path></svg></button>
<button type="button" aria-label="More actions" aria-haspopup="menu" aria-expanded="false" style="width: 44px; height: 44px; display: grid; place-items: center; padding: 0; border: 1px solid #3f3f46; background: transparent; color: #fafafa"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg></button>
</div>
<a href="#" style="grid-column: 1 / -1; min-width: 0; min-height: 24px; display: flex; align-items: center; gap: 6px; padding: 0 0 0 14px; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #a1a1aa; text-decoration: none; white-space: nowrap"><span style="min-width: 0; overflow: hidden; text-overflow: ellipsis">#3104 検索を速くする</span><span aria-hidden="true" style="flex: none">·</span><span style="flex: none">search-api</span></a>
<div style="grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; padding: 4px 0 8px 14px">
<button type="button" aria-haspopup="dialog" aria-expanded="{{openStr}}" aria-label="PR #128 検索のインデックスを差分で更新する, open, CI running. 1 more PR from this session" style="min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center; gap: 8px; padding: 0 12px; border: 1px solid {{border}}; background: {{bg}}; color: #fafafa; font-family: inherit; font-size: 13px; white-space: nowrap"><span aria-hidden="true" style="flex: none; width: 7px; height: 7px; background: #60a5fa"></span><span style="font-family: 'JetBrains Mono', monospace; font-size: 12.5px">#128</span><span style="color: #60a5fa">Open · CI running</span><span style="color: #a1a1aa">+1</span><span aria-hidden="true" style="color: #8b8b94">▾</span></button>
<button type="button" aria-haspopup="dialog" aria-expanded="false" style="min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; border: 1px solid #2a2a2a; background: transparent; color: #a1a1aa; font-family: inherit; font-size: 13px; white-space: nowrap">Vibe off<span aria-hidden="true" style="color: #8b8b94">▾</span></button>
</div>
</header>
<div style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 14px; padding: 0 16px 16px">
<article style="align-self: flex-end; max-width: 92%; display: flex; flex-direction: column; gap: 4px">
<div style="text-align: right; font-size: 12px; color: #8b8b94">You · 14:10</div>
<div style="padding: 10px 14px; background: #1f1f1f">インデックスを差分で更新できるようにして。ジョブも足して。</div>
</article>
<article style="color: #d4d4d8">差分更新を PR #128 に、ジョブを example/infra の PR #57 にしました。CI を待っています。</article>
</div>
<form style="flex: none; display: grid; grid-template-columns: 1fr 44px; gap: 8px; padding: 10px 12px max(30px, env(safe-area-inset-bottom)); border-top: 1px solid #2a2a2a; background: #141414">
<textarea aria-label="Message" rows="1" placeholder="Message session" style="min-height: 44px; box-sizing: border-box; padding: 10px 12px; border: 1px solid #3f3f46; background: #0a0a0a; color: #fafafa; font-family: inherit; font-size: 16px; resize: none; outline: none"></textarea>
<button type="submit" aria-label="Send message" style="width: 44px; height: 44px; display: grid; place-items: center; padding: 0; border: 0; background: #fafafa; color: #141414"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 7-7 7 7"></path><path d="M12 19V5"></path></svg></button>
</form>
<sc-if value="{{open}}" hint-placeholder-val="{{ true }}">
<div style="position: absolute; inset: 0; z-index: 30; display: flex; flex-direction: column; justify-content: flex-end; background: rgba(0, 0, 0, 0.58)">
<section role="dialog" aria-modal="true" aria-labelledby="pr-sheet-title" style="display: flex; flex-direction: column; max-height: 80%; overflow-y: auto; padding: 16px 0 max(30px, env(safe-area-inset-bottom)); border-top: 1px solid #3f3f46; background: #1f1f1f; box-shadow: 0 -12px 36px rgb(0 0 0 / 30%); color: #d4d4d8; font-size: 14px">
<h2 id="pr-sheet-title" style="margin: 0 16px 6px; color: #fafafa; font-size: 15px; font-weight: 700">Pull requests from this session</h2>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
<h3 style="margin: 0; padding: 10px 16px 2px; color: #8b8b94; font-size: 12.5px; font-weight: 400">{{g.name}}</h3>
<sc-for list="{{g.rows}}" as="r" hint-placeholder-count="1">
<a href="#" style="min-height: 56px; box-sizing: border-box; display: grid; grid-template-columns: 7px 1fr; align-items: center; column-gap: 12px; padding: 6px 16px; color: #fafafa; text-decoration: none"><span aria-hidden="true" style="width: 7px; height: 7px; background: {{r.dot}}"></span><span style="min-width: 0; display: grid"><span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><span style="font-family: 'JetBrains Mono', monospace; font-size: 13px">#{{r.num}}</span> {{r.title}}</span><span style="font-size: 12.5px; color: #a1a1aa"><span style="font-family: 'JetBrains Mono', monospace">{{r.repo}}</span> · <span style="color: {{r.metaColor}}">{{r.meta}}</span></span></span></a>
</sc-for>
</sc-for>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 16px 0">
<button type="button" style="min-height: 44px; border: 1px solid #3f3f46; background: transparent; color: #fafafa; font-family: inherit; font-size: 12px">Close</button>
<button type="button" aria-label="Merge PR #128" style="min-height: 44px; border: 1px solid #fafafa; background: #fafafa; color: #0a0a0a; font-family: inherit; font-size: 12px; font-weight: 700">Merge #128</button>
</div>
</section>
</div>
</sc-if>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"sheetOpen":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const open = this.props.sheetOpen ?? true;
    return {
      open,
      openStr: open ? 'true' : 'false',
      border: open ? '#a1a1aa' : '#3f3f46',
      bg: open ? '#262626' : 'transparent',
      groups: [
        { name: 'This branch', rows: [{ num: 128, title: '検索のインデックスを差分で更新する', repo: 'example/search-api', dot: '#60a5fa', meta: 'Open · CI running', metaColor: '#60a5fa' }] },
        { name: 'Opened elsewhere', rows: [{ num: 57, title: 'インデックス用のジョブを追加する', repo: 'example/infra', dot: '#4ade80', meta: 'Open · CI passed', metaColor: '#a1a1aa' }] }
      ]
    };
  }
}
</script>
</body>
</html>
