<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>A: phone close sheet with one line on what it withdraws</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; background: #0a0a0a">
<dc-import name="PhoneChat" close-confirm="{{ true }}" close-dialog="{{ dialog }}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { dialog: { note: 'Withdraws 1 to-do and 1 proposal.' } };
  }
}
</script>
</body>
</html>
