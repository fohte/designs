<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>C · PR 下書きの Preview · PC</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; overflow: hidden; background: #0a0a0a; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif">
<div style="flex: none; width: 240px"><dc-import name="Nav" view="inbox" inbox-collapsed="{{ true }}" hint-size="240px,900px"></dc-import></div>
<div style="flex: none; width: 560px"><dc-import name="Conversation" variant="drafts" drafts-detail="PR draft · feature/retry-limit is in the editor" panel-open="{{ true }}" hint-size="100%,900px"></dc-import></div>
<div style="flex: 1; min-width: 0"><dc-import name="StatusPanel" tab="review" draft="{{ 1 }}" view="preview" look="c" hint-size="100%,900px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
