<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>今 · iPhone · Later のシート (スワイプか長押しから)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; background: #0a0a0a">
<dc-import name="ScenePhone" screen="{{ screen }}" inbox="{{ inbox }}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      "screen": "inbox",
      "inbox": {
        "sheet": "later"
      }
    };
  }
}
</script>
</body>
</html>
