<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>New session with model and effort: phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<main style="position: relative; width: 100%; height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 15px; line-height: 1.55"><header style="flex: none; display: flex; align-items: center; gap: 8px; min-height: 50px; padding: max(8px, env(safe-area-inset-top)) 16px 6px; border-bottom: 1px solid #2a2a2a"><button type="button" aria-label="Back to Inbox" style="width: 44px; height: 44px; margin-left: -14px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #d4d4d8"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button><h1 style="margin: 0; font-size: 15px">New session</h1>
<button type="button" aria-haspopup="listbox" aria-expanded="false" style="margin-left: auto; min-width: 0; height: 32px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; border: 1px solid #3f3f46; background: transparent; color: #fafafa; font-family: 'JetBrains Mono', monospace; font-size: 12px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"></path></svg> example/service ▾</button></header><div style="flex: 1; display: grid; place-items: center; padding: 24px; color: #8b8b94; font-size: 13px; text-align: center">The conversation opens here when the session starts.</div><div style="flex: none; padding: 10px 12px max(30px, env(safe-area-inset-bottom)); border-top: 1px solid #2a2a2a">
<div style="border: 1px solid #52525b; background: #0f0f0f">
<textarea aria-label="First message" placeholder="First message (optional)" style="display: block; width: 100%; height: 72px; box-sizing: border-box; padding: 10px 12px; border: 0; outline: none; background: transparent; color: #fafafa; font-family: inherit; font-size: 16px; resize: none">配信ログの保存期間を設定ファイルに出したい</textarea>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 8px">
<sc-if value="{{ isA }}" hint-placeholder-val="{{ true }}">
<button type="button" aria-haspopup="menu" aria-label="Engine" style="height: 30px; padding: 0 10px; border: 1px solid #3f3f46; background: transparent; color: #fafafa; font-family: inherit; font-size: 12.5px">{{ s.engine }} ▾</button>
<button type="button" aria-haspopup="menu" aria-label="Model" style="height: 30px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; border: 1px solid {{ s.modelBorder }}; background: transparent; color: {{ s.modelColor }}; font-family: inherit; font-size: 12.5px"><span>{{ s.model }}</span><sc-if value="{{ s.modelDefault }}" hint-placeholder-val="{{ true }}"><span style="font-size: 11px; color: #8b8b94">default</span></sc-if> ▾</button>
<button type="button" aria-haspopup="menu" aria-label="Reasoning effort" aria-expanded="{{ menuOpen }}" style="height: 30px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; border: 1px solid {{ s.effortBorder }}; background: transparent; color: {{ s.effortColor }}; font-family: inherit; font-size: 12.5px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 14 4-4"></path><path d="M3.34 19a10 10 0 1 1 17.32 0"></path></svg><span>{{ s.effort }}</span><sc-if value="{{ s.effortDefault }}" hint-placeholder-val="{{ true }}"><span style="font-size: 11px; color: #8b8b94">default</span></sc-if> ▾</button>
</sc-if>
<sc-if value="{{ isB }}" hint-placeholder-val="{{ false }}">
<button type="button" aria-haspopup="menu" aria-label="Engine" style="height: 30px; padding: 0 10px; border: 1px solid #3f3f46; background: transparent; color: #fafafa; font-family: inherit; font-size: 12.5px">{{ s.engine }} ▾</button>
<button type="button" aria-haspopup="dialog" aria-label="Model and reasoning effort" aria-expanded="{{ menuOpen }}" style="height: 30px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; border: 1px solid {{ s.comboBorder }}; background: transparent; color: #fafafa; font-family: inherit; font-size: 12.5px"><span style="color: {{ s.modelColor }}">{{ s.model }}</span><span aria-hidden="true" style="color: #71717a">·</span><span style="color: {{ s.effortColor }}">{{ s.effort }}</span><sc-if value="{{ s.allDefault }}" hint-placeholder-val="{{ true }}"><span style="font-size: 11px; color: #8b8b94">default</span></sc-if> ▾</button>
</sc-if>
<sc-if value="{{ isC }}" hint-placeholder-val="{{ false }}">
<button type="button" aria-haspopup="dialog" aria-label="Engine, model and reasoning effort" aria-expanded="{{ menuOpen }}" style="height: 30px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; border: 1px solid {{ s.comboBorder }}; background: transparent; color: #fafafa; font-family: inherit; font-size: 12.5px"><span>{{ s.engine }}</span><span aria-hidden="true" style="color: #71717a">·</span><span style="color: {{ s.modelColor }}">{{ s.model }}</span><span aria-hidden="true" style="color: #71717a">·</span><span style="color: {{ s.effortColor }}">{{ s.effort }}</span><sc-if value="{{ s.allDefault }}" hint-placeholder-val="{{ true }}"><span style="font-size: 11px; color: #8b8b94">default</span></sc-if> ▾</button>
</sc-if>
<button type="button" aria-haspopup="menu" style="height: 30px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; border: 1px solid #3f3f46; background: transparent; color: #fafafa; font-family: inherit; font-size: 12.5px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="6" x2="6" y1="3" y2="15"></line><circle cx="18" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><path d="M18 9a9 9 0 0 1-9 9"></path></svg> New worktree ▾</button>
<button type="button" style="margin-left: auto; height: 32px; padding: 0 14px; border: 0; background: #fafafa; color: #0a0a0a; font-family: inherit; font-size: 13px; font-weight: 700">Start ↵</button>
</div></div></div>

<sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; justify-content: flex-end; background: rgba(0, 0, 0, 0.58)">
<div role="dialog" aria-label="{{ sheetLabel }}" style="box-sizing: border-box; padding: 0 0 max(30px, env(safe-area-inset-bottom)); background: #161616; border-top: 1px solid #3f3f46">
<div style="display: flex; align-items: center; min-height: 52px; padding: 0 8px 0 16px; border-bottom: 1px solid #2a2a2a"><h2 style="margin: 0; font-size: 15px">{{ sheetLabel }}</h2><button type="button" style="margin-left: auto; height: 44px; padding: 0 8px; border: 0; background: transparent; color: #fafafa; font-family: inherit; font-size: 16px; font-weight: 700">Done</button></div>

<sc-if value="{{ isA }}" hint-placeholder-val="{{ true }}">
<div role="radiogroup" aria-label="Reasoning effort" style="padding: 4px 0">
<button type="button" role="radio" aria-checked="true" style="width: 100%; min-height: 52px; display: grid; grid-template-columns: 20px 1fr auto; align-items: center; gap: 10px; padding: 0 16px; border: 0; background: transparent; color: #fafafa; font-family: inherit; font-size: 15px; text-align: left"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg><span>Default<span style="display: block; font-size: 12px; color: #8b8b94">from profile daily</span></span><span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #a1a1aa">high</span></button>
<button type="button" role="radio" aria-checked="false" style="width: 100%; min-height: 52px; display: grid; grid-template-columns: 20px 1fr; align-items: center; gap: 10px; padding: 0 16px; border: 0; background: transparent; color: #fafafa; font-family: 'JetBrains Mono', monospace; font-size: 14px; text-align: left"><span></span><span>low</span></button>
<button type="button" role="radio" aria-checked="false" style="width: 100%; min-height: 52px; display: grid; grid-template-columns: 20px 1fr; align-items: center; gap: 10px; padding: 0 16px; border: 0; background: transparent; color: #fafafa; font-family: 'JetBrains Mono', monospace; font-size: 14px; text-align: left"><span></span><span>medium</span></button>
<button type="button" role="radio" aria-checked="false" style="width: 100%; min-height: 52px; display: grid; grid-template-columns: 20px 1fr; align-items: center; gap: 10px; padding: 0 16px; border: 0; background: transparent; color: #fafafa; font-family: 'JetBrains Mono', monospace; font-size: 14px; text-align: left"><span></span><span>high</span></button>
</div>
<p style="margin: 0; padding: 8px 16px 0; font-size: 12.5px; color: #8b8b94"><span style="font-family: 'JetBrains Mono', monospace">comet-5</span> goes up to high.</p>
</sc-if>

<sc-if value="{{ isB }}" hint-placeholder-val="{{ false }}">
<div style="height: 32px; display: flex; align-items: flex-end; padding: 0 16px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; color: #8b8b94">MODEL · CLAUDE CODE</div>
<div role="radiogroup" aria-label="Model" style="padding: 4px 0">
<button type="button" role="radio" aria-checked="false" style="width: 100%; min-height: 48px; display: grid; grid-template-columns: 20px 1fr auto; align-items: center; gap: 10px; padding: 0 16px; border: 0; background: transparent; color: #fafafa; font-family: inherit; font-size: 15px; text-align: left"><span></span><span>Default</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #a1a1aa">atlas-5</span></button>
<button type="button" role="radio" aria-checked="false" style="width: 100%; min-height: 48px; display: grid; grid-template-columns: 20px 1fr auto; align-items: center; gap: 10px; padding: 0 16px; border: 0; background: transparent; color: #fafafa; font-family: 'JetBrains Mono', monospace; font-size: 14px; text-align: left"><span></span><span>atlas-5</span><span></span></button>
<button type="button" role="radio" aria-checked="true" style="width: 100%; min-height: 48px; display: grid; grid-template-columns: 20px 1fr auto; align-items: center; gap: 10px; padding: 0 16px; border: 0; background: transparent; color: #fafafa; font-family: 'JetBrains Mono', monospace; font-size: 14px; text-align: left"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg><span>borealis-5</span><span></span></button>
<button type="button" role="radio" aria-checked="false" style="width: 100%; min-height: 48px; display: grid; grid-template-columns: 20px 1fr auto; align-items: center; gap: 10px; padding: 0 16px; border: 0; background: transparent; color: #fafafa; font-family: 'JetBrains Mono', monospace; font-size: 14px; text-align: left"><span></span><span>comet-5</span><span style="font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 12px; color: #8b8b94">up to high</span></button>
</div>
</sc-if>

<sc-if value="{{ isC }}" hint-placeholder-val="{{ false }}">
<div role="radiogroup" aria-label="Engine and model" style="padding: 4px 0">
<div style="height: 32px; display: flex; align-items: flex-end; padding: 0 16px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; color: #8b8b94">CLAUDE CODE</div>
<button type="button" role="radio" aria-checked="false" style="width: 100%; min-height: 48px; display: grid; grid-template-columns: 20px 1fr auto; align-items: center; gap: 10px; padding: 0 16px; border: 0; background: transparent; color: #fafafa; font-family: inherit; font-size: 15px; text-align: left"><span></span><span>Default</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #a1a1aa">atlas-5 · high</span></button>
<button type="button" role="radio" aria-checked="true" style="width: 100%; min-height: 48px; display: grid; grid-template-columns: 20px 1fr auto; align-items: center; gap: 10px; padding: 0 16px; border: 0; background: transparent; color: #fafafa; font-family: 'JetBrains Mono', monospace; font-size: 14px; text-align: left"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg><span>borealis-5</span><span></span></button>
<button type="button" role="radio" aria-checked="false" style="width: 100%; min-height: 48px; display: grid; grid-template-columns: 20px 1fr auto; align-items: center; gap: 10px; padding: 0 16px; border: 0; background: transparent; color: #fafafa; font-family: 'JetBrains Mono', monospace; font-size: 14px; text-align: left"><span></span><span>comet-5</span><span style="font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 12px; color: #8b8b94">up to high</span></button>
<div style="height: 32px; display: flex; align-items: flex-end; padding: 0 16px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; color: #8b8b94">CODEX</div>
<button type="button" role="radio" aria-checked="false" style="width: 100%; min-height: 48px; display: grid; grid-template-columns: 20px 1fr auto; align-items: center; gap: 10px; padding: 0 16px; border: 0; background: transparent; color: #fafafa; font-family: inherit; font-size: 15px; text-align: left"><span></span><span>Default</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #a1a1aa">cobalt-2 · medium</span></button>
<button type="button" role="radio" aria-checked="false" style="width: 100%; min-height: 48px; display: grid; grid-template-columns: 20px 1fr auto; align-items: center; gap: 10px; padding: 0 16px; border: 0; background: transparent; color: #fafafa; font-family: 'JetBrains Mono', monospace; font-size: 14px; text-align: left"><span></span><span>cobalt-2-mini</span><span style="font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 12px; color: #8b8b94">up to high</span></button>
</div>
</sc-if>

<sc-if value="{{ showEffortGrid }}" hint-placeholder-val="{{ false }}">
<div style="height: 32px; display: flex; align-items: flex-end; padding: 0 16px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; color: #8b8b94">EFFORT</div>
<div role="radiogroup" aria-label="Reasoning effort" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; margin: 8px 16px 0; border: 1px solid #3f3f46; background: #3f3f46">
<sc-for list="{{ efforts }}" as="e" hint-placeholder-count="6"><button type="button" role="radio" aria-checked="{{ e.on }}" style="height: 44px; padding: 0 6px; border: 0; background: {{ e.bg }}; color: {{ e.fg }}; font-family: inherit; font-size: 14px; white-space: nowrap">{{ e.label }}</button></sc-for>
</div>
</sc-if>
</div>
</div>
</sc-if>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"option":{"editor":"enum","options":["a","b","c"],"default":"a"},"state":{"editor":"enum","options":["default","menu"],"default":"default"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const option = this.props.option ?? 'a';
    const state = this.props.state ?? 'default';
    const menuOpen = state === 'menu';
    let s = { engine: 'Claude Code', model: 'atlas-5', modelDefault: true, effort: 'high', effortDefault: true };
    if (menuOpen && option === 'a') s = { ...s, model: 'comet-5', modelDefault: false };
    if (menuOpen && option !== 'a') s = { ...s, model: 'borealis-5', modelDefault: false, effort: 'xhigh', effortDefault: false };
    s.allDefault = s.modelDefault && s.effortDefault;
    s.modelColor = s.modelDefault ? '#a1a1aa' : '#fafafa';
    s.effortColor = s.effortDefault ? '#a1a1aa' : '#fafafa';
    s.modelBorder = s.modelDefault ? '#3f3f46' : '#71717a';
    s.effortBorder = menuOpen ? '#fafafa' : (s.effortDefault ? '#3f3f46' : '#71717a');
    s.comboBorder = menuOpen ? '#fafafa' : (s.allDefault ? '#3f3f46' : '#71717a');
    const efforts = ['Default · high', 'low', 'medium', 'high', 'xhigh', 'max'].map((label) => {
      const on = label === 'xhigh';
      return { label, on, bg: on ? '#fafafa' : '#161616', fg: on ? '#0a0a0a' : '#d4d4d8' };
    });
    const sheetLabels = { a: 'Effort for comet-5', b: 'Model and effort', c: 'Engine, model and effort' };
    return {
      s,
      menuOpen,
      efforts,
      sheetLabel: sheetLabels[option] ?? sheetLabels.a,
      showEffortGrid: option !== 'a',
      isA: option === 'a',
      isB: option === 'b',
      isC: option === 'c',
    };
  }
}
</script>
</body>
</html>
