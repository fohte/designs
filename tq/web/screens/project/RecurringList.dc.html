<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Recurring templates</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 900px; overflow: hidden; display: flex; background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif">
<div style="flex: none; width: 200px"><dc-import name="Nav" view="none" hint-size="200px,900px"></dc-import></div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<main style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column">

<div style="flex: none; height: 40px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 1px solid #2a2a2a; background: #0a0a0a">
<h2 style="margin: 0; display: inline-flex; align-items: baseline; gap: 8px; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px"><span aria-hidden="true" style="font-weight: 700; color: #ef4444">##</span><span style="font-weight: 500; color: #fafafa">recurring</span></h2>
<a href="RecurringCreateModal.dc.html" style="margin-left: auto; height: 24px; box-sizing: border-box; display: inline-flex; align-items: center; padding: 0 8px; border: 1px solid #71717a; background: #1f1f1f; color: #fafafa; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500; text-decoration: none; white-space: nowrap">+ new</a>
</div>

<sc-if value="{{isLoading}}" hint-placeholder-val="{{false}}">
<p style="margin: 0; padding: 16px; text-align: center; font-size: 14px; line-height: 20px; color: #71717a">Loading...</p>
</sc-if>
<sc-if value="{{isEmpty}}" hint-placeholder-val="{{false}}">
<p style="margin: 0; padding: 16px; text-align: center; font-size: 14px; line-height: 20px; color: #71717a">No recurring templates yet.</p>
</sc-if>

<sc-if value="{{hasRows}}" hint-placeholder-val="{{true}}">
<div>
<sc-for list="{{sections}}" as="sec" hint-placeholder-count="2">
<section aria-label="{{sec.label}}">
<h3 style="margin: 0; padding: 6px 14px; background: #141414; border-bottom: 1px solid #2a2a2a; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px; font-weight: 400; letter-spacing: 0.1em; color: #52525b">{{sec.heading}}</h3>
<sc-for list="{{sec.rows}}" as="r" hint-placeholder-count="3">
<sc-if value="{{r.linked}}" hint-placeholder-val="{{true}}">
<a href="RecurringDetail.dc.html" style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #2a2a2a; color: inherit; text-decoration: none">
<span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 14px; line-height: 20px; font-weight: 500; color: #fafafa">{{r.title}}</span>
<span style="flex: none; display: inline-flex; align-items: center; gap: 4px; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px; color: #71717a"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m17 2 4 4-4 4"></path><path d="M3 11v-1a4 4 0 0 1 4-4h14"></path><path d="m7 22-4-4 4-4"></path><path d="M21 13v1a4 4 0 0 1-4 4H3"></path></svg>{{r.rule}}</span>
<span aria-hidden="true" style="color: #52525b">·</span>
<span style="flex: none; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px; color: #71717a">{{r.next}}</span>
</a>
</sc-if>
<sc-if value="{{r.plain}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #2a2a2a; color: inherit; text-decoration: none">
<span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 14px; line-height: 20px; font-weight: 500; color: #fafafa">{{r.title}}</span>
<span style="flex: none; display: inline-flex; align-items: center; gap: 4px; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px; color: #71717a"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m17 2 4 4-4 4"></path><path d="M3 11v-1a4 4 0 0 1 4-4h14"></path><path d="m7 22-4-4 4-4"></path><path d="M21 13v1a4 4 0 0 1-4 4H3"></path></svg>{{r.rule}}</span>
<span aria-hidden="true" style="color: #52525b">·</span>
<span style="flex: none; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px; color: #71717a">{{r.next}}</span>
</div>
</sc-if>
</sc-for>
</section>
</sc-for>
</div>
</sc-if>

</main>
<dc-import name="StatusLine" path="/recurring" hint-size="100%,24px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["rows","empty","loading"],"default":"rows"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const state = this.props.state ?? 'rows';
    // The detail screen depicts only this template.
    const mark = (rows) => rows.map((r) => ({ ...r, linked: r.title === '植物に水をやる', plain: r.title !== '植物に水をやる' }));
    const active = [
      { title: '植物に水をやる', rule: 'Weekly · Sun, Wed', next: 'Next: Aug 16' },
      { title: '体重を記録する', rule: 'Daily', next: 'Next: Aug 16' },
      { title: '家賃を払う', rule: 'Monthly · 1st', next: 'Next: Sep 1' },
      { title: '浄水器のフィルターを替える', rule: 'Every 2 months · 15th', next: 'Next: Oct 15' }
    ];
    const paused = [
      { title: '週次ミーティングのメモ', rule: 'Weekly · Mon', next: 'Not generating' }
    ];
    return {
      isLoading: state === 'loading',
      isEmpty: state === 'empty',
      hasRows: state === 'rows',
      sections: [
        { label: 'Active', heading: 'Active · ' + active.length, rows: mark(active) },
        { label: 'Paused', heading: 'Paused · ' + paused.length, rows: mark(paused) }
      ]
    };
  }
}
</script>
</body>
</html>
