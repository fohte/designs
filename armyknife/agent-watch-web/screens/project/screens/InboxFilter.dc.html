<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Inbox filter</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; overflow: hidden; background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 13px; line-height: 1.55">
<div style="flex: none; width: 240px"><dc-import name="Nav" view="inbox" hint-size="240px,900px"></dc-import></div>
<div style="position: relative; flex: none; width: 460px; border-right: 1px solid #2a2a2a">
<dc-import name="InboxList" filter="none" hint-size="460px,900px"></dc-import>
<div style="position: absolute; inset: 0; box-sizing: border-box; padding: 134px 14px; display: flex; justify-content: center">
<div role="dialog" aria-label="Filter Inbox" style="width: 500px; max-width: 100%; height: max-content; box-sizing: border-box; background: #1f1f1f; border: 1px solid #3f3f46">
<div style="height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 1px solid #2a2a2a">
<input aria-label="Filter" value="kind:" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: #fafafa; font-family: 'JetBrains Mono', monospace; font-size: 13px">
<span style="flex: none; font-size: 11.5px; color: #8b8b94">↵ apply · esc close</span>
</div>
<div style="display: grid; grid-template-columns: 170px 1fr; min-height: 223px">
<div role="listbox" aria-label="Field" style="padding: 6px 0; border-right: 1px solid #2a2a2a">
<sc-for list="{{fields}}" as="f" hint-placeholder-count="5">
<div role="option" aria-selected="{{f.selected}}" style="height: 30px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; background: {{f.bg}}; color: {{f.color}}; font-size: 12.5px"><span>{{f.label}}</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #a1a1aa">{{f.key}}</span></div>
</sc-for>
</div>
<div role="listbox" aria-label="Kind" aria-multiselectable="true" style="padding: 6px 0">
<sc-for list="{{kinds}}" as="k" hint-placeholder-count="7">
<label style="height: 30px; display: grid; grid-template-columns: 14px 1fr auto; align-items: center; gap: 10px; padding: 0 12px; font-size: 12.5px"><span role="checkbox" aria-checked="{{k.checked}}" style="width: 12px; height: 12px; display: grid; place-items: center; border: 1px solid {{k.box}}; background: {{k.fill}}; color: #0a0a0a; font-size: 10px; line-height: 1">{{k.tick}}</span><span style="color: {{k.color}}">{{k.label}}</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8b8b94">{{k.count}}</span></label>
</sc-for>
</div>
</div>
<div style="padding: 8px 12px; border-top: 1px solid #2a2a2a; font-size: 11.5px; color: #8b8b94">Type to filter: <code style="font-family: 'JetBrains Mono', monospace; color: #a1a1aa">project:web-app kind:review,question task:#123 has:decision</code></div>
</div>
</div>
</div>
<div style="flex: 1; min-width: 0"><dc-import name="Conversation" variant="question" hint-size="100%,900px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      fields: [
        ['Project', 'project:'], ['Kind', 'kind:'], ['tq task', 'task:'], ['Repository', 'repo:'], ['Engine', 'engine:']
      ].map(([label, key], i) => ({ label, key, selected: i === 1 ? 'true' : 'false', bg: i === 1 ? '#3f3f46' : 'transparent', color: i === 1 ? '#fafafa' : '#d4d4d8' })),
      kinds: [
        ['Question', '#fbbf24', 1, true],
        ['Review', '#60a5fa', 1, true],
        ['Error', '#f87171', 1, false],
        ['Plan', '#d4d4d8', 1, false],
        ['Approve', '#fbbf24', 1, false],
        ['Proposal', '#fbbf24', 1, false],
        ['Working', '#60a5fa', 5, false]
      ].map(([label, color, count, checked]) => ({ label, color, count, checked: checked ? 'true' : 'false', box: checked ? '#fafafa' : '#71717a', fill: checked ? '#fafafa' : 'transparent', tick: checked ? '✓' : '' }))
    };
  }
}
</script>
</body>
</html>
