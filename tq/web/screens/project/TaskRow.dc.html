<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Task row</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<a href="#task" aria-label="{{num}} {{title}}" style="display: block; width: 100%; text-decoration: none; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif; color: #fafafa; opacity: {{dragOpacity}}">
<div style="box-sizing: border-box; width: 100%; border-bottom: 1px solid #2a2a2a; border-left: 2px solid transparent; padding: 8px 12px 8px {{indent}}; background: {{rowBg}}; box-shadow: {{ring}}; opacity: {{dimOpacity}}">
<div style="display: flex; align-items: flex-start; gap: 8px">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">

<div style="display: flex; align-items: baseline; gap: 8px">
<sc-if value="{{showGlyph}}" hint-placeholder-val="{{ false }}">
<span style="display: inline-flex; align-items: center; gap: 4px">
<sc-if value="{{isCompleted}}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#c792ea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="completed"><path d="M20 6 9 17l-5-5"></path></svg></sc-if>
<sc-if value="{{isNotPlanned}}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#71717a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="not planned"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></sc-if>
<sc-if value="{{isDuplicate}}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#71717a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="duplicate"><line x1="5" x2="19" y1="9" y2="9"></line><line x1="5" x2="19" y1="15" y2="15"></line></svg></sc-if>
<sc-if value="{{isWaiting}}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fafafa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="返事待ち"><path d="M5 22h14"></path><path d="M5 2h14"></path><path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22"></path><path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2"></path></svg></sc-if>
</span>
</sc-if>
<span style="flex: none; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px; color: #52525b">{{num}}</span>
<span style="min-width: 64px; font-size: 14px; line-height: 20px; font-weight: 400; overflow-wrap: break-word; color: {{titleColor}}; text-decoration: {{titleDecoration}}">{{title}}<sc-if value="{{hasPriority}}" hint-placeholder-val="{{ false }}"><span style="display: inline-block; margin-left: 6px; padding: 2px 6px; background: #141414; color: #fafafa; font-size: 10px; line-height: 14px; text-decoration: none; vertical-align: 1px">{{priority}}</span></sc-if></span>
<sc-if value="{{cardChildren}}" hint-placeholder-val="{{ false }}"><span style="flex: none; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px; color: #71717a">{{children}}</span></sc-if>
<sc-if value="{{cardChecklist}}" hint-placeholder-val="{{ false }}"><span aria-label="{{checklistLabel}}" style="flex: none; display: inline-flex; align-items: center; gap: 4px; align-self: center; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px; color: #71717a"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 5h8"></path><path d="M13 12h8"></path><path d="M13 19h8"></path><path d="m3 17 2 2 4-4"></path><path d="m3 7 2 2 4-4"></path></svg>{{checklist}}</span></sc-if>
</div>

<div style="display: flex; flex-wrap: wrap; align-items: center; column-gap: 8px; row-gap: 4px; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px; color: #71717a">
<sc-if value="{{treeToggle}}" hint-placeholder-val="{{ false }}"><button type="button" aria-label="{{toggleLabel}}" aria-expanded="{{expanded}}" style="flex: none; height: 40px; min-width: 40px; display: inline-flex; align-items: center; justify-content: center; padding: 0; border: 0; background: transparent; color: inherit; font: inherit"><span style="display: inline-flex; align-items: center; gap: 4px; border: 1px solid #2a2a2a; padding: 2px 6px; color: #71717a"><span aria-hidden="true">{{arrow}}</span>{{children}}</span></button></sc-if>
<sc-if value="{{treeChecklist}}" hint-placeholder-val="{{ false }}"><span aria-label="{{checklistLabel}}" style="flex: none; display: inline-flex; align-items: center; gap: 4px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 5h8"></path><path d="M13 12h8"></path><path d="M13 19h8"></path><path d="m3 17 2 2 4-4"></path><path d="m3 7 2 2 4-4"></path></svg>{{checklist}}</span></sc-if>
<sc-for list="{{meta}}" as="m" hint-placeholder-count="2">
<sc-if value="{{m.sep}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="color: #52525b">·</span></sc-if>
<sc-if value="{{m.isLabels}}" hint-placeholder-val="{{ false }}"><span style="display: flex; align-items: center; gap: 6px"><sc-for list="{{m.labels}}" as="l" hint-placeholder-count="1"><button type="button" style="padding: 0; border: 0; background: transparent; color: #71717a; font: inherit">{{l}}</button></sc-for></span></sc-if>
<sc-if value="{{m.isProject}}" hint-placeholder-val="{{ false }}"><span style="flex: none; max-width: 128px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{m.text}}</span></sc-if>
<sc-if value="{{m.isText}}" hint-placeholder-val="{{ false }}"><span style="flex: none">{{m.text}}</span></sc-if>
<sc-if value="{{m.isDate}}" hint-placeholder-val="{{ false }}"><span style="flex: none; display: inline-flex; align-items: center; gap: 4px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M16 2v4"></path><path d="M3 10h18"></path><path d="M8 2v4"></path><path d="M17 14h-6"></path><path d="M13 18H7"></path><path d="M7 14h.01"></path><path d="M17 18h.01"></path></svg><sc-if value="{{m.start}}" hint-placeholder-val="{{ true }}"><span>{{m.start}}</span></sc-if><span>→</span><sc-if value="{{m.due}}" hint-placeholder-val="{{ true }}"><span style="color: {{m.dueColor}}">{{m.due}}</span></sc-if></span></sc-if>
<sc-if value="{{m.isGithub}}" hint-placeholder-val="{{ false }}"><button type="button" style="flex: none; display: inline-flex; align-items: center; gap: 4px; padding: 0 4px; border: 1px solid #2a2a2a; background: transparent; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px"><span style="display: inline-flex; align-items: center; gap: 4px; color: {{m.color}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="18" r="3"></circle><circle cx="6" cy="6" r="3"></circle><path d="M13 6h3a2 2 0 0 1 2 2v7"></path><line x1="6" x2="6" y1="9" y2="21"></line></svg>{{m.text}}</span></button></sc-if>
<sc-if value="{{m.isBlocker}}" hint-placeholder-val="{{ false }}"><span style="flex: none; display: inline-flex; align-items: center; gap: 4px"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 22h14"></path><path d="M5 2h14"></path><path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22"></path><path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2"></path></svg><span style="max-width: 208px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{m.text}}</span><span aria-hidden="true">·</span><span>follow up</span><span>{{m.followUp}}</span></span></sc-if>
</sc-for>
</div>

</div>
<sc-if value="{{tree}}" hint-placeholder-val="{{ true }}">
<div style="flex: none; align-self: center"><button type="button" aria-label="Task actions" style="width: 20px; height: 20px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #71717a; opacity: {{actionsOpacity}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg></button></div>
</sc-if>
</div>
</div>
</a>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"num":{"editor":"text","default":"#128"},"title":{"editor":"text","default":"オンボーディングのチェックリストを書く"},"status":{"editor":"enum","options":["todo","completed","not_planned","duplicate"],"default":"todo"},"priority":{"editor":"text","default":"Now"},"labels":{"editor":"text","default":"#docs"},"project":{"editor":"text","default":"サイト改修"},"context":{"editor":"enum","options":["personal","work"],"default":"personal"},"due":{"editor":"text","default":"Mar 20 → Mar 28"},"overdue":{"editor":"enum","options":["false","true"],"default":"false"},"children":{"editor":"text","default":""},"expanded":{"editor":"enum","options":["false","true"],"default":"false"},"waiting":{"editor":"enum","options":["false","true"],"default":"false"},"depth":{"editor":"text","default":"0"},"selected":{"editor":"enum","options":["false","true"],"default":"false"},"hover":{"editor":"enum","options":["false","true"],"default":"false"},"dragging":{"editor":"enum","options":["false","true"],"default":"false"},"card":{"editor":"enum","options":["false","true"],"default":"false"},"checklist":{"editor":"text","default":""},"github":{"editor":"text","default":""},"githubState":{"editor":"enum","options":["open","closed","merged"],"default":"open"},"blocker":{"editor":"text","default":""},"followUp":{"editor":"text","default":""},"duplicateOf":{"editor":"text","default":""},"actions":{"editor":"enum","options":["true","false"],"default":"true"},"$preview":{"width":800,"height":57}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const on = (v) => v === 'true' || v === true;
    const status = p.status ?? 'todo';
    const closed = status !== 'todo';
    const waiting = on(p.waiting);
    const card = on(p.card);
    const depth = parseInt(p.depth ?? '0', 10) || 0;
    const children = p.children ?? '';
    const checklist = p.checklist ?? '';
    const expanded = on(p.expanded);
    const hover = on(p.hover);
    const priority = p.priority ?? '';
    const labels = (p.labels ?? '').split(/\s+/).filter(Boolean);
    const project = p.project ?? '';
    const due = p.due ?? '';
    const github = p.github ?? '';
    const ghColors = { open: '#c3e88d', closed: '#f07178', merged: '#c792ea' };

    // Metadata in the order the app renders it; only present items get a `·` between them.
    const meta = [];
    if (labels.length > 0) meta.push({ isLabels: true, labels });
    if (project) meta.push({ isProject: true, text: project });
    meta.push({ isText: true, text: p.context ?? 'personal' });
    if (due) {
      const [start, end] = due.split('→').map((t) => t.trim());
      meta.push({ isDate: true, start: start ?? '', due: end ?? '', dueColor: on(p.overdue) && !closed ? '#ef4444' : 'inherit' });
    }
    if (github) meta.push({ isGithub: true, text: github, color: ghColors[p.githubState ?? 'open'] ?? ghColors.open });
    if (status === 'not_planned') meta.push({ isText: true, text: 'not planned' });
    if (status === 'duplicate') meta.push({ isText: true, text: p.duplicateOf ? 'duplicate of ' + p.duplicateOf : 'duplicate' });
    if (waiting) meta.push({ isBlocker: true, text: p.blocker || '見積もりの返信', followUp: p.followUp || 'Mar 3' });
    meta.forEach((m, i) => { m.sep = i > 0; });

    const [done, total] = checklist.split('/');
    return {
      num: p.num ?? '#128',
      title: p.title ?? "オンボーディングのチェックリストを書く",
      priority,
      hasPriority: priority !== '',
      showGlyph: closed || waiting,
      isCompleted: status === 'completed',
      isNotPlanned: status === 'not_planned',
      isDuplicate: status === 'duplicate',
      isWaiting: waiting,
      titleColor: closed ? '#71717a' : '#fafafa',
      titleDecoration: closed ? 'line-through' : 'none',
      dimOpacity: closed ? '0.55' : '1',
      dragOpacity: on(p.dragging) ? '0.5' : '1',
      indent: (12 + 16 * depth) + 'px',
      rowBg: hover ? '#0d0d0d' : 'transparent',
      ring: on(p.selected) ? 'inset 0 0 0 1px #71717a' : 'none',
      tree: !card && p.actions !== "false",
      actionsOpacity: hover ? '1' : '0',
      children,
      cardChildren: card && children !== '',
      treeToggle: !card && children !== '',
      expanded: expanded ? 'true' : 'false',
      arrow: expanded ? '▾' : '▸',
      toggleLabel: expanded ? 'Collapse' : 'Expand',
      checklist,
      checklistLabel: done + ' of ' + total + ' checklist items completed',
      cardChecklist: card && checklist !== '',
      treeChecklist: !card && checklist !== '',
      meta,
    };
  }
}
</script>
</body>
</html>
