<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Link existing task, phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif">
<dc-import name="ProjectDetailPhone" hint-size="390px,844px"></dc-import>
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(4px)"></div>

<div role="dialog" aria-modal="true" aria-labelledby="link-task-title-phone" style="position: absolute; left: 16px; right: 16px; top: 50%; transform: translateY(-50%); box-sizing: border-box; display: grid; gap: 16px; padding: 16px; background: #0a0a0a; box-shadow: 0 0 0 1px rgba(250, 250, 250, 0.1); font-size: 14px; line-height: 20px">
<div style="display: flex; flex-direction: column; gap: 8px">
<h2 id="link-task-title-phone" style="margin: 0; font-size: 16px; line-height: 1; font-weight: 500; color: #fafafa">Link existing task</h2>
</div>
<input type="text" value="{{query}}" placeholder="Search tasks..." aria-label="Search tasks" style="width: 100%; height: 32px; box-sizing: border-box; padding: 4px 10px; border: 1px solid #ef4444; box-shadow: 0 0 0 1px rgba(239, 68, 68, 0.5); background: rgba(42, 42, 42, 0.3); color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif; font-size: 16px; outline: none">
<div style="max-height: 288px; overflow-y: auto; color: #fafafa">
<sc-if value="{{isEmpty}}" hint-placeholder-val="{{false}}">
<div style="padding: 32px 16px; text-align: center; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px; color: #52525b">Type to search tasks</div>
</sc-if>
<sc-if value="{{isNone}}" hint-placeholder-val="{{false}}">
<div style="padding: 32px 16px; text-align: center; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px; color: #52525b">no results for "{{query}}"</div>
</sc-if>
<sc-if value="{{isMatches}}" hint-placeholder-val="{{true}}">
<div role="listbox" aria-label="Tasks">
<sc-for list="{{matches}}" as="m" hint-placeholder-count="4">
<sc-if value="{{m.linked}}" hint-placeholder-val="{{true}}">
<a href="ProjectMoveConfirmPhone.dc.html" role="option" aria-selected="false" style="min-height: 44px; box-sizing: border-box; width: 100%; display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 14px; line-height: 20px; color: #fafafa; text-decoration: none">
<span style="flex: none; color: #52525b">#{{m.num}}</span>
<span style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{m.title}}</span>
<sc-if value="{{m.hasParent}}" hint-placeholder-val="{{false}}"><span style="margin-left: auto; flex: none; font-size: 12px; line-height: 16px; color: #52525b">← #{{m.parent}}</span></sc-if>
</a>
</sc-if>
<sc-if value="{{m.plain}}" hint-placeholder-val="{{false}}">
<div role="option" aria-selected="false" style="min-height: 44px; box-sizing: border-box; width: 100%; display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 14px; line-height: 20px; color: #fafafa; text-decoration: none">
<span style="flex: none; color: #52525b">#{{m.num}}</span>
<span style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{m.title}}</span>
<sc-if value="{{m.hasParent}}" hint-placeholder-val="{{false}}"><span style="margin-left: auto; flex: none; font-size: 12px; line-height: 16px; color: #52525b">← #{{m.parent}}</span></sc-if>
</div>
</sc-if>
</sc-for>
</div>
</sc-if>
</div>
<button type="button" aria-label="Close" style="position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #fafafa"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"results":{"editor":"enum","options":["matches","empty query","no match"],"default":"matches"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const results = this.props.results ?? 'matches';
    const matches = [
      [142, 'デッキの床板を張り替える', null],
      [156, 'デッキ用の塗料を選ぶ', 142],
      [97, '玄関デッキの手すりを直す', null],
      [171, 'デッキ下の雑草を抜く', null]
    ].map(([num, title, parent]) => ({ num, title, parent, hasParent: parent != null, linked: num === 142, plain: num !== 142 })); // the confirm dialog depicts only #142
    return {
      matches,
      query: results === 'matches' ? 'デッキ' : results === 'no match' ? '芝刈り機' : '',
      isEmpty: results === 'empty query',
      isNone: results === 'no match',
      isMatches: results === 'matches'
    };
  }
}
</script>
</body>
</html>
