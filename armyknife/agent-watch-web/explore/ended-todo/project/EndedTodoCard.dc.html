<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>To-do card of an ended session</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; box-sizing: border-box; background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: {{fs}}; line-height: 1.55">
<sc-if value="{{withdrawn}}" hint-placeholder-val="{{ false }}">
<dc-import name="TodoCard" form="withdrawn" phone="{{ phone }}" note="{{wNote}}" title="{{title}}" hint-size="100%,80px"></dc-import>
</sc-if>
<sc-if value="{{pending}}" hint-placeholder-val="{{ true }}">
<article aria-label="User task" style="border: 1px solid #2a2a2a; padding: 14px; display: flex; flex-direction: column; gap: 8px">
<dc-import name="TodoCard" form="header" phone="{{ phone }}" note="{{note}}" hint-size="100%,26px"></dc-import>
<h3 style="margin: 0; font-size: 17px; font-weight: 700">{{title}}</h3>
<div style="font-size: {{detailFs}}; color: #d4d4d8; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">次に通知が届いたときに、実機で音が鳴るか確かめてください。鳴らなければ、設定で選んだ音の名前をコメントに書いてください。</div>
<button type="button" style="align-self: flex-start; min-height: {{moreH}}; padding: 0; border: 0; background: transparent; color: #a1a1aa; font-family: inherit; font-size: {{smallFs}}">Show more</button>
<sc-if value="{{explain}}" hint-placeholder-val="{{ false }}"><p style="margin: 0; color: #a1a1aa; font-size: {{smallFs}}">This session has ended. Mark done and Reject reach it only after you resume it.</p></sc-if>
<textarea aria-label="Comment" rows="2" placeholder="Comment (optional)" style="width: 100%; box-sizing: border-box; padding: {{taPad}}; border: 1px solid #3f3f46; background: #141414; color: #fafafa; font-family: inherit; font-size: {{taFs}}; resize: none"></textarea>
<div style="display: {{btnDisplay}}; grid-template-columns: {{btnCols}}; gap: 8px">
<sc-for list="{{buttons}}" as="b" hint-placeholder-count="3">
<button type="button" style="grid-column: {{b.span}}; margin-left: {{b.ml}}; min-height: {{btnH}}; padding: 0 12px; border: 1px solid {{b.border}}; background: {{b.bg}}; color: {{b.fg}}; font-family: inherit; font-size: {{btnFs}}; font-weight: {{b.weight}}">{{b.label}}</button>
</sc-for>
</div>
</article>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"look":{"editor":"enum","options":["plain","tag","primary","auto"],"default":"plain"},"phone":{"editor":"boolean","default":false},"withdrawn":{"editor":"boolean","default":false},"title":{"editor":"text","default":"通知の音を実機で確かめる"},"$preview":{"width":672,"height":250}}'>
class Component extends DCLogic {
  renderVals() {
    // look: plain is the card as today. tag adds Session ended to the heading and Withdraw after Mark done / Reject.
    // primary says the answer waits for a resume and makes Withdraw the main button.
    const look = this.props.look ?? 'plain';
    const phone = this.props.phone ?? false;
    const main = { border: '#fafafa', bg: '#fafafa', fg: '#0a0a0a', weight: 700 };
    const sub = { border: '#3f3f46', bg: 'transparent', fg: '#d4d4d8', weight: 400 };
    const b = (label, st, extra) => ({ label, ...st, span: 'auto', ml: '0', ...extra });
    const buttons = {
      plain: [b('Mark done', main), b('Reject', sub)],
      tag: [b('Mark done', main), b('Reject', sub), b('Withdraw', sub, { ml: phone ? '0' : 'auto' })],
      primary: [b('Withdraw', main, { span: phone ? '1 / -1' : 'auto' }), b('Mark done', sub), b('Reject', sub)],
      // auto: the server withdrew it when the session ended; only the withdrawn card shows.
      auto: []
    }[look];
    const withdrawn = this.props.withdrawn ?? false;
    return {
      phone, withdrawn, pending: !withdrawn,
      title: this.props.title ?? '通知の音を実機で確かめる',
      note: look === 'plain' || look === 'auto' ? '' : 'Session ended',
      wNote: look === 'auto' ? 'session ended 14:32' : '',
      explain: look === 'primary',
      buttons,
      btnDisplay: phone ? 'grid' : 'flex',
      btnCols: phone ? (look === 'tag' ? '1fr 1fr 1fr' : '1fr 1fr') : 'none',
      fs: phone ? '15px' : '14px', detailFs: phone ? '14px' : '13px', smallFs: phone ? '13px' : '12px',
      moreH: phone ? '32px' : '0', taPad: phone ? '8px 10px' : '6px 8px', taFs: phone ? '16px' : '13px',
      btnH: phone ? '44px' : '28px', btnFs: phone ? '14px' : '12px'
    };
  }
}
</script>
</body>
</html>
