<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Focus view content</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
textarea::placeholder{color:#71717a}
@keyframes focus-spin{to{transform:rotate(360deg)}}
</style>
</helmet>
<main style="width: 100%; height: 100%; overflow: hidden; display: flex; flex-direction: column; background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif">
<header style="flex: none; height: 40px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid #2a2a2a; background: #0a0a0a">
<h1 style="margin: 0; display: inline-flex; align-items: baseline; gap: 8px; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px"><span aria-hidden="true" style="font-weight: 700; color: #ef4444">##</span><span style="font-weight: 500; color: #fafafa">today</span></h1>
<span style="margin-left: auto; white-space: nowrap; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px; color: #71717a">focus mode</span>
</header>

<sc-if value="{{loading}}" hint-placeholder-val="false">
<div style="flex: 1; display: grid; place-items: center"><svg role="img" aria-label="Loading" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#71717a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="animation: focus-spin 1s linear infinite"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg></div>
</sc-if>

<sc-if value="{{empty}}" hint-placeholder-val="false">
<div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 24px; text-align: center">
<p style="margin: 0; font-size: 18px; line-height: 28px; font-weight: 500">{{emptyTitle}}</p>
<p style="margin: 0; font-size: 14px; line-height: 20px; color: #71717a">{{emptyBody}}</p>
</div>
</sc-if>

<sc-if value="{{normal}}" hint-placeholder-val="true">
<div style="flex: 1; min-height: 0; overflow-y: auto; display: flex; justify-content: center; {{s.body}}">
<div style="width: 100%; max-width: 768px; display: flex; flex-direction: column; {{s.gap}}">

<div style="display: flex; align-items: center; gap: 12px; white-space: nowrap; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px">
<span><span style="color: #a1a1aa">2</span><span style="color: #52525b">/</span><span style="color: #a1a1aa">5 completed</span></span>
<div role="progressbar" aria-label="Today's progress" aria-valuenow="40" aria-valuemin="0" aria-valuemax="100" style="flex: 1; height: 2px; background: #1f1f1f"><div style="width: 40%; height: 2px; background: #fafafa"></div></div>
</div>

<article style="border: 1px solid #2a2a2a; background: #141414; {{s.card}}">
<div style="display: flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px">
<span aria-hidden="true" style="color: #ef4444">▍</span>
<span style="letter-spacing: 0.1em; color: #52525b">TODO</span>
<span style="margin-left: auto; letter-spacing: 0.1em; color: #71717a">#231 · personal</span>
</div>
<h2 style="margin: 0; font-weight: 700; line-height: 1.375; text-wrap: balance; {{s.title}}">カレンダー表示を 3 日ビューに対応させる</h2>
<div style="display: flex; gap: 12px; {{s.actions}}">
<button type="button" style="height: 32px; padding: 0 10px; border: 1px solid #71717a; background: #1f1f1f; color: #fafafa; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 500; {{s.complete}}">complete</button>
<sc-if value="{{desktop}}" hint-placeholder-val="true">
<button type="button" style="height: 32px; padding: 0 10px; border: 1px solid #2a2a2a; background: transparent; color: #a1a1aa; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 500">defer</button>
</sc-if>
</div>
</article>

<section aria-label="Subtasks" style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px; letter-spacing: 0.1em"><span style="color: #52525b">SUBTASKS</span><span style="color: #71717a">1/3</span></div>
<div style="border: 1px solid #2a2a2a">
<dc-import name="TaskRow" num="#232" title="3 日ビューの列幅を調整する" status="completed" priority="" labels="" project="" context="personal" due="" overdue="false" children="" expanded="false" waiting="false" depth="0" selected="false" hint-size="100%,57px"></dc-import>
<dc-import name="TaskRow" num="#233" title="3 日ビューで矢印キーの移動幅を 3 日にする" status="todo" priority="" labels="" project="" context="personal" due="" overdue="false" children="" expanded="false" waiting="false" depth="0" selected="false" hint-size="100%,57px"></dc-import>
<dc-import name="TaskRow" num="#234" title="3 日ビューの表示テストを書く" status="todo" priority="" labels="" project="" context="personal" due="" overdue="false" children="" expanded="false" waiting="false" depth="0" selected="false" hint-size="100%,57px"></dc-import>
</div>
</section>

<label style="display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px; letter-spacing: 0.1em; color: #52525b">NOTES</span>
<textarea rows="5" placeholder="Jot down notes while you work..." style="width: 100%; min-height: 64px; box-sizing: border-box; padding: 12px; border: 1px solid #2a2a2a; border-radius: 0; background: #141414; color: #fafafa; font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 1.625; resize: vertical; outline: none"></textarea>
</label>

<div style="display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid #2a2a2a">
<span style="flex: none; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px; letter-spacing: 0.1em; color: #52525b">UP NEXT</span>
<sc-if value="{{desktop}}" hint-placeholder-val="true">
<span style="flex: none; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px; color: #52525b">#240</span>
</sc-if>
<span style="min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; line-height: 20px; color: #a1a1aa">歯医者の予約を取り直す</span>
</div>

</div>
</div>
</sc-if>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"phone":{"editor":"enum","options":["false","true"],"default":"false"},"state":{"editor":"enum","options":["normal","loading","empty","done"],"default":"normal"},"$preview":{"width":1240,"height":876}}'>
class Component extends DCLogic {
  renderVals() {
    const phone = String(this.props.phone) === 'true';
    const state = String(this.props.state || 'normal');
    const done = state === 'done';
    return {
      desktop: !phone,
      loading: state === 'loading',
      empty: state === 'empty' || done,
      normal: state === 'normal',
      emptyTitle: done ? 'All tasks completed for today' : "No tasks in today's queue",
      emptyBody: done ? 'Great work today.' : 'Add tasks to your queue from the Day View.',
      s: phone
        ? { body: 'padding: 16px 14px', gap: 'gap: 20px', card: 'padding: 20px', title: 'margin-top: 12px; font-size: 20px', actions: 'margin-top: 16px', complete: 'flex: 1' }
        : { body: 'padding: 40px 24px', gap: 'gap: 28px', card: 'padding: 24px', title: 'margin-top: 14px; font-size: 24px', actions: 'margin-top: 20px', complete: '' },
    };
  }
}
</script>
</body>
</html>
