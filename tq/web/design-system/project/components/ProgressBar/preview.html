<html lang="en">
<head>
<meta charset="utf-8">
<title>ProgressBar</title>
</head>
<body>
<div class="tq-stack" style="max-width: 190px">
  <div class="tq-progress" role="img" aria-label="39% done"><div class="tq-progress__fill" style="width: 39%"></div></div>
  <div class="tq-progress tq-progress--muted" role="img" aria-label="72% done"><div class="tq-progress__fill" style="width: 72%"></div></div>
</div>
</body>
</html>
