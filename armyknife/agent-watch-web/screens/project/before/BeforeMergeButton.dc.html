<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Before Merge button</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="display: inline-flex; align-items: center; gap: 8px; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: {{fs}}; line-height: 1.5; white-space: nowrap">
<sc-if value="{{idle}}" hint-placeholder-val="{{ true }}"><button type="button" aria-label="Merge PR #{{num}}" style="min-width: {{minW}}; height: {{h}}; padding: 0 {{padX}}; border: 1px solid {{border}}; background: transparent; color: {{color}}; font-family: inherit; font-size: {{fs}}">Merge</button></sc-if>
<sc-if value="{{merging}}" hint-placeholder-val="{{ false }}"><button type="button" disabled aria-label="Merging PR #{{num}}" style="min-width: {{minW}}; height: {{h}}; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 {{padX}}; border: 1px solid #2a2a2a; background: #141414; color: #a1a1aa; font-family: inherit; font-size: {{fs}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg>Merging…</button></sc-if>
<sc-if value="{{done}}" hint-placeholder-val="{{ false }}"><span role="status" style="height: {{h}}; display: inline-flex; align-items: center; gap: 6px; color: {{doneColor}}"><sc-if value="{{queued}}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path></svg></sc-if><sc-if value="{{checked}}" hint-placeholder-val="{{ true }}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></sc-if>{{doneText}}</span></sc-if>
<sc-if value="{{failed}}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; align-items: center; gap: 5px; color: #f87171"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><line x1="12" x2="12" y1="8" y2="12"></line><line x1="12" x2="12.01" y1="16" y2="16"></line></svg>Failed</span><button type="button" aria-label="Retry merging PR #{{num}}" style="min-width: {{minW}}; height: {{h}}; padding: 0 {{padX}}; border: 1px solid #f87171; background: transparent; color: #fafafa; font-family: inherit; font-size: {{fs}}">Retry</button></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["idle","merging","merged","alreadyMerged","queued","failed"],"default":"idle"},"num":{"editor":"int","default":2049},"form":{"editor":"enum","options":["header","row","phone"],"default":"header"},"$preview":{"width":160,"height":44}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.props.state ?? 'idle';
    const form = this.props.form ?? 'header';
    const phone = form === 'phone';
    const done = st === 'merged' || st === 'alreadyMerged' || st === 'queued';
    return {
      num: this.props.num ?? 2049,
      idle: st === 'idle', merging: st === 'merging', done, failed: st === 'failed',
      queued: st === 'queued', checked: st !== 'queued',
      doneText: { merged: 'Merged', alreadyMerged: 'Already merged', queued: 'Queued' }[st] ?? '',
      doneColor: { merged: '#4ade80', alreadyMerged: '#a1a1aa', queued: '#60a5fa' }[st] ?? '#a1a1aa',
      border: form === 'header' ? '#2a2a2a' : '#3f3f46',
      color: form === 'header' ? '#d4d4d8' : '#fafafa',
      fs: phone ? '13px' : '12px', h: phone ? '44px' : '26px', padX: phone ? '14px' : '10px', minW: phone ? '72px' : '0'
    };
  }
}
</script>
</body>
</html>
