<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Header merge · a</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 5590px; height: 936px; display: flex; gap: 20px; background: #0a0a0a; color: #a1a1aa; font-family: 'Helvetica Neue', Arial, 'Hiragino Sans', sans-serif; font-size: 12.5px">
<sc-for list="{{states}}" as="s" hint-placeholder-count="3">
<section style="width: 1440px; flex: none; display: flex; flex-direction: column; gap: 16px"><h2 style="margin: 0; height: 20px; font-size: 12.5px; font-weight: 700; color: #a1a1aa">PC · {{s.label}}</h2><div style="width: 1440px; height: 900px; display: flex; overflow: hidden; background: #0a0a0a"><div style="flex: none; width: 240px"><dc-import name="Nav" view="inbox" hint-size="240px,900px"></dc-import></div><div style="flex: none; width: 460px; border-right: 1px solid #2a2a2a"><dc-import name="InboxList" filter="none" current="{{ 1 }}" hint-size="460px,900px"></dc-import></div><div style="flex: 1; min-width: 0"><dc-import name="Conversation" variant="review" prs-open="{{ true }}" option="a" pr-case="{{s.c}}" hint-size="100%,900px"></dc-import></div></div></section>
<section style="width: 390px; flex: none; display: flex; flex-direction: column; gap: 16px"><h2 style="margin: 0; height: 20px; font-size: 12.5px; font-weight: 700; color: #a1a1aa">スマホ · {{s.label}}</h2><div style="height: 844px"><dc-import name="PhoneChat" state="review" prs-open="{{ true }}" option="a" pr-case="{{s.c}}" hint-size="390px,844px"></dc-import></div></section>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":5590,"height":936}}'>
class Component extends DCLogic {
  renderVals() {
    const L = { ok: 'マージできる', ci: 'CI が失敗', two: '開いた PR が 2 つ' };
    return { states: ['ok', 'ci', 'two'].map((c) => ({ c, label: L[c] })) };
  }
}
</script>
</body>
</html>
