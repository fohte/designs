<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>New task sheet on phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
input::placeholder{color:#71717a}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif">
<dc-import name="TasksPhone" hint-size="390px,844px"></dc-import>
<div style="position: absolute; inset: 0; z-index: 50; background: rgba(0,0,0,.4); backdrop-filter: blur(4px)"></div>
<div role="dialog" aria-labelledby="new-task-title-phone" style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 51; max-height: 85%; overflow-y: auto; padding-bottom: 20px; background: #141414; box-shadow: 0 25px 50px -12px rgba(0,0,0,.25), 0 0 0 1px #222222">

<div style="position: sticky; top: 0; height: 48px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #2a2a2a; background: #141414">
<h2 id="new-task-title-phone" style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 600; color: #fafafa">New Task</h2>
<button type="button" aria-label="Close" style="width: 28px; height: 28px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #fafafa"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
</div>

<div style="display: flex; flex-direction: column; gap: 16px; padding: 16px 20px 0">

<div style="display: flex; min-width: 0; align-items: center; gap: 8px">
<div style="min-width: 0; flex: 1; padding: 0 4px">
<input type="text" aria-label="Task title" placeholder="タスクのタイトル" style="width: 100%; height: 32px; box-sizing: border-box; margin: 0 -4px; padding: 0 4px; border: 0; border-bottom: 1px solid #71717a; background: transparent; color: #fafafa; font: inherit; font-size: 16px; outline: none">
</div>
<button type="button" aria-label="Show title shortcut help" style="flex: none; width: 28px; height: 28px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #71717a"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><path d="M12 17h.01"></path></svg></button>
</div>

<div style="display: flex; flex-direction: column; gap: 4px">
<span id="template-label-phone" style="font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px; letter-spacing: 0.1em; color: #52525b">TEMPLATE</span>
<div role="group" aria-labelledby="template-label-phone" style="display: flex; overflow-x: auto; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px">
<button type="button" aria-pressed="true" style="flex: none; height: 24px; box-sizing: border-box; padding: 4px 10px; border: 1px solid #71717a; background: #1f1f1f; color: #fafafa; font: inherit">—</button>
<button type="button" aria-pressed="false" style="flex: none; height: 24px; box-sizing: border-box; padding: 4px 10px; border: 1px solid #2a2a2a; border-left: 0; background: transparent; color: #71717a; font: inherit">Bug report</button>
<button type="button" aria-pressed="false" style="flex: none; height: 24px; box-sizing: border-box; padding: 4px 10px; border: 1px solid #2a2a2a; border-left: 0; background: transparent; color: #71717a; font: inherit">Research</button>
<button type="button" aria-pressed="false" style="flex: none; height: 24px; box-sizing: border-box; padding: 4px 10px; border: 1px solid #2a2a2a; border-left: 0; background: transparent; color: #71717a; font: inherit">Weekly review</button>
</div>
</div>

<div style="max-height: 253px; overflow-y: auto; font-size: 14px">
<div role="textbox" aria-multiline="true" aria-label="Description" style="min-height: 120px; padding: 8px; font-size: 14px; line-height: 2; color: #71717a">Add description...</div>
</div>

<div style="height: 1px; background: #2a2a2a"></div>

<div style="display: flex; align-items: center; gap: 8px; overflow-x: auto; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px">
<button type="button" style="flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid #2a2a2a; background: transparent; color: #71717a; font: inherit"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 19h6"></path><path d="M16 2v4"></path><path d="M19 16v6"></path><path d="M21 12.598V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h8.5"></path><path d="M3 10h18"></path><path d="M8 2v4"></path></svg>Start</button>
<button type="button" style="flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid #2a2a2a; background: transparent; color: #71717a; font: inherit"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M3 10h18"></path></svg>Due</button>
<button type="button" style="flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid #2a2a2a; background: transparent; color: #71717a; font: inherit"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"></path><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"></path><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"></path></svg>Context</button>
<button type="button" style="flex: none; display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border: 1px solid #2a2a2a; background: transparent; color: #71717a; font: inherit"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 22V4a1 1 0 0 1 .4-.8A6 6 0 0 1 8 2c3 0 5 2 7.333 2q2 0 3.067-.8A1 1 0 0 1 20 4v10a1 1 0 0 1-.4.8A6 6 0 0 1 16 16c-3 0-5-2-8-2a6 6 0 0 0-4 1.528"></path></svg>Inbox</button>
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#71717a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Plan" style="flex: none"><path d="M16 14v2.2l1.6 1"></path><path d="M16 2v4"></path><path d="M21 7.5V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3.5"></path><path d="M3 10h5"></path><path d="M8 2v4"></path><circle cx="16" cy="16" r="6"></circle></svg>
<div role="group" aria-label="Plan" style="flex: none; display: inline-flex; border: 1px solid #2a2a2a; background: #141414; padding: 2px; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif">
<button type="button" aria-pressed="true" style="padding: 4px 10px; border: 0; background: #0a0a0a; color: #fafafa; font: inherit; font-size: 12px; line-height: 16px; font-weight: 500; white-space: nowrap">—</button>
<button type="button" aria-pressed="false" style="padding: 4px 10px; border: 0; background: transparent; color: #71717a; font: inherit; font-size: 12px; line-height: 16px; font-weight: 500; white-space: nowrap">today</button>
<button type="button" aria-pressed="false" style="padding: 4px 10px; border: 0; background: transparent; color: #71717a; font: inherit; font-size: 12px; line-height: 16px; font-weight: 500; white-space: nowrap">this week</button>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px">
<button type="button" style="width: fit-content; padding: 0; border: 0; background: transparent; color: #71717a; font: inherit">+ add tag</button>
</div>

<button type="button" disabled="{{ true }}" style="width: 100%; height: 48px; padding: 0 10px; border: 1px solid #71717a; background: #1f1f1f; color: #fafafa; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 500; opacity: 0.5">Create</button>

</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
