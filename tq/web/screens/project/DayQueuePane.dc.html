<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Queue pane</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif">

<div style="flex: none; padding: 10px 0; border-bottom: 1px solid #2a2a2a">
<div style="display: flex; flex-direction: column; gap: 8px; padding: 0 12px">
<div style="display: flex; align-items: baseline; gap: 10px; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px"><span style="color: #fafafa">2</span><span style="color: #52525b">/</span><span style="color: #fafafa">5</span><span style="color: #52525b">done</span></div>
<div role="progressbar" aria-label="Queue progress" aria-valuenow="40" aria-valuemin="0" aria-valuemax="100" style="height: 2px; background: #1f1f1f"><div style="width: 40%; height: 2px; background: #fafafa"></div></div>
</div>
</div>

<div style="flex: 1; min-height: 0; overflow: auto">

<sc-if value="{{compact}}" hint-placeholder-val="{{ false }}">
<section aria-label="due today" style="border-bottom: 1px solid #2a2a2a">
<h3 style="margin: 0; display: flex; align-items: center; gap: 8px; padding: 8px 12px; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px; font-weight: 400; color: #71717a">due today<span style="display: inline-flex; padding: 0 4px; border: 1px solid #2a2a2a; font-size: 10px; line-height: 14px">1</span></h3>
<div style="padding: 4px 0">
<dc-import name="TaskRow" num="#244" title="API レート制限の調査メモをまとめる" status="todo" priority="" labels="" project="社内基盤" context="work" due="→ Sep 1" overdue="false" children="" expanded="false" waiting="false" depth="0" selected="false" hint-size="100%,57px"></dc-import>
</div>
</section>
</sc-if>

<section aria-label="today" style="border-bottom: 1px solid #2a2a2a">
<h3 style="margin: 0; display: flex; align-items: center; gap: 8px; padding: 8px 12px; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px; font-weight: 400; color: #71717a">today<span style="display: inline-flex; padding: 0 4px; border: 1px solid #2a2a2a; font-size: 10px; line-height: 14px">{{todayCount}}</span><span style="margin-left: auto">09-01</span></h3>
<div style="padding: 4px 0">
<div style="display: flex; align-items: center; gap: 4px; border-bottom: 1px solid #2a2a2a"><div style="flex: 1; min-width: 0"><dc-import name="TaskRow" num="#212" title="請求書の PDF を経理に送る" status="completed" priority="" labels="" project="" context="work" due="" overdue="false" children="" expanded="false" waiting="false" depth="0" selected="false" hint-size="100%,57px"></dc-import></div><button type="button" aria-label="Remove from queue" style="flex: none; width: 24px; height: 24px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #71717a"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></div>
<div style="display: flex; align-items: center; gap: 4px; border-bottom: 1px solid #2a2a2a"><div style="flex: 1; min-width: 0"><dc-import name="TaskRow" num="#198" title="週次レポートのドラフトを書く" status="completed" priority="" labels="#report" project="" context="work" due="" overdue="false" children="" expanded="false" waiting="false" depth="0" selected="false" hint-size="100%,57px"></dc-import></div><button type="button" aria-label="Remove from queue" style="flex: none; width: 24px; height: 24px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #71717a"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></div>
<sc-if value="{{compact}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 4px; border-bottom: 1px solid #2a2a2a; background: #1f1f1f"><div style="flex: 1; min-width: 0"><dc-import name="DayExtrasRow" num="#231" title="カレンダー表示を 3 日ビューに対応させる" status="todo" labels="#dev/tq" project="tq" context="personal" due="" extra="09:30–10:30" extra-tone="muted" current="true" hint-size="100%,57px"></dc-import></div><button type="button" aria-label="Remove from queue" style="flex: none; width: 24px; height: 24px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #71717a"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></div>
<div style="display: flex; align-items: center; gap: 4px; border-bottom: 1px solid #2a2a2a"><div style="flex: 1; min-width: 0"><dc-import name="DayExtrasRow" num="#240" title="歯医者の予約を取り直す" status="todo" labels="#home" project="" context="personal" due="" extra="block ended 09:00" extra-tone="red" current="false" hint-size="100%,57px"></dc-import></div><button type="button" aria-label="Remove from queue" style="flex: none; width: 24px; height: 24px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #71717a"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></div>
</sc-if>
<sc-if value="{{full}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; align-items: center; gap: 4px; border-bottom: 1px solid #2a2a2a"><div style="flex: 1; min-width: 0"><dc-import name="TaskRow" num="#231" title="カレンダー表示を 3 日ビューに対応させる" status="todo" priority="" labels="#dev/tq" project="tq" context="personal" due="" overdue="false" children="" expanded="false" waiting="false" depth="0" selected="false" hint-size="100%,57px"></dc-import></div><button type="button" aria-label="Remove from queue" style="flex: none; width: 24px; height: 24px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #71717a"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></div>
<div style="display: flex; align-items: center; gap: 4px; border-bottom: 1px solid #2a2a2a"><div style="flex: 1; min-width: 0"><dc-import name="TaskRow" num="#240" title="歯医者の予約を取り直す" status="todo" priority="" labels="#home" project="" context="personal" due="" overdue="false" children="" expanded="false" waiting="false" depth="0" selected="false" hint-size="100%,57px"></dc-import></div><button type="button" aria-label="Remove from queue" style="flex: none; width: 24px; height: 24px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #71717a"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></div>
<div style="display: flex; align-items: center; gap: 4px; border-bottom: 1px solid #2a2a2a"><div style="flex: 1; min-width: 0"><dc-import name="TaskRow" num="#244" title="API レート制限の調査メモをまとめる" status="todo" priority="" labels="" project="社内基盤" context="work" due="→ Sep 1" overdue="false" children="" expanded="false" waiting="false" depth="0" selected="false" hint-size="100%,57px"></dc-import></div><button type="button" aria-label="Remove from queue" style="flex: none; width: 24px; height: 24px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #71717a"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></div>
</sc-if>
</div>
</section>

<section aria-label="this week" style="border-bottom: 1px solid #2a2a2a">
<h3 style="margin: 0; display: flex; align-items: center; gap: 8px; padding: 8px 12px; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px; font-weight: 400; color: #71717a">this week<span style="display: inline-flex; padding: 0 4px; border: 1px solid #2a2a2a; font-size: 10px; line-height: 14px">2 + 3</span><span style="margin-left: auto">08-31 – 09-06</span></h3>
<div style="padding: 4px 0">
<div style="display: flex; align-items: center; gap: 4px; border-bottom: 1px solid #2a2a2a"><div style="flex: 1; min-width: 0"><dc-import name="TaskRow" num="#226" title="引っ越しの見積もりを比較する" status="todo" priority="" labels="#home" project="" context="personal" due="Sep 2 → Sep 4" overdue="false" children="" expanded="false" waiting="false" depth="0" selected="false" hint-size="100%,57px"></dc-import></div><button type="button" aria-label="Remove from queue" style="flex: none; width: 24px; height: 24px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #71717a"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></div>
<div style="display: flex; align-items: center; gap: 4px; border-bottom: 1px solid #2a2a2a"><div style="flex: 1; min-width: 0"><dc-import name="TaskRow" num="#219" title="オンボーディング資料を更新する" status="todo" priority="" labels="#docs" project="" context="work" due="" overdue="false" children="" expanded="false" waiting="true" depth="0" selected="false" hint-size="100%,57px"></dc-import></div><button type="button" aria-label="Remove from queue" style="flex: none; width: 24px; height: 24px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #71717a"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></div>

<div style="padding: 6px 12px; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px; color: #71717a">Wed 09-02</div>
<div style="display: flex; min-height: 32px; box-sizing: border-box; align-items: center; gap: 8px; padding: 4px 12px; border-bottom: 1px solid #2a2a2a; font-size: 14px; line-height: 20px"><a href="#" style="flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: #71717a; text-decoration: none">ジムの体験レッスンを予約する</a><button type="button" aria-label="Remove day from ジムの体験レッスンを予約する" title="Remove day" style="flex: none; width: 24px; height: 24px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #71717a"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></div>
<div style="display: flex; min-height: 32px; box-sizing: border-box; align-items: center; gap: 8px; padding: 4px 12px; border-bottom: 1px solid #2a2a2a; font-size: 14px; line-height: 20px"><a href="#" style="flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: #71717a; text-decoration: none">読書会の課題本を読み終える</a><button type="button" aria-label="Remove day from 読書会の課題本を読み終える" title="Remove day" style="flex: none; width: 24px; height: 24px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #71717a"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></div>
<div style="padding: 6px 12px; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px; color: #71717a">Thu 09-03</div>
<div style="display: flex; min-height: 32px; box-sizing: border-box; align-items: center; gap: 8px; padding: 4px 12px; border-bottom: 1px solid #2a2a2a; font-size: 14px; line-height: 20px"><a href="#" style="flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: #71717a; text-decoration: none">四半期目標の振り返りを書く</a><button type="button" aria-label="Remove day from 四半期目標の振り返りを書く" title="Remove day" style="flex: none; width: 24px; height: 24px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #71717a"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></div>
</div>
</section>

<sc-if value="{{full}}" hint-placeholder-val="{{ true }}">
<section aria-label="candidates" style="border-top: 1px solid #2a2a2a">
<h3 style="margin: 0; display: flex; align-items: center; gap: 8px; padding: 8px 12px; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px; font-weight: 400; color: #71717a">candidates<span style="display: inline-flex; padding: 0 4px; border: 1px solid #2a2a2a; font-size: 10px; line-height: 14px">3</span></h3>
<dc-import name="DayExtrasRow" num="#205" title="保険の更新手続きをする" status="todo" labels="#home" project="" context="personal" due="→ Aug 31" overdue="true" extra="1d overdue" extra-tone="red" hint-size="100%,57px"></dc-import>
<dc-import name="DayExtrasRow" num="#187" title="デザインレビューの返事を確認する" status="todo" labels="#design" project="" context="work" due="" extra="wait resolved" extra-tone="red" hint-size="100%,57px"></dc-import>
<dc-import name="DayExtrasRow" num="#250" title="確定申告の書類を揃える" status="todo" labels="#home" project="" context="personal" due="→ Sep 4" overdue="false" extra="due in 3d" extra-tone="muted" hint-size="100%,57px"></dc-import>
</section>
</sc-if>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"layout":{"editor":"enum","options":["default","compact"],"default":"default"},"$preview":{"width":384,"height":836}}'>
class Component extends DCLogic {
  renderVals() {
    const compact = (this.props.layout ?? 'default') === 'compact';
    // The compact side window moves tasks due today out of today/this week into a read-only `due today` section and drops candidates.
    return { compact, full: !compact, todayCount: compact ? '4' : '5' };
  }
}
</script>
</body>
</html>
