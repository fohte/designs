<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>A session that just started</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 100%; height: {{h}}; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: {{fs}}; line-height: 1.55">
<header style="flex: none; display: flex; align-items: center; gap: 8px; min-height: {{headH}}; padding: {{headPad}}; border-bottom: 1px solid #2a2a2a">
<sc-if value="{{phone}}" hint-placeholder-val="{{ false }}"><button type="button" aria-label="Back to Inbox" style="flex: none; width: 44px; height: 44px; margin-left: -14px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #d4d4d8"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button></sc-if>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<a href="#" style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8b8b94; text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">example/notification-service</a>
<h1 style="margin: 0; font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">通知の再送処理を見直して</h1>
</div>
<span style="flex: none; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8b8b94">claude</span>
</header>
<div style="flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 16px; padding: {{bodyPad}}">
<article style="align-self: flex-end; max-width: 80%; display: flex; flex-direction: column; gap: 4px"><div style="display: flex; justify-content: flex-end; font-size: 12px; color: #8b8b94">You · 12:03</div><div style="padding: 10px 14px; background: #1f1f1f; color: #fafafa">通知の再送処理を見直して</div></article>
</div>
<div style="flex: none"><dc-import name="StatusBand" state="working" phone="{{ phone }}" label="Working · 6s" detail="Read src/retry.ts" hint-size="100%,58px"></dc-import></div>
<div style="flex: none; padding: {{composerPad}}">
<textarea aria-label="Message" rows="1" placeholder="Message" style="display: block; width: 100%; min-height: 44px; box-sizing: border-box; padding: 10px 12px; border: 1px solid #3f3f46; outline: none; background: #141414; color: #fafafa; font-family: inherit; font-size: {{inputFs}}; resize: none"></textarea>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"form":{"editor":"enum","options":["desktop","phone"],"default":"desktop"},"$preview":{"width":740,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const phone = (this.props.form ?? 'desktop') === 'phone';
    return {
      phone, h: phone ? '844px' : '900px',
      fs: phone ? '15px' : '13px', inputFs: phone ? '16px' : '14px',
      headH: phone ? '50px' : '52px', headPad: phone ? 'max(8px, env(safe-area-inset-top)) 16px 6px' : '6px 24px',
      bodyPad: phone ? '16px' : '24px',
      composerPad: phone ? '10px 12px max(30px, env(safe-area-inset-bottom))' : '12px 24px 16px'
    };
  }
}
</script>
</body>
</html>
