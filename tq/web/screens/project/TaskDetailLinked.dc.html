<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Task linked tasks section</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<section style="width: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; background: #0a0a0a; color: #fafafa; font-family: 'JetBrains Mono', monospace">
<h3 style="margin: 0; display: inline-flex; align-items: baseline; gap: 8px; font-size: 14px; line-height: 20px; font-weight: 700"><span style="color: #ef4444; font-size: 12px">###</span>linked tasks</h3>

<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; font-size: 12px; line-height: 16px; color: #71717a">No linked tasks. Mention a task with #123 in the description, a page, or a comment to link it.</p>
</sc-if>

<sc-if value="{{filled}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 10px; line-height: 14px; color: #52525b">mentions</span>
<div style="border: 1px solid #2a2a2a">
<dc-import name="TaskRow" num="#118" title="セッション期限を延ばす" status="completed" priority="" labels="#auth" project="会員サイト改修" context="work" due="" overdue="false" children="" expanded="false" waiting="false" depth="0" selected="false" hint-size="100%,57px"></dc-import>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 10px; line-height: 14px; color: #52525b">mentioned by</span>
<div style="border: 1px solid #2a2a2a">
<dc-import name="TaskRow" num="#102" title="問い合わせの多い不具合をまとめる" status="todo" priority="" labels="" project="" context="work" due="" overdue="false" children="" expanded="false" waiting="false" depth="0" selected="false" hint-size="100%,57px"></dc-import>
</div>
</div>
</div>
</sc-if>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"empty":{"editor":"boolean","default":false},"$preview":{"width":768,"height":200}}'>
class Component extends DCLogic {
  renderVals() {
    const empty = this.props.empty === true || this.props.empty === 'true';
    return { empty, filled: !empty };
  }
}
</script>
</body>
</html>
