<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Pane dialog</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 14px; line-height: 1.55">

<sc-if value="{{isModal}}" hint-placeholder-val="{{ true }}">
<section role="dialog" aria-modal="true" aria-label="Session hasn't started" style="width: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; padding: 16px; background: #0f0f0f; border: 1px solid #1a1a1a; border-radius: 8px; box-shadow: 0 12px 36px rgba(0, 0, 0, 0.24); font-size: 12px">
<div style="display: flex; align-items: center; gap: 8px; min-width: 0"><span aria-hidden="true" style="flex: none; width: 7px; height: 7px; background: #f59e0b"></span><h3 style="margin: 0; flex: none; font-size: 13px; font-weight: 700">Session hasn't started</h3><span style="min-width: 0; color: #a1a1aa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{title}}</span></div>
<div style="min-width: 0; overflow: hidden; contain: inline-size"><dc-import name="PaneSnapshot" form="pc" refresh="{{refresh}}" repo="{{repo}}" body-h="{{ '330px' }}" hint-size="100%,366px"></dc-import></div>
<div style="display: flex; align-items: center; justify-content: flex-end; gap: 8px">
<span style="margin-right: auto; color: #8b8b94; font-size: 11.5px">Esc to close</span>
<button type="button" style="height: 26px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; border: 1px solid #2a2a2a; background: transparent; color: #d4d4d8; font-family: inherit; font-size: 12px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 11 2-2-2-2"></path><path d="M11 13h4"></path><rect width="18" height="18" x="3" y="3" rx="2" ry="2"></rect></svg>Open in terminal</button>
<button type="button" style="height: 26px; padding: 0 10px; border: 1px solid #2a2a2a; background: transparent; color: #d4d4d8; font-family: inherit; font-size: 12px">Retry</button>
<button type="button" style="height: 26px; padding: 0 10px; border: 1px solid #2a2a2a; background: transparent; color: #f87171; font-family: inherit; font-size: 12px">Close session</button>
<button type="button" style="height: 26px; padding: 0 10px; border: 1px solid #fafafa; background: #fafafa; color: #0a0a0a; font-family: inherit; font-size: 12px; font-weight: 700">Done</button>
</div>
</section>
</sc-if>

<sc-if value="{{isSheet}}" hint-placeholder-val="{{ false }}">
<section role="dialog" aria-modal="true" aria-label="Session hasn't started" style="width: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; padding: 18px 16px max(30px, env(safe-area-inset-bottom)); border-top: 1px solid #3f3f46; background: #1f1f1f; box-shadow: 0 -12px 36px rgb(0 0 0 / 30%); color: #d4d4d8; font-size: 14px">
<div style="display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="flex: none; width: 7px; height: 7px; background: #f59e0b"></span><h2 style="margin: 0; color: #fafafa; font-size: 15px; font-weight: 700">Session hasn't started</h2></div>
<p style="margin: 0; font-size: 13px">{{title}}</p>
<div style="min-width: 0; overflow: hidden; contain: inline-size"><dc-import name="PaneSnapshot" form="phone" refresh="{{refresh}}" repo="{{repo}}" body-h="{{ '270px' }}" hint-size="100%,316px"></dc-import></div>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
<button type="button" style="min-height: 44px; border: 1px solid #3f3f46; background: transparent; color: #fafafa; font-family: inherit; font-size: 13px">Retry</button>
<button type="button" style="min-height: 44px; border: 1px solid #3f3f46; background: transparent; color: #f87171; font-family: inherit; font-size: 13px">Close session</button>
</div>
<button type="button" style="min-height: 44px; border: 1px solid #fafafa; background: #fafafa; color: #0a0a0a; font-family: inherit; font-size: 13px; font-weight: 700">Done</button>
</section>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"form":{"editor":"enum","options":["modal","sheet"],"default":"modal"},"refresh":{"editor":"enum","options":["auto","button"],"default":"auto"},"repo":{"editor":"text","default":"example/service"},"title":{"editor":"text","default":"通知の再送処理を見直す"},"$preview":{"width":720,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    const form = this.props.form ?? 'modal';
    return {
      isModal: form === 'modal',
      isSheet: form === 'sheet',
      refresh: this.props.refresh ?? 'auto',
      repo: this.props.repo ?? 'example/service',
      title: this.props.title ?? '通知の再送処理を見直す'
    };
  }
}
</script>
</body>
</html>
