    <h3 style="margin: 0; font-size: 17px; line-height: 1.5"><span class="m" style="color: #ef4444; font-weight: 400">### </span>競合の選択を出したくない</h3>
    <p style="margin: 0; outline: 1px solid #2a2a2a; outline-offset: 6px">LWW でも同期そのものはできる。ただ、競合のたびに選択を求められると、<del style="color: #f87171; text-decoration-color: #f87171; background: rgba(248, 113, 113, 0.12)">作業が止まる</del><ins style="color: #4ade80; text-decoration: underline; text-decoration-color: #4ade80; text-underline-offset: 4px; background: rgba(74, 222, 128, 0.12)">書く手が止まる</ins>。<ins style="color: #4ade80; text-decoration: underline; text-decoration-color: #4ade80; text-underline-offset: 4px; background: rgba(74, 222, 128, 0.12)">たとえば電車で足したメモと、PC で直した見出しがぶつかるたびにダイアログが出ると、続きを書く前にどちらを残すかを考えることになる。</ins></p>
    <p style="margin: 0; color: #a1a1aa">そこで、編集は操作の列として記録し、端末ごとにあとから合流させる方式にした。</p>
  </div>

    </div>
