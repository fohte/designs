<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Background action</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; box-sizing: border-box; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: {{fs}}; line-height: 1.5">

<sc-if value="{{isToast}}" hint-placeholder-val="{{ true }}">
<div style="position: relative; overflow: hidden; box-sizing: border-box; display: grid; grid-template-columns: 16px 1fr {{closeW}}; column-gap: 10px; align-items: start; padding: 12px {{toastPadR}} 12px 14px; border: 1px solid #3f3f46; background: #1f1f1f; box-shadow: 0 12px 36px rgb(0 0 0 / 30%)">
<span style="padding-top: 2px; color: {{ic}}">
<sc-if value="{{spin}}" hint-placeholder-val="{{ true }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg></sc-if>
<sc-if value="{{ok}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></sc-if>
<sc-if value="{{clock}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path></svg></sc-if>
<sc-if value="{{errIcon}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><line x1="12" x2="12" y1="8" y2="12"></line><line x1="12" x2="12.01" y1="16" y2="16"></line></svg></sc-if>
</span>
<div style="min-width: 0; display: flex; flex-direction: column; gap: 2px"><strong style="color: #fafafa">{{title}}</strong><span style="min-width: 0; color: #a1a1aa; font-family: {{subFont}}; font-size: {{subFs}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{session}}</span>
<sc-if value="{{hasMsg}}" hint-placeholder-val="{{ false }}"><span style="color: #d4d4d8; font-size: {{subFs}}">{{msg}}</span></sc-if>
<sc-if value="{{toastControls}}" hint-placeholder-val="{{ false }}"><div style="display: grid; grid-template-columns: {{actCols}}; gap: 8px; margin-top: 8px"><sc-if value="{{hasKeep}}" hint-placeholder-val="{{ false }}"><button type="button" style="grid-column: 1 / -1; min-height: {{btnH}}; padding: 0 12px; border: 1px solid #fafafa; background: #fafafa; color: #0a0a0a; font-family: inherit; font-size: {{subFs}}; font-weight: 700; white-space: nowrap">Close and keep worktree</button></sc-if><sc-if value="{{hasRetry}}" hint-placeholder-val="{{ true }}"><button type="button" style="min-height: {{btnH}}; padding: 0 12px; border: 1px solid {{retryBorder}}; background: {{retryBg}}; color: {{retryFg}}; font-family: inherit; font-size: {{subFs}}; font-weight: {{retryWeight}}; white-space: nowrap">Retry</button></sc-if><sc-if value="{{hasDetails}}" hint-placeholder-val="{{ true }}"><button type="button" aria-label="{{detailsAria}}" style="min-height: {{btnH}}; padding: 0 12px; border: 1px solid {{detailsBorder}}; background: {{detailsBg}}; color: {{detailsFg}}; font-family: inherit; font-size: {{subFs}}; font-weight: {{detailsWeight}}; white-space: nowrap">{{detailsLabel}}</button></sc-if></div></sc-if>
<sc-if value="{{hasBtns}}" hint-placeholder-val="{{ false }}"><div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px"><sc-for list="{{btns}}" as="b" hint-placeholder-count="3"><button type="button" aria-label="{{b.aria}}" style="flex: {{b.flex}}; min-width: {{b.minW}}; min-height: {{btnH}}; padding: 0 12px; border: 1px solid {{b.border}}; background: {{b.bg}}; color: {{b.fg}}; font-family: inherit; font-size: {{subFs}}; font-weight: {{b.weight}}; white-space: nowrap">{{b.label}}</button></sc-for></div></sc-if>
</div>
<button type="button" aria-label="Dismiss" style="width: {{closeW}}; height: {{closeH}}; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #8b8b94"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
<sc-if value="{{hasRows}}" hint-placeholder-val="{{ false }}"><div style="grid-column: 1 / -1; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; width: {{rowsW}}; margin-top: {{rowsMt}}; text-align: left"><sc-for list="{{rows}}" as="r" hint-placeholder-count="2"><div style="display: flex; flex-direction: column; gap: 4px"><sc-if value="{{r.hasCaption}}" hint-placeholder-val="{{ false }}"><span style="color: #a1a1aa; font-size: {{subFs}}">{{r.caption}}</span></sc-if><div role="group" aria-label="{{r.aria}}" style="display: grid; grid-template-columns: {{r.cols}}; gap: {{r.gap}}"><sc-for list="{{r.btns}}" as="b" hint-placeholder-count="2"><button type="button" aria-label="{{b.aria}}" aria-haspopup="{{b.popup}}" style="display: flex; align-items: center; justify-content: center; gap: 6px; min-width: 0; min-height: {{btnH}}; padding: 0 {{b.pad}}; border: 1px solid {{b.border}}; border-left-color: {{b.borderL}}; background: {{b.bg}}; color: {{b.fg}}; font-family: inherit; font-size: {{subFs}}; font-weight: {{b.weight}}; white-space: nowrap"><sc-if value="{{b.trash}}" hint-placeholder-val="{{ false }}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M3 6h18"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></sc-if><sc-if value="{{b.caret}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="m6 9 6 6 6-6"></path></svg></sc-if><sc-if value="{{b.hasLabel}}" hint-placeholder-val="{{ true }}"><span style="overflow: hidden; text-overflow: ellipsis">{{b.label}}</span></sc-if></button></sc-for></div></div></sc-for></div></sc-if>
<sc-if value="{{autoDismiss}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="position: absolute; left: 0; bottom: 0; width: 60%; height: 2px; background: #52525b"></span></sc-if>
</div>
</sc-if>

<sc-if value="{{isRow}}" hint-placeholder-val="{{ false }}">
<div style="box-sizing: border-box; display: grid; grid-template-columns: 16px 1fr auto; column-gap: {{gap}}; padding: {{rowPad}}; border-top: 1px solid #2a2a2a; color: #d4d4d8">
<span style="padding-top: 2px; color: {{ic}}">
<sc-if value="{{spin}}" hint-placeholder-val="{{ true }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg></sc-if>
<sc-if value="{{ok}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></sc-if>
<sc-if value="{{clock}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path></svg></sc-if>
<sc-if value="{{errIcon}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><line x1="12" x2="12" y1="8" y2="12"></line><line x1="12" x2="12.01" y1="16" y2="16"></line></svg></sc-if>
</span>
<div style="min-width: 0; display: flex; flex-direction: column; gap: 2px"><strong style="color: #fafafa">{{title}}</strong><a href="#" style="min-width: 0; color: #a1a1aa; font-family: {{subFont}}; font-size: {{subFs}}; text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{session}}</a>
<sc-if value="{{hasRowCmd}}" hint-placeholder-val="{{ false }}"><code style="min-width: 0; color: #d4d4d8; font-family: 'JetBrains Mono', monospace; font-size: {{cmdFs}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{cmd}}</code></sc-if>
<sc-if value="{{hasRowMsg}}" hint-placeholder-val="{{ false }}"><span style="font-size: {{subFs}}">{{msg}}</span></sc-if>
<sc-if value="{{hasChecks}}" hint-placeholder-val="{{ false }}"><div style="display: flex; flex-direction: column; gap: 4px; margin-top: 6px"><dc-import name="CloseChecks" items="{{ checkItems }}" phone="{{ phone }}" hint-size="100%,150px"></dc-import><code style="overflow-wrap: anywhere; color: #8b8b94; font-family: 'JetBrains Mono', monospace; font-size: {{pathFs}}">{{path}}</code></div></sc-if>
<sc-if value="{{rowControls}}" hint-placeholder-val="{{ false }}"><div style="display: {{rowActDisplay}}; grid-template-columns: 1fr 1fr; flex-wrap: wrap; gap: 8px; margin-top: 6px"><sc-if value="{{hasKeep}}" hint-placeholder-val="{{ false }}"><button type="button" style="grid-column: 1 / -1; min-height: {{btnH}}; padding: 0 12px; border: 1px solid #fafafa; background: #fafafa; color: #0a0a0a; font-family: inherit; font-size: {{subFs}}; font-weight: 700; white-space: nowrap">Close and keep worktree</button></sc-if><sc-if value="{{hasRetry}}" hint-placeholder-val="{{ true }}"><button type="button" style="grid-column: {{retrySpan}}; min-width: {{retryW}}; min-height: {{btnH}}; padding: 0 12px; border: 1px solid {{retryBorder}}; background: {{retryBg}}; color: {{retryFg}}; font-family: inherit; font-size: {{subFs}}; font-weight: {{retryWeight}}; white-space: nowrap">Retry</button></sc-if><sc-if value="{{hasOutputBtn}}" hint-placeholder-val="{{ false }}"><button type="button" style="min-width: {{retryW}}; min-height: {{btnH}}; padding: 0 12px; border: 1px solid #fafafa; background: #fafafa; color: #0a0a0a; font-family: inherit; font-size: {{subFs}}; font-weight: 700; white-space: nowrap">Show output</button></sc-if><sc-if value="{{hasTerminal}}" hint-placeholder-val="{{ false }}"><button type="button" style="min-height: {{btnH}}; padding: 0 12px; border: 1px solid #3f3f46; background: transparent; color: #d4d4d8; font-family: inherit; font-size: {{subFs}}; white-space: nowrap">Open in terminal</button></sc-if></div></sc-if>
<sc-if value="{{hasBtns}}" hint-placeholder-val="{{ false }}"><div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px"><sc-for list="{{btns}}" as="b" hint-placeholder-count="3"><button type="button" aria-label="{{b.aria}}" style="flex: {{b.flex}}; min-width: {{b.minW}}; min-height: {{btnH}}; padding: 0 12px; border: 1px solid {{b.border}}; background: {{b.bg}}; color: {{b.fg}}; font-family: inherit; font-size: {{subFs}}; font-weight: {{b.weight}}; white-space: nowrap">{{b.label}}</button></sc-for></div></sc-if>
<sc-if value="{{hasFoot}}" hint-placeholder-val="{{ false }}"><div style="display: flex; flex-direction: column; align-items: flex-start; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid #2a2a2a"><span style="color: #a1a1aa; font-size: {{subFs}}">{{footText}}</span><button type="button" style="align-self: {{footAlign}}; min-height: {{btnH}}; padding: 0 12px; border: 1px solid #f87171; background: transparent; color: #f87171; font-family: inherit; font-size: {{subFs}}; white-space: nowrap">Discard changes and close…</button></div></sc-if>
</div>
<span style="color: #8b8b94; font-family: 'JetBrains Mono', monospace; font-size: 12px">{{time}}</span>
<sc-if value="{{hasRows}}" hint-placeholder-val="{{ false }}"><div style="grid-column: 1 / -1; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; width: {{rowsW}}; margin-top: {{rowsMt}}; text-align: left"><sc-for list="{{rows}}" as="r" hint-placeholder-count="2"><div style="display: flex; flex-direction: column; gap: 4px"><sc-if value="{{r.hasCaption}}" hint-placeholder-val="{{ false }}"><span style="color: #a1a1aa; font-size: {{subFs}}">{{r.caption}}</span></sc-if><div role="group" aria-label="{{r.aria}}" style="display: grid; grid-template-columns: {{r.cols}}; gap: {{r.gap}}"><sc-for list="{{r.btns}}" as="b" hint-placeholder-count="2"><button type="button" aria-label="{{b.aria}}" aria-haspopup="{{b.popup}}" style="display: flex; align-items: center; justify-content: center; gap: 6px; min-width: 0; min-height: {{btnH}}; padding: 0 {{b.pad}}; border: 1px solid {{b.border}}; border-left-color: {{b.borderL}}; background: {{b.bg}}; color: {{b.fg}}; font-family: inherit; font-size: {{subFs}}; font-weight: {{b.weight}}; white-space: nowrap"><sc-if value="{{b.trash}}" hint-placeholder-val="{{ false }}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M3 6h18"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></sc-if><sc-if value="{{b.caret}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="m6 9 6 6 6-6"></path></svg></sc-if><sc-if value="{{b.hasLabel}}" hint-placeholder-val="{{ true }}"><span style="overflow: hidden; text-overflow: ellipsis">{{b.label}}</span></sc-if></button></sc-for></div></div></sc-for></div></sc-if>
</div>
</sc-if>

<sc-if value="{{isLine}}" hint-placeholder-val="{{ false }}">
<div role="status" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: {{subFs}}; text-align: center">
<div style="display: flex; align-items: center; gap: 8px; color: {{lineColor}}">
<span style="display: inline-flex; color: {{ic}}">
<sc-if value="{{spin}}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg></sc-if>
<sc-if value="{{ok}}" hint-placeholder-val="{{ true }}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></sc-if>
<sc-if value="{{clock}}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 6v6l4 2"></path></svg></sc-if>
<sc-if value="{{errIcon}}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><line x1="12" x2="12" y1="8" y2="12"></line><line x1="12" x2="12.01" y1="16" y2="16"></line></svg></sc-if>
</span>
<span>{{lineText}}</span><sc-if value="{{hasTime}}" hint-placeholder-val="{{ true }}"><span style="color: #8b8b94">· {{time}}</span></sc-if>
</div>
<sc-if value="{{hasMsg}}" hint-placeholder-val="{{ false }}"><span style="color: #a1a1aa">{{msg}}</span></sc-if>
<sc-if value="{{lineControls}}" hint-placeholder-val="{{ false }}"><div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 2px"><sc-if value="{{hasKeep}}" hint-placeholder-val="{{ false }}"><button type="button" style="min-height: {{lineBtnH}}; padding: 0 12px; border: 1px solid #fafafa; background: #fafafa; color: #0a0a0a; font-family: inherit; font-size: {{subFs}}; font-weight: 700; white-space: nowrap">Close and keep worktree</button></sc-if><sc-if value="{{hasRetry}}" hint-placeholder-val="{{ true }}"><button type="button" style="min-width: {{retryW}}; min-height: {{lineBtnH}}; padding: 0 12px; border: 1px solid #3f3f46; background: transparent; color: #fafafa; font-family: inherit; font-size: {{subFs}}; white-space: nowrap">Retry</button></sc-if></div></sc-if>
<sc-if value="{{hasBtns}}" hint-placeholder-val="{{ false }}"><div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 2px"><sc-for list="{{btns}}" as="b" hint-placeholder-count="3"><button type="button" aria-label="{{b.aria}}" style="min-width: {{b.lineMinW}}; min-height: {{lineBtnH}}; padding: 0 12px; border: 1px solid {{b.border}}; background: {{b.bg}}; color: {{b.fg}}; font-family: inherit; font-size: {{subFs}}; font-weight: {{b.weight}}; white-space: nowrap">{{b.label}}</button></sc-for></div></sc-if>
<sc-if value="{{hasRows}}" hint-placeholder-val="{{ false }}"><div style="grid-column: 1 / -1; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; width: {{rowsW}}; margin-top: {{rowsMt}}; text-align: left"><sc-for list="{{rows}}" as="r" hint-placeholder-count="2"><div style="display: flex; flex-direction: column; gap: 4px"><sc-if value="{{r.hasCaption}}" hint-placeholder-val="{{ false }}"><span style="color: #a1a1aa; font-size: {{subFs}}">{{r.caption}}</span></sc-if><div role="group" aria-label="{{r.aria}}" style="display: grid; grid-template-columns: {{r.cols}}; gap: {{r.gap}}"><sc-for list="{{r.btns}}" as="b" hint-placeholder-count="2"><button type="button" aria-label="{{b.aria}}" aria-haspopup="{{b.popup}}" style="display: flex; align-items: center; justify-content: center; gap: 6px; min-width: 0; min-height: {{btnH}}; padding: 0 {{b.pad}}; border: 1px solid {{b.border}}; border-left-color: {{b.borderL}}; background: {{b.bg}}; color: {{b.fg}}; font-family: inherit; font-size: {{subFs}}; font-weight: {{b.weight}}; white-space: nowrap"><sc-if value="{{b.trash}}" hint-placeholder-val="{{ false }}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M3 6h18"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></sc-if><sc-if value="{{b.caret}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="m6 9 6 6 6-6"></path></svg></sc-if><sc-if value="{{b.hasLabel}}" hint-placeholder-val="{{ true }}"><span style="overflow: hidden; text-overflow: ellipsis">{{b.label}}</span></sc-if></button></sc-for></div></div></sc-for></div></sc-if>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"a":{"editor":null},"form":{"editor":"enum","options":["toast","row","line"],"default":"toast"},"phone":{"editor":"boolean","default":false},"$preview":{"width":360,"height":110}}'>
class Component extends DCLogic {
  renderVals() {
    // a.result: merging | merged | alreadyMerged | queued | mergeFailed | closing | closed | closeFailed.
    const a = this.props.a ?? { result: 'mergeFailed', pr: 2049, session: '配信チェックの PR を確認する', reason: 'Head branch was updated after you confirmed. Confirm the new head to merge.', time: '12:03' };
    const form = this.props.form ?? 'toast';
    const phone = this.props.phone ?? false;
    const pr = 'PR #' + a.pr;
    // title: toast and Activity. line: the one line in the conversation.
    const W = {
      merging: { icon: 'spin', title: 'Merging ' + pr, line: 'Merging ' + pr + '…' },
      merged: { icon: 'ok', title: 'Merged ' + pr, line: 'Merged ' + pr },
      alreadyMerged: { icon: 'done', title: pr + ' was already merged', line: pr + ' was already merged' },
      queued: { icon: 'queue', title: 'Added ' + pr + ' to the merge queue', line: 'Added ' + pr + ' to the merge queue', msg: 'It merges when the queue’s checks pass.' },
      mergeFailed: { icon: 'err', title: 'Merge failed · ' + pr, line: 'Merge of ' + pr + ' failed' },
      closing: { icon: 'spin', title: 'Closing session', line: 'Closing session…' },
      closed: { icon: 'ok', title: 'Closed session', line: 'Closed session' },
      closeFailed: { icon: 'err', title: 'Close failed', line: 'Close failed' },
      // Discard changes and close: deletes the worktree and its branch after you confirm the list.
      // The server checks again before deleting; anything new or a running process stops it with nothing deleted.
      deleting: { icon: 'spin', title: 'Deleting worktree', line: 'Deleting worktree…' },
      deleted: { icon: 'ok', title: 'Closed session and deleted worktree', line: 'Closed session and deleted worktree' },
      deleteChanged: { icon: 'err', title: 'Did not delete worktree', line: 'Did not delete worktree', msg: 'Changed after you confirmed: ' + (a.grew ?? '') + '.' },
      deleteBlocked: { icon: 'err', title: 'Did not delete worktree', line: 'Did not delete worktree', msg: 'Running in the worktree: ' + (a.process ?? '') + '. Stop it, then Retry.' },
      deleteFailed: { icon: 'err', title: 'Delete failed', line: 'Delete failed' },
      // A ! command from a message. The server stops it after 30 s.
      running: { icon: 'spin', title: 'Running command', line: 'Running command…' },
      succeeded: { icon: 'ok', title: 'Ran command', line: 'Ran command' },
      commandFailed: { icon: 'err', title: 'Command failed · exit ' + a.exit, line: 'Command failed (exit ' + a.exit + ')' },
      timedOut: { icon: 'timeout', title: 'Command timed out', line: 'Command timed out', msg: 'Stopped after 30 s.' }
    }[a.result];
    const IC = { spin: '#a1a1aa', ok: '#4ade80', done: '#a1a1aa', queue: '#60a5fa', err: '#f87171', timeout: '#f87171' };
    const isCmd = ['running', 'succeeded', 'commandFailed', 'timedOut'].includes(a.result);
    const failed = W.icon === 'err' || W.icon === 'timeout';
    // a.checks: a close stopped by its guards, with all three results (the close API runs every guard):
    // path, files (uncommitted), branch + merged + reason, processes ('pid name'). Without it, a.reason is the API's plain message.
    const c = a.checks ?? null;
    const n = (k, one, many) => k + ' ' + (k === 1 ? one : many);
    const files = c?.files ?? [], procs = c?.processes ?? [];
    const checkItems = c ? [
      { label: 'Uncommitted changes', detail: files.join(' · '), state: files.length ? n(files.length, 'file', 'files') : 'None' },
      { label: 'Branch ' + c.branch, detail: c.merged ? '' : (c.reason ?? ''), state: c.merged ? 'Merged' : 'Not merged', ok: !!c.merged },
      { label: 'Running processes', detail: procs.join(' · '), state: procs.length ? procs.length + ' running' : 'None' }
    ] : [];
    const left = [
      files.length ? n(files.length, 'uncommitted file', 'uncommitted files') : '',
      c && !c.merged ? 'branch not merged' : '',
      procs.length ? n(procs.length, 'running process', 'running processes') : ''
    ].filter(Boolean);
    // The toast and the conversation line show only this summary; the Activity row lists all three checks.
    const msg = c ? 'Left in the worktree: ' + left.join(', ') : (a.reason ?? W.msg ?? '');
    const hasKeep = !!c;
    const hasTerminal = !!c?.path;
    // a.discard: where Discard changes and close… sits. button: a 4th button everywhere. menu: behind ⋯. review: only at the bottom of the Activity row.
    const B = {
      keep: { label: 'Close and keep worktree', kind: 'primary', full: true },
      retry: { label: 'Retry', kind: 'plain' },
      details: { label: 'Details', kind: 'plain' },
      terminal: { label: 'Open in terminal', kind: 'plain' },
      discard: { label: 'Discard changes and close…', kind: 'danger', full: true },
      more: { label: '⋯', kind: 'more', aria: 'More actions' },
      again: { label: 'Review again', kind: 'primary' },
      keepPlain: { label: 'Close and keep worktree', kind: 'plain' },
      retryMain: { label: 'Retry', kind: 'primary' }
    };
    const opt = c ? a.discard : null;
    const sets = {
      button: { toast: ['keep', 'retry', 'details', 'discard'], row: ['keep', 'retry', 'terminal', 'discard'], line: ['keep', 'retry', 'discard'] },
      menu: { toast: ['keep', 'retry', 'details', 'more'], row: ['keep', 'retry', 'terminal', 'more'], line: ['keep', 'retry', 'more'] },
      review: { row: ['keep', 'retry', 'terminal'] },
      deleteChanged: { toast: ['again', 'keepPlain'], row: ['again', 'keepPlain'], line: ['again', 'keepPlain'] },
      deleteBlocked: { toast: ['retryMain', 'terminal'], row: ['retryMain', 'terminal', 'keepPlain'], line: ['retryMain'] },
      deleteFailed: { toast: ['retryMain', 'details'], row: ['retryMain'], line: ['retryMain'] }
    };
    const names = (sets[opt] ?? sets[a.result] ?? {})[form] ?? null;
    const S = {
      primary: { border: '#fafafa', bg: '#fafafa', fg: '#0a0a0a', weight: 700 },
      plain: { border: '#3f3f46', bg: 'transparent', fg: '#fafafa', weight: 400 },
      danger: { border: '#f87171', bg: 'transparent', fg: '#f87171', weight: 400 },
      more: { border: '#3f3f46', bg: a.menuOpen ? '#3f3f46' : 'transparent', fg: '#fafafa', weight: 700 }
    };
    const btns = names ? names.map((k) => {
      const b = B[k];
      return {
        ...b, ...S[b.kind], aria: b.aria ?? b.label,
        // Phone: the buttons share each row; PC: they keep their own width. Full ones take a row of their own.
        flex: b.full ? '1 1 100%' : b.kind === 'more' ? '0 0 auto' : phone ? '1 1 0' : '0 0 auto',
        minW: b.kind === 'more' ? (phone ? '44px' : '30px') : '0',
        lineMinW: phone ? (b.kind === 'more' ? '44px' : '88px') : '0'
      };
    }) : null;
    const nFiles = (c?.changes ?? files).length, nCommits = (c?.commits ?? []).length;
    const foot = [nFiles ? n(nFiles, 'file', 'files') : '', nCommits ? n(nCommits, 'commit', 'commits') : ''].filter(Boolean).join(' and ');
    // grid / split / stack: every button in a grid of equal heights, the same rows in the toast, the conversation line and Activity.
    // The trigger stays red text, never red fill: the red fill is the confirmation's final Discard and close.
    const R = {
      keep: { label: 'Close and keep worktree', kind: 'primary' },
      keepShort: { label: 'Keep worktree', aria: 'Close and keep worktree', kind: 'primary' },
      caret: { label: '', aria: 'More ways to close', kind: 'primary', caret: true, popup: 'menu', pad: '0', borderL: '#0a0a0a' },
      retry: { label: 'Retry', kind: 'plain' },
      details: { label: 'Details', kind: 'plain' },
      terminal: { label: 'Open in terminal', kind: 'plain' },
      discardShort: { label: 'Discard changes…', aria: 'Discard changes and close…', kind: 'dangerEdge', trash: true, popup: 'dialog' },
      discard: { label: 'Discard changes and close…', kind: 'dangerText', trash: true, popup: 'dialog' }
    };
    const RS = {
      primary: { border: '#fafafa', bg: '#fafafa', fg: '#0a0a0a', weight: 700 },
      plain: { border: '#3f3f46', bg: 'transparent', fg: '#fafafa', weight: 400 },
      dangerEdge: { border: '#f87171', bg: 'transparent', fg: '#f87171', weight: 400 },
      dangerText: { border: '#3f3f46', bg: 'transparent', fg: '#f87171', weight: 400 }
    };
    const second = form === 'row' ? 'terminal' : 'details';
    const tap = phone ? '44px' : '26px';
    const layouts = {
      grid: [{ caption: 'Close anyway', aria: 'Close anyway', btns: ['keepShort', 'discardShort'] }, { btns: ['retry', second] }],
      split: [{ aria: 'Close', btns: ['keep', 'caret'], cols: '1fr ' + tap, gap: '0' }, { btns: ['retry', second] }],
      stack: [{ btns: ['keep'] }, { btns: ['discard'] }, { btns: ['retry', second] }]
    };
    const rows = (c && layouts[a.discard]) ? layouts[a.discard].map((r) => ({
      caption: r.caption ?? '', hasCaption: !!r.caption, aria: r.aria ?? 'Actions',
      cols: r.cols ?? 'repeat(' + r.btns.length + ', minmax(0, 1fr))', gap: r.gap ?? '8px',
      btns: r.btns.map((k) => {
        const b = R[k], s = RS[b.kind];
        return { ...s, ...b, aria: b.aria ?? b.label, hasLabel: !!b.label, trash: !!b.trash, caret: !!b.caret, popup: b.popup ?? 'false', pad: b.pad ?? '10px', borderL: b.borderL ?? s.border, ...(b.caret && a.menuOpen && form === 'toast' ? { bg: '#d4d4d8', border: '#d4d4d8' } : {}) };
      })
    })) : null;
    // A command failure offers only Show output: its full result is already in the conversation, and Retry from a toast could run it twice.
    return {
      btns: btns ?? [], hasBtns: !!btns,
      hasFoot: opt === 'review' && form === 'row', footText: 'Deletes the worktree with ' + foot + ' that are not saved anywhere else.', footAlign: phone ? 'stretch' : 'flex-start',
      // A close failure without guard results has nothing more to show in Activity.
      hasDetails: isCmd || !(a.result === 'closeFailed' && !c),
      hasRetry: !isCmd,
      hasOutputBtn: isCmd && failed,
      toastControls: failed && !btns && !rows, rowControls: failed && !btns && !rows, lineControls: failed && !isCmd && !btns && !rows,
      rows: rows ?? [], hasRows: !!rows,
      rowsW: form === 'line' && !phone ? '360px' : '100%', rowsMt: form === 'toast' ? '10px' : form === 'row' ? '8px' : '4px',
      detailsLabel: isCmd ? 'Show output' : 'Details',
      detailsAria: isCmd ? 'Show output in the conversation' : 'Details in Activity',
      detailsBorder: isCmd ? '#fafafa' : '#3f3f46', detailsBg: isCmd ? '#fafafa' : 'transparent', detailsFg: isCmd ? '#0a0a0a' : '#d4d4d8', detailsWeight: isCmd ? 700 : 400,
      // A command toast's second line is the command; Activity rows show the session and the command.
      subFont: isCmd && form === 'toast' ? "'JetBrains Mono', monospace" : 'inherit',
      cmd: a.cmd ?? '', hasRowCmd: isCmd && form === 'row',
      cmdFs: phone ? '12px' : '11.5px',
      hasChecks: !!c, checkItems, path: c?.path ?? '', hasKeep, hasTerminal, hasRowMsg: !!msg && !c,
      retryBorder: hasKeep ? '#3f3f46' : '#fafafa', retryBg: hasKeep ? 'transparent' : '#fafafa', retryFg: hasKeep ? '#fafafa' : '#0a0a0a', retryWeight: hasKeep ? 400 : 700,
      // Phone: the buttons fill the row, Close and keep worktree on its own line, then Retry and Open in terminal side by side.
      rowActDisplay: phone && hasKeep ? 'grid' : 'flex', retrySpan: phone && hasKeep && !hasTerminal ? '1 / -1' : 'auto',
      pathFs: phone ? '11px' : '10.5px',
      isToast: form === 'toast', isRow: form === 'row', isLine: form === 'line',
      spin: W.icon === 'spin', ok: W.icon === 'ok' || W.icon === 'done', queue: W.icon === 'queue', err: failed,
      clock: W.icon === 'queue' || W.icon === 'timeout', errIcon: W.icon === 'err',
      ic: IC[W.icon],
      lineColor: failed ? '#f87171' : '#a1a1aa',
      title: W.title, lineText: W.line,
      session: isCmd && form === 'toast' ? (a.cmd ?? '') : (a.session ?? ''),
      msg, hasMsg: !!msg,
      time: a.time ?? '', hasTime: !!a.time,
      // Running toasts stay until they finish; failures stay until dismissed; the rest leave on their own.
      autoDismiss: W.icon === 'ok' || W.icon === 'done' || W.icon === 'queue',
      fs: phone ? '14px' : '13px', subFs: phone ? '13px' : '12px',
      btnH: phone ? '44px' : '26px', lineBtnH: phone ? '44px' : '24px', retryW: phone ? '88px' : '0',
      actCols: phone ? (isCmd ? '1fr' : '1fr 1fr') : 'max-content max-content',
      closeW: phone ? '44px' : '22px', closeH: phone ? '32px' : '22px', toastPadR: phone ? '0' : '10px',
      gap: phone ? '12px' : '10px', rowPad: phone ? '12px 16px' : '10px 14px'
    };
  }
}
</script>
