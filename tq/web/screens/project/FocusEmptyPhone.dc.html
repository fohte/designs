<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Focus view on a phone, empty</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: #0a0a0a">
<div style="flex: 1; min-height: 0"><dc-import name="FocusBody" phone="true" state="{{state}}" hint-size="100%,791px"></dc-import></div>
<dc-import name="TabBar" view="today" hint-size="100%,53px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"allDone":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { state: this.props.allDone === true || String(this.props.allDone) === 'true' ? 'done' : 'empty' };
  }
}
</script>
</body>
</html>
