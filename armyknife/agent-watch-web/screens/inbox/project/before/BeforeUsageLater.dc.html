<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Later menu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; display: flex; overflow: hidden; background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 13px; line-height: 1.55">
<div style="flex: none; width: 240px"><dc-import name="BeforeUsageNav" view="inbox" hint-size="240px,900px"></dc-import></div>
<div style="flex: none; width: 460px; border-right: 1px solid #2a2a2a"><dc-import name="BeforeUsageInboxList" filter="none" later-menu-open="{{ true }}" hint-size="460px,900px"></dc-import></div>
<div style="flex: 1; min-width: 0"><dc-import name="BeforeUsageConversation" variant="question" hint-size="100%,900px"></dc-import></div>

<div style="position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0, 0, 0, 0.35)">
<div role="menu" aria-label="Later: 通知の再送処理を見直す" style="width: 280px; box-sizing: border-box; padding: 6px 0; background: #1f1f1f; border: 1px solid #3f3f46">
<div style="padding: 6px 12px 8px; font-size: 12px; color: #a1a1aa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Later: 通知の再送処理を見直す</div>
<sc-for list="{{options}}" as="o" hint-placeholder-count="5">
<button type="button" role="menuitem" style="width: 100%; height: 32px; box-sizing: border-box; display: grid; grid-template-columns: 1fr auto 14px; align-items: center; gap: 10px; padding: 0 12px; border: 0; background: {{o.bg}}; color: #fafafa; font-family: inherit; font-size: 13px; text-align: left"><span>{{o.label}}</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #a1a1aa">{{o.when}}</span><kbd style="font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #a1a1aa">{{o.key}}</kbd></button>
</sc-for>
<div style="margin: 6px 0; height: 1px; background: #2a2a2a"></div>
<p style="margin: 0; padding: 2px 12px 4px; font-size: 11.5px; color: #8b8b94">New activity in the session also brings it back.</p>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      options: [
        ['In 1 hour', '16:00', '1'],
        ['This evening', '19:00', '2'],
        ['Tomorrow', 'Mon 9:00', '3'],
        ['Next week', 'Mon 11/16', '4'],
        ['Until it changes', 'next activity', '5']
      ].map(([label, when, key], i) => ({ label, when, key, bg: i === 0 ? '#2a2a2e' : 'transparent' }))
    };
  }
}
</script>
</body>
</html>
