<!-- @dsCard group="Actions" height=300 subtitle="static rendition" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Button</title>
</head>
<body>
<div class="fui-row">
  <span class="fui-note">variant</span>
  <button class="fui-button fui-button--default" type="button">Default</button>
  <button class="fui-button fui-button--solid" type="button">Solid</button>
  <button class="fui-button fui-button--outline" type="button">Outline</button>
  <button class="fui-button fui-button--secondary" type="button">Secondary</button>
  <button class="fui-button fui-button--ghost" type="button">Ghost</button>
  <button class="fui-button fui-button--destructive" type="button">Destructive</button>
  <button class="fui-button fui-button--link" type="button">Link</button>
  <button class="fui-button-plain" type="button">Plain</button>
</div>
<div class="fui-row">
  <span class="fui-note">size</span>
  <button class="fui-button fui-button--default fui-button--xs" type="button">Extra small</button>
  <button class="fui-button fui-button--default fui-button--sm" type="button">Small</button>
  <button class="fui-button fui-button--default" type="button">Default</button>
  <button class="fui-button fui-button--default fui-button--lg" type="button">Large</button>
  <button class="fui-button fui-button--default fui-button--icon" type="button" aria-label="Search"><svg class="fui-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></button>
  <button class="fui-button fui-button--default fui-button--icon-xs" type="button" aria-label="Add"><svg class="fui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg></button>
  <button class="fui-button fui-button--default fui-button--icon-sm" type="button" aria-label="Download"><svg class="fui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5"/></svg></button>
  <button class="fui-button fui-button--default fui-button--icon-lg" type="button" aria-label="Continue"><svg class="fui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
</div>
<div class="fui-row">
  <span class="fui-note">state</span>
  <button class="fui-button fui-button--default is-hover" type="button">Hover</button>
  <button class="fui-button fui-button--outline is-hover" type="button">Hover</button>
  <button class="fui-button fui-button--secondary is-hover" type="button">Hover</button>
  <button class="fui-button fui-button--destructive is-hover" type="button">Hover</button>
  <button class="fui-button fui-button--outline is-focus" type="button">Focus</button>
  <button class="fui-button fui-button--destructive is-focus" type="button">Focus</button>
  <button class="fui-button fui-button--outline" type="button" aria-invalid="true">Invalid</button>
  <button class="fui-button fui-button--default" type="button" disabled>Disabled</button>
</div>
<div class="fui-row">
  <span class="fui-note">content</span>
  <button class="fui-button fui-button--solid" type="button">Accept <kbd class="fui-kbd">Tab</kbd></button>
  <button class="fui-button fui-button--outline" type="button"><svg class="fui-icon" data-icon="inline-start" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg>New note</button>
  <button class="fui-button fui-button--outline fui-button--sm" type="button">Next<svg class="fui-icon" data-icon="inline-end" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button>
  <span style="font-size:14px">Change the title <button class="fui-button-plain" type="button">Edit</button> any time.</span>
  <button class="fui-button-plain" type="button" aria-label="Remove tag"><svg class="fui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  <button class="fui-button-plain is-hover" type="button" aria-label="Remove tag"><svg class="fui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  <button class="fui-button-plain is-hover" type="button" style="font-size:14px">+3 more</button>
</div>
</body>
</html>
