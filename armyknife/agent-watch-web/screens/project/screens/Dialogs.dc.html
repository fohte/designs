<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Confirmation dialogs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: grid; grid-template-columns: 1fr 1fr; background: rgba(0, 0, 0, 0.55); color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 14px; line-height: 1.55">

<div style="display: grid; place-items: center; padding: 16px; background: #050505">
<section role="dialog" aria-modal="true" aria-labelledby="bang-title" style="width: min(100%, 34rem); box-sizing: border-box; padding: 1.25rem; background: #1f1f1f; border: 1px solid #3f3f46; box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.25)">
<h2 id="bang-title" style="margin: 0; font-size: 1.1rem; font-weight: 700">Run agent command?</h2>
<p style="margin: 1rem 0 0; color: #d4d4d8">Review the command and working directory before it runs.</p>
<dl style="margin: 1rem 0">
<dt style="margin-top: 0.75rem; font-weight: 700">Working directory</dt>
<dd style="margin: 0.25rem 0 0"><code style="font-family: 'JetBrains Mono', monospace; font-size: 0.9em; color: #d4d4d8">~/src/example/service</code></dd>
<dt style="margin-top: 0.75rem; font-weight: 700">Command</dt>
<dd style="margin: 0.25rem 0 0"><pre style="margin: 0; padding: 10px 12px; background: #131313; border: 1px solid #262626; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: #d4d4d8">cargo test -p service
cargo clippy</pre></dd>
</dl>
<div style="display: flex; justify-content: flex-end; gap: 8px">
<button type="button" style="min-height: 2rem; padding: 0.25rem 0.65rem; border: 1px solid #3f3f46; background: #1f1f1f; color: #fafafa; font-family: inherit; font-size: 0.8rem">Cancel</button>
<button type="button" style="min-height: 2rem; padding: 0.25rem 0.65rem; border: 1px solid #3f3f46; background: #1f1f1f; color: #fafafa; font-family: inherit; font-size: 0.8rem">Run command</button>
</div>
</section>
</div>

<div style="display: grid; place-items: center; padding: 16px; background: #050505; border-left: 1px solid #2a2a2a">
<section role="dialog" aria-modal="true" aria-labelledby="merge-title" style="width: min(100%, 320px); box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; padding: 16px; background: #0f0f0f; border: 1px solid #1a1a1a; border-radius: 8px; box-shadow: 0 12px 36px rgba(0, 0, 0, 0.24); font-size: 12px">
<h3 id="merge-title" style="margin: 0; font-size: 13px; font-weight: 700">Merge this pull request?</h3>
<p style="margin: 0; color: #d4d4d8">Merge PR #2049 using the confirmed head commit?</p>
<code style="overflow-wrap: anywhere; color: #8b8b94; font-family: 'JetBrains Mono', monospace; font-size: 10px">3f9c2a1e8b7d4c6f0a5e9d2b1c8f7a6e5d4c3b2a</code>
<div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px">
<button type="button" style="height: 26px; padding: 0 10px; border: 1px solid #2a2a2a; background: transparent; color: #d4d4d8; font-family: inherit; font-size: 12px">Cancel</button>
<button type="button" style="height: 26px; padding: 0 10px; border: 1px solid #fafafa; background: #fafafa; color: #0a0a0a; font-family: inherit; font-size: 12px; font-weight: 700">Confirm merge</button>
</div>
</section>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
