<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Focus view</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 900px; overflow: hidden; display: flex; background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif">
<div style="flex: none; width: 200px"><dc-import name="Nav" view="today" hint-size="200px,900px"></dc-import></div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<div style="flex: 1; min-height: 0"><dc-import name="FocusBody" phone="false" state="{{state}}" hint-size="100%,876px"></dc-import></div>
<dc-import name="StatusLine" path="/today" hint-size="100%,24px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["normal","loading","empty","done"],"default":"normal"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { state: String(this.props.state || 'normal') };
  }
}
</script>
</body>
</html>
