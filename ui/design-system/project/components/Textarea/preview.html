<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Textarea</title>
</head>
<body>
<div class="fui-grid">
  <div class="fui-cell" style="align-self:stretch"><span class="fui-note">placeholder</span><textarea class="fui-textarea" placeholder="Enter a longer value"></textarea></div>
  <div class="fui-cell" style="align-self:stretch"><span class="fui-note">value</span><textarea class="fui-textarea">Bring the blue notebook.
Leave the spare key with the neighbour.</textarea></div>
  <div class="fui-cell" style="align-self:stretch"><span class="fui-note">focus</span><textarea class="fui-textarea is-focus" placeholder="Enter a longer value"></textarea></div>
  <div class="fui-cell" style="align-self:stretch"><span class="fui-note">disabled</span><textarea class="fui-textarea" placeholder="Enter a longer value" disabled></textarea></div>
  <div class="fui-cell" style="align-self:stretch"><span class="fui-note">invalid</span><textarea class="fui-textarea" placeholder="Enter a longer value" aria-invalid="true"></textarea></div>
</div>
</body>
</html>
