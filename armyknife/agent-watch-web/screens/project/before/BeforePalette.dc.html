<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Command palette</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; display: flex; overflow: hidden; background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 13px; line-height: 1.55">
<div style="flex: none; width: 240px"><dc-import name="BeforeNav" view="inbox" hint-size="240px,900px"></dc-import></div>
<div style="flex: none; width: 460px; border-right: 1px solid #2a2a2a"><dc-import name="BeforeInboxList" filter="none" hint-size="460px,900px"></dc-import></div>
<div style="flex: 1; min-width: 0"><dc-import name="BeforeConversation" variant="question" hint-size="100%,900px"></dc-import></div>

<div style="position: absolute; inset: 0; display: flex; justify-content: center; padding-top: 96px; box-sizing: border-box; background: rgba(0, 0, 0, 0.58)">
<div role="dialog" aria-label="Jump to" style="width: 680px; height: 660px; box-sizing: border-box; display: flex; flex-direction: column; background: #161616; border: 1px solid #3f3f46">
<div style="flex: none; height: 54px; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid #2a2a2a">
<span aria-hidden="true" style="color: #8b8b94; font-size: 16px">⌕</span>
<input aria-label="Jump to" value="{{query}}" placeholder="Jump to a session, tq task or project, or type &gt; for commands" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: #fafafa; font-family: inherit; font-size: 15px">
<kbd style="padding: 1px 6px; border: 1px solid #3f3f46; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #a1a1aa">esc</kbd>
</div>
<div role="tablist" aria-label="Scope" style="flex: none; height: 34px; display: flex; align-items: stretch; gap: 16px; padding: 0 16px; border-bottom: 1px solid #2a2a2a; font-size: 12px">
<sc-for list="{{scopes}}" as="s" hint-placeholder-count="5">
<button type="button" role="tab" aria-selected="{{s.selected}}" style="padding: 0; border: 0; border-bottom: 2px solid {{s.underline}}; background: transparent; color: {{s.color}}; font-family: inherit; font-size: 12px; font-weight: {{s.weight}}">{{s.label}}</button>
</sc-for>
</div>
<div role="listbox" style="flex: 1; min-height: 0; overflow-y: auto; padding: 4px 0">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<h2 style="height: 28px; display: flex; align-items: center; margin: 0; padding: 0 16px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; color: #8b8b94">{{g.title}}</h2>
<sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
<sc-if value="{{it.isSession}}" hint-placeholder-val="{{ true }}">
<div role="option" aria-selected="{{it.selected}}"><dc-import name="BeforeSessionRow" s="{{ it }}" density="compact" hint-size="100%,69px"></dc-import></div>
</sc-if>
<sc-if value="{{it.isOther}}" hint-placeholder-val="{{ false }}">
<div role="option" aria-selected="{{it.selected}}" style="min-height: 44px; box-sizing: border-box; display: grid; grid-template-columns: 16px 1fr; align-items: center; gap: 12px; padding: 5px 16px; background: {{it.bg}}">
<span aria-hidden="true" style="color: #a1a1aa; text-align: center">{{it.glyph}}</span>
<div style="min-width: 0"><div style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fafafa">{{it.title}}</div><div style="font-size: 11.5px; color: #a1a1aa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.sub}}</div></div>
</div>
</sc-if>
</sc-for>
</sc-for>
</div>
<div style="flex: none; height: 36px; display: flex; align-items: center; gap: 14px; padding: 0 16px; border-top: 1px solid #2a2a2a; font-size: 11.5px; color: #8b8b94">
<span>↵ Open</span><span>⌘↵ Open beside</span><span>→ Actions</span><span>Tab Scope</span><span style="margin-left: auto; font-family: 'JetBrains Mono', monospace">#  task · @ project · &gt; command</span>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"scope":{"editor":"enum","options":["all","tasks","close"],"default":"all"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const scope = this.props.scope ?? 'all';
    const tasks = scope === 'tasks';
    const close = scope === 'close';
    const scopes = [['all', 'All'], ['sessions', 'Sessions'], ['tasks', 'tq tasks #'], ['projects', 'Projects @'], ['commands', 'Commands >']]
      .map(([id, label]) => {
        const on = id === scope || (close && id === 'commands');
        return { label, selected: on ? 'true' : 'false', color: on ? '#fafafa' : '#a1a1aa', weight: on ? 700 : 400, underline: on ? '#fafafa' : 'transparent' };
      });
    let first = true;
    const pick = (o) => {
      const on = first; first = false;
      return { ...o, selected: on ? 'true' : 'false', bg: on ? '#2a2a2e' : 'transparent' };
    };
    const it = (glyph, title, sub) => pick({ isOther: true, isSession: false, glyph, title, sub });
    const ses = (status, unread, title, age, role, engine, taskRef, taskTitle, repo) =>
      pick({ isSession: true, isOther: false, pad: '6px 16px 7px', status, unread, title, age, role, engine, taskRef, taskTitle, repo });
    // Close this session acts on the open conversation; only a Done session closes without asking.
    const groups = close ? [
      { title: 'COMMANDS', items: [
        it('›', 'Close this session', '通知の再送処理を見直す · Question · Asks before closing'),
        it('›', 'Close all done', 'Close every done session')
      ] }
    ] : tasks ? [
      { title: 'TQ TASKS', items: [
        it('#', '#2048 通知の信頼性を上げる', 'P1 · 3 sessions'),
        it('#', '#2050 配信チェックを入れる', 'P2 · 1 session'),
        it('#', '#2055 監視を整える', 'P3 · 2 sessions')
      ] }
    ] : [
      { title: 'NEEDS ACTION', items: [
        ses('Question', true, '通知の再送処理を見直す', '8s', 'development', 'claude', 'P1 #2048', '通知の信頼性を上げる', 'example/service'),
        ses('Review', true, '配信チェックの PR を確認する', '2m', '', 'codex', 'P2 #2050', '配信チェックを入れる', 'example/web-app'),
        ses('Error', true, '統合テストの失敗を直す', '4m', 'debug-flow', 'claude', 'P1 #2052', 'テストを安定させる', 'example/service')
      ] },
      { title: 'RECENT', items: [
        ses('Working', false, '配信メトリクスを追加する', '18s', 'development', 'codex', 'P3 #2055', '監視を整える', 'example/observability'),
        ses('Done', false, '送信キューを分ける', '1h', 'development', 'claude', 'P1 #2048', '通知の信頼性を上げる', 'example/service')
      ] },
      { title: 'COMMANDS', items: [
        it('+', 'New session', 'Start Claude Code or Codex in a directory'),
        it('›', 'Switch to Board', ''),
        it('›', 'Close all done', '')
      ] }
    ];
    return { query: tasks ? '#20' : close ? '>close' : '', scopes, groups };
  }
}
</script>
</body>
</html>
