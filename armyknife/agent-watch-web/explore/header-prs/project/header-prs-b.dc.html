<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Header PRs: B</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 880px; box-sizing: border-box; display: flex; flex-direction: column; gap: 32px; padding: 40px; background: #050505; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 14px; line-height: 1.55">
<sc-for list="{{states}}" as="s" hint-placeholder-count="3">
<section aria-label="{{s.label}}" style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; color: #a1a1aa; font-size: 12.5px; font-weight: 400">{{s.label}}</h2>
<div style="display: flex; border: 1px solid #2a2a2a; background: #0a0a0a">
<div style="flex: 1; min-width: 0">
<header style="display: flex; flex-direction: column; padding: 10px 24px 0; border-bottom: 1px solid #2a2a2a">
<div style="display: flex; align-items: center; gap: 10px; min-width: 0; font-size: 12px; color: #8b8b94">
<a href="#" style="min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #d4d4d8; text-decoration: none"><span style="font-family: 'JetBrains Mono', monospace; font-weight: 700">{{s.taskId}}</span> {{s.taskTitle}}</a>
<a href="#" style="flex: none; font-family: 'JetBrains Mono', monospace; color: #8b8b94; text-decoration: none; white-space: nowrap">{{s.repo}}</a>
<div style="flex: 0 0 auto; display: flex; align-items: center; gap: 6px; margin-left: auto">
<button type="button" aria-label="{{s.panelLabel}}" title="{{s.panelLabel}}" aria-expanded="{{s.panelStr}}" style="min-width: 32px; height: 26px; display: inline-flex; align-items: center; justify-content: center; padding: 0 10px; border: 1px solid {{s.panelBorder}}; background: {{s.panelBg}}; color: #d4d4d8"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M15 3v18"></path><path d="{{s.panelArrow}}"></path></svg></button>
<button type="button" aria-label="Add to Starred" title="Add to Starred" aria-pressed="false" style="min-width: 26px; height: 26px; padding: 0 4px; border: 1px solid #2a2a2a; background: transparent; color: #8b8b94; font-size: 16px; line-height: 1">☆</button>
<sc-if value="{{s.hasChip}}" hint-placeholder-val="{{ true }}">
<a href="#" aria-label="PR #128 検索のインデックスを差分で更新する, open, CI running" title="#128 検索のインデックスを差分で更新する" style="height: 26px; box-sizing: border-box; display: inline-flex; align-items: center; gap: 7px; padding: 0 9px; border: 1px solid #2a2a2a; color: #fafafa; font-size: 12px; text-decoration: none; white-space: nowrap"><span aria-hidden="true" style="width: 7px; height: 7px; background: #60a5fa"></span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11.5px">#128</span><span style="color: #60a5fa">CI running</span></a>
<button type="button" aria-label="Merge PR #128" style="height: 26px; padding: 0 10px; border: 1px solid #2a2a2a; background: transparent; color: #d4d4d8; font-family: inherit; font-size: 12px">Merge</button>
</sc-if>
<button type="button" aria-label="Open in terminal" title="Open in terminal" style="width: 28px; height: 26px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #71717a"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 11 2-2-2-2"></path><path d="M11 13h4"></path><rect width="18" height="18" x="3" y="3" rx="2" ry="2"></rect></svg></button>
</div>
</div>
<div style="display: flex; align-items: center; gap: 8px; min-width: 0">
<h1 style="margin: 2px 0 12px; min-width: 0; font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.title}}</h1>
<button type="button" aria-label="Copy session ID" title="Copy session ID" style="flex: none; width: 26px; height: 26px; margin-bottom: 10px; display: grid; place-items: center; padding: 0; border: 1px solid #2a2a2a; background: transparent; color: #d4d4d8"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path></svg></button>
<button type="button" aria-label="Edit session title" title="Edit session title" style="flex: none; width: 26px; height: 26px; margin-bottom: 10px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #71717a"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path><path d="m15 5 4 4"></path></svg></button>
<button type="button" aria-haspopup="dialog" aria-expanded="false" style="flex: none; height: 24px; margin: 0 0 10px 2px; display: inline-flex; align-items: center; gap: 6px; padding: 0 8px; border: 1px solid #2a2a2a; background: transparent; color: #a1a1aa; font-family: inherit; font-size: 12px; white-space: nowrap">Vibe off<span aria-hidden="true" style="color: #8b8b94">▾</span></button>
</div>
</header>
<div style="height: {{s.bodyH}}"></div>
</div>
<sc-if value="{{s.panel}}" hint-placeholder-val="{{ false }}">
<aside aria-label="Session status" style="flex: none; width: 380px; box-sizing: border-box; border-left: 1px solid #2a2a2a; background: #0f0f0f; color: #d4d4d8; font-size: 13px">
<h3 style="margin: 0; padding: 14px 18px 6px; color: #fafafa; font-size: 12.5px; font-weight: 700">Pull requests</h3>
<sc-for list="{{s.groups}}" as="g" hint-placeholder-count="3">
<h4 style="margin: 0; padding: 8px 18px 2px; color: #8b8b94; font-size: 11.5px; font-weight: 400">{{g.name}}</h4>
<sc-for list="{{g.rows}}" as="r" hint-placeholder-count="1">
<a href="#" style="display: grid; grid-template-columns: 7px 1fr; align-items: center; column-gap: 10px; padding: 6px 18px; color: {{r.color}}; text-decoration: none"><span aria-hidden="true" style="width: 7px; height: 7px; background: {{r.dot}}"></span><span style="min-width: 0; display: grid"><span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px">#{{r.num}}</span> {{r.title}}</span><span style="color: #8b8b94; font-size: 11.5px"><span style="font-family: 'JetBrains Mono', monospace">{{r.repo}}</span> · <span style="color: {{r.metaColor}}">{{r.meta}}</span></span></span></a>
</sc-for>
</sc-for>
<h3 style="margin: 14px 0 0; padding: 12px 18px 6px; border-top: 1px solid #2a2a2a; color: #fafafa; font-size: 12.5px; font-weight: 700">Tasks</h3>
<p style="margin: 0; padding: 0 18px; color: #8b8b94; font-size: 12px">今の panel の内容が続く</p>
</aside>
</sc-if>
</div>
</section>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":880}}'>
class Component extends DCLogic {
  renderVals() {
    const row = (num, title, repo, kind) => ({ num, title, repo, ...{
      running: { dot: '#60a5fa', meta: 'Open · CI running', metaColor: '#60a5fa', color: '#fafafa' },
      passed: { dot: '#4ade80', meta: 'Open · CI passed', metaColor: '#a1a1aa', color: '#fafafa' },
      merged: { dot: '#52525b', meta: '✓ Merged', metaColor: '#8b8b94', color: '#a1a1aa' }
    }[kind] });
    const base = { taskId: 'P2 #3104', taskTitle: '検索を速くする', repo: 'example/search-api', title: '検索のインデックスを作り直す' };
    const st = (s) => ({
      ...s,
      panelStr: s.panel ? 'true' : 'false',
      panelLabel: s.panel ? 'Close session status panel' : 'Open session status panel',
      panelArrow: s.panel ? 'm8 9 3 3-3 3' : 'm10 15-3-3 3-3',
      panelBorder: s.panel ? '#a1a1aa' : '#2a2a2a',
      panelBg: s.panel ? '#262626' : 'transparent',
      bodyH: s.panel ? '300px' : '48px'
    });
    return {
      states: [
        st({ ...base, label: '1 · branch の PR が open で CI 実行中。ヘッダーには番号と CI だけ', hasChip: true, panel: false, groups: [] }),
        st({ ...base, label: '2 · branch の PR と、ほかで開いた PR。ヘッダーは branch の PR だけ、パネルに全部 (前に merged した #121 も)', hasChip: true, panel: true,
          groups: [
            { name: 'This branch', rows: [row(128, '検索のインデックスを差分で更新する', 'example/search-api', 'running')] },
            { name: 'Opened elsewhere', rows: [row(57, 'インデックス用のジョブを追加する', 'example/infra', 'passed')] },
            { name: 'Merged · 1', rows: [row(121, 'インデックスの形式を決める', 'example/search-api', 'merged')] }
          ] }),
        st({ ...base, taskId: 'P3 #3090', taskTitle: '検索結果を整える', title: '検索結果の並び順を直す', label: '3 · どちらも merged。ヘッダーに PR は出ず、パネルの Merged に残る', hasChip: false, panel: true,
          groups: [
            { name: 'Merged · 2', rows: [row(29, '並び順の重みを設定から読む', 'example/search-api', 'merged'), row(28, '並び順のテストを足す', 'example/search-api', 'merged')] }
          ] })
      ]
    };
  }
}
</script>
</body>
</html>
