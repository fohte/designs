<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Save view dialog</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
input::placeholder{color:#71717a}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif">
<dc-import name="TasksDesktop" firstRow="plain" hint-size="1440px,900px"></dc-import>
<div style="position: absolute; inset: 0; z-index: 50; background: rgba(0,0,0,.4); backdrop-filter: blur(4px)"></div>
<div role="dialog" aria-labelledby="save-view-title" style="position: absolute; left: 50%; top: 50%; z-index: 51; transform: translate(-50%, -50%); width: 384px; box-sizing: border-box; display: grid; gap: 16px; padding: 16px; background: #0a0a0a; box-shadow: 0 0 0 1px #222222; font-size: 14px; line-height: 20px">
<h2 id="save-view-title" style="margin: 0; font-size: 16px; line-height: 1; font-weight: 500">Save view</h2>
<label for="save-view-name" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">View name</label>
<input id="save-view-name" type="text" placeholder="View name" value="API の作業" onChange="{{noop}}" style="width: 100%; height: 32px; box-sizing: border-box; padding: 0 10px; border: 1px solid #ef4444; box-shadow: 0 0 0 1px rgba(239,68,68,.5); background: transparent; color: #fafafa; font: inherit; font-size: 14px; outline: none">
<div style="margin: 0 -16px -16px; padding: 16px; display: flex; justify-content: flex-end; gap: 8px; border-top: 1px solid #2a2a2a; background: #0f0f0f">
<button type="button" style="height: 32px; padding: 0 10px; border: 1px solid #2a2a2a; background: #0a0a0a; color: #fafafa; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 500">Cancel</button>
<button type="button" style="height: 32px; padding: 0 10px; border: 1px solid #71717a; background: #1f1f1f; color: #fafafa; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 500">Save</button>
</div>
<button type="button" aria-label="Close" style="position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #fafafa"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { noop: () => {} };
  }
}
</script>
</body>
</html>
