<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>C: phone, the text is back in the composer after Resume</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; background: #0a0a0a">
<dc-import name="PhoneChat" state="review" vibe="off" draft="{{ draft }}" draft-text="PR の説明に計測値の例も足して。" draft-note="Not delivered at 14:31" timeline="{{ timeline }}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {"draft":true,"timeline":[{"msg":{"text":"PR の説明に計測値の例も足して。","time":"14:31","look":"event","note":"Back in the composer"}}]};
  }
}
</script>
</body>
</html>
