<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Close failure · A · phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; background: #0a0a0a">
<dc-import name="PhoneChat" state="review" done="{{ true }}" activity="{{ activity }}" toasts="{{ toasts }}" action-line="{{ line }}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const left = { kind: 'process', processes: ['48213 node', '48250 vite'] };
    return {
      activity: { count: '1', tone: 'failure' },
      line: { result: 'closeFailed', time: '12:03', left },
      toasts: [{ result: 'closeFailed', session: '通知の再送処理を見直す', left }]
    };
  }
}
</script>
</body>
</html>
