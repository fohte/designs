<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Input</title>
</head>
<body>
<div class="fui-grid">
  <div class="fui-cell"><span class="fui-note">default · placeholder</span><input class="fui-input fui-input--default" placeholder="Enter a value"></div>
  <div class="fui-cell"><span class="fui-note">value</span><input class="fui-input fui-input--default" value="Morning walk route"></div>
  <div class="fui-cell"><span class="fui-note">focus</span><input class="fui-input fui-input--default is-focus" placeholder="Enter a value"></div>
  <div class="fui-cell"><span class="fui-note">disabled</span><input class="fui-input fui-input--default" placeholder="Enter a value" disabled></div>
  <div class="fui-cell"><span class="fui-note">invalid</span><input class="fui-input fui-input--default" placeholder="Enter a value" aria-invalid="true"></div>
  <div class="fui-cell"><span class="fui-note">file</span><input class="fui-input fui-input--default" type="file"></div>
</div>
<div class="fui-grid">
  <div class="fui-cell"><span class="fui-note">ghost</span><input class="fui-input fui-ghost-field fui-input--ghost" placeholder="Enter a value"></div>
  <div class="fui-cell"><span class="fui-note">ghost · hover</span><input class="fui-input fui-ghost-field fui-input--ghost is-hover" placeholder="Enter a value"></div>
  <div class="fui-cell"><span class="fui-note">ghost · focus</span><input class="fui-input fui-ghost-field fui-input--ghost is-focus" value="Morning walk route"></div>
  <div class="fui-cell"><span class="fui-note">ghost · invalid, focus</span><input class="fui-input fui-ghost-field fui-input--ghost is-focus" placeholder="Enter a value" aria-invalid="true"></div>
</div>
</body>
</html>
