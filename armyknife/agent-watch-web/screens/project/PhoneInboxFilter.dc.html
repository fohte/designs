<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Phone: Inbox filter</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<main role="dialog" aria-modal="true" aria-label="Filter Inbox" style="width: 100%; min-height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 15px; line-height: 1.55">
<div style="display: flex; align-items: center; gap: 4px; padding: 8px 4px 8px 16px">
<input aria-label="Filter" value="kind:" autocapitalize="off" style="flex: 1; min-width: 0; height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #a1a1aa; background: #141414; color: #fafafa; font-family: 'JetBrains Mono', monospace; font-size: 16px; outline: none">
<button type="button" style="height: 44px; padding: 0 12px; border: 0; background: transparent; color: #d4d4d8; font-family: inherit; font-size: 15px">Cancel</button>
</div>
<div role="tablist" aria-label="Field" style="display: flex; gap: 4px; padding: 0 16px; overflow-x: auto; white-space: nowrap; border-bottom: 1px solid #2a2a2a">
<sc-for list="{{fields}}" as="f" hint-placeholder-count="5">
<button type="button" role="tab" aria-selected="{{f.selected}}" style="flex: none; height: 44px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; border: 0; border-bottom: 2px solid {{f.line}}; background: transparent; color: {{f.color}}; font-family: inherit; font-size: 14px"><span>{{f.label}}</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #8b8b94">{{f.key}}</span></button>
</sc-for>
</div>
<div role="group" aria-label="Kind" style="display: flex; flex-direction: column">
<sc-for list="{{kinds}}" as="k" hint-placeholder-count="7">
<label style="min-height: 48px; box-sizing: border-box; display: grid; grid-template-columns: 20px 1fr auto; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid #1a1a1a"><sc-if value="{{k.checked}}" hint-placeholder-val="{{ true }}"><input type="checkbox" checked="" style="width: 20px; height: 20px; margin: 0; accent-color: #fafafa"></sc-if><sc-if value="{{k.unchecked}}" hint-placeholder-val="{{ false }}"><input type="checkbox" style="width: 20px; height: 20px; margin: 0; accent-color: #fafafa"></sc-if><span style="color: {{k.color}}">{{k.label}}</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: #8b8b94">{{k.count}}</span></label>
</sc-for>
</div>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding: 12px 16px max(30px, env(safe-area-inset-bottom)); border-top: 1px solid #2a2a2a">
<p style="margin: 0; font-size: 12.5px; color: #8b8b94">Type to filter: <code style="font-family: 'JetBrains Mono', monospace; color: #a1a1aa; overflow-wrap: anywhere">project:web-app kind:review,question task:#123 has:decision</code></p>
<button type="button" style="width: 100%; min-height: 44px; border: 1px solid #fafafa; background: #fafafa; color: #0a0a0a; font-family: inherit; font-size: 13px; font-weight: 700">Show 2 sessions</button>
</div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      fields: [
        ['Project', 'project:'], ['Kind', 'kind:'], ['tq task', 'task:'], ['Repository', 'repo:'], ['Engine', 'engine:']
      ].map(([label, key], i) => ({ label, key, selected: i === 1 ? 'true' : 'false', line: i === 1 ? '#fafafa' : 'transparent', color: i === 1 ? '#fafafa' : '#a1a1aa' })),
      kinds: [
        ['Question', '#fbbf24', 1, true],
        ['Review', '#fbbf24', 1, true],
        ['Error', '#f87171', 1, false],
        ['Plan', '#d4d4d8', 1, false],
        ['Approve', '#fbbf24', 1, false],
        ['Proposal', '#fbbf24', 1, false],
        ['Working', '#60a5fa', 5, false]
      ].map(([label, color, count, checked]) => ({ label, color, count, checked, unchecked: !checked }))
    };
  }
}
</script>
</body>
</html>
