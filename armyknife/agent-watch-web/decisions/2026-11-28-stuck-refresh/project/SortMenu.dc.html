<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>SortMenu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; line-height: 1.55">
<sc-if value="{{pc}}" hint-placeholder-val="{{ true }}">
<div role="menu" aria-label="Sort inbox" style="width: 236px; box-sizing: border-box; padding: 6px 0; background: #1f1f1f; border: 1px solid #3f3f46; box-shadow: 0 12px 32px rgb(0 0 0 / 45%)">
<sc-for list="{{options}}" as="o" hint-placeholder-count="3">
<button type="button" role="menuitemradio" aria-checked="{{o.checked}}" style="width: 100%; height: 32px; box-sizing: border-box; display: grid; grid-template-columns: 14px 1fr auto; align-items: center; gap: 8px; padding: 0 12px; border: 0; background: {{o.bg}}; color: #fafafa; font-family: inherit; font-size: 13px; text-align: left"><span style="display: grid; place-items: center"><sc-if value="{{o.on}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></sc-if></span><span>{{o.label}}</span><span style="font-size: 11.5px; color: #a1a1aa">{{o.hint}}</span></button>
</sc-for>
<div style="margin: 6px 0; height: 1px; background: #2a2a2a"></div>
<p style="margin: 0; padding: 2px 12px 4px; font-size: 11.5px; color: #8b8b94">Sections stay. Saved in this browser.</p>
</div>
</sc-if>
<sc-if value="{{phone}}" hint-placeholder-val="{{ false }}">
<section role="dialog" aria-modal="true" aria-label="Sort" style="width: 100%; box-sizing: border-box; display: flex; flex-direction: column; padding: 16px 0 max(30px, env(safe-area-inset-bottom)); border-top: 1px solid #3f3f46; background: #1f1f1f; box-shadow: 0 -12px 36px rgb(0 0 0 / 30%); font-size: 14px">
<h2 style="margin: 0; padding: 0 16px 10px; font-size: 15px; font-weight: 700">Sort</h2>
<div role="menu" aria-label="Sort inbox" style="display: flex; flex-direction: column; border-top: 1px solid #2a2a2a">
<sc-for list="{{options}}" as="o" hint-placeholder-count="3">
<button type="button" role="menuitemradio" aria-checked="{{o.checked}}" style="min-height: 48px; display: grid; grid-template-columns: 18px 1fr auto; align-items: center; gap: 10px; padding: 0 16px; border: 0; border-bottom: 1px solid #2a2a2a; background: transparent; color: #fafafa; font-family: inherit; font-size: 15px; text-align: left"><span style="display: grid; place-items: center"><sc-if value="{{o.on}}" hint-placeholder-val="{{ false }}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></sc-if></span><span>{{o.label}}</span><span style="font-size: 12.5px; color: #a1a1aa">{{o.hint}}</span></button>
</sc-for>
</div>
<p style="margin: 0; padding: 10px 16px 0; font-size: 12.5px; color: #8b8b94">Sections stay. Saved in this browser.</p>
<div style="padding: 12px 16px 0"><button type="button" style="width: 100%; min-height: 44px; border: 1px solid #3f3f46; background: transparent; color: #fafafa; font-family: inherit; font-size: 13px">Cancel</button></div>
</section>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"form":{"editor":"enum","options":["pc","phone"],"default":"pc"},"value":{"editor":"enum","options":["priority","updated","project"],"default":"priority"},"$preview":{"width":390,"height":300}}'>
class Component extends DCLogic {
  renderVals() {
    const phone = (this.props.form ?? 'pc') === 'phone';
    const value = this.props.value ?? 'priority';
    return {
      pc: !phone, phone,
      options: [
        ['priority', 'Priority', 'tq priority, then newest'],
        ['updated', 'Updated', 'Newest first'],
        ['project', 'Project', 'A to Z']
      ].map(([k, label, hint]) => ({ label, hint, on: k === value, checked: k === value ? 'true' : 'false', bg: k === value ? '#262626' : 'transparent' }))
    };
  }
}
</script>
</body>
</html>
