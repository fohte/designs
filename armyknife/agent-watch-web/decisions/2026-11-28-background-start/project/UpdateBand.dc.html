<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Update band</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div role="status" style="width: 100%; height: {{bandH}}; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: {{bandPad}}; border-bottom: 1px solid #1e3a5f; background: #0f1a2a; color: #dbeafe; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: {{fs}}; line-height: 1.5">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path><path d="M8 16H3v5"></path></svg>
<span style="min-width: 0; flex: {{textFlex}}">New version v0.4.2 is ready.</span>
<button type="button" style="flex: none; height: {{btnH}}; padding: 0 12px; border: 1px solid #fafafa; background: #fafafa; color: #0a0a0a; font-family: inherit; font-size: {{btnFs}}; font-weight: 700">Reload</button>
<button type="button" aria-label="Dismiss until the next update" style="flex: none; width: {{xW}}; height: {{btnH}}; margin-left: {{xMargin}}; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #8b8b94"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"phone":{"editor":"boolean","default":false},"$preview":{"width":760,"height":40}}'>
class Component extends DCLogic {
  renderVals() {
    // phone: the band sits under the header and takes 44px touch targets.
    const phone = this.props.phone ?? false;
    return {
      fs: phone ? '14px' : '13px',
      bandH: phone ? '52px' : '36px', bandPad: phone ? '0 0 0 14px' : '0 8px 0 16px',
      textFlex: phone ? '1' : '0 1 auto', xMargin: phone ? '0' : 'auto',
      btnH: phone ? '36px' : '24px', btnFs: phone ? '13.5px' : '12px',
      xW: phone ? '44px' : '28px'
    };
  }
}
</script>
</body>
</html>
