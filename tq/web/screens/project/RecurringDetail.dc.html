<!doctype html>
<html lang="ja">
<head>

<div style="max-width: 768px; display: flex; flex-direction: column; gap: 20px">

<nav aria-label="Breadcrumb" style="display: flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px; color: #71717a">

<div style="display: flex; flex-wrap: wrap; gap: 8px">
<span style="display: inline-flex; padding: 0 4px; border: 1px solid #2a2a2a; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px; color: #71717a">#home</span>
<span style="display: inline-flex; padding: 0 4px; border: 1px solid #2a2a2a; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px; color: #71717a">#plants</span>
<span style="display: inline-flex; padding: 0 4px; border: 1px solid #2a2a2a; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px; color: #71717a">personal</span>
</div>

<p style="margin: 0; white-space: pre-line; font-size: 14px; line-height: 1.625; color: #71717a">ベランダと窓辺の鉢植えに水をやる。
夏のあいだは朝のうちに済ませる。</p>

<div style="border-top: 1px solid #2a2a2a"></div>

<dc-import name="RecurringGeneratedTasks" state="{{listState}}" hint-size="100%,240px"></dc-import>

</div>
</div>

<aside style="flex: none; width: 240px; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px; padding: 16px; border-left: 1px solid #2a2a2a; overflow-y: auto">

<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px; color: #52525b">REPEAT</span>
<button type="button" aria-label="Repeat" style="width: calc(100% + 8px); min-height: 32px; box-sizing: border-box; margin: 0 -4px; display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 6px 4px; border: 0; background: transparent; color: #fafafa; text-align: left; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px"><span style="min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">Weekly · Sun, Wed</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#71717a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="m6 9 6 6 6-6"></path></svg></button>

<span style="font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px; color: #52525b">NEXT</span>

<span style="font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px; color: #52525b">DUE OFFSET</span>
<span style="font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px; color: #fafafa">0 days after start</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px; color: #52525b">CONTEXT</span>
<span style="font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px; color: #fafafa">personal</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px; color: #52525b">PROJECT</span>
<span style="font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px; color: #fafafa">—</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px; color: #52525b">TAGS</span>
<span style="font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px; color: #fafafa">home, plants</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px; color: #52525b">STATE</span>
<div style="padding: 0 4px; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; color: #fafafa">
<button type="button" aria-label="State" style="height: 28px; margin: 0 -4px; display: inline-flex; align-items: center; justify-content: space-between; gap: 6px; padding: 0 4px; border: 0; border-bottom: 1px solid transparent; background: transparent; color: #fafafa; font-family: inherit; font-size: 14px">Active<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#71717a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
</div>
</div>
</aside>

</main>
<dc-import name="StatusLine" path="/recurring/5c1e8a7d-2b4f-4e9a-8c3d-7f6a1b2e9d40" hint-size="100%,24px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"listState":{"editor":"enum","options":["items","loading","error","empty","loading more","load more failed"],"default":"items"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { listState: this.props.listState ?? 'items' };
  }
}
</script>
