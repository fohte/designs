<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Phone: filter sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<section role="dialog" aria-modal="true" aria-label="Filter by kind" style="width: 100%; box-sizing: border-box; display: flex; flex-direction: column; padding: 6px 0 max(30px, env(safe-area-inset-bottom)); border-top: 1px solid #3f3f46; background: #1f1f1f; box-shadow: 0 -12px 36px rgb(0 0 0 / 30%); color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 15px; line-height: 1.55">
<div style="display: flex; align-items: center; padding: 0 8px 0 16px">
<h2 style="margin: 0; font-size: 15px; font-weight: 700">Kind</h2>
<button type="button" style="margin-left: auto; height: 44px; padding: 0 8px; border: 0; background: transparent; color: #a1a1aa; font-family: inherit; font-size: 13px">Clear</button>
</div>
<div role="group" aria-label="Kind" style="display: flex; flex-direction: column; border-top: 1px solid #2a2a2a">
<sc-for list="{{kinds}}" as="k" hint-placeholder-count="7">
<label style="min-height: 48px; box-sizing: border-box; display: grid; grid-template-columns: 20px 1fr auto; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid #2a2a2a"><sc-if value="{{k.checked}}" hint-placeholder-val="{{ true }}"><input type="checkbox" checked="" style="width: 20px; height: 20px; margin: 0; accent-color: #fafafa"></sc-if><sc-if value="{{k.unchecked}}" hint-placeholder-val="{{ false }}"><input type="checkbox" style="width: 20px; height: 20px; margin: 0; accent-color: #fafafa"></sc-if><span style="color: {{k.color}}">{{k.label}}</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: #8b8b94">{{k.count}}</span></label>
</sc-for>
</div>
<div style="padding: 12px 16px 0"><button type="button" style="width: 100%; min-height: 44px; border: 1px solid #fafafa; background: #fafafa; color: #0a0a0a; font-family: inherit; font-size: 13px; font-weight: 700">Show 2 sessions</button></div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":520}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      kinds: [
        ['Question', '#fbbf24', 1, true],
        ['Review', '#fbbf24', 1, true],
        ['Error', '#f87171', 1, false],
        ['Plan', '#d4d4d8', 1, false],
        ['Approve', '#fbbf24', 1, false],
        ['Proposal', '#fbbf24', 1, false],
        ['Working', '#60a5fa', 5, false]
      ].map(([label, color, count, checked]) => ({ label, color, count, checked, unchecked: !checked }))
    };
  }
}
</script>
</body>
</html>
