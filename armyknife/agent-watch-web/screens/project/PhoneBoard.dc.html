<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Phone: Board</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<main style="position: relative; width: 100%; height: 100vh; overflow: hidden; box-sizing: border-box; display: flex; flex-direction: column; background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 15px; line-height: 1.55">
<header style="flex: none; display: flex; align-items: center; gap: 4px; padding: 8px 8px 0 16px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700"><span style="margin-right: 7px; color: #ef4444">&gt;</span>agent watch</span>
<span style="margin-left: 10px; display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: #8b8b94"><span style="width: 6px; height: 6px; border-radius: 50%; background: #a1a1aa"></span>Connected · 22:00</span>
<button type="button" aria-label="Open navigation" style="margin-left: auto; width: 36px; height: 36px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #d4d4d8"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16"></path><path d="M4 12h16"></path><path d="M4 19h16"></path></svg></button>
<button type="button" aria-label="New session" style="width: 36px; height: 36px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #d4d4d8"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></button>
<button type="button" aria-label="Jump to" style="width: 36px; height: 36px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #d4d4d8"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 21-4.34-4.34"></path><circle cx="11" cy="11" r="8"></circle></svg></button>
</header>
<div style="flex: none; display: flex; align-items: center; gap: 8px; margin: 4px 8px 0 16px">
<h1 style="margin: 0; font-size: 26px; font-weight: 700">Board</h1>
<button type="button" aria-pressed="true" style="margin-left: auto; min-height: 44px; display: inline-flex; align-items: center; gap: 8px; padding: 0 8px; border: 0; background: transparent; color: #a1a1aa; font-family: inherit; font-size: 12.5px"><span aria-hidden="true" style="width: 14px; height: 14px; box-sizing: border-box; display: grid; place-items: center; border: 1px solid #fafafa; background: #fafafa; color: #0a0a0a; font-size: 11px; line-height: 1">✓</span>Hide quiet projects (2)</button>
</div>
<div style="flex: none; margin: 0 16px 8px; font-size: 12.5px; color: #8b8b94">Projects that need you come first</div>
<div aria-hidden="true" style="flex: none; height: 14px; display: flex; justify-content: center; align-items: center; gap: 6px">
<sc-for list="{{columns}}" as="col" hint-placeholder-count="4"><span style="width: 6px; height: 6px; background: {{col.dot}}"></span></sc-for>
</div>
<div style="flex: 1; min-height: 0; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scroll-padding-left: 16px; padding: 6px 0 16px">
<div style="height: 100%; display: flex; align-items: flex-start; gap: 10px; padding: 0 16px; width: max-content">
<sc-for list="{{columns}}" as="col" hint-placeholder-count="2">
<section style="flex: none; width: 300px; max-height: 100%; overflow-y: auto; scroll-snap-align: start; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; padding: 12px; background: #111111">
<header style="display: flex; flex-direction: column; gap: 1px">
<h2 style="margin: 0; font-size: 17px; font-weight: 700">{{col.name}}</h2>
<div style="font-size: 12.5px; font-weight: {{col.needWeight}}; color: {{col.needColor}}">{{col.need}}</div>
<div style="font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #8b8b94">{{col.repos}}</div>
</header>
<sc-if value="{{col.hasNeeds}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column">
<h3 style="margin: 0 0 2px; font-size: 12.5px; font-weight: 700; color: #fbbf24">Needs action</h3>
<sc-for list="{{col.needs}}" as="c" hint-placeholder-count="2">
<div style="margin: 0 -12px"><dc-import name="SessionRow" s="{{ c }}" density="phone" hint-size="100%,72px"></dc-import></div>
</sc-for>
</div>
</sc-if>
<sc-if value="{{col.hasWorking}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column">
<h3 style="margin: 0 0 2px; font-size: 12.5px; font-weight: 700; color: #60a5fa">In progress</h3>
<sc-for list="{{col.working}}" as="c" hint-placeholder-count="2">
<div style="margin: 0 -12px"><dc-import name="SessionRow" s="{{ c }}" density="phone" hint-size="100%,72px"></dc-import></div>
</sc-for>
<sc-if value="{{col.hasMore}}" hint-placeholder-val="{{ false }}"><button type="button" style="align-self: flex-start; min-height: 44px; padding: 0; border: 0; background: transparent; color: #a1a1aa; font-family: inherit; font-size: 13px">{{col.more}} ›</button></sc-if>
</div>
</sc-if>
<sc-if value="{{col.hasDone}}" hint-placeholder-val="{{ true }}">
<div style="font-size: 13px; color: #8b8b94"><span style="color: #a1a1aa">✓ Done</span> · {{col.done}}</div>
</sc-if>
</section>
</sc-for>
</div>
</div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const col = (name, repos, needs, working, more, done, i) => ({
      name, repos, needs, working, more, done,
      need: needs.length ? needs.length + ' need action' : 'Nothing needed',
      needColor: needs.length ? '#fbbf24' : '#8b8b94',
      needWeight: needs.length ? 700 : 400,
      hasNeeds: needs.length > 0,
      hasWorking: working.length > 0,
      hasMore: more !== '',
      hasDone: done !== '',
      dot: i === 0 ? '#fafafa' : '#3f3f46'
    });
    const n = (status, age, title, role, engine, taskRef, taskTitle, repo) => ({ status, unread: true, age, title, role, engine, taskRef, taskTitle, repo });
    const w = (age, title, role, engine, taskRef, taskTitle, repo) => ({ status: 'Working', age, title, role, engine, taskRef, taskTitle, repo });
    return {
      columns: [
        col('service', 'example/service', [
          n('Question', '8s', '通知の再送処理を見直す', 'development', 'claude', 'P1 #2048', '通知の信頼性を上げる', 'example/service'),
          n('Error', '4m', '統合テストの失敗を直す', 'debug-flow', 'claude', 'P1 #2052', 'テストを安定させる', 'example/service'),
          n('Approve', '6m', 'ステージングの設定を書き換える', 'development', 'codex', 'P2 #2053', '新しい設定を段階的に公開する', 'example/service')
        ], [w('30s', '再送の記録を残す', 'development', 'codex', 'P1 #2048', '通知の信頼性を上げる', 'example/service')], '', '送信キューを分ける and 2 more', 0),
        col('web-app', 'example/web-app', [
          n('Review', '2m', '配信チェックの PR を確認する', '', 'codex', 'P2 #2050', '配信チェックを入れる', 'example/web-app'),
          { ...n('Plan', '5m', '段階的な公開の計画を立てる', 'PM', 'claude', 'P2 #2054', '新しい設定を段階的に公開する', 'example/web-app'), unread: false }
        ], [w('1m', '設定画面の文言を直す', 'design', 'claude', 'P3 #2056', '設定画面を作り直す', 'example/web-app')], '', 'ログイン画面を直す', 1),
        col('observability', 'example/observability', [
          n('Proposal', '12m', 'アラートの送り先を決める', 'designer', 'claude', 'P2 #2051', '監視を整える', 'example/observability')
        ], [
          w('18s', '配信メトリクスを追加する', 'development', 'codex', 'P3 #2055', '監視を整える', 'example/observability'),
          w('2m', '配信ログの保存期間を決める', 'research', 'codex', 'P2 #2051', '監視を整える', 'example/observability'),
          w('5m', 'ダッシュボードの遅延を調べる', 'debug-flow', 'codex', 'P3 #2057', '監視を整える', 'example/observability')
        ], '1 more', '', 2),
        col('handbook', 'example/handbook', [], [], '', 'セットアップ手順を更新する', 3)
      ]
    };
  }
}
</script>
</body>
</html>
