<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Merge band above the composer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div role="group" aria-label="Pull requests ready to merge" style="width: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: {{gap}}; padding: {{pad}}; border-top: 1px solid {{line}}; background: #0f0f0f; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; line-height: 1.5">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="1">
<div style="display: flex; align-items: center; gap: 12px; min-width: 0">
<div role="status" aria-live="polite" style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<span style="display: flex; align-items: center; gap: 8px; font-size: {{fs}}; font-weight: 700; color: {{r.labelColor}}; white-space: nowrap"><span aria-hidden="true" style="flex: none; width: 7px; height: 7px; background: {{r.dot}}"></span>{{r.label}}</span>
<span style="padding-left: 15px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: {{fsDetail}}; color: #a1a1aa"><span style="font-family: 'JetBrains Mono', monospace">#{{r.num}}</span> {{r.detail}}</span>
</div>
<sc-if value="{{r.isIdle}}" hint-placeholder-val="{{ true }}"><button type="button" aria-label="Merge PR #{{r.num}}" style="flex: none; height: {{btnH}}; padding: 0 14px; border: 1px solid #fafafa; background: #fafafa; color: #0a0a0a; font-family: inherit; font-size: {{fsBtn}}; font-weight: 700">Merge</button></sc-if>
<sc-if value="{{r.isMerging}}" hint-placeholder-val="{{ false }}"><button type="button" disabled aria-label="Merging PR #{{r.num}}" style="flex: none; height: {{btnH}}; display: inline-flex; align-items: center; gap: 6px; padding: 0 14px; border: 1px solid #2a2a2a; background: #141414; color: #a1a1aa; font-family: inherit; font-size: {{fsBtn}}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg>Merging…</button></sc-if>
<sc-if value="{{r.isFailed}}" hint-placeholder-val="{{ false }}"><button type="button" aria-label="Retry merging PR #{{r.num}}" style="flex: none; height: {{btnH}}; padding: 0 14px; border: 1px solid #f87171; background: transparent; color: #fafafa; font-family: inherit; font-size: {{fsBtn}}">Retry</button></sc-if>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["idle","merging","failed","merged"],"default":"idle"},"two":{"editor":"boolean","default":false},"phone":{"editor":"boolean","default":false},"$preview":{"width":760,"height":60}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.props.state ?? 'idle';
    const phone = this.props.phone ?? false;
    const row = (num, title, s) => ({
      num, isIdle: s === 'idle', isMerging: s === 'merging', isFailed: s === 'failed',
      label: { idle: 'Ready to merge', merging: 'Merging…', failed: 'Merge failed', merged: 'Merged' }[s],
      labelColor: { failed: '#f87171', merged: '#4ade80' }[s] ?? '#fafafa',
      dot: { idle: '#4ade80', merging: '#60a5fa', failed: '#f87171', merged: '#52525b' }[s],
      detail: s === 'failed' ? 'Base branch was modified. Retry to merge again' : title
    });
    const rows = [row(2050, '再送処理を retry() にまとめる', st)];
    if (this.props.two) rows.push(row(64, '再送キューの上限を設定に出す', 'idle'));
    return {
      rows,
      line: st === 'failed' ? '#f87171' : '#2a2a2a',
      pad: phone ? '10px 12px' : '10px max(24px, calc((100% - 712px) / 2))',
      gap: phone ? '8px' : '6px',
      fs: phone ? '14px' : '13px', fsDetail: phone ? '12.5px' : '11.5px', fsBtn: phone ? '14px' : '12px',
      btnH: phone ? '44px' : '32px'
    };
  }
}
</script>
</body>
</html>
