<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>A: close copy by state, one line</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 820px; overflow: hidden; background: #050505">
<dc-import name="CloseCopy" withdraw="line" hint-size="1440px,820px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
