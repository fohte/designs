<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Phone: discard changes and close confirmation sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0a0a0a">
<dc-import name="PhoneChat" state="review" done="{{ true }}" toasts="{{ toasts }}" action-line="{{ line }}" hint-size="390px,844px"></dc-import>
<div style="position: absolute; z-index: 30; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; background: rgb(0 0 0 / 55%)"><dc-import name="DiscardDialog" form="sheet" session="{{ session }}" branch="{{ branch }}" path="{{ path }}" changes="{{ changes }}" commits="{{ commits }}" hint-size="100%,600px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const session = '通知の再送処理を見直す', branch = 'feature/resend-limit', path = '~/src/example/service/.worktrees/resend-limit';
    const changes = [
      { s: 'M', path: 'src/resend.ts' }, { s: 'M', path: 'src/resend.test.ts' }, { s: 'A', path: 'src/resend-limit.ts' },
      { s: 'A', path: 'src/resend-limit.test.ts' }, { s: 'M', path: 'config/resend.yaml' }, { s: 'D', path: 'src/legacy-retry.ts' },
      { s: 'M', path: 'src/queue.ts' }, { s: 'M', path: 'src/queue.test.ts' }, { s: 'M', path: 'docs/resend.md' },
      { s: 'M', path: 'package.json' }, { s: 'M', path: 'pnpm-lock.yaml' }, { s: '??', path: 'scripts/replay.sh' },
      { s: '??', path: 'notes/limit.md' }, { s: '??', path: 'tmp/resend-debug.log' }
    ];
    const commits = [{ sha: 'a1b2c3d', subject: '再送の上限を設定に出す' }, { sha: 'e4f5a6b', subject: '上限に達したら警告を出す' }];
    const checks = { path, files: changes.map((f) => f.path), branch, merged: false, reason: 'PR #64 is still open', processes: [] };
    return {
      session, branch, path, changes, commits,
      line: { result: 'closeFailed', checks, time: '12:03' },
      toasts: [{ result: 'closeFailed', session, checks }]
    };
  }
}
</script>
</body>
</html>
