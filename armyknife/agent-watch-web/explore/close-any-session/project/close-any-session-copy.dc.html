<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Close any session · confirmation copy by state</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; display: grid; grid-template-columns: repeat(3, 380px); grid-auto-rows: min-content; justify-content: center; align-content: center; gap: 40px 56px; padding: 48px; background: #050505; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 13px; line-height: 1.55">
<sc-for list="{{kinds}}" as="k" hint-placeholder-count="6">
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 12px; color: #a1a1aa">{{k.label}}</span>
<dc-import name="CloseConfirm" kind="{{k.kind}}" form="modal" title="{{k.title}}" hint-size="100%,200px"></dc-import>
</div>
</sc-for>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 12px; color: #a1a1aa">Done</span>
<div style="box-sizing: border-box; padding: 16px; border: 1px dashed #3f3f46; border-radius: 8px; color: #d4d4d8; font-size: 12px">No confirmation. Close ends the session right away, as it does now.</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      kinds: [
        { kind: 'working', label: 'Working', title: '配信メトリクスを追加する' },
        { kind: 'question', label: 'Needs action · Question', title: '通知の再送処理を見直す' },
        { kind: 'proposal', label: 'Needs action · Proposal', title: 'アラートの送り先を決める' },
        { kind: 'approve', label: 'Needs action · Approve', title: 'ステージングの設定を書き換える' },
        { kind: 'review', label: 'Needs action · Review / Plan', title: '配信チェックの PR を確認する' },
        { kind: 'idle', label: 'Waiting · Error, Later, idle', title: '統合テストの失敗を直す' }
      ]
    };
  }
}
</script>
</body>
</html>
