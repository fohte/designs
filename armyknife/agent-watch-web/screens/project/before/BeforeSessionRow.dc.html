<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Session row</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; box-sizing: border-box; display: flex; gap: 8px; padding: {{pad}}; background: {{bg}}; border-bottom: {{border}}; box-shadow: {{bar}}; opacity: {{opacity}}; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: {{titleSize}}; line-height: 1.5; text-align: left">
<sc-if value="{{hasCaret}}" hint-placeholder-val="{{ false }}"><span style="width: 10px; flex: none; color: #71717a; font-size: 10px; margin-top: 3px">{{caret}}</span></sc-if>
<span style="display: inline-flex; margin-top: {{iconTop}}">
<sc-if value="{{isKind}}" hint-placeholder-val="{{ true }}"><span role="img" aria-label="{{status}}" title="{{status}}" style="display: inline-flex; flex: none; color: {{kindColor}}">
<sc-if value="{{isQuestion}}" hint-placeholder-val="{{ true }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width: {{iconPx}}; height: {{iconPx}}"><path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719"></path><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><path d="M12 17h.01"></path></svg></sc-if>
<sc-if value="{{isReview}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width: {{iconPx}}; height: {{iconPx}}"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path><circle cx="12" cy="12" r="3"></circle></svg></sc-if>
<sc-if value="{{isError}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width: {{iconPx}}; height: {{iconPx}}"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg></sc-if>
<sc-if value="{{isPlan}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width: {{iconPx}}; height: {{iconPx}}"><path d="M3 5h.01"></path><path d="M3 12h.01"></path><path d="M3 19h.01"></path><path d="M8 5h13"></path><path d="M8 12h13"></path><path d="M8 19h13"></path></svg></sc-if>
<sc-if value="{{isApprove}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width: {{iconPx}}; height: {{iconPx}}"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path><path d="M9.1 9a3 3 0 0 1 5.82 1c0 2-3 3-3 3"></path><path d="M12 17h.01"></path></svg></sc-if>
<sc-if value="{{isProposal}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width: {{iconPx}}; height: {{iconPx}}"><path d="M12 13v8"></path><path d="M12 3v3"></path><path d="M18 6a2 2 0 0 1 1.387.56l2.307 2.22a1 1 0 0 1 0 1.44l-2.307 2.22A2 2 0 0 1 18 13H6a2 2 0 0 1-1.387-.56l-2.306-2.22a1 1 0 0 1 0-1.44l2.306-2.22A2 2 0 0 1 6 6z"></path></svg></sc-if>
</span></sc-if>
<sc-if value="{{isWorking}}" hint-placeholder-val="{{ false }}"><span role="img" aria-label="Working" title="Working" style="display: inline-grid; place-items: center; flex: none; width: {{iconPx}}; height: {{iconPx}}"><span style="width: 7px; height: 7px; border-radius: 50%; background: #60a5fa"></span></span></sc-if>
<sc-if value="{{isDone}}" hint-placeholder-val="{{ false }}"><span role="img" aria-label="Done" title="Done" style="display: inline-grid; place-items: center; flex: none; width: {{iconPx}}; height: {{iconPx}}; color: #71717a; font-size: 11px">✓</span></sc-if>
</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="display: flex; align-items: center; gap: 8px"><span style="min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: {{titleSize}}; color: {{titleColor}}; font-weight: {{titleWeight}}">{{title}}</span><sc-if value="{{vibeIcon}}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="{{zapFill}}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="{{vibeLabel}}" style="flex: none; margin-left: -4px; color: #a1a1aa"><title>{{vibeLabel}}</title><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"></path></svg></sc-if><span style="margin-left: auto"></span><span style="flex: none; font-family: 'JetBrains Mono', monospace; font-size: {{metaSize}}; color: #8b8b94">{{age}}</span></span>
<sc-if value="{{hasPreview}}" hint-placeholder-val="{{ true }}"><span style="min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: {{previewSize}}; color: {{previewColor}}">{{preview}}</span></sc-if>
<span style="display: flex; align-items: center; gap: 6px; font-size: {{metaSize}}; color: #8b8b94; white-space: nowrap">
<span style="min-width: 0; display: flex; align-items: center; gap: 5px; overflow: hidden">
<span role="img" aria-label="{{roleLabel}}" title="{{roleLabel}}" style="display: inline-flex; flex: none; color: #8b8b94">
<sc-if value="{{isDevelopment}}" hint-placeholder-val="{{ true }}"><svg width="12.5" height="12.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width: {{rolePx}}; height: {{rolePx}}"><path d="m16 18 6-6-6-6"></path><path d="m8 6-6 6 6 6"></path></svg></sc-if>
<sc-if value="{{isDesign}}" hint-placeholder-val="{{ false }}"><svg width="12.5" height="12.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width: {{rolePx}}; height: {{rolePx}}"><rect x="16" y="16" width="6" height="6" rx="1"></rect><rect x="2" y="16" width="6" height="6" rx="1"></rect><rect x="9" y="2" width="6" height="6" rx="1"></rect><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3"></path><path d="M12 12V8"></path></svg></sc-if>
<sc-if value="{{isDesigner}}" hint-placeholder-val="{{ false }}"><svg width="12.5" height="12.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width: {{rolePx}}; height: {{rolePx}}"><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"></circle><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"></circle><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"></circle><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"></circle><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"></path></svg></sc-if>
<sc-if value="{{isResearch}}" hint-placeholder-val="{{ false }}"><svg width="12.5" height="12.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width: {{rolePx}}; height: {{rolePx}}"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.34-4.34"></path></svg></sc-if>
<sc-if value="{{isDebugFlow}}" hint-placeholder-val="{{ false }}"><svg width="12.5" height="12.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width: {{rolePx}}; height: {{rolePx}}"><path d="m8 2 1.88 1.88"></path><path d="M14.12 3.88 16 2"></path><path d="M9 7.13v-1a3.003 3.003 0 1 1 6 0v1"></path><path d="M12 20c-3.3 0-6-2.7-6-6v-3a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v3c0 3.3-2.7 6-6 6"></path><path d="M12 20v-9"></path><path d="M6.53 9C4.6 8.8 3 7.1 3 5"></path><path d="M6 13H2"></path><path d="M3 21c0-2.1 1.7-3.9 3.8-4"></path><path d="M20.97 5c0 2.1-1.6 3.8-3.5 4"></path><path d="M22 13h-4"></path><path d="M17.2 17c2.1.1 3.8 1.9 3.8 4"></path></svg></sc-if>
<sc-if value="{{isPm}}" hint-placeholder-val="{{ false }}"><svg width="12.5" height="12.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width: {{rolePx}}; height: {{rolePx}}"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg></sc-if>
<sc-if value="{{isNoRole}}" hint-placeholder-val="{{ false }}"><svg width="12.5" height="12.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width: {{rolePx}}; height: {{rolePx}}"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg></sc-if>
</span>
<sc-if value="{{hasEngine}}" hint-placeholder-val="{{ true }}"><span title="{{engineName}}" style="font-family: 'JetBrains Mono', monospace; font-size: {{metaSize}}; color: #8b8b94; white-space: nowrap">{{engine}}</span><span>·</span></sc-if>
<span style="min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><sc-if value="{{hasTask}}" hint-placeholder-val="{{ true }}"><span style="font-family: 'JetBrains Mono', monospace; color: #a1a1aa">{{taskRef}}</span> {{taskTitle}}</sc-if><sc-if value="{{noTask}}" hint-placeholder-val="{{ false }}"><span>— No task</span></sc-if></span>
</span>
<sc-if value="{{repoInline}}" hint-placeholder-val="{{ true }}"><span style="margin-left: auto"></span><span style="flex: none; font-family: 'JetBrains Mono', monospace">{{repo}}</span></sc-if>
</span>
<sc-if value="{{repoOwnLine}}" hint-placeholder-val="{{ false }}"><span style="display: flex; align-items: center; gap: 6px; font-size: {{metaSize}}; color: #8b8b94; white-space: nowrap"><span style="min-width: 0; overflow: hidden; text-overflow: ellipsis; font-family: 'JetBrains Mono', monospace">{{repo}}</span></span></sc-if>
</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"s":{"editor":null},"density":{"editor":"enum","options":["full","phone","compact"],"default":"full"},"$preview":{"width":460,"height":76}}'>
class Component extends DCLogic {
  renderVals() {
    // full: Inbox. phone: the phone Inbox. compact: every other session list (no preview, repo on its own line).
    const density = this.props.density ?? 'full';
    const s = this.props.s ?? { status: 'Question', unread: true, title: '通知の再送処理を見直す', age: '8s', preview: '再試行は 3 回で止めてよいですか?', role: 'development', engine: 'claude', taskRef: 'P1 #2048', taskTitle: '通知の信頼性を上げる', repo: 'example/service' };
    const D = {
      full: { pad: '8px 18px 9px 14px', border: '1px solid #1a1a1a', icon: '14px', top: '2px', title: '13.5px', meta: '11.5px', preview: '12.5px', role: '12.5px' },
      phone: { pad: '10px 16px', border: '1px solid #1a1a1a', icon: '16px', top: '3px', title: '15px', meta: '12.5px', preview: '13.5px', role: '13.5px' },
      compact: { pad: '6px 12px 7px', border: '0', icon: '14px', top: '2px', title: '13px', meta: '11.5px', preview: '12.5px', role: '12.5px' }
    }[density];
    const st = s.status;
    const kinds = ['Question', 'Review', 'Error', 'Plan', 'Approve', 'Proposal'];
    const role = s.role || '';
    const compact = density === 'compact';
    return {
      pad: s.pad ?? D.pad, bg: s.bg ?? 'transparent', border: D.border, bar: s.bar ?? 'none', opacity: s.opacity ?? 1,
      hasCaret: s.caret !== undefined, caret: s.caret ?? '',
      iconTop: D.top, iconPx: D.icon, rolePx: D.role, titleSize: D.title, metaSize: D.meta, previewSize: D.preview,
      status: st, isKind: kinds.includes(st), kindColor: st === 'Error' ? '#f87171' : '#fbbf24',
      isQuestion: st === 'Question', isReview: st === 'Review', isError: st === 'Error',
      isPlan: st === 'Plan', isApprove: st === 'Approve', isProposal: st === 'Proposal',
      isWorking: st === 'Working', isDone: st === 'Done',
      title: s.title, age: s.age,
      titleColor: s.unread ? '#fafafa' : '#d4d4d8', titleWeight: s.unread ? 700 : 400,
      hasPreview: !compact && !!s.preview, preview: s.preview ?? '', previewColor: s.previewColor ?? '#a1a1aa',
      // A session without a role shows the gray ellipsis icon.
      roleLabel: role || 'no role',
      isDevelopment: role === 'development', isDesign: role === 'design', isDesigner: role === 'designer',
      isResearch: role === 'research', isDebugFlow: role === 'debug-flow', isPm: role === 'PM', isNoRole: role === '',
      engine: s.engine, hasEngine: !!s.engine, engineName: s.engine === 'codex' ? 'Codex' : s.engine === 'claude' ? 'Claude Code' : '',
      hasTask: !!s.taskRef, noTask: !s.taskRef, taskRef: s.taskRef ?? '', taskTitle: s.taskTitle ?? '',
      repo: s.repo, repoInline: !compact, repoOwnLine: compact,
      // s.vibe: 'on' | 'inherited' | 'off'. A session whose repository does not allow vibe mode is 'off' here.
      vibeIcon: s.vibe === 'on' || s.vibe === 'inherited',
      vibeLabel: s.vibe === 'inherited' ? 'Vibe mode on, inherited from a parent session' : 'Vibe mode on',
      zapFill: s.vibe === 'inherited' ? 'none' : 'currentColor'
    };
  }
}
</script>
</body>
</html>
