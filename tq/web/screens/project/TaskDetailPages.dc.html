<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Task pages section</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<section style="width: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px; background: #0a0a0a; color: #fafafa; font-family: 'JetBrains Mono', monospace">

<div style="display: flex; align-items: baseline; gap: 8px">
<h3 style="margin: 0; display: inline-flex; align-items: baseline; gap: 8px; font-size: 14px; line-height: 20px; font-weight: 700"><span style="color: #ef4444; font-size: 12px">###</span>pages</h3>
<sc-if value="{{filled}}" hint-placeholder-val="{{ true }}"><span style="font-size: 10px; line-height: 14px; color: #52525b">3</span></sc-if>
<button type="button" style="margin-left: auto; align-self: center; height: 24px; display: inline-flex; align-items: center; gap: 4px; padding: 0 8px; border: 1px solid #2a2a2a; background: #0a0a0a; color: #fafafa; font-family: inherit; font-size: 12px; font-weight: 500"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>add page</button>
</div>

<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; font-size: 12px; line-height: 16px; color: #71717a">No pages yet. Add a page to keep notes and documentation.</p>
</sc-if>

<sc-if value="{{filled}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 8px">

<div style="border: 1px solid #2a2a2a">
<div style="display: flex; align-items: center; gap: 8px; padding: 8px 10px">
<button type="button" aria-label="Expand" style="flex: none; width: 24px; height: 24px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #71717a"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate(-90deg)"><path d="m6 9 6 6 6-6"></path></svg></button>
<button type="button" style="flex: 1; min-width: 0; padding: 0; border: 0; background: transparent; color: #fafafa; font-family: inherit; font-size: 12px; line-height: 16px; font-weight: 500; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">調査メモ</button>
<span style="font-size: 10px; line-height: 14px; color: #3f3f46">2h ago</span>
<a href="#page-1" aria-label="Open page" style="width: 24px; height: 24px; display: grid; place-items: center; color: #52525b"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"></path><path d="M10 14 21 3"></path><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path></svg></a>
<button type="button" aria-label="Page actions" style="width: {{act}}; height: {{act}}; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #71717a"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg></button>
</div>
<div style="border-top: 1px solid #2a2a2a; padding: 8px 10px">
<p style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px; color: #71717a; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden">## 再現手順<br>1. 設定ページを開いたまま 30 分放置する<br>2. 任意のリンクを押してログイン画面へ飛ばされるのを確認する</p>
<button type="button" style="margin-top: 4px; padding: 0; border: 0; background: transparent; color: #71717a; font-family: inherit; font-size: 10px; line-height: 14px">show more</button>
</div>
</div>

<div style="border: 1px solid #2a2a2a">
<div style="display: flex; align-items: center; gap: 8px; padding: 8px 10px">
<button type="button" aria-label="Expand" style="flex: none; width: 24px; height: 24px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #71717a"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: rotate(-90deg)"><path d="m6 9 6 6 6-6"></path></svg></button>
<span style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px">
<button type="button" style="min-width: 0; padding: 0; border: 0; background: transparent; color: #fafafa; font-family: inherit; font-size: 12px; line-height: 16px; font-weight: 500; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">リダイレクトの流れ</button>
<span style="flex: none; display: inline-flex; padding: 0 4px; border: 1px solid #2a2a2a; color: #71717a; font-size: 10px; line-height: 14px">assistant-a</span>
</span>
<span style="font-size: 10px; line-height: 14px; color: #3f3f46">1d ago</span>
<a href="#page-2" aria-label="Open page" style="width: 24px; height: 24px; display: grid; place-items: center; color: #52525b"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"></path><path d="M10 14 21 3"></path><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path></svg></a>
<button type="button" aria-label="Page actions" style="width: {{act}}; height: {{act}}; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #71717a"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg></button>
</div>
<div style="border-top: 1px solid #2a2a2a; padding: 8px 10px; display: flex; align-items: center; gap: 4px; font-size: 10px; line-height: 14px; color: #52525b"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 16 4-4-4-4"></path><path d="m6 8-4 4 4 4"></path><path d="m14.5 4-5 16"></path></svg>HTML page</div>
</div>

<div style="border: 1px solid #2a2a2a">
<div style="display: flex; align-items: center; gap: 8px; padding: 8px 10px">
<button type="button" aria-label="Collapse" style="flex: none; width: 24px; height: 24px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #71717a"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
<button type="button" style="flex: 1; min-width: 0; padding: 0; border: 0; background: transparent; color: #fafafa; font-family: inherit; font-size: 12px; line-height: 16px; font-weight: 500; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">リリース手順</button>
<span style="font-size: 10px; line-height: 14px; color: #3f3f46">Nov 20</span>
<a href="#page-3" aria-label="Open page" style="width: 24px; height: 24px; display: grid; place-items: center; color: #52525b"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"></path><path d="M10 14 21 3"></path><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path></svg></a>
<button type="button" aria-label="Page actions" style="width: {{act}}; height: {{act}}; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #71717a"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg></button>
</div>
<div style="border-top: 1px solid #2a2a2a; background: #141414; padding: 12px">
<div style="min-height: 120px; box-sizing: border-box; padding: 8px; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif; font-size: 14px; line-height: 28px; color: #fafafa">
<h2 style="margin: 0; font-size: 1.25em; line-height: 28px; font-weight: 700"><span style="margin-right: 6px; color: #ef4444; font-family: 'JetBrains Mono', monospace; font-size: 13px">##</span>デプロイ</h2>
<ol style="margin: 16px 0 0 8px; padding-left: 16px; color: #71717a">
<li style="padding-bottom: 4px"><span style="color: #fafafa">main にマージしてステージングへ反映する</span></li>
<li style="padding-bottom: 4px"><span style="color: #fafafa">ログインし直して元のページに戻るか確かめる</span></li>
</ol>
</div>
</div>
</div>

</div>
</sc-if>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"empty":{"editor":"boolean","default":false},"form":{"editor":"enum","options":["desktop","phone"],"default":"desktop"},"$preview":{"width":768,"height":420}}'>
class Component extends DCLogic {
  renderVals() {
    const empty = this.props.empty === true || this.props.empty === 'true';
    return {
      empty,
      filled: !empty,
      act: (this.props.form ?? 'desktop') === 'phone' ? '44px' : '20px',
    };
  }
}
</script>
</body>
</html>
