<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Phone: navigation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 100%; height: 100vh; overflow: hidden; background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 14px; line-height: 1.55">
<sc-if value="{{overInbox}}" hint-placeholder-val="{{ true }}"><dc-import name="PhoneInbox" hint-size="100%,844px"></dc-import></sc-if>
<sc-if value="{{overChat}}" hint-placeholder-val="{{ false }}"><dc-import name="PhoneChat" nav="{{chatNav}}" hint-size="100%,844px"></dc-import></sc-if>
<div style="position: absolute; inset: 0; background: rgba(0, 0, 0, 0.45)"></div>
<nav role="dialog" aria-modal="true" aria-label="Navigation" style="position: absolute; top: 0; bottom: 0; left: 0; width: 320px; max-width: 86%; box-sizing: border-box; display: flex; flex-direction: column; padding: 8px 12px; background: #0f0f0f; box-shadow: 8px 0 24px rgba(0, 0, 0, 0.5)">
<div style="height: 48px; flex: none; display: flex; align-items: center; padding: 0 4px; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700"><span style="margin-right: 7px; color: #ef4444">&gt;</span>agent watch</div>

<sc-if value="{{hasButton}}" hint-placeholder-val="{{ false }}">
<button type="button" aria-haspopup="dialog" style="flex: none; height: 44px; display: flex; align-items: center; gap: 10px; margin-bottom: 10px; padding: 0 12px; border: 1px solid {{fieldBorder}}; background: {{fieldBg}}; color: #a1a1aa; font-family: inherit; font-size: 15px; text-align: left"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 21-4.34-4.34"></path><circle cx="11" cy="11" r="8"></circle></svg>Jump to…</button>
</sc-if>
<sc-if value="{{hasInput}}" hint-placeholder-val="{{ false }}">
<div style="flex: none; display: flex; align-items: center; gap: 4px; margin-bottom: 10px">
<label style="flex: 1; min-width: 0; height: 44px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 12px; border: 1px solid {{fieldBorder}}; background: #1a1a1a; color: #a1a1aa"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="m21 21-4.34-4.34"></path><circle cx="11" cy="11" r="8"></circle></svg><input aria-label="Jump to" value="{{query}}" placeholder="Jump to…" style="flex: 1; min-width: 0; height: 40px; border: 0; outline: none; background: transparent; color: #fafafa; font-family: inherit; font-size: 16px"></label>
<sc-if value="{{typing}}" hint-placeholder-val="{{ false }}"><button type="button" style="flex: none; height: 44px; padding: 0 6px; border: 0; background: transparent; color: #d4d4d8; font-family: inherit; font-size: 15px">Cancel</button></sc-if>
</div>
</sc-if>

<sc-if value="{{typing}}" hint-placeholder-val="{{ false }}">
<div style="flex: 1; min-height: 0; overflow: hidden; margin: 0 -12px; border-top: 1px solid #2a2a2a"><dc-import name="PhonePalette" form="drawer" variant="a" scope="{{scope}}" from="{{from}}" hint-size="100%,760px"></dc-import></div>
</sc-if>

<sc-if value="{{notTyping}}" hint-placeholder-val="{{ true }}">
<div role="group" aria-label="Views" style="flex: none; display: grid; grid-template-columns: 1fr 1fr; height: 36px; box-sizing: border-box; margin-bottom: 12px; padding: 2px; background: #1a1a1a">
<button type="button" aria-pressed="true" style="border: 0; background: #3f3f46; color: #fafafa; font-family: inherit; font-size: 13px; font-weight: 700">Inbox <span style="font-family: 'JetBrains Mono', monospace; color: #fbbf24">6</span></button>
<button type="button" aria-pressed="false" style="border: 0; background: transparent; color: #a1a1aa; font-family: inherit; font-size: 13px">Board</button>
</div>
<div style="flex: 1; min-height: 0; overflow-y: auto; margin: 0 -8px; padding: 0 8px">
<h2 style="height: 26px; display: flex; align-items: center; margin: 0; padding: 0 4px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; color: #8b8b94">VIEWS</h2>
<div style="height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 4px; color: #d4d4d8"><span style="flex: 1">web-app のレビュー</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #fbbf24">3</span></div>
<div style="height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 4px; color: #d4d4d8"><span style="flex: 1">Errors</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #f87171">1</span></div>
<h2 style="height: 26px; display: flex; align-items: center; margin: 12px 0 0; padding: 0 4px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; color: #8b8b94">Starred</h2>
<sc-for list="{{starred}}" as="s" hint-placeholder-count="2">
<div style="margin: 0 -8px"><dc-import name="SessionRow" s="{{ s }}" density="compact" hint-size="100%,69px"></dc-import></div>
</sc-for>
<h2 style="height: 26px; display: flex; align-items: center; margin: 14px 0 0; padding: 0 4px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; color: #8b8b94">PM</h2>
<sc-for list="{{pm}}" as="s" hint-placeholder-count="2">
<div style="margin: 0 -8px"><dc-import name="SessionRow" s="{{ s }}" density="compact" hint-size="100%,69px"></dc-import></div>
</sc-for>
</div>
<div style="flex: none; padding-bottom: 16px"><dc-import name="Quota" phone="{{ true }}" hint-size="100%,140px"></dc-import></div>
</sc-if>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"over":{"editor":"enum","options":["inbox","chat"],"default":"inbox"},"chatNav":{"editor":"enum","options":["back","menu"],"default":"back"},"search":{"editor":"enum","options":["none","button","buttonPressed","input","typing"],"default":"none"},"scope":{"editor":"enum","options":["all","close"],"default":"all"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const over = this.props.over ?? 'inbox';
    // button: Jump to… opens the full-screen palette. input/typing: the drawer is the palette; typing replaces its list with results.
    const search = this.props.search ?? 'none';
    const typing = search === 'typing';
    const scope = this.props.scope ?? 'all';
    return {
      overInbox: over === 'inbox', overChat: over === 'chat', chatNav: this.props.chatNav ?? 'back',
      // The palette offers Close this session only for the chat the drawer was opened over.
      from: over,
      hasButton: search === 'button' || search === 'buttonPressed',
      hasInput: search === 'input' || typing,
      typing, notTyping: !typing, scope,
      query: typing && scope === 'close' ? 'close' : '',
      fieldBorder: search === 'buttonPressed' || typing ? '#a1a1aa' : '#2a2a2a',
      fieldBg: search === 'buttonPressed' ? '#262626' : '#1a1a1a',
      starred: [
        { status: 'Question', unread: true, title: '通知の再送処理を見直す', age: '8s', role: 'development', engine: 'claude', taskRef: 'P1 #2048', taskTitle: '通知の信頼性を上げる', repo: 'example/service', vibe: 'inherited' },
        { status: 'Working', title: '配信ログの保存期間を決める', age: '2m', role: 'research', engine: 'codex', taskRef: 'P2 #2051', taskTitle: '監視を整える', repo: 'example/observability' }
      ],
      pm: [
        { status: 'Plan', title: '段階的な公開を進める', age: '5m', role: 'PM', engine: 'claude', taskRef: 'P2 #2052', taskTitle: '新しい設定を段階的に公開する', repo: 'example/web-app' },
        { status: 'Working', title: '通知まわりの改修', age: '12m', role: 'PM', engine: 'claude', taskRef: 'P1 #2048', taskTitle: '通知の信頼性を上げる', repo: 'example/service', vibe: 'on' }
      ]
    };
  }
}
</script>
</body>
</html>
