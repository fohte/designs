<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>NewSessionPane</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<section aria-label="New session" style="position: relative; width: {{w}}; height: {{h}}; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 13px; line-height: 1.55">
<header style="{{headerStyle}}">
<sc-if value="{{phone}}" hint-placeholder-val="{{ false }}"><button type="button" aria-label="Back to Inbox" style="flex: none; width: 44px; height: 44px; margin-left: -14px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #d4d4d8"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button></sc-if>
<h1 style="flex: none; margin: 0; font-size: 15px">New session</h1>
<button type="button" aria-haspopup="dialog" aria-expanded="{{dirOpen}}" style="{{dirStyle}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"></path></svg><span style="min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{dirLabel}}</span><sc-if value="{{chips}}" hint-placeholder-val="{{ false }}"><kbd style="flex: none; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8b8b94">d</kbd></sc-if><sc-if value="{{alt}}" hint-placeholder-val="{{ false }}"><kbd style="flex: none; min-width: 16px; height: 16px; display: inline-grid; place-items: center; padding: 0 3px; box-sizing: border-box; background: #fafafa; color: #0a0a0a; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700">d</kbd></sc-if><span aria-hidden="true" style="flex: none">▾</span></button>
</header>
<div style="flex: 1; display: grid; place-items: center; padding: 24px; color: #8b8b94; font-size: 13px; text-align: center">The conversation opens here when the session starts.</div>
<div style="{{composerStyle}}">
<div style="position: relative; border: 1px solid {{boxBorder}}; background: #0f0f0f">
<textarea aria-label="First message" placeholder="First message (optional)" style="display: block; width: 100%; height: 72px; box-sizing: border-box; padding: 10px 12px; border: 0; outline: none; background: transparent; color: #fafafa; font-family: inherit; font-size: {{inputSize}}; resize: none" value="{{message}}"></textarea>
<sc-if value="{{caret}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="position: absolute; left: {{caretLeft}}; top: 13px; width: 1px; height: 17px; background: #fafafa"></span></sc-if>
<sc-if value="{{slashOpen}}" hint-placeholder-val="{{ false }}"><div role="listbox" aria-label="Session options and skills" style="position: absolute; left: -1px; right: -1px; bottom: calc(100% - 4px); z-index: 10; box-sizing: border-box; padding: 4px; background: #141414; border: 1px solid #3f3f46; box-shadow: 0 8px 24px rgb(0 0 0 / 35%)">
<sc-if value="{{slashHasOpts}}" hint-placeholder-val="{{ true }}"><div style="height: 24px; display: flex; align-items: center; padding: 0 10px; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; color: #8b8b94">SESSION</div></sc-if>
<sc-for list="{{slashOpts}}" as="o" hint-placeholder-count="4"><div role="option" aria-selected="{{o.active}}" style="min-height: {{slashRowH}}; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 4px 10px; background: {{o.bg}}"><span style="flex: none; width: 124px; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: #fafafa">{{o.cmd}}</span><span style="min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: #a1a1aa">{{o.desc}}</span></div></sc-for>
<sc-if value="{{slashHasSkills}}" hint-placeholder-val="{{ true }}"><div style="height: 24px; display: flex; align-items: center; margin-top: 2px; padding: 0 10px; font-size: 11px; font-weight: 700; letter-spacing: 0.04em; color: #8b8b94">SKILLS</div></sc-if>
<sc-for list="{{slashSkills}}" as="o" hint-placeholder-count="2"><div role="option" aria-selected="false" style="min-height: {{slashRowH}}; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 4px 10px"><span style="flex: none; width: 124px; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: #fafafa">{{o.cmd}}</span><span style="min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: #a1a1aa">{{o.desc}}</span></div></sc-for>
</div></sc-if>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 8px">
<button type="button" aria-haspopup="menu" aria-expanded="{{engineOpen}}" style="{{engineStyle}}">{{engineLabel}}<sc-if value="{{chips}}" hint-placeholder-val="{{ false }}"><kbd style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8b8b94">e</kbd></sc-if><sc-if value="{{alt}}" hint-placeholder-val="{{ false }}"><kbd style="min-width: 16px; height: 16px; display: inline-grid; place-items: center; padding: 0 3px; box-sizing: border-box; background: #fafafa; color: #0a0a0a; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700">e</kbd></sc-if> ▾</button>
<button type="button" aria-haspopup="dialog" aria-label="Model and reasoning effort" aria-expanded="{{modelOpen}}" style="{{modelStyle}}"><sc-if value="{{pc}}" hint-placeholder-val="{{ true }}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="16" height="16" x="4" y="4" rx="2"></rect><rect width="6" height="6" x="9" y="9" rx="1"></rect><path d="M15 2v2"></path><path d="M15 20v2"></path><path d="M2 15h2"></path><path d="M2 9h2"></path><path d="M20 15h2"></path><path d="M20 9h2"></path><path d="M9 2v2"></path><path d="M9 20v2"></path></svg></sc-if><span style="color: #a1a1aa">{{modelName}}</span><span aria-hidden="true" style="color: #71717a">·</span><span style="color: #a1a1aa">{{effortName}}</span><span style="font-size: 11px; color: #8b8b94">default</span><sc-if value="{{chips}}" hint-placeholder-val="{{ false }}"><kbd style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8b8b94">m</kbd></sc-if><sc-if value="{{alt}}" hint-placeholder-val="{{ false }}"><kbd style="min-width: 16px; height: 16px; display: inline-grid; place-items: center; padding: 0 3px; box-sizing: border-box; background: #fafafa; color: #0a0a0a; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700">m</kbd></sc-if> ▾</button>
<button type="button" aria-pressed="{{worktree}}" style="{{wtStyle}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="6" x2="6" y1="3" y2="15"></line><circle cx="18" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><path d="M18 9a9 9 0 0 1-9 9"></path></svg> New worktree<sc-if value="{{worktree}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="color: #fafafa">✓</span></sc-if><sc-if value="{{chips}}" hint-placeholder-val="{{ false }}"><kbd style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8b8b94">w</kbd></sc-if><sc-if value="{{alt}}" hint-placeholder-val="{{ false }}"><kbd style="min-width: 16px; height: 16px; display: inline-grid; place-items: center; padding: 0 3px; box-sizing: border-box; background: #fafafa; color: #0a0a0a; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700">w</kbd></sc-if></button>
<span role="status" style="flex: 1 1 0; min-width: 0; line-height: 1.3; text-align: right; font-size: 12px; color: #8b8b94">{{status}}</span>
<button type="button" style="{{startStyle}}">Start ↵</button>
</div>
<sc-if value="{{engineOpen}}" hint-placeholder-val="{{ false }}"><div role="menu" aria-label="Choose an engine" style="position: absolute; left: 8px; bottom: 42px; z-index: 10; width: 180px; padding: 4px 0; background: #161616; border: 1px solid #3f3f46; box-shadow: 0 12px 36px rgb(0 0 0 / 40%)">
<sc-for list="{{engines}}" as="e" hint-placeholder-count="2"><button type="button" role="menuitemradio" aria-checked="{{e.on}}" style="width: 100%; min-height: {{rowH}}; display: grid; grid-template-columns: 16px 1fr; align-items: center; gap: 8px; padding: 4px 12px; border: 0; background: {{e.bg}}; color: #fafafa; font-family: inherit; font-size: 13px; text-align: left"><span style="color: #fafafa">{{e.check}}</span><span>{{e.label}}</span></button></sc-for>
</div></sc-if>
<sc-if value="{{modelOpen}}" hint-placeholder-val="{{ false }}"><div role="dialog" aria-label="Model and reasoning effort" style="position: absolute; left: {{modelLeft}}; bottom: 42px; z-index: 10; width: 340px; max-width: calc(100% - 16px); box-sizing: border-box; padding: 4px 0 12px; background: #161616; border: 1px solid #3f3f46; box-shadow: 0 12px 36px rgb(0 0 0 / 40%)">
<div style="height: 28px; display: flex; align-items: center; padding: 0 12px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; color: #8b8b94">MODEL · CLAUDE CODE</div>
<div role="radiogroup" aria-label="Model">
<button type="button" role="radio" aria-checked="true" style="width: 100%; min-height: {{rowH}}; display: grid; grid-template-columns: 16px 1fr auto; align-items: center; gap: 8px; padding: 4px 12px; border: 0; background: transparent; color: #fafafa; font-family: inherit; font-size: 13px; text-align: left"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg><span>Default <span style="font-size: 11px; color: #8b8b94">profile daily</span></span><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #a1a1aa">atlas-5</span></button>
<button type="button" role="radio" aria-checked="false" style="width: 100%; min-height: {{rowH}}; display: grid; grid-template-columns: 16px 1fr auto; align-items: center; gap: 8px; padding: 4px 12px; border: 0; background: transparent; color: #fafafa; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; text-align: left"><span></span><span>atlas-5</span><span></span></button>
<button type="button" role="radio" aria-checked="false" style="width: 100%; min-height: {{rowH}}; display: grid; grid-template-columns: 16px 1fr auto; align-items: center; gap: 8px; padding: 4px 12px; border: 0; background: #2a2a2e; color: #fafafa; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; text-align: left"><span></span><span>borealis-5</span><span></span></button>
<button type="button" role="radio" aria-checked="false" style="width: 100%; min-height: {{rowH}}; display: grid; grid-template-columns: 16px 1fr auto; align-items: center; gap: 8px; padding: 4px 12px; border: 0; background: transparent; color: #fafafa; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; text-align: left"><span></span><span>comet-5</span><span style="font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 11.5px; color: #8b8b94">up to high</span></button>
</div>
<div style="height: 28px; display: flex; align-items: center; margin-top: 6px; padding: 0 12px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; color: #8b8b94">EFFORT</div>
<div role="radiogroup" aria-label="Reasoning effort" style="display: flex; margin: 0 12px; border: 1px solid #3f3f46">
<button type="button" role="radio" aria-checked="true" style="flex: 1 1 auto; height: {{effortH}}; padding: 0 6px; border: 0; border-right: 1px solid #3f3f46; background: #fafafa; color: #0a0a0a; font-family: inherit; font-size: 12px; white-space: nowrap">Default · high</button><button type="button" role="radio" aria-checked="false" style="flex: 1 1 auto; height: {{effortH}}; padding: 0 6px; border: 0; border-right: 1px solid #3f3f46; background: transparent; color: #d4d4d8; font-family: inherit; font-size: 12px; white-space: nowrap">low</button><button type="button" role="radio" aria-checked="false" style="flex: 1 1 auto; height: {{effortH}}; padding: 0 6px; border: 0; border-right: 1px solid #3f3f46; background: transparent; color: #d4d4d8; font-family: inherit; font-size: 12px; white-space: nowrap">medium</button><button type="button" role="radio" aria-checked="false" style="flex: 1 1 auto; height: {{effortH}}; padding: 0 6px; border: 0; background: transparent; color: #d4d4d8; font-family: inherit; font-size: 12px; white-space: nowrap">high</button>
</div>
</div></sc-if>
</div>
<sc-if value="{{line}}" hint-placeholder-val="{{ false }}"><div aria-label="Keyboard shortcuts" style="height: 28px; display: flex; align-items: center; gap: 14px; padding: 0 2px; overflow: hidden; font-size: 11.5px; color: #8b8b94; white-space: nowrap"><sc-for list="{{lineItems}}" as="it" hint-placeholder-count="4"><span><kbd style="font-family: 'JetBrains Mono', monospace; color: #a1a1aa">{{it.k}}</kbd> {{it.label}}</span></sc-for></div></sc-if>
</div>
<sc-if value="{{dirOpen}}" hint-placeholder-val="{{ false }}"><div role="dialog" aria-label="Choose a directory" style="position: absolute; top: {{popTop}}; right: {{popRight}}; z-index: 10; width: {{popW}}; box-sizing: border-box; display: flex; flex-direction: column; background: #161616; border: 1px solid #3f3f46; box-shadow: 0 12px 36px rgb(0 0 0 / 40%)">
<div style="height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid #2a2a2a"><span aria-hidden="true" style="color: #8b8b94">⌕</span><input aria-label="Directory" placeholder="Search repositories or type a path" value="{{query}}" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: #fafafa; font-family: inherit; font-size: {{inputSize}}"></div>
<h2 style="height: 28px; display: flex; align-items: center; margin: 4px 0 0; padding: 0 12px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; color: #8b8b94">RECENT</h2>
<div role="listbox" aria-label="Directories"><sc-for list="{{dirs}}" as="d" hint-placeholder-count="3"><div role="option" aria-selected="{{d.active}}" style="min-height: 44px; box-sizing: border-box; display: grid; grid-template-columns: 14px 1fr auto; align-items: center; gap: 10px; padding: 4px 12px; background: {{d.bg}}"><span style="color: #a1a1aa"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"></path></svg></span><div style="min-width: 0"><div style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{d.name}}</div><div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8b8b94; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{d.path}}</div></div><span style="font-size: 11.5px; color: #8b8b94">{{d.when}}</span></div></sc-for></div>
</div></sc-if>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"form":{"editor":"enum","options":["pc","phone"],"default":"pc"},"keys":{"editor":"enum","options":["approved","a","b","c"],"default":"b"},"hints":{"editor":"enum","options":["none","line","chips","row"],"default":"line"},"slash":{"editor":"text","default":""},"slashList":{"editor":"boolean","default":true},"focus":{"editor":"enum","options":["none","message","dir","engine","model","worktree","start"],"default":"message"},"menu":{"editor":"enum","options":["none","dir","engine","model"],"default":"none"},"dir":{"editor":"boolean","default":true},"codex":{"editor":"boolean","default":false},"worktree":{"editor":"boolean","default":false},"query":{"editor":"text","default":""},"typed":{"editor":"boolean","default":true},"w":{"editor":null},"h":{"editor":null},"$preview":{"width":740,"height":520}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const phone = (p.form ?? 'pc') === 'phone';
    const keys = p.keys ?? 'b';
    const hints = phone ? 'none' : (p.hints ?? 'line');
    const focus = p.focus ?? 'message';
    const menu = p.menu ?? 'none';
    const dir = p.dir ?? true;
    const codex = p.codex ?? false;
    const worktree = p.worktree ?? false;
    const ring = '; border-color: #a1a1aa; box-shadow: 0 0 0 1px #a1a1aa';
    const open = '; background: #262626; border-color: #a1a1aa';
    const ctl = 'flex: none; height: 30px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; border: 1px solid #3f3f46; background: transparent; color: #fafafa; font-family: inherit; font-size: 12.5px';
    const st = (name, isOpen) => ctl + (isOpen ? open : '') + (focus === name ? ring : '');
    const dirBase = 'margin-left: auto; min-width: 0; height: 32px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; background: transparent; font-family: inherit; font-size: 12.5px; ' + (dir ? 'border: 1px solid #3f3f46; color: #fafafa' : 'border: 1px solid #fbbf24; color: #fbbf24');
    const menuLines = {
      dir: [['↑↓', 'Move'], ['↵', 'Choose'], ['Esc', 'Back']],
      engine: [['↑↓', 'Move'], ['↵', 'Choose'], ['Esc', 'Back']],
      model: [['↑↓', 'Model'], ['←→', 'Effort'], ['↵', 'Done'], ['Esc', 'Back']]
    };
    const slash = p.slash ?? '';
    const inRow = ['engine', 'model', 'worktree', 'start'].includes(focus);
    const baseLines = {
      approved: [['↵', 'Start'], ['⇧↵ / ⌥↵', 'New line']],
      a: [['↵', 'Start'], ['⇧↵ / ⌥↵', 'New line'], ['Tab', 'Next field'], ['←→ / Space', 'Change'], ['Esc', 'Close']],
      b: inRow
        ? [['d', 'Directory'], ['e', 'Engine'], ['m', 'Model'], ['w', 'Worktree'], ['←→', 'Move'], ['⇧Tab / Esc', 'Message']]
        : [['↵', 'Start'], ['⇧↵ / ⌥↵', 'New line'], ['Tab', 'Options'], ['Esc', 'Close']],
      c: slash && (p.slashList ?? true)
        ? [['↑↓', 'Move'], ['↵ / Tab', 'Choose'], ['Esc', 'Close list']]
        : [['↵', 'Start'], ['⇧↵ / ⌥↵', 'New line'], ['/', 'Options and skills'], ['Esc', 'Close']]
    };
    const items = (menu !== 'none' && keys !== 'approved' ? menuLines[menu] : baseLines[keys]) || [];
    const typed = p.typed ?? true;
    const message = slash || (typed ? '配信ログの保存期間を設定ファイルに出したい' : '');
    const opts = [
      { cmd: '/dir', desc: 'Choose a directory' },
      { cmd: '/engine', desc: 'Claude Code or Codex' },
      { cmd: '/model', desc: 'Model and reasoning effort' },
      { cmd: '/worktree', desc: 'New worktree on / off' }
    ].filter((o) => o.cmd.startsWith(slash)).map((o, i) => ({ ...o, active: i === 0, bg: i === 0 ? '#0a0a0a' : 'transparent' }));
    const skills = [
      { cmd: '/review', desc: 'Review the current branch' },
      { cmd: '/release-notes', desc: 'Draft release notes from merged PRs' }
    ].filter((o) => o.cmd.startsWith(slash));
    return {
      phone,
      pc: !phone,
      w: p.w ?? (phone ? '390px' : '740px'),
      h: p.h ?? (phone ? '844px' : '520px'),
      headerStyle: phone
        ? 'flex: none; display: flex; align-items: center; gap: 8px; min-height: 50px; padding: 8px 16px 6px; border-bottom: 1px solid #2a2a2a'
        : 'flex: none; display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 0 16px; border-bottom: 1px solid #2a2a2a',
      composerStyle: phone
        ? 'flex: none; padding: 10px 12px 30px; border-top: 1px solid #2a2a2a'
        : 'flex: none; padding: ' + (hints === 'line' ? '12px 16px 6px' : '12px 16px 16px') + '; border-top: 1px solid #2a2a2a',
      inputSize: phone ? '16px' : '13px',
      rowH: phone ? '44px' : '36px',
      effortH: phone ? '44px' : '30px',
      dirOpen: menu === 'dir',
      engineOpen: menu === 'engine',
      modelOpen: menu === 'model',
      dirStyle: dirBase + (menu === 'dir' ? '; border-color: #a1a1aa' : '') + (focus === 'dir' && menu !== 'dir' ? ring : ''),
      dirLabel: dir ? '~/ghq/github.com/example/service' : 'Choose a directory',
      engineStyle: st('engine', menu === 'engine'),
      engineLabel: codex ? 'Codex' : 'Claude Code',
      modelStyle: st('model', menu === 'model'),
      modelName: codex ? 'vega-3' : 'atlas-5',
      effortName: codex ? 'medium' : 'high',
      modelLeft: codex ? '70px' : '114px',
      worktree,
      wtStyle: st('worktree', false) + (worktree ? '; background: #262626; border-color: #a1a1aa' : ''),
      status: dir ? '' : 'Choose a directory to start',
      startStyle: 'flex: none; height: 32px; padding: 0 14px; border: 0; font-family: inherit; font-size: 13px; font-weight: 700; ' + (dir ? 'background: #fafafa; color: #0a0a0a' : 'background: #27272a; color: #71717a') + (focus === 'start' ? '; box-shadow: 0 0 0 2px #0a0a0a, 0 0 0 3px #a1a1aa' : ''),
      boxBorder: focus === 'message' && menu === 'none' ? '#a1a1aa' : '#52525b',
      message,
      caret: focus === 'message' && menu === 'none',
      caretLeft: slash ? (13 + slash.length * 7.5) + 'px' : (!typed ? '12px' : (phone ? '349px' : '286px')),
      chips: hints === 'chips',
      alt: hints === 'row' && inRow,
      slashOpen: !!slash && menu === 'none' && (p.slashList ?? true),
      slashOpts: opts,
      slashSkills: skills,
      slashHasOpts: opts.length > 0,
      slashHasSkills: skills.length > 0,
      slashRowH: phone ? '44px' : '36px',
      line: hints === 'line',
      lineItems: items.map(([k, label]) => ({ k, label })),
      query: p.query ?? '',
      popTop: phone ? '52px' : '48px',
      popRight: phone ? '8px' : '16px',
      popW: phone ? '374px' : '420px',
      dirs: [
        { name: 'example/service', path: '~/ghq/github.com/example/service', when: '2h ago' },
        { name: 'example/web-app', path: '~/ghq/github.com/example/web-app', when: 'yesterday' },
        { name: 'scratch', path: '~/work/scratch', when: '3d ago' }
      ].filter((d) => !p.query || d.name.includes(p.query)).map((d, i) => ({ ...d, active: i === 0, bg: i === 0 ? '#2a2a2e' : 'transparent' })),
      engines: [
        { label: 'Claude Code', on: !codex, check: codex ? '' : '✓', bg: codex ? '#2a2a2e' : 'transparent' },
        { label: 'Codex', on: codex, check: codex ? '✓' : '', bg: codex ? 'transparent' : '#2a2a2e' }
      ]
    };
  }
}
</script>
</body>
</html>
