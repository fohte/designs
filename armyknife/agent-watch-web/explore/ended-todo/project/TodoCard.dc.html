<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>To-do card: folded row, or the open card's header</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: {{fs}}; line-height: 1.55">
<sc-if value="{{deskFolded}}" hint-placeholder-val="{{ true }}">
<article aria-label="User task, folded" style="display: flex; align-items: center; border: 1px solid #2a2a2a; background: #111111">
<button type="button" aria-expanded="false" style="flex: 1; min-width: 0; height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 14px; border: 0; background: transparent; color: #fafafa; font-family: inherit; font-size: 14px; text-align: left"><span style="flex: none; color: #a1a1aa; font-size: 12px; font-weight: 700">To-do · later</span><strong style="min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{title}}</strong><sc-if value="{{added}}" hint-placeholder-val="{{ false }}"><span style="flex: none; color: #8b8b94; font-size: 12px">· added folded</span></sc-if><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-left: auto; color: #a1a1aa"><path d="m6 9 6 6 6-6"></path></svg></button>
</article>
</sc-if>
<sc-if value="{{phoneFolded}}" hint-placeholder-val="{{ false }}">
<article aria-label="User task, folded" style="display: flex; align-items: center; border: 1px solid #2a2a2a; background: #111111">
<button type="button" aria-expanded="false" style="flex: 1; min-width: 0; min-height: 48px; display: flex; flex-direction: column; justify-content: center; gap: 1px; padding: 6px 14px; border: 0; background: transparent; color: #fafafa; font-family: inherit; text-align: left"><span style="display: flex; align-items: center; gap: 6px; color: #a1a1aa; font-size: 12.5px; font-weight: 700">To-do · later<sc-if value="{{added}}" hint-placeholder-val="{{ false }}"><span style="color: #8b8b94; font-weight: 400">· added folded</span></sc-if></span><span style="display: flex; align-items: center; gap: 8px; width: 100%"><strong style="min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 15px">{{title}}</strong><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-left: auto; color: #a1a1aa"><path d="m6 9 6 6 6-6"></path></svg></span></button>
</article>
</sc-if>
<sc-if value="{{deskHeader}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 8px"><h2 style="margin: 0; color: #a1a1aa; font-size: 12px; font-weight: 700">To-do · pending</h2><sc-if value="{{hasNote}}" hint-placeholder-val="{{ false }}"><span style="padding: 0 5px; border: 1px solid #3f3f46; color: #a1a1aa; font-size: 11px">{{note}}</span></sc-if><button type="button" aria-label="Fold this to-do" title="Fold" aria-expanded="true" style="margin-left: auto; width: 28px; height: 26px; display: grid; place-items: center; padding: 0; border: 1px solid #2a2a2a; background: transparent; color: #d4d4d8"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"></path></svg></button></div>
</sc-if>
<sc-if value="{{phoneHeader}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 8px; min-height: 24px"><h2 style="margin: 0; color: #a1a1aa; font-size: 12.5px; font-weight: 700">To-do · pending</h2><sc-if value="{{hasNote}}" hint-placeholder-val="{{ false }}"><span style="padding: 0 5px; border: 1px solid #3f3f46; color: #a1a1aa; font-size: 12px">{{note}}</span></sc-if><button type="button" aria-label="Fold this to-do" aria-expanded="true" style="margin: -10px -10px -10px auto; width: 44px; height: 44px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #d4d4d8"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"></path></svg></button></div>
</sc-if>
<sc-if value="{{isWithdrawn}}" hint-placeholder-val="{{ false }}">
<article aria-label="User task, withdrawn" style="border: 1px solid #3f3f46; padding: {{wPad}}"><h2 style="margin: 0 0 4px; color: #a1a1aa; font-size: {{wHead}}; font-weight: 700">To-do · withdrawn<sc-if value="{{hasNote}}" hint-placeholder-val="{{ false }}"><span style="font-weight: 400"> · {{note}}</span></sc-if></h2><h3 style="margin: 0; color: #a1a1aa; font-size: 17px; font-weight: 700">{{title}}</h3></article>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"form":{"editor":"enum","options":["folded","header","withdrawn"],"default":"folded"},"note":{"editor":"text","default":""},"phone":{"editor":"boolean","default":false},"added":{"editor":"boolean","default":false},"title":{"editor":"text","default":"通知の音を実機で確かめる"},"$preview":{"width":672,"height":40}}'>
class Component extends DCLogic {
  renderVals() {
    // form: folded is the one-line row that opens the card; header is the open card's top line with ⌃ (Fold). The card body stays in the importer.
    // withdrawn: the card after its to-do was withdrawn, reduced to its state and title.
    const form = this.props.form ?? 'folded';
    const folded = form === 'folded';
    const header = form === 'header';
    const phone = this.props.phone ?? false;
    const note = this.props.note ?? '';
    return {
      deskFolded: folded && !phone,
      phoneFolded: folded && phone,
      deskHeader: header && !phone,
      phoneHeader: header && phone,
      isWithdrawn: form === 'withdrawn', wPad: '14px', wHead: phone ? '12.5px' : '12px',
      // note: a label after the heading, such as Session ended. On withdrawn, it says why after the state.
      note, hasNote: !!note,
      // added: the session added it folded, marked to check later.
      added: this.props.added ?? false,
      title: this.props.title ?? '通知の音を実機で確かめる',
      fs: phone ? '15px' : '14px'
    };
  }
}
</script>
</body>
</html>
