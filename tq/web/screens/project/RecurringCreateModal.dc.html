<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>New Recurring Template</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif">
<dc-import name="RecurringList" hint-size="1440px,900px"></dc-import>
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(4px)"></div>

<div style="position: absolute; inset: 0; box-sizing: border-box; padding: 32px; display: flex; align-items: center; justify-content: center">
<div role="dialog" aria-modal="true" aria-labelledby="template-form-title" style="width: 100%; max-width: 600px; max-height: 100%; display: flex; flex-direction: column; overflow: hidden; background: #141414; box-shadow: 0 0 0 1px rgba(250, 250, 250, 0.1), 0 25px 50px -12px rgba(0, 0, 0, 0.25)">

<div style="flex: none; height: 56px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; border-bottom: 1px solid #2a2a2a">
<span id="template-form-title" style="font-size: 16px; line-height: 24px; font-weight: 600; color: #fafafa">New Recurring Template</span>
<button type="button" aria-label="Close" style="width: 28px; height: 28px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #fafafa"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
</div>

<div style="flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; padding: 24px">
<input type="text" placeholder="Template title" aria-label="Template title" style="width: calc(100% + 8px); height: 32px; box-sizing: border-box; margin: 0 -4px; padding: 4px; border: 0; border-bottom: 1px solid transparent; background: transparent; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif; font-size: 14px; outline: none">
<textarea rows="3" placeholder="Description" aria-label="Description" style="display: block; width: 100%; min-height: 64px; box-sizing: border-box; padding: 8px 10px; border: 1px solid #2a2a2a; background: rgba(42, 42, 42, 0.3); color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif; font-size: 14px; line-height: 20px; resize: none; outline: none"></textarea>

<div style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 12px">
<span style="width: 96px; flex: none; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px; letter-spacing: 0.1em; color: #52525b">REPEAT</span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<button type="button" aria-label="Repeat type" style="width: calc(100% + 8px); height: 28px; box-sizing: border-box; margin: 0 -4px; display: flex; align-items: center; justify-content: flex-start; gap: 6px; padding: 0 4px; border: 0; border-bottom: 1px solid transparent; background: transparent; color: #fafafa; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 14px">Daily<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#71717a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
<div style="display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px; color: #fafafa">
<label for="template-interval">Every</label>
<input id="template-interval" type="number" min="1" value="1" style="width: 48px; height: 32px; box-sizing: border-box; padding: 4px; border: 0; border-bottom: 1px solid transparent; background: transparent; color: #fafafa; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 14px; outline: none">
<span>day</span>
</div>
</div>
</div>

<div style="display: flex; align-items: center; gap: 12px">
<label for="template-first-date" style="width: 96px; flex: none; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px; letter-spacing: 0.1em; color: #52525b">First task date</label>
<input id="template-first-date" type="date" value="2026-08-15" min="2026-08-15" style="width: auto; min-width: 0; height: 32px; box-sizing: border-box; margin: 0 -4px; padding: 4px; border: 0; border-bottom: 1px solid transparent; background: transparent; color: #fafafa; color-scheme: dark; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 14px">
</div>

<div style="display: flex; align-items: center; gap: 12px">
<span style="width: 96px; flex: none; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px; letter-spacing: 0.1em; color: #52525b">Context</span>
<button type="button" aria-label="Context" style="height: 28px; margin: 0 -4px; display: inline-flex; align-items: center; justify-content: space-between; gap: 6px; padding: 0 4px; border: 0; border-bottom: 1px solid transparent; background: transparent; color: #fafafa; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 14px">Personal<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#71717a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
</div>

<div style="display: flex; align-items: center; gap: 12px">
<span style="width: 96px; flex: none; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px; letter-spacing: 0.1em; color: #52525b">Tags</span>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px">
<button type="button" style="padding: 0; border: 0; background: transparent; color: #71717a; font-family: inherit; font-size: inherit; font-weight: 500">+ add tag</button>
</div>
</div>
</div>
</div>

<div style="flex: none; display: flex; align-items: center; justify-content: flex-end; gap: 12px; padding: 12px 24px; border-top: 1px solid #2a2a2a">
<button type="button" style="height: 32px; padding: 0 10px; border: 1px solid #2a2a2a; background: #0a0a0a; color: #fafafa; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 500">Cancel</button>
<button type="button" disabled style="height: 36px; padding: 0 10px; border: 1px solid #71717a; background: #1f1f1f; color: #fafafa; opacity: 0.5; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 500">Create Template</button>
</div>

</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
