<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Phone conversation with two denials</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<main style="width: 100%; height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 15px; line-height: 1.55">
<header style="flex: none; display: grid; grid-template-columns: auto 1fr auto; align-items: center; column-gap: 6px; padding: 6px 8px 4px 0; border-bottom: 1px solid #2a2a2a">
<div style="display: flex"><button type="button" aria-label="Back to Inbox" style="width: 44px; height: 44px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #d4d4d8"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button><button type="button" aria-label="Open sessions" style="width: 44px; height: 44px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #d4d4d8"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16"></path><path d="M4 12h16"></path><path d="M4 19h16"></path></svg></button></div>
<h1 style="margin: 0; min-width: 0; font-size: 13px; font-weight: 700; line-height: 1.3">通知の再送処理を見直す</h1>
<button type="button" aria-label="More actions" style="width: 44px; height: 44px; display: grid; place-items: center; padding: 0; border: 1px solid #3f3f46; background: transparent; color: #fafafa"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg></button>
<div style="grid-column: 1 / -1; min-height: 28px; display: flex; align-items: center; padding: 0 0 0 14px; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #a1a1aa">example/notification-service</div>
</header>
<div style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 14px; padding: 0 16px 16px">
<article style="flex: none; align-self: flex-end; max-width: 92%; display: flex; flex-direction: column; gap: 4px">
<div style="text-align: right; font-size: 12px; color: #8b8b94">You · 10:02</div>
<div style="padding: 10px 14px; background: #1f1f1f">古いキャッシュを消してから、直したブランチを push しておいてください。</div>
</article>
<article style="flex: none; color: #d4d4d8">共有キャッシュを消してから作り直します。</article>
<div style="flex: none"><dc-import name="DeniedCard" kind="danger" phone="{{ true }}" hint-size="100%,240px"></dc-import></div>
<article style="flex: none; color: #d4d4d8">共有キャッシュは消さず、作業ディレクトリの中に作り直しました。ブランチを push します。</article>
<div style="flex: none"><dc-import name="DeniedCard" kind="unjudged" wording="{{wording}}" state="{{state}}" phone="{{ true }}" hint-size="100%,260px"></dc-import></div>
<article style="flex: none; color: #d4d4d8">push は通らなかったので、手元で commit までにしてあります。</article>
</div>
<div style="flex: none; padding: 10px 14px 24px; border-top: 1px solid #2a2a2a; background: #141414"><div style="min-height: 44px; box-sizing: border-box; padding: 10px 12px; border: 1px solid #2a2a2a; font-size: 16px; color: #71717a">Reply to Claude…</div></div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"wording":{"editor":"enum","options":["now","a","b","c"],"default":"now"},"state":{"editor":"enum","options":["pending","dismissed","sent","open"],"default":"pending"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { wording: this.props.wording ?? 'now', state: this.props.state ?? 'pending' };
  }
}
</script>
</body>
</html>
