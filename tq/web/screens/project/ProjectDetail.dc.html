<button type="button" aria-label="Remove status filter" style="width: 16px; height: 16px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #71717a"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>

<div style="flex: 1; min-width: 128px; display: flex; align-items: center; padding: 0 4px">
<input id="project-task-filter" type="text" placeholder="Filter…" aria-label="Filter query" style="width: 100%; height: 32px; box-sizing: border-box; padding: 4px 4px; margin: 0 -4px; border: 0; border-bottom: 1px solid transparent; background: transparent; color: #fafafa; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 14px; outline: none">

<sc-for list="{{swatches}}" as="s" hint-placeholder-count="8">
<button type="button" role="radio" aria-checked="{{s.checked}}" aria-label="{{s.name}}" title="{{s.name}}" style="width: 20px; height: 20px; box-sizing: border-box; padding: 0; background: {{s.hex}}; {{s.ring}}"></button>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const presets = [
      ['Orange', '#FF8400'], ['Red', '#FF5C33'], ['Green', '#4CAF50'], ['Blue', '#4A90D9'],
      ['Purple', '#9B59B6'], ['Teal', '#26A69A'], ['Pink', '#E91E63'], ['Yellow', '#FFC107']
    ];
    const selected = 'Green';
    return {
      swatches: presets.map(([name, hex]) => ({
        name, hex,
        checked: name === selected ? 'true' : 'false',
        ring: name === selected ? 'border: 2px solid #fafafa; transform: scale(1.1)' : 'border: 2px solid transparent'
      }))
    };
  }
}
</script>
