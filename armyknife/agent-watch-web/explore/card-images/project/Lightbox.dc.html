<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Image preview over the page</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div role="dialog" aria-modal="true" aria-label="Image preview" style="position: relative; width: 100%; height: {{h}}; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: {{bg}}; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 14px; line-height: 1.55">

<sc-if value="{{isToday}}" hint-placeholder-val="{{ false }}">
<div style="flex: 1; min-height: 0; display: grid; place-items: center; padding: 24px">
<button type="button" aria-label="Close image preview" style="width: {{todayW}}; height: {{todayH}}; display: block; padding: 0; border: 0; background: transparent; cursor: zoom-out"><dc-import name="Shot" h="{{todayH}}" kind="settings" fs="{{todayFs}}" hint-size="100%,100%"></dc-import></button>
</div>
</sc-if>

<sc-if value="{{isDesk}}" hint-placeholder-val="{{ true }}">
<header style="flex: none; display: flex; align-items: center; gap: 16px; padding: 16px 24px">
<span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #d4d4d8">2 / 6</span>
<span style="min-width: 0; flex: 1; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><strong>音の一覧</strong> <span style="color: #a1a1aa; font-size: 13px">· sound-list.png</span></span>
<a href="#" target="_blank" rel="noopener noreferrer" style="display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border: 1px solid #3f3f46; color: #d4d4d8; font-size: 12px; text-decoration: none">Open original<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"></path><path d="M10 14 21 3"></path><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path></svg></a>
<button type="button" aria-label="Close image preview" title="Close (Esc)" style="width: 32px; height: 32px; display: grid; place-items: center; padding: 0; border: 1px solid #3f3f46; background: transparent; color: #fafafa"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
</header>
<div style="flex: 1; min-height: 0; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 24px; padding: 0 24px">
<button type="button" aria-label="Previous image" title="Previous (←)" style="width: 44px; height: 44px; display: grid; place-items: center; padding: 0; border: 1px solid #3f3f46; background: #141414; color: #fafafa"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
<div style="height: 100%; display: grid; place-items: center"><div style="width: 960px; height: 600px"><dc-import name="Shot" h="600px" kind="sounds" fs="20px" hint-size="100%,100%"></dc-import></div></div>
<button type="button" aria-label="Next image" title="Next (→)" style="width: 44px; height: 44px; display: grid; place-items: center; padding: 0; border: 1px solid #3f3f46; background: #141414; color: #fafafa"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
</div>
<footer style="flex: none; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 16px 24px 18px">
<div style="display: flex; gap: 8px">
<sc-for list="{{strip}}" as="t" hint-placeholder-count="6">
<button type="button" aria-label="{{t.aria}}" aria-current="{{t.cur}}" style="width: 64px; height: 40px; display: block; padding: 0; border: 0; outline: {{t.outline}}; outline-offset: 2px; background: transparent; opacity: {{t.op}}"><dc-import name="Shot" h="40px" kind="{{t.kind}}" fs="3px" hint-size="100%,100%"></dc-import></button>
</sc-for>
</div>
<span style="font-size: 12px; color: #a1a1aa">← → Move · Esc Close</span>
</footer>
</sc-if>

<sc-if value="{{isPhone}}" hint-placeholder-val="{{ false }}">
<header style="flex: none; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; padding: 6px 8px">
<button type="button" aria-label="Close image preview" style="width: 44px; height: 44px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #fafafa"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
<span style="text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: #d4d4d8">2 / 6</span>
<a href="#" target="_blank" rel="noopener noreferrer" aria-label="Open original in a new tab" style="width: 44px; height: 44px; display: grid; place-items: center; color: #fafafa"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"></path><path d="M10 14 21 3"></path><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path></svg></a>
</header>
<div style="position: relative; flex: 1; min-height: 0; display: grid; place-items: center; overflow: hidden">
<sc-if value="{{notZoomed}}" hint-placeholder-val="{{ true }}"><div style="width: 100%; height: 244px"><dc-import name="Shot" h="244px" kind="sounds" fs="9px" hint-size="100%,100%"></dc-import></div></sc-if>
<sc-if value="{{zoomed}}" hint-placeholder-val="{{ false }}"><div style="position: absolute; left: -150px; top: calc(50% - 300px); width: 960px; height: 600px"><dc-import name="Shot" h="600px" kind="sounds" fs="22px" hint-size="100%,100%"></dc-import></div><span style="position: absolute; top: 8px; left: 50%; transform: translateX(-50%); padding: 2px 8px; background: rgb(10 10 10 / 80%); font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #d4d4d8">250%</span></sc-if>
</div>
<footer style="flex: none; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 16px 28px">
<span style="max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><strong>音の一覧</strong> <span style="color: #a1a1aa; font-size: 13px">· sound-list.png</span></span>
<span aria-hidden="true" style="display: flex; gap: 6px"><sc-for list="{{dots}}" as="d" hint-placeholder-count="6"><span style="width: 7px; height: 7px; background: {{d}}"></span></sc-for></span>
<span style="font-size: 12.5px; color: #a1a1aa">{{phoneHint}}</span>
</footer>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"phone":{"editor":"boolean","default":false},"mode":{"editor":"enum","options":["today","gallery"],"default":"gallery"},"zoomed":{"editor":"boolean","default":false},"h":{"editor":null},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const phone = this.props.phone ?? false;
    // today: the one image, no controls; a click anywhere closes it. gallery: the card's images in order, open at the 2nd.
    const today = (this.props.mode ?? 'gallery') === 'today';
    // zoomed: pinched open on the phone; double-tap fits it back.
    const zoomed = this.props.zoomed ?? false;
    const kinds = ['settings', 'sounds', 'phone', 'log', 'silent', 'settings'];
    const names = ['notify-settings.png', 'sound-list.png', 'lock-screen.png', 'device-log.png', 'silent-mode.png', 'notify-settings-after.png'];
    return {
      h: this.props.h ?? (phone ? '844px' : '900px'),
      isToday: today, isDesk: !today && !phone, isPhone: !today && phone,
      bg: today ? 'rgb(0 0 0 / 85%)' : phone ? '#000000' : 'rgb(0 0 0 / 88%)',
      todayW: phone ? '342px' : '1024px', todayH: phone ? '214px' : '640px', todayFs: phone ? '8px' : '20px',
      strip: kinds.map((kind, i) => ({ kind, aria: 'Show ' + names[i], cur: i === 1 ? 'true' : 'false', outline: i === 1 ? '2px solid #fafafa' : 'none', op: i === 1 ? 1 : 0.6 })),
      dots: kinds.map((_, i) => i === 1 ? '#fafafa' : '#52525b'),
      zoomed, notZoomed: !zoomed,
      phoneHint: zoomed ? 'Double-tap to fit · drag to move' : 'Swipe to move · pinch to zoom · swipe down to close'
    };
  }
}
</script>
</body>
</html>
