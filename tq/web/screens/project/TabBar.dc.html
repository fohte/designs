<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Bottom tab bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; box-sizing: border-box; border-top: 1px solid #2a2a2a; background: #0a0a0a; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace">
<nav aria-label="Primary navigation">
<ul style="display: flex; margin: 0; padding: 0 4px 0 0; list-style: none">
<li style="flex: 1 0 0; min-width: 52px"><a href="#" aria-current="{{cur.browse}}" style="min-height: 52px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0 8px; text-decoration: none; font-size: 10px; line-height: 14px; letter-spacing: 0.05em; {{tab.browse}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h16"></path><path d="M4 6h16"></path><path d="M4 18h16"></path></svg><span>browse</span></a></li>
<li style="flex: 1 0 0; min-width: 52px"><a href="#" aria-current="{{cur.today}}" style="min-height: 52px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0 8px; text-decoration: none; font-size: 10px; line-height: 14px; letter-spacing: 0.05em; {{tab.today}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg><span>today</span></a></li>
<li style="flex: 1 0 0; min-width: 52px"><a href="#" aria-current="{{cur.calendar}}" style="min-height: 52px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0 8px; text-decoration: none; font-size: 10px; line-height: 14px; letter-spacing: 0.05em; {{tab.calendar}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M3 10h18"></path></svg><span>calendar</span></a></li>
<li style="flex: 1 0 0; min-width: 52px"><a href="#" aria-current="{{cur.tasks}}" style="min-height: 52px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0 8px; text-decoration: none; font-size: 10px; line-height: 14px; letter-spacing: 0.05em; {{tab.tasks}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 17 2 2 4-4"></path><path d="m3 7 2 2 4-4"></path><path d="M13 6h8"></path><path d="M13 12h8"></path><path d="M13 18h8"></path></svg><span>tasks</span></a></li>
<li style="flex: 1 0 0; min-width: 52px; position: relative"><span aria-hidden="true" style="position: absolute; left: 0; top: 12px; bottom: 12px; width: 1px; background: #2a2a2a"></span><button type="button" style="width: 100%; min-height: 52px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0 8px; border: 0; border-top: 2px solid transparent; background: transparent; color: #71717a; font-family: inherit; font-size: 10px; line-height: 14px; letter-spacing: 0.05em"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg><span>search</span></button></li>
<li style="flex: 1 0 0; min-width: 52px"><button type="button" style="width: 100%; min-height: 52px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0 8px; border: 0; border-top: 2px solid transparent; background: transparent; color: #71717a; font-family: inherit; font-size: 10px; line-height: 14px; letter-spacing: 0.05em"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg><span>new</span></button></li>
</ul>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"view":{"editor":"enum","options":["browse","today","calendar","tasks","none"],"default":"tasks"},"$preview":{"width":390,"height":53}}'>
class Component extends DCLogic {
  renderVals() {
    const view = this.props.view ?? 'tasks';
    const tab = {}, cur = {};
    for (const k of ['browse', 'today', 'calendar', 'tasks']) {
      const on = view === k;
      tab[k] = on ? 'border-top: 2px solid #ef4444; color: #fafafa' : 'border-top: 2px solid transparent; color: #52525b';
      cur[k] = on ? 'page' : 'false';
    }
    return { tab, cur };
  }
}
</script>
</body>
</html>
