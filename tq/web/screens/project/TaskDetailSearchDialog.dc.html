<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Task search dialog</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #0a0a0a; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif">
<dc-import name="TaskDetail" height="{{h}}" scroll="{{scroll}}" open="{{sidebarOpen}}" hint-size="1440px,900px"></dc-import>
<div style="position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px)">
<div role="dialog" aria-modal="true" aria-labelledby="task-search-title" style="position: relative; width: 384px; box-sizing: border-box; display: grid; gap: 16px; padding: 16px; background: #0a0a0a; box-shadow: 0 0 0 1px rgba(250,250,250,0.1); color: #fafafa; font-size: 14px; line-height: 20px">
<h2 id="task-search-title" style="margin: 0; font-size: 16px; line-height: 1; font-weight: 500">{{title}}</h2>
<input type="text" aria-label="{{title}}" value="{{query}}" placeholder="{{placeholder}}" style="width: 100%; height: 32px; box-sizing: border-box; padding: 4px 10px; border: 1px solid #ef4444; box-shadow: 0 0 0 3px rgba(239,68,68,0.2); background: rgba(255,255,255,0.02); color: #fafafa; font-family: inherit; font-size: 14px; outline: none">

<div style="max-height: 288px; overflow-y: auto">
<sc-if value="{{showEmpty}}" hint-placeholder-val="{{ false }}">
<div style="padding: 32px 16px; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 12px; line-height: 16px; color: #52525b">{{emptyText}}</div>
</sc-if>
<sc-if value="{{showNoResults}}" hint-placeholder-val="{{ false }}">
<div style="padding: 32px 16px; text-align: center; font-family: 'JetBrains Mono', monospace; font-size: 12px; line-height: 16px; color: #52525b">no results for "{{query}}"</div>
</sc-if>
<sc-if value="{{showResults}}" hint-placeholder-val="{{ true }}">
<div role="listbox" aria-label="Tasks">
<div role="option" aria-selected="false" style="min-height: 36px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: #1f1f1f"><span style="flex: none; color: #52525b">#120</span><span style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">認証ライブラリを更新する</span></div>
<div role="option" aria-selected="false" style="min-height: 36px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 12px"><span style="flex: none; color: #52525b">#96</span><span style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">認証まわりのログを整理する</span><span style="margin-left: auto; flex: none; font-size: 12px; color: #52525b">← #90</span></div>
<div role="option" aria-selected="false" style="min-height: 36px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 12px"><span style="flex: none; color: #52525b">#77</span><span style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">認証画面のアクセシビリティ改善</span></div>
<sc-if value="{{showWait}}" hint-placeholder-val="{{ true }}">
<div role="option" aria-selected="false" style="min-height: 36px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 12px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#71717a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M5 22h14"></path><path d="M5 2h14"></path><path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22"></path><path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2"></path></svg><span style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">Wait for “{{query}}”</span></div>
</sc-if>
</div>
</sc-if>
<sc-if value="{{showGithub}}" hint-placeholder-val="{{ false }}">
<div style="padding: 4px 0; border-top: 1px solid #2a2a2a; border-bottom: 1px solid #2a2a2a">
<div style="padding: 4px 12px; font-family: 'JetBrains Mono', monospace; font-size: 10px; line-height: 14px; color: #52525b">GitHub</div>
<div role="option" aria-selected="false" style="min-height: 36px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 4px 12px; background: #1f1f1f">
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<span style="min-width: 0; display: flex; align-items: center; gap: 8px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#c3e88d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><circle cx="18" cy="18" r="3"></circle><circle cx="6" cy="6" r="3"></circle><path d="M13 6h3a2 2 0 0 1 2 2v7"></path><line x1="6" x2="6" y1="9" y2="21"></line></svg><span style="flex: none; color: #71717a">example-org/api#77</span><span style="min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">セッション API に redirect パラメータを追加</span></span>
<span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; line-height: 14px; color: #52525b">pull request · open</span>
</span>
</div>
</div>
</sc-if>
</div>

<sc-if value="{{showSkip}}" hint-placeholder-val="{{ false }}">
<div style="border-top: 1px solid #2a2a2a">
<button type="button" style="width: 100%; min-height: 36px; padding: 0 12px; border: 0; background: transparent; color: #71717a; font-family: inherit; font-size: 14px; text-align: center">Close without linking</button>
</div>
</sc-if>

<button type="button" aria-label="Close" style="position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #fafafa"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["blocker","github","link","no-results","duplicate"],"default":"blocker"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const v = this.props.variant ?? 'blocker';
    const github = v === 'blocker' || v === 'github';
    const titles = { blocker: 'Add blocker', github: 'Add blocker', link: 'Link existing task', 'no-results': 'Link existing task', duplicate: 'Duplicate of' };
    const queries = { blocker: '認証', github: 'https://github.com/example-org/api/pull/77', link: '認証', 'no-results': 'xyz', duplicate: '' };
    return {
      h: 900,
      // Add blocker opens from the dependencies section; the others from the subtasks panel or the status menu.
      scroll: github ? 2076 : v === 'duplicate' ? 0 : 1500,
      sidebarOpen: '',
      title: titles[v],
      query: queries[v],
      placeholder: github ? 'Search tasks or paste a GitHub issue/PR URL...' : 'Search tasks...',
      showEmpty: v === 'duplicate',
      emptyText: github ? 'Search tasks or paste a GitHub issue/PR URL' : 'Type to search tasks',
      showNoResults: v === 'no-results',
      showResults: v === 'blocker' || v === 'link',
      showWait: v === 'blocker',
      showGithub: v === 'github',
      showSkip: v === 'duplicate',
    };
  }
}
</script>
</body>
</html>
