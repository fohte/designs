<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Compact Day view during a meeting</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 320px; height: 900px; overflow: hidden">
<dc-import name="Compact" electron="true" connected="true" now="meeting" next-warning="false" hint-size="320px,900px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":320,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
