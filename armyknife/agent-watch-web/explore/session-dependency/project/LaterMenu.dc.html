<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Later choices</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; box-sizing: border-box; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; line-height: 1.55">

<sc-if value="{{isMenu}}" hint-placeholder-val="{{ true }}">
<div role="menu" aria-label="Later: {{s.title}}" style="width: 100%; box-sizing: border-box; padding: 6px 0; background: #1f1f1f; border: 1px solid #3f3f46; box-shadow: 0 12px 36px rgb(0 0 0 / 30%); font-size: 13px">
<div style="padding: 6px 12px 8px; font-size: 12px; color: #a1a1aa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Later: {{s.title}}</div>
<sc-for list="{{options}}" as="o" hint-placeholder-count="5">
<button type="button" role="menuitem" style="width: 100%; height: 32px; box-sizing: border-box; display: grid; grid-template-columns: 1fr auto 14px; align-items: center; gap: 10px; padding: 0 12px; border: 0; background: {{o.bg}}; color: #fafafa; font-family: inherit; font-size: 13px; text-align: left"><span>{{o.label}}</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #a1a1aa">{{o.when}}</span><kbd style="font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #a1a1aa">{{o.key}}</kbd></button>
</sc-for>
<sc-if value="{{until}}" hint-placeholder-val="{{ false }}">
<div style="margin: 6px 0; height: 1px; background: #2a2a2a"></div>
<button type="button" role="menuitem" aria-haspopup="dialog" style="width: 100%; min-height: 44px; box-sizing: border-box; display: grid; grid-template-columns: 1fr 14px; align-items: center; gap: 10px; padding: 4px 12px; border: 0; background: {{untilBg}}; color: #fafafa; font-family: inherit; font-size: 13px; text-align: left"><span style="display: flex; flex-direction: column"><span>Until something else is done…</span><span style="font-size: 11.5px; color: #a1a1aa">Blockers of its tq task: tasks, issues or PRs</span></span><kbd style="font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #a1a1aa">6</kbd></button>
</sc-if>
<div style="margin: 6px 0; height: 1px; background: #2a2a2a"></div>
<p style="margin: 0; padding: 2px 12px 4px; font-size: 11.5px; color: #8b8b94">New activity in the session also brings it back.</p>
</div>
</sc-if>

<sc-if value="{{isSheet}}" hint-placeholder-val="{{ false }}">
<section role="dialog" aria-modal="true" aria-label="Later" style="width: 100%; box-sizing: border-box; display: flex; flex-direction: column; padding: 16px 0 max(30px, env(safe-area-inset-bottom)); border-top: 1px solid #3f3f46; background: #1f1f1f; box-shadow: 0 -12px 36px rgb(0 0 0 / 30%); font-size: 14px">
<h2 style="margin: 0; padding: 0 16px; font-size: 15px; font-weight: 700">Later</h2>
<div style="display: flex; align-items: center; gap: 8px; min-width: 0; padding: 4px 16px 10px; font-size: 13px"><span aria-hidden="true" style="flex: none; width: 7px; height: 7px; border-radius: {{s.radius}}; background: {{s.dot}}"></span><span style="flex: none; color: {{s.color}}">{{s.state}}</span><span style="min-width: 0; color: #d4d4d8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.title}}</span></div>
<div role="menu" aria-label="Bring it back" style="display: flex; flex-direction: column; border-top: 1px solid #2a2a2a">
<sc-for list="{{options}}" as="o" hint-placeholder-count="5">
<button type="button" role="menuitem" style="min-height: 48px; display: flex; align-items: center; gap: 10px; padding: 0 16px; border: 0; border-bottom: 1px solid #2a2a2a; background: transparent; color: #fafafa; font-family: inherit; font-size: 15px; text-align: left"><span style="flex: 1">{{o.label}}</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: #a1a1aa">{{o.when}}</span></button>
</sc-for>
<sc-if value="{{until}}" hint-placeholder-val="{{ false }}">
<button type="button" role="menuitem" aria-haspopup="dialog" style="min-height: 60px; display: flex; align-items: center; gap: 10px; padding: 6px 16px; border: 0; border-bottom: 1px solid #2a2a2a; background: {{untilBg}}; color: #fafafa; font-family: inherit; font-size: 15px; text-align: left"><span style="flex: 1; display: flex; flex-direction: column"><span>Until something else is done…</span><span style="font-size: 12.5px; color: #a1a1aa">Blockers of its tq task: tasks, issues or PRs</span></span><span aria-hidden="true" style="color: #71717a">›</span></button>
</sc-if>
</div>
<p style="margin: 0; padding: 10px 16px 0; font-size: 12.5px; color: #8b8b94">New activity in the session also brings it back.</p>
<div style="padding: 12px 16px 0"><button type="button" style="width: 100%; min-height: 44px; border: 1px solid #3f3f46; background: transparent; color: #fafafa; font-family: inherit; font-size: 13px">Cancel</button></div>
</section>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"form":{"editor":"enum","options":["menu","sheet"],"default":"menu"},"until":{"editor":"boolean","default":false},"pressed":{"editor":"boolean","default":false},"session":{"editor":null},"$preview":{"width":300,"height":300}}'>
class Component extends DCLogic {
  renderVals() {
    const form = this.props.form ?? 'menu';
    const s = this.props.session ?? { state: 'Question', dot: '#fbbf24', round: false, color: '#fbbf24', title: '通知の再送処理を見直す' };
    // pressed: the pointer or the keyboard is on "Until something else is done…"; otherwise the first time is.
    const pressed = this.props.pressed ?? false;
    return {
      isMenu: form === 'menu', isSheet: form === 'sheet',
      until: this.props.until ?? false,
      untilBg: pressed ? (form === 'menu' ? '#2a2a2e' : '#262626') : 'transparent',
      s: { ...s, radius: s.round ? '50%' : '0' },
      options: [
        ['In 1 hour', '16:00', '1'],
        ['This evening', '19:00', '2'],
        ['Tomorrow', 'Mon 9:00', '3'],
        ['Next week', 'Mon 11/16', '4'],
        ['Until it changes', 'next activity', '5']
      ].map(([label, when, key], i) => ({ label, when, key, bg: form === 'menu' && i === 0 && !pressed ? '#2a2a2e' : 'transparent' }))
    };
  }
}
</script>
</body>
</html>
