<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Task row with queue extras</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="display: block; width: 100%; box-sizing: border-box; padding: 8px 12px; border-bottom: 1px solid #2a2a2a; border-left: 2px solid transparent; background: {{bg}}; opacity: {{opacity}}; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif">
<div style="display: flex; align-items: center; gap: 8px">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: baseline; gap: 8px">
<sc-if value="{{completed}}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#c792ea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Completed" role="img" style="flex: none; align-self: center"><path d="M20 6 9 17l-5-5"></path></svg></sc-if>
<span style="flex: none; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px; color: #52525b">{{num}}</span>
<a href="#" style="min-width: 64px; font-size: 14px; line-height: 20px; color: {{titleColor}}; text-decoration: {{titleDecoration}}">{{title}}</a>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; column-gap: 8px; row-gap: 4px; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px; color: #71717a">
<sc-for list="{{meta}}" as="m" hint-placeholder-count="2">
<sc-if value="{{m.sep}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="color: #52525b">·</span></sc-if>
<span style="display: inline-flex; align-items: center; gap: 4px; color: {{m.color}}; font-weight: {{m.weight}}"><sc-if value="{{m.range}}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M16 2v4"></path><path d="M3 10h18"></path><path d="M8 2v4"></path><path d="M17 14h-6"></path><path d="M13 18H7"></path><path d="M7 14h.01"></path><path d="M17 18h.01"></path></svg></sc-if>{{m.text}}</span>
</sc-for>
</div>
</div>
<sc-if value="{{add}}" hint-placeholder-val="{{ false }}">
<button type="button" aria-label="Add to today's queue" style="flex: none; width: 24px; height: 24px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #71717a"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></button>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"num":{"editor":null},"title":{"editor":null},"status":{"editor":null},"labels":{"editor":null},"project":{"editor":null},"context":{"editor":null},"due":{"editor":null},"overdue":{"editor":null},"lead":{"editor":null},"leadTone":{"editor":null},"extra":{"editor":null},"extraTone":{"editor":null},"current":{"editor":null},"add":{"editor":null},"$preview":{"width":384,"height":57}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const completed = (p.status ?? 'todo') === 'completed';
    const tone = (t) => (t === 'red' ? '#ef4444' : '#71717a');
    // Queue extras: a status text leads the metadata line (Now panel), the rest trail it (time ranges, reason badges).
    const items = [];
    if (p.lead) items.push({ text: p.lead, color: tone(p.leadTone), weight: p.leadTone === 'red' ? 500 : 400 });
    const labels = p.labels ?? '';
    if (labels) items.push({ text: labels, color: '#71717a', weight: 400 });
    if (p.project) items.push({ text: p.project, color: '#71717a', weight: 400 });
    items.push({ text: p.context ?? 'personal', color: '#71717a', weight: 400 });
    if (p.due) items.push({ text: p.due, color: p.overdue === 'true' ? '#ef4444' : '#71717a', weight: 400, range: true });
    const extra = p.extra ?? 'due today';
    if (extra) items.push({ text: extra, color: tone(p.extraTone), weight: 400 });
    return {
      num: p.num ?? '#231',
      title: p.title ?? 'カレンダー表示を 3 日ビューに対応させる',
      completed,
      opacity: completed ? 0.55 : 1,
      titleColor: completed ? '#71717a' : '#fafafa',
      titleDecoration: completed ? 'line-through' : 'none',
      bg: p.current === 'true' ? '#1f1f1f' : 'transparent',
      add: p.add === 'true',
      meta: items.map((m, i) => ({ range: false, ...m, sep: i > 0 })),
    };
  }
}
</script>
</body>
</html>
