<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Activity button</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="display: flex; width: {{rootW}}; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; line-height: 1.55">
<sc-if value="{{isDesktop}}" hint-placeholder-val="{{ true }}">
<button type="button" aria-haspopup="dialog" aria-expanded="{{openStr}}" aria-label="Activity, {{aria}}" style="flex: 1; height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 8px; border: 1px solid {{border}}; background: {{bg}}; color: #d4d4d8; font-family: inherit; font-size: 13px; text-align: left"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"></path></svg><span style="flex: 1">Activity</span><span style="display: inline-flex; align-items: center; gap: 5px; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: {{color}}"><sc-if value="{{running}}" hint-placeholder-val="{{ false }}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg></sc-if>{{count}}</span></button>
</sc-if>
<sc-if value="{{isPhone}}" hint-placeholder-val="{{ false }}">
<button type="button" aria-haspopup="dialog" aria-expanded="{{openStr}}" aria-label="Activity, {{aria}}" style="position: relative; width: 44px; height: 44px; display: grid; place-items: center; padding: 0; border: 1px solid {{phoneBorder}}; background: {{bg}}; color: #d4d4d8"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"></path></svg><span aria-hidden="true" style="position: absolute; right: 3px; bottom: 2px; font-family: 'JetBrains Mono', monospace; font-size: 10px; line-height: 1; color: {{color}}">{{count}}</span></button>
</sc-if>
<sc-if value="{{isBare}}" hint-placeholder-val="{{ false }}">
<button type="button" aria-haspopup="dialog" aria-expanded="{{openStr}}" aria-label="Activity, {{aria}}" style="height: 36px; display: inline-flex; align-items: center; gap: 4px; padding: 0 6px; border: 0; background: {{bg}}; color: #d4d4d8; font-family: 'JetBrains Mono', monospace; font-size: 11px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"></path></svg><span style="color: {{color}}">{{count}}</span></button>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"activity":{"editor":null},"form":{"editor":"enum","options":["desktop","phone","phoneBare"],"default":"desktop"},"open":{"editor":"boolean","default":false},"$preview":{"width":224,"height":44}}'>
class Component extends DCLogic {
  renderVals() {
    // activity: { count, tone: 'running' | 'failure' | 'idle' }. desktop: the nav entry. phone: a header button beside other bordered 44px buttons. phoneBare: the borderless phone Inbox header.
    const a = this.props.activity ?? { count: '2', tone: 'running' };
    const form = this.props.form ?? 'desktop';
    const open = this.props.open ?? false;
    return {
      isDesktop: form === 'desktop', isPhone: form === 'phone', isBare: form === 'phoneBare',
      rootW: form === 'desktop' ? '100%' : 'auto',
      count: a.count ?? '', running: a.tone === 'running',
      color: { running: '#60a5fa', failure: '#f87171' }[a.tone] ?? '#8b8b94',
      aria: a.count ? a.count + ' ' + (a.tone === 'failure' ? 'failed' : 'running') : 'no new results',
      openStr: open ? 'true' : 'false',
      border: open ? '#a1a1aa' : '#2a2a2a', phoneBorder: open ? '#a1a1aa' : '#3f3f46',
      bg: open ? '#262626' : 'transparent'
    };
  }
}
</script>
</body>
</html>
