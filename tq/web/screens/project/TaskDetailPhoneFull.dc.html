<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Task detail on a phone, whole page</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 4900px; overflow: hidden; background: #0a0a0a">
<dc-import name="TaskDetailPhone" height="{{h}}" hint-size="390px,4900px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":4900}}'>
class Component extends DCLogic {
  renderVals() {
    return { h: 4900 };
  }
}
</script>
</body>
</html>
