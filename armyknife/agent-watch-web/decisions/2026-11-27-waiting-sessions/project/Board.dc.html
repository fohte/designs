<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Board</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; overflow: hidden; background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 13px; line-height: 1.55">
<div style="flex: none; width: 240px"><dc-import name="Nav" view="board" wait="{{navWait}}" mark="{{mark}}" inbox-count="{{ 4 }}" hint-size="240px,900px"></dc-import></div>
<main style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<header style="flex: none; height: 48px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; padding: 0 20px; border-bottom: 1px solid #2a2a2a">
<h1 style="margin: 0; font-size: 15px; font-weight: 700">Board</h1>
<span style="font-size: 12px; color: #8b8b94">Projects that need you come first</span>
<label style="margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #a1a1aa"><span role="checkbox" aria-checked="true" style="width: 12px; height: 12px; display: grid; place-items: center; border: 1px solid #fafafa; background: #fafafa; color: #0a0a0a; font-size: 10px; line-height: 1">✓</span>Hide quiet projects (2)</label>
</header>
<div style="flex: 1; min-height: 0; display: flex; align-items: flex-start; gap: 12px; padding: 16px 20px; overflow: hidden">
<sc-for list="{{columns}}" as="col" hint-placeholder-count="3">
<section style="flex: none; width: 280px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; padding: 12px; background: #111111">
<header>
<h2 style="margin: 0; font-size: 15px; font-weight: 700">{{col.name}}</h2>
<div style="font-size: 12px; font-weight: {{col.needWeight}}; color: {{col.needColor}}">{{col.need}}</div>
<div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8b8b94">{{col.repos}}</div>
</header>
<sc-if value="{{col.hasNeeds}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 6px">
<h3 style="margin: 0; font-size: 11.5px; font-weight: 700; color: #fbbf24">Needs action</h3>
<sc-for list="{{col.needs}}" as="c" hint-placeholder-count="2">
<div style="margin: 0 -12px"><dc-import name="SessionRow" s="{{ c }}" density="compact" hint-size="100%,69px"></dc-import></div>
</sc-for>
</div>
</sc-if>
<sc-if value="{{col.hasWaits}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; flex-direction: column; gap: 6px">
<h3 style="margin: 0; font-size: 11.5px; font-weight: 700; color: #a1a1aa">Waiting</h3>
<sc-for list="{{col.waits}}" as="c" hint-placeholder-count="1">
<div style="margin: 0 -12px"><dc-import name="SessionRow" s="{{ c }}" density="compact" hint-size="100%,90px"></dc-import></div>
</sc-for>
</div>
</sc-if>
<sc-if value="{{col.hasWorking}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 6px">
<h3 style="margin: 0; font-size: 11.5px; font-weight: 700; color: #60a5fa">In progress</h3>
<sc-for list="{{col.working}}" as="c" hint-placeholder-count="2">
<div style="margin: 0 -12px"><dc-import name="SessionRow" s="{{ c }}" density="compact" hint-size="100%,69px"></dc-import></div>
</sc-for>
<sc-if value="{{col.hasMore}}" hint-placeholder-val="{{ false }}"><button type="button" style="align-self: flex-start; padding: 0; border: 0; background: transparent; color: #a1a1aa; font-family: inherit; font-size: 12px">{{col.more}}</button></sc-if>
</div>
</sc-if>
<sc-if value="{{col.hasDone}}" hint-placeholder-val="{{ true }}">
<div style="font-size: 12px; color: #8b8b94"><span style="color: #a1a1aa">✓ Done</span> · {{col.done}}</div>
</sc-if>
</section>
</sc-for>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"wait":{"editor":"enum","options":["none","today","section","inline"],"default":"none"},"mark":{"editor":"enum","options":["square","hourglass"],"default":"square"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    // wait: how sessions that stopped with `a agent status set wait` show. 'none': the screens canvas as it is.
    // 'today': in In progress as Working. 'section': a Waiting group of their own. 'inline': in In progress with the wait mark and note.
    const wait = this.props.wait ?? 'none';
    const mark = this.props.mark ?? 'square';
    if (wait !== 'none') return { columns: this.waitColumns(wait, mark), navWait: wait === "today" ? "today" : "mark", mark };
    const col = (name, repos, needs, working, more, done) => ({
      name, repos, needs, working, more, done, waits: [], hasWaits: false,
      need: needs.length ? needs.length + ' need action' : 'Nothing needed',
      needColor: needs.length ? '#fbbf24' : '#8b8b94',
      needWeight: needs.length ? 700 : 400,
      hasNeeds: needs.length > 0,
      hasWorking: working.length > 0,
      hasMore: more !== '',
      hasDone: done !== ''
    });
    const n = (status, age, title, role, engine, taskRef, taskTitle, repo) => ({ status, unread: true, age, title, role, engine, taskRef, taskTitle, repo });
    const w = (age, title, role, engine, taskRef, taskTitle, repo) => ({ status: 'Working', age, title, role, engine, taskRef, taskTitle, repo });
    return { navWait: "today", mark,
      columns: [
        col('service', 'example/service', [
          n('Question', '8s', '通知の再送処理を見直す', 'development', 'claude', 'P1 #2048', '通知の信頼性を上げる', 'example/service'),
          n('Error', '4m', '統合テストの失敗を直す', 'debug-flow', 'claude', 'P1 #2052', 'テストを安定させる', 'example/service'),
          n('Approve', '6m', 'ステージングの設定を書き換える', 'development', 'codex', 'P2 #2053', '新しい設定を段階的に公開する', 'example/service')
        ], [w('30s', '再送の記録を残す', 'development', 'codex', 'P1 #2048', '通知の信頼性を上げる', 'example/service')], '', '送信キューを分ける and 2 more'),
        col('web-app', 'example/web-app', [
          n('Review', '2m', '配信チェックの PR を確認する', '', 'codex', 'P2 #2050', '配信チェックを入れる', 'example/web-app'),
          { ...n('Plan', '5m', '段階的な公開の計画を立てる', 'PM', 'claude', 'P2 #2054', '新しい設定を段階的に公開する', 'example/web-app'), unread: false }
        ], [w('1m', '設定画面の文言を直す', 'design', 'claude', 'P3 #2056', '設定画面を作り直す', 'example/web-app')], '', 'ログイン画面を直す'),
        col('observability', 'example/observability', [
          n('Proposal', '12m', 'アラートの送り先を決める', 'designer', 'claude', 'P2 #2051', '監視を整える', 'example/observability')
        ], [
          w('18s', '配信メトリクスを追加する', 'development', 'codex', 'P3 #2055', '監視を整える', 'example/observability'),
          w('2m', '配信ログの保存期間を決める', 'research', 'codex', 'P2 #2051', '監視を整える', 'example/observability'),
          w('5m', 'ダッシュボードの遅延を調べる', 'debug-flow', 'codex', 'P3 #2057', '監視を整える', 'example/observability')
        ], '1 more', ''),
        col('handbook', 'example/handbook', [], [], '', 'セットアップ手順を更新する')
      ]
    };
  }
  waitColumns(wait, mark) {
    const n = (status, age, title, role, engine, taskRef, taskTitle, repo) => ({ status, unread: true, age, title, role, engine, taskRef, taskTitle, repo });
    const w = (age, title, role, engine, taskRef, taskTitle, repo) => ({ status: 'Working', age, title, role, engine, taskRef, taskTitle, repo });
    // A waiting session; its note shows on the compact row once it is marked.
    const z = (note, age, title, role, engine, taskRef, taskTitle, repo) => wait === 'today'
      ? w(age, title, role, engine, taskRef, taskTitle, repo)
      : { status: 'Waiting', mark, isWait: true, preview: note, notePreview: true, age, title, role, engine, taskRef, taskTitle, repo };
    const col = (name, repos, needs, inProg, more, done) => {
      const waits = wait === 'section' ? inProg.filter((c) => c.isWait) : [];
      const working = wait === 'section' ? inProg.filter((c) => !c.isWait) : inProg;
      return {
        name, repos, needs, waits, working, more, done,
        need: needs.length ? needs.length + ' need action' : 'Nothing needed',
        needColor: needs.length ? '#fbbf24' : '#8b8b94',
        needWeight: needs.length ? 700 : 400,
        hasNeeds: needs.length > 0, hasWaits: waits.length > 0, hasWorking: working.length > 0,
        hasMore: more !== '', hasDone: done !== ''
      };
    };
    return [
      col('service', 'example/service', [
        n('Question', '8s', '通知の再送処理を見直す', 'development', 'claude', 'P1 #2048', '通知の信頼性を上げる', 'example/service'),
        n('Error', '4m', '統合テストの失敗を直す', 'debug-flow', 'claude', 'P1 #2052', 'テストを安定させる', 'example/service')
      ], [
        z('子セッション 2 件の PR のマージ待ち', '14m', '通知まわりの改修', 'PM', 'claude', 'P1 #2048', '通知の信頼性を上げる', 'example/service'),
        w('30s', '再送の記録を残す', 'development', 'codex', 'P2 #2053', '通知の信頼性を上げる', 'example/service')
      ], '', '送信キューを分ける and 2 more'),
      col('web-app', 'example/web-app', [
        n('Review', '2m', '配信チェックの PR を確認する', '', 'codex', 'P2 #2050', '配信チェックを入れる', 'example/web-app')
      ], [
        z('PR #2061 のマージ待ち', '6m', '配信チェックを本番に出す', 'development', 'claude', 'P1 #2050', '配信チェックを入れる', 'example/web-app'),
        w('1m', '設定画面の文言を直す', 'design', 'claude', 'P3 #2056', '設定画面を作り直す', 'example/web-app')
      ], '', 'ログイン画面を直す'),
      col('observability', 'example/observability', [
        n('Proposal', '12m', 'アラートの送り先を決める', 'designer', 'claude', 'P2 #2051', '監視を整える', 'example/observability')
      ], [
        z('CI の結果を待っています', '3m', '監視の設定を入れ替える', 'development', 'claude', 'P3 #2055', '監視を整える', 'example/observability'),
        w('18s', '配信メトリクスを追加する', 'development', 'codex', 'P3 #2055', '監視を整える', 'example/observability'),
        w('2m', '配信ログの保存期間を決める', 'research', 'codex', 'P2 #2051', '監視を整える', 'example/observability')
      ], '1 more', ''),
      col('handbook', 'example/handbook', [], [], '', 'セットアップ手順を更新する')
    ];
  }
}
</script>
</body>
</html>
