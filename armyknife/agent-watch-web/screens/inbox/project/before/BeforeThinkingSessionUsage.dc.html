<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Session usage</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div role="group" aria-label="Session usage" style="width: 100%; box-sizing: border-box; display: flex; align-items: center; gap: 8px; row-gap: 2px; flex-wrap: wrap; font-family: 'JetBrains Mono', monospace; font-size: {{size}}; line-height: 1.55; color: #8b8b94; white-space: nowrap">
<span title="{{engineTitle}}" style="color: #d4d4d8">{{engine}}</span><span style="color: #d4d4d8">{{model}}</span><span>({{effort}})</span>
<span aria-hidden="true" style="color: #3f3f46">|</span>
<span role="meter" aria-label="Context used" aria-valuenow="{{ctx}}" aria-valuemin="0" aria-valuemax="100" style="position: relative; display: inline-block; flex: none; width: 48px; height: 4px; background: #262626"><span style="position: absolute; inset: 0 auto 0 0; width: {{ctx}}%; background: #d4d4d8"></span></span><span>{{tokens}} ({{ctx}}%)</span>
<span aria-hidden="true" style="color: #3f3f46">|</span>
<span>5h <span style="color: {{h5.color}}">{{h5.used}}%</span> <span title="{{h5.paceTitle}}" style="color: {{h5.markColor}}">{{h5.mark}}</span></span>
<span>7d <span style="color: {{d7.color}}">{{d7.used}}%</span> <span title="{{d7.paceTitle}}" style="color: {{d7.markColor}}">{{d7.mark}}</span></span>
<span aria-hidden="true" style="color: #3f3f46">|</span>
<span>{{version}}</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"engine":{"editor":"enum","options":["claude","codex"],"default":"claude"},"phone":{"editor":"boolean","default":false},"$preview":{"width":672,"height":40}}'>
class Component extends DCLogic {
  renderVals() {
    const q = (used, pace) => {
      const ahead = used > pace;
      return {
        used,
        color: used >= 95 ? '#f87171' : used >= 80 ? '#fbbf24' : '#d4d4d8',
        mark: ahead ? '▲' : '✓',
        markColor: ahead ? '#fbbf24' : '#71717a',
        paceTitle: `${ahead ? 'Ahead of pace' : 'On pace'}: ${pace}% expected by now`
      };
    };
    const phone = this.props.phone ?? false;
    const s = (this.props.engine ?? 'claude') === 'codex'
      ? { engine: 'codex', engineTitle: 'Codex', model: 'gpt-5-codex', effort: 'high', ctx: 19, tokens: '51.2k', h5: q(88, 64), d7: q(35, 40), version: 'v0.60.0' }
      : { engine: 'claude', engineTitle: 'Claude Code', model: 'Sonnet 5.5', effort: 'medium', ctx: 42, tokens: '84.3k', h5: q(41, 52), d7: q(76, 83), version: 'v2.4.0' };
    return { ...s, size: phone ? '11px' : '11.5px' };
  }
}
</script>
</body>
</html>
