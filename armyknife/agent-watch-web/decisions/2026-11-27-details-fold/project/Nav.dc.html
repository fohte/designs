<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Navigation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Main navigation" style="width: 240px; height: {{h}}; box-sizing: border-box; display: flex; flex-direction: column; padding: 0 8px; overflow: hidden; background: #0f0f0f; border-right: 1px solid #2a2a2a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 13px; line-height: 1.55">

<div style="height: 48px; flex: none; display: flex; align-items: center; padding: 0 8px; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700"><span style="margin-right: 7px; color: #ef4444">&gt;</span><span>agent watch</span><button type="button" aria-label="New session" title="New session" style="margin-left: auto; width: 28px; height: 28px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #d4d4d8"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></button><button type="button" aria-label="Jump to with Command K" style="height: 28px; display: inline-flex; align-items: center; gap: 5px; padding: 0 6px; border: 0; background: transparent; color: #8b8b94; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; font-weight: 400"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 21-4.34-4.34"></path><circle cx="11" cy="11" r="8"></circle></svg>⌘K</button><button type="button" aria-label="{{inboxToggleLabel}}" title="{{inboxToggleLabel}}" style="width: 28px; height: 28px; margin-right: -6px; display: grid; place-items: center; border: 0; background: transparent; color: #a1a1aa"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M9 3v18"></path><path d="{{inboxToggleArrow}}"></path></svg></button></div>

<div role="group" aria-label="Views" style="flex: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); height: 28px; box-sizing: border-box; margin: 0 4px 12px; padding: 2px; background: #1a1a1a">
<button type="button" aria-pressed="{{inboxOn}}" style="border: 0; padding: 0 8px; font-family: inherit; font-size: 12.5px; {{inboxStyle}}">Inbox <span style="font-family: 'JetBrains Mono', monospace; color: #fbbf24">{{inboxCount}}</span></button>
<button type="button" aria-pressed="{{boardOn}}" style="border: 0; padding: 0 8px; font-family: inherit; font-size: 12.5px; {{boardStyle}}">Board</button>
</div>

<div style="flex: 1; min-height: 0; overflow-y: auto">
<section style="margin-top: 0">
<h2 style="height: 26px; display: flex; align-items: center; margin: 0; padding: 0 8px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; color: #8b8b94">VIEWS</h2>
<button type="button" style="width: 100%; height: 28px; display: grid; grid-template-columns: 12px 1fr auto; align-items: center; gap: 8px; padding: 0 8px; border: 0; background: transparent; color: #d4d4d8; font-family: inherit; font-size: 13px; text-align: left"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 20a1 1 0 0 0 .553.895l2 1A1 1 0 0 0 14 21v-7a2 2 0 0 1 .517-1.341L21.74 4.67A1 1 0 0 0 21 3H3a1 1 0 0 0-.742 1.67l7.225 7.989A2 2 0 0 1 10 14z"></path></svg><span>web-app のレビュー</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #fbbf24">3</span></button>
<button type="button" style="width: 100%; height: 28px; display: grid; grid-template-columns: 12px 1fr auto; align-items: center; gap: 8px; padding: 0 8px; border: 0; background: transparent; color: #d4d4d8; font-family: inherit; font-size: 13px; text-align: left"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 20a1 1 0 0 0 .553.895l2 1A1 1 0 0 0 14 21v-7a2 2 0 0 1 .517-1.341L21.74 4.67A1 1 0 0 0 21 3H3a1 1 0 0 0-.742 1.67l7.225 7.989A2 2 0 0 1 10 14z"></path></svg><span>Errors</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #f87171">1</span></button>
</section>

<section style="margin-top: 12px">
<h2 style="height: 26px; display: flex; align-items: center; margin: 0; padding: 0 8px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; color: #8b8b94">Starred</h2>
<sc-for list="{{starred}}" as="s" hint-placeholder-count="2">
<div style="margin: 0 -8px"><dc-import name="SessionRow" s="{{ s }}" density="compact" hint-size="100%,69px"></dc-import></div>
</sc-for>
</section>

<section style="margin-top: 12px">
<h2 style="height: 26px; display: flex; align-items: center; margin: 0; padding: 0 8px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; color: #8b8b94">Recent</h2>
<sc-for list="{{recent}}" as="s" hint-placeholder-count="3">
<div style="margin: 0 -8px"><dc-import name="SessionRow" s="{{ s }}" density="compact" hint-size="100%,69px"></dc-import></div>
</sc-for>
</section>

<section style="margin-top: 12px">
<h2 style="height: 26px; display: flex; align-items: center; margin: 0; padding: 0 8px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; color: #8b8b94">PM</h2>
<sc-for list="{{pm}}" as="s" hint-placeholder-count="2">
<div style="margin: 0 -8px"><dc-import name="SessionRow" s="{{ s }}" density="compact" hint-size="100%,69px"></dc-import></div>
</sc-for>
</section>
</div>

<div style="flex: none; margin: 8px 0"><dc-import name="ActivityButton" activity="{{ activity }}" form="desktop" open="{{ activityOpen }}" hint-size="100%,32px"></dc-import></div>
<div style="flex: none"><dc-import name="Quota" hint-size="100%,140px"></dc-import></div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"view":{"editor":"enum","options":["inbox","board"],"default":"inbox"},"inboxCollapsed":{"editor":"boolean","default":false},"inboxCount":{"editor":"int","default":6},"activity":{"editor":null},"activityOpen":{"editor":"boolean","default":false},"h":{"editor":null},"$preview":{"width":240,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const view = this.props.view ?? 'inbox';
    const collapsed = this.props.inboxCollapsed ?? false;
    const on = 'background: #3f3f46; color: #fafafa; font-weight: 700';
    const off = 'background: transparent; color: #a1a1aa; font-weight: 400';
    // activity: { count, tone: 'running' | 'failure' | 'idle' | 'empty' }. Unset is the muted entry without a count, as before any action ran.
    const activity = this.props.activity ?? { count: '', tone: 'empty' };
    const activityOpen = this.props.activityOpen ?? false;
    return {
      // h: shorter when the update band takes the top of the window.
      h: this.props.h ?? '900px',
      inboxCount: this.props.inboxCount ?? 6,
      activity, activityOpen,
      inboxToggleLabel: collapsed ? 'Show Inbox' : 'Hide Inbox',
      inboxToggleArrow: collapsed ? 'm14 9 3 3-3 3' : 'm16 15-3-3 3-3',
      inboxOn: view === 'inbox' ? 'true' : 'false',
      boardOn: view === 'board' ? 'true' : 'false',
      inboxStyle: view === 'inbox' ? on : off,
      boardStyle: view === 'board' ? on : off,
      starred: [
        { status: 'Question', unread: true, title: '通知の再送処理を見直す', age: '8s', role: 'development', engine: 'claude', taskRef: 'P1 #2048', taskTitle: '通知の信頼性を上げる', repo: 'example/service', vibe: 'inherited' },
        { status: 'Working', title: '配信ログの保存期間を決める', age: '2m', role: 'research', engine: 'codex', taskRef: 'P2 #2051', taskTitle: '監視を整える', repo: 'example/observability' }
      ],
      recent: [
        { status: 'Done', title: '再試行の上限を設定に出す', age: '1h', role: 'development', engine: 'claude', taskRef: 'P1 #2048', taskTitle: '通知の信頼性を上げる', repo: 'example/service' },
        { status: 'Working', title: 'ダッシュボードの遅延を調べる', age: '5m', role: 'debug-flow', engine: 'codex', taskRef: 'P3 #2057', taskTitle: '監視を整える', repo: 'example/observability' },
        { status: 'Done', title: 'セットアップ手順を更新する', age: '2h', role: '', engine: 'codex', taskRef: '', repo: 'example/handbook' }
      ],
      pm: [
        { status: 'Plan', title: '段階的な公開を進める', age: '5m', role: 'PM', engine: 'claude', taskRef: 'P2 #2052', taskTitle: '新しい設定を段階的に公開する', repo: 'example/web-app' },
        { status: 'Working', title: '通知まわりの改修', age: '12m', role: 'PM', engine: 'claude', taskRef: 'P1 #2048', taskTitle: '通知の信頼性を上げる', repo: 'example/service', vibe: 'on' }
      ]
    };
  }
}
</script>
</body>
</html>
