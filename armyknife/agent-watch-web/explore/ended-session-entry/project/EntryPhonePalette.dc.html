<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Phone: command palette with a query</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<main style="width: 100%; height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 15px; line-height: 1.55">
<header style="flex: none; min-height: 50px; display: flex; align-items: center; gap: 8px; padding: max(8px, env(safe-area-inset-top)) 8px 6px 16px; border-bottom: 1px solid #2a2a2a"><span aria-hidden="true" style="color: #8b8b94">⌕</span><input aria-label="Jump to" value="配信" placeholder="Jump to" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; color: #fafafa; font-family: inherit; font-size: 16px"><button type="button" style="height: 44px; padding: 0 8px; border: 0; background: transparent; color: #d4d4d8; font-family: inherit; font-size: 16px">Cancel</button></header>
<div role="listbox" style="flex: 1; min-height: 0; overflow-y: auto; padding: 4px 0">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<h2 style="height: 28px; display: flex; align-items: center; gap: 8px; margin: 8px 0 0; padding: 0 16px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; color: #8b8b94">{{g.title}}<span style="font-weight: 400; letter-spacing: 0">{{g.sub}}</span></h2>
<sc-for list="{{g.items}}" as="it" hint-placeholder-count="2">
<sc-if value="{{it.isSession}}" hint-placeholder-val="{{ true }}">
<div role="option" aria-selected="false"><dc-import name="SessionRow" s="{{ it }}" density="phone" hint-size="100%,76px"></dc-import></div>
</sc-if>
<sc-if value="{{it.isOther}}" hint-placeholder-val="{{ false }}">
<div role="option" aria-selected="false" style="min-height: 52px; box-sizing: border-box; display: grid; grid-template-columns: 16px 1fr; align-items: center; gap: 12px; padding: 6px 16px">
<span aria-hidden="true" style="color: #a1a1aa; text-align: center">{{it.glyph}}</span>
<div style="min-width: 0"><div style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{it.title}}</div><div style="font-size: 12.5px; color: #a1a1aa">{{it.sub}}</div></div>
</div>
</sc-if>
</sc-for>
</sc-for>
</div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"option":{"editor":"enum","options":["current","a"],"default":"current"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const a = (this.props.option ?? 'current') === 'a';
    const ses = (status, title, age, role, engine, taskRef, taskTitle, repo) =>
      ({ isSession: true, isOther: false, status, unread: false, title, age, role, engine, taskRef, taskTitle, repo });
    const groups = [
      { title: 'SESSIONS', sub: '', items: [
        ses('Working', '配信メトリクスを追加する', '18s', 'development', 'codex', 'P3 #2055', '監視を整える', 'example/observability')
      ] },
      { title: 'TQ TASKS', sub: '', items: [
        { isOther: true, isSession: false, glyph: '#', title: '#2050 配信チェックを入れる', sub: 'P2 · 1 session' }
      ] }
    ];
    if (a) groups.push({ title: 'ENDED', sub: 'Only while you type', items: [
      ses('Ended', '配信チェックの PR を確認する', 'Ended 14:32', '', 'codex', 'P2 #2050', '配信チェックを入れる', 'example/web-app'),
      ses('Ended', '配信ログの保存期間を決める', 'Ended Mon', 'research', 'claude', '', '', 'example/service')
    ] });
    return { groups };
  }
}
</script>
</body>
</html>
