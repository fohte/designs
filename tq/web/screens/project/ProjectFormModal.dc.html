<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>New Project</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif">
<dc-import name="ProjectList" state="rows" filter="active" hint-size="1440px,900px"></dc-import>
<div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(4px)"></div>

<div style="position: absolute; inset: 0; box-sizing: border-box; padding: 32px; display: flex; align-items: center; justify-content: center">
<div role="dialog" aria-modal="true" aria-labelledby="project-form-title" style="width: 100%; max-width: 600px; max-height: 100%; display: flex; flex-direction: column; overflow: hidden; background: #141414; box-shadow: 0 0 0 1px rgba(250, 250, 250, 0.1), 0 25px 50px -12px rgba(0, 0, 0, 0.25)">

<div style="flex: none; height: 56px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; border-bottom: 1px solid #2a2a2a">
<span id="project-form-title" style="font-size: 16px; line-height: 24px; font-weight: 600; color: #fafafa">New Project</span>
<button type="button" aria-label="Close" style="width: 28px; height: 28px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #fafafa"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
</div>

<div style="flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; padding: 24px">
<input type="text" placeholder="Project name" aria-label="Project name" style="width: calc(100% + 8px); height: 32px; box-sizing: border-box; margin: 0 -4px; padding: 4px; border: 0; border-bottom: 1px solid transparent; background: transparent; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif; font-size: 14px; outline: none">
<textarea rows="3" placeholder="What is this project about?" aria-label="Description" style="display: block; width: 100%; min-height: 64px; box-sizing: border-box; padding: 8px 10px; border: 1px solid #2a2a2a; background: rgba(42, 42, 42, 0.3); color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif; font-size: 14px; line-height: 20px; resize: none; outline: none"></textarea>

<div style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 12px">
<span style="width: 96px; flex: none; display: flex; align-items: center; gap: 6px; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px; letter-spacing: 0.1em; color: #52525b">Status</span>
<button type="button" aria-label="Status" style="height: 28px; margin: 0 -4px; display: inline-flex; align-items: center; justify-content: space-between; gap: 6px; padding: 0 4px; border: 0; border-bottom: 1px solid transparent; background: transparent; color: #fafafa; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 14px">Active<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#71717a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
</div>
<div style="display: flex; align-items: center; gap: 12px">
<span style="width: 96px; flex: none; display: flex; align-items: center; gap: 6px; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px; letter-spacing: 0.1em; color: #52525b">Context</span>
<button type="button" aria-label="Context" style="height: 28px; margin: 0 -4px; display: inline-flex; align-items: center; justify-content: space-between; gap: 6px; padding: 0 4px; border: 0; border-bottom: 1px solid transparent; background: transparent; color: #fafafa; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 14px">Personal<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#71717a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
</div>
<div style="display: flex; align-items: center; gap: 12px">
<label for="new-project-start" style="width: 96px; flex: none; display: flex; align-items: center; gap: 6px; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px; letter-spacing: 0.1em; color: #52525b"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 19h6"></path><path d="M16 2v4"></path><path d="M19 16v6"></path><path d="M21 12.598V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h8.5"></path><path d="M3 10h18"></path><path d="M8 2v4"></path></svg>Start date</label>
<input id="new-project-start" type="date" style="width: auto; min-width: 0; height: 32px; box-sizing: border-box; margin: 0 -4px; padding: 4px; border: 0; border-bottom: 1px solid transparent; background: transparent; color: #fafafa; color-scheme: dark; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 14px">
</div>
<div style="display: flex; align-items: center; gap: 12px">
<label for="new-project-target" style="width: 96px; flex: none; display: flex; align-items: center; gap: 6px; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px; letter-spacing: 0.1em; color: #52525b"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M3 10h18"></path></svg>Target date</label>
<input id="new-project-target" type="date" style="width: auto; min-width: 0; height: 32px; box-sizing: border-box; margin: 0 -4px; padding: 4px; border: 0; border-bottom: 1px solid transparent; background: transparent; color: #fafafa; color-scheme: dark; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 14px">
</div>
<div style="display: flex; align-items: center; gap: 12px">
<span id="new-project-color" style="width: 96px; flex: none; display: flex; align-items: center; gap: 6px; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px; letter-spacing: 0.1em; color: #52525b"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22a1 1 0 0 1 0-20 10 9 0 0 1 10 9 5 5 0 0 1-5 5h-2.25a1.75 1.75 0 0 0-1.4 2.8l.3.4a1.75 1.75 0 0 1-1.4 2.8z"></path><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"></circle><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"></circle><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"></circle><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"></circle></svg>Color</span>
<div role="radiogroup" aria-labelledby="new-project-color" style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{swatches}}" as="s" hint-placeholder-count="8">
<button type="button" role="radio" aria-checked="{{s.checked}}" aria-label="{{s.name}}" title="{{s.name}}" style="width: 20px; height: 20px; box-sizing: border-box; padding: 0; background: {{s.hex}}; {{s.ring}}"></button>
</sc-for>
</div>
</div>
</div>
</div>

<div style="flex: none; display: flex; align-items: center; justify-content: flex-end; gap: 12px; padding: 12px 24px; border-top: 1px solid #2a2a2a">
<button type="button" style="height: 32px; padding: 0 10px; border: 1px solid #2a2a2a; background: #0a0a0a; color: #fafafa; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 500">Cancel</button>
<button type="button" disabled style="height: 36px; padding: 0 10px; border: 1px solid #71717a; background: #1f1f1f; color: #fafafa; opacity: 0.5; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 500">Create Project</button>
</div>

</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const presets = [
      ['Orange', '#FF8400'], ['Red', '#FF5C33'], ['Green', '#4CAF50'], ['Blue', '#4A90D9'],
      ['Purple', '#9B59B6'], ['Teal', '#26A69A'], ['Pink', '#E91E63'], ['Yellow', '#FFC107']
    ];
    return {
      swatches: presets.map(([name, hex], i) => ({
        name, hex,
        checked: i === 0 ? 'true' : 'false',
        ring: i === 0 ? 'border: 2px solid #fafafa; transform: scale(1.1)' : 'border: 2px solid transparent'
      }))
    };
  }
}
</script>
</body>
</html>
