<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Navigation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Main navigation" style="width: 240px; height: 900px; box-sizing: border-box; display: flex; flex-direction: column; padding: 0 8px; overflow: hidden; background: #0f0f0f; border-right: 1px solid #2a2a2a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 13px; line-height: 1.55">

<div style="height: 48px; flex: none; display: flex; align-items: center; padding: 0 8px; font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700"><span style="margin-right: 7px; color: #ef4444">&gt;</span><span>agent watch</span><button type="button" aria-label="New session" title="New session" style="margin-left: auto; width: 28px; height: 28px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #d4d4d8"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></button><button type="button" aria-label="Jump to with Command K" style="height: 28px; display: inline-flex; align-items: center; gap: 5px; padding: 0 6px; border: 0; background: transparent; color: #8b8b94; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; font-weight: 400"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 21-4.34-4.34"></path><circle cx="11" cy="11" r="8"></circle></svg>⌘K</button><button type="button" aria-label="{{inboxToggleLabel}}" title="{{inboxToggleLabel}}" style="width: 28px; height: 28px; margin-right: -6px; display: grid; place-items: center; border: 0; background: transparent; color: #a1a1aa"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M9 3v18"></path><path d="{{inboxToggleArrow}}"></path></svg></button></div>

<div role="group" aria-label="Views" style="flex: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); height: 28px; box-sizing: border-box; margin: 0 4px 12px; padding: 2px; background: #1a1a1a">
<button type="button" aria-pressed="{{inboxOn}}" style="border: 0; padding: 0 8px; font-family: inherit; font-size: 12.5px; {{inboxStyle}}">Inbox <span style="font-family: 'JetBrains Mono', monospace; color: #fbbf24">6</span></button>
<button type="button" aria-pressed="{{boardOn}}" style="border: 0; padding: 0 8px; font-family: inherit; font-size: 12.5px; {{boardStyle}}">Board</button>
</div>

<section style="margin-top: 0">
<h2 style="height: 26px; display: flex; align-items: center; margin: 0; padding: 0 8px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; color: #8b8b94">VIEWS</h2>
<button type="button" style="width: 100%; height: 28px; display: grid; grid-template-columns: 12px 1fr auto; align-items: center; gap: 8px; padding: 0 8px; border: 0; background: transparent; color: #d4d4d8; font-family: inherit; font-size: 13px; text-align: left"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 20a1 1 0 0 0 .553.895l2 1A1 1 0 0 0 14 21v-7a2 2 0 0 1 .517-1.341L21.74 4.67A1 1 0 0 0 21 3H3a1 1 0 0 0-.742 1.67l7.225 7.989A2 2 0 0 1 10 14z"></path></svg><span>web-app のレビュー</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #fbbf24">3</span></button>
<button type="button" style="width: 100%; height: 28px; display: grid; grid-template-columns: 12px 1fr auto; align-items: center; gap: 8px; padding: 0 8px; border: 0; background: transparent; color: #d4d4d8; font-family: inherit; font-size: 13px; text-align: left"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 20a1 1 0 0 0 .553.895l2 1A1 1 0 0 0 14 21v-7a2 2 0 0 1 .517-1.341L21.74 4.67A1 1 0 0 0 21 3H3a1 1 0 0 0-.742 1.67l7.225 7.989A2 2 0 0 1 10 14z"></path></svg><span>Errors</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #f87171">1</span></button>
</section>

<section style="margin-top: 12px">
<h2 style="height: 26px; display: flex; align-items: center; margin: 0; padding: 0 8px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; color: #8b8b94">Starred</h2>
<button type="button" style="width: 100%; display: flex; align-items: center; gap: 8px; padding: 5px 8px 0; border: 0; background: transparent; font-family: inherit; font-size: 13px; text-align: left"><span style="color: #fbbf24; font-size: 10px">★</span><span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #fafafa; font-weight: 700">通知の再送処理を見直す</span><span role="img" aria-label="Question" title="Question" style="display: inline-flex; color: #fbbf24"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719"></path><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><path d="M12 17h.01"></path></svg></span></button>
<span style="display: block; margin-left: 18px; padding: 0 8px 5px 8px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8b8b94; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">#2048 · example/service</span>
<button type="button" style="width: 100%; display: flex; align-items: center; gap: 8px; padding: 5px 8px 0; border: 0; background: transparent; font-family: inherit; font-size: 13px; text-align: left"><span style="color: #fbbf24; font-size: 10px">★</span><span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #d4d4d8">配信ログの保存期間を決める</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #60a5fa">Working</span></button>
<span style="display: block; margin-left: 18px; padding: 0 8px 5px 8px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8b8b94; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">#2051 · example/observability</span>
</section>

<section style="margin-top: 12px">
<h2 style="height: 26px; display: flex; align-items: center; margin: 0; padding: 0 8px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; color: #8b8b94">Recent</h2>
<sc-for list="{{recent}}" as="r" hint-placeholder-count="3">
<button type="button" aria-label="Open {{r.title}} recent session" style="width: 100%; min-height: 32px; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; padding: 3px 8px; border: 0; background: transparent; color: #d4d4d8; font-family: inherit; font-size: 12px; text-align: left"><span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.title}}</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: #8b8b94">{{r.repo}}</span></button>
</sc-for>
</section>

<section style="margin-top: 14px">
<h2 style="height: 26px; display: flex; align-items: center; margin: 0; padding: 0 8px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; color: #8b8b94">Development</h2>
<sc-for list="{{projects}}" as="p" hint-placeholder-count="4">
<button type="button" aria-label="Open {{p.name}} Development session in Inbox" style="width: 100%; height: 28px; display: grid; grid-template-columns: 6px 1fr auto; align-items: center; gap: 8px; padding: 0 8px; border: 0; background: transparent; font-family: inherit; font-size: 13px; text-align: left"><span style="width: 6px; height: 6px; background: {{p.dot}}"></span><span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: {{p.color}}; font-weight: {{p.weight}}">{{p.name}}</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: {{p.statusColor}}">{{p.status}}</span></button>
</sc-for>
</section>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"view":{"editor":"enum","options":["inbox","board"],"default":"inbox"},"inboxCollapsed":{"editor":"boolean","default":false},"$preview":{"width":240,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const view = this.props.view ?? 'inbox';
    const collapsed = this.props.inboxCollapsed ?? false;
    const on = 'background: #3f3f46; color: #fafafa; font-weight: 700';
    const off = 'background: transparent; color: #a1a1aa; font-weight: 400';
    const S = {
      Review: ['#fbbf24', '#fafafa', 700, '#fbbf24'],
      Working: ['transparent', '#fafafa', 400, '#60a5fa'],
      Idle: ['transparent', '#a1a1aa', 400, '#8b8b94']
    };
    const projects = [['web-app', 'Review'], ['service', 'Working'], ['observability', 'Working'], ['handbook', 'Idle']]
      .map(([name, status]) => ({ name, status, dot: S[status][0], color: S[status][1], weight: S[status][2], statusColor: S[status][3] }));
    return {
      inboxToggleLabel: collapsed ? 'Show Inbox' : 'Hide Inbox',
      inboxToggleArrow: collapsed ? 'm14 9 3 3-3 3' : 'm16 15-3-3 3-3',
      inboxOn: view === 'inbox' ? 'true' : 'false',
      boardOn: view === 'board' ? 'true' : 'false',
      inboxStyle: view === 'inbox' ? on : off,
      boardStyle: view === 'board' ? on : off,
      recent: [
        { title: '再試行の上限を設定に出す', repo: 'example/service' },
        { title: 'ダッシュボードの遅延を調べる', repo: 'example/observability' },
        { title: 'セットアップ手順を更新する', repo: 'example/handbook' }
      ],
      projects
    };
  }
}
</script>
</body>
</html>
