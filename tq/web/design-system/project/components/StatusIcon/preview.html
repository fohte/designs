<!-- @dsCard group="Status" height=64 subtitle="static rendition" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>StatusIcon</title>
</head>
<body>
<div class="tq-row">
  <span class="tq-status tq-status--todo" role="img" aria-label="todo"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></span><span class="tq-note">todo</span>
  <span class="tq-status tq-status--completed" role="img" aria-label="completed"><svg class="tq-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span><span class="tq-note">completed</span>
  <span class="tq-status tq-status--not-planned" role="img" aria-label="not planned"><svg class="tq-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></span><span class="tq-note">not_planned</span>
  <span class="tq-status tq-status--duplicate" role="img" aria-label="duplicate"><svg class="tq-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9h14M5 15h14"/></svg></span><span class="tq-note">duplicate</span>
</div>
</body>
</html>
