<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Wait form dialog</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #0a0a0a; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif">
<dc-import name="TaskDetail" height="{{h}}" scroll="{{scroll}}" hint-size="1440px,900px"></dc-import>
<div style="position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px)">
<div role="dialog" aria-modal="true" aria-labelledby="wait-title" style="position: relative; width: 384px; box-sizing: border-box; display: grid; gap: 16px; padding: 16px; background: #0a0a0a; box-shadow: 0 0 0 1px rgba(250,250,250,0.1); color: #fafafa; font-size: 14px; line-height: 20px">
<h2 id="wait-title" style="margin: 0; font-size: 16px; line-height: 1; font-weight: 500">{{title}}</h2>
<form style="display: flex; flex-direction: column; gap: 16px">
<textarea aria-label="Wait description" rows="4" placeholder="What are you waiting for?" style="min-height: 64px; box-sizing: border-box; padding: 8px 10px; border: 1px solid #ef4444; box-shadow: 0 0 0 3px rgba(239,68,68,0.2); background: transparent; color: #fafafa; font-family: inherit; font-size: 14px; line-height: 20px; resize: none; outline: none">{{body}}</textarea>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="wait-follow-up" style="font-family: 'JetBrains Mono', monospace; font-size: 10px; line-height: 14px; color: #52525b">FOLLOW UP</label>
<input id="wait-follow-up" type="text" value="2026/11/29" style="width: 100%; height: 32px; box-sizing: border-box; padding: 4px 10px; border: 1px solid #2a2a2a; background: transparent; color: #fafafa; font-family: inherit; font-size: 14px; outline: none">
</div>
<div style="display: flex; justify-content: flex-end; gap: 8px">
<button type="button" style="height: 32px; padding: 0 10px; border: 1px solid #2a2a2a; background: #0a0a0a; color: #fafafa; font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 500">Cancel</button>
<button type="submit" style="height: 32px; padding: 0 10px; border: 1px solid #71717a; background: #1f1f1f; color: #fafafa; font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 500">{{submit}}</button>
</div>
</form>
<button type="button" aria-label="Close" style="position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #fafafa"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["wait","github-reply"],"default":"wait"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const github = (this.props.mode ?? 'wait') === 'github-reply';
    return {
      h: 900,
      scroll: 2076,
      title: github ? 'Wait for GitHub reply' : 'Wait for',
      submit: github ? 'Enable' : 'Add',
      body: github ? 'レビューコメントへの返信を待つ' : 'デザインレビューの返事',
    };
  }
}
</script>
</body>
</html>
