<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>案 E: 次の行動のキュー</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
a{color:#7aa2f7}a:hover{color:#a9c1fa}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; flex-direction: column; overflow: hidden; color-scheme: dark; background: #0f0f0e; color: #c4c3bc; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 13px; line-height: 1.5">

<header style="flex: none; height: 48px; display: flex; align-items: center; gap: 16px; padding: 0 20px; border-bottom: 1px solid #2a2a28; background: #161615">
<span style="font-family: 'JetBrains Mono', monospace; font-weight: 700; color: #ededea">research map</span>
<span aria-hidden="true" style="color: #4a4945">/</span>
<span style="font-weight: 700; color: #ededea">分類精度 (balanced accuracy) を上げる</span>
</header>

<div style="flex: 1; min-height: 0; display: flex">

<main style="flex: 1; min-width: 0; overflow-y: auto; padding: 28px 40px 40px">
<div style="max-width: 820px; display: flex; flex-direction: column; gap: 28px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
<section aria-label="{{g.label}}" style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: baseline; gap: 10px"><h2 style="margin: 0; font-size: 13px; font-weight: 700; color: #ededea">{{g.label}}</h2><span style="font-size: 12px; color: #9a998f">{{g.hint}}</span></div>
<div style="display: flex; flex-direction: column; border-top: 1px solid #2a2a28">
<sc-for list="{{g.items}}" as="it" hint-placeholder-count="2">
<div style="{{it.style}}">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<span style="{{it.textStyle}}">{{it.text}}</span>
<span style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #9a998f">
<span aria-hidden="true" style="{{it.markStyle}}"></span>
<sc-if value="{{it.tag}}" hint-placeholder-val="{{ false }}"><span style="padding: 0 4px; border: 1px solid #3a3a37; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #c4c3bc">{{it.tag}}</span></sc-if>
<span style="color: #c4c3bc">{{it.approach}}</span><span aria-hidden="true" style="color: #4a4945">·</span><span>{{it.branch}}</span>
<sc-if value="{{it.decision}}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="color: #4a4945">·</span><span>判断 {{it.decision}}</span></sc-if>
</span>
</div>
<button type="button" style="{{it.actionStyle}}">{{it.action}}</button>
</div>
</sc-for>
</div>
</section>
</sc-for>
</div>
</main>

<aside aria-label="マップ" style="flex: none; width: 380px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px; padding: 20px 0; border-left: 1px solid #2a2a28; background: #161615; overflow-y: auto">
<div style="display: flex; align-items: baseline; justify-content: space-between; padding: 0 20px 8px"><h2 style="margin: 0; font-size: 12px; color: #9a998f">マップ</h2><span style="font-size: 11.5px; color: #9a998f">済 4 · 中 3 · 未 4</span></div>
<sc-for list="{{tree}}" as="t" hint-placeholder-count="16">
<div style="{{t.style}}"><sc-if value="{{t.leaf}}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="{{t.markStyle}}"></span></sc-if><span style="flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.label}}</span></div>
</sc-for>
</aside>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const mark = (st) => {
      const base = 'flex: none; box-sizing: border-box; width: 9px; height: 9px; ';
      if (st === 'done') return base + 'background: #ededea';
      if (st === 'doing') return base + 'background: #e8913a';
      return base + 'border: 1px solid #7a7972';
    };
    const btn = (primary) => 'flex: none; align-self: center; height: 32px; padding: 0 14px; border: 1px solid ' + (primary ? '#ededea' : '#3a3a37') + '; background: ' + (primary ? '#ededea' : '#161615') + '; color: ' + (primary ? '#0f0f0e' : '#c4c3bc') + '; font-size: 12px; font-weight: ' + (primary ? '700' : '400') + '; cursor: pointer';
    const item = (it, g) => ({
      tag: '', decision: '', ...it,
      markStyle: mark(it.st),
      style: 'display: flex; gap: 16px; padding: 14px 16px; border-bottom: 1px solid #2a2a28; background: ' + (g.current ? '#1c2433' : 'transparent'),
      textStyle: 'color: ' + (g.muted ? '#c4c3bc' : '#ededea') + '; font-size: ' + (g.current ? '16px' : '14px') + '; font-weight: ' + (g.muted ? '400' : '700'),
      actionStyle: btn(g.current),
    });
    const groups = [
      { label: '着手中', hint: '結果が出たら知見と判断を記録する', current: true, items: [
        { text: '出所を 1 つずつ外した検証で、改善が残るか確かめる', tag: 'A+C', approach: '確率平均', branch: 'アンサンブル', decision: '深掘り', st: 'doing', action: '結果を記録' },
      ] },
      { label: '次の候補', hint: '判断済みで、次にやることが決まっている', items: [
        { text: '中間層 4 条件を同じ分割で比較する', tag: 'C', approach: '凍結 LLM の中間層', branch: '特徴表現', decision: '深掘り', st: 'doing', action: '着手する' },
        { text: '出所ごとに分けた分割で再評価する', approach: '交差検証と公開スコアの差', branch: '評価', decision: '追加検証', st: 'doing', action: '着手する' },
      ] },
      { label: '未着手の候補', hint: 'まだ次の行動を決めていない', muted: true, items: [
        { text: '埋め込みの中心化', approach: '埋め込みの中心化', branch: '特徴表現', st: 'todo', action: '次の行動を決める' },
        { text: '小型 LLM の LoRA 微調整', approach: '小型 LLM の LoRA 微調整', branch: 'モデル', st: 'todo', action: '次の行動を決める' },
        { text: 'A + B のスタッキング', tag: 'A+B', approach: 'スタッキング', branch: 'アンサンブル', st: 'todo', action: '次の行動を決める' },
      ] },
      { label: '保留中', hint: '再開する条件', muted: true, items: [
        { text: 'A + C の結果しだいで単体の調整に戻る', tag: 'A', approach: '文字 n-gram の TF-IDF', branch: '特徴表現', decision: '保留', st: 'done', action: '再開する' },
        { text: 'ラベルを揃える方法が見つかったら再開', approach: '外部コーパスの追加', branch: '学習データ', decision: '保留', st: 'done', action: '再開する' },
      ] },
    ].map((g) => ({ ...g, items: g.items.map((it) => item(it, g)) }));

    const rows = [
      ['b', '特徴表現'], ['l', 'A  文字 n-gram の TF-IDF', 'done'], ['l', 'B  凍結 LLM の最終層', 'done'], ['l', 'C  凍結 LLM の中間層', 'doing'], ['l2', '中間層 4 条件の比較', 'todo'], ['l', '埋め込みの中心化', 'todo'],
      ['b', 'モデル'], ['l', 'ロジスティック回帰', 'done'], ['l', '小型 LLM の LoRA 微調整', 'todo'],
      ['b', 'アンサンブル'], ['l', 'A+C  確率平均', 'doing', true], ['l', 'A+B  スタッキング', 'todo'],
      ['b', '学習データ'], ['l', '外部コーパスの追加', 'done'],
      ['b', '評価'], ['l', '交差検証と公開スコアの差', 'doing'],
    ];
    const tree = rows.map(([kind, label, st, cur]) => ({
      label, leaf: kind !== 'b', markStyle: st ? mark(st) : '',
      style: 'display: flex; align-items: center; gap: 8px; height: ' + (kind === 'b' ? '32px' : '28px') + '; padding: 0 20px 0 ' + (kind === 'b' ? 20 : kind === 'l2' ? 56 : 36) + 'px; margin-top: ' + (kind === 'b' ? '6px' : '0') + '; background: ' + (cur ? '#1c2433' : 'transparent') + '; color: ' + (kind === 'b' ? '#9a998f' : st === 'todo' ? '#9a998f' : '#ededea') + '; font-size: ' + (kind === 'b' ? '12px' : '12.5px') + '; font-weight: ' + (kind === 'b' || cur ? '700' : '400'),
    }));
    return { groups, tree };
  }
}
</script>
</body>
</html>
