<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Close failure · C · phone</title>

<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; background: #0a0a0a">
<dc-import name="PhoneChat" state="review" done="{{ true }}" activity="{{ activity }}" close-fail="{{ fail }}" close-fail-open="{{ true }}" close-fail-checks="{{ true }}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      activity: { count: '1', tone: 'failure' },
      fail: {
        kind: 'process',
        session: '通知の再送処理を見直す',
        path: '~/src/example/service/.worktrees/retry-backoff',
        checks: [
          { label: 'Uncommitted changes', detail: '', state: 'None' },
          { label: 'Branch feature/retry-backoff', detail: 'Merged', state: 'None' },
          { label: 'Running processes', detail: '48213 node · 48250 vite', state: '2 running' }
        ]
      }
    };
  }
}
</script>
</body>
</html>
