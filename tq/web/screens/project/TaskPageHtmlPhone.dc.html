<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>HTML task page on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif">
<main style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column">
<header style="flex: none; height: 40px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 1px solid #2a2a2a; background: #0a0a0a; font-family: 'JetBrains Mono', monospace">
<a href="#task-128" aria-label="Back" style="display: flex; align-items: center; gap: 4px; color: #71717a"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
<nav aria-label="Breadcrumb" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; font-size: 12px; line-height: 16px">
<span style="color: #71717a">#128</span>
<span style="color: #3f3f46">/</span>
<span style="flex: 1; min-width: 0; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">リダイレクトの流れ</span>
<span style="font-size: 10px; line-height: 14px; color: #3f3f46">saved 3m ago</span>
</nav>
</header>
<div style="flex: 1; min-height: 0; overflow: hidden">
<div style="height: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; padding: 24px">
<input type="text" aria-label="Page title" value="リダイレクトの流れ" placeholder="Page title" style="height: 32px; box-sizing: border-box; padding: 0 4px; margin: 0 -4px; border: 0; border-bottom: 1px solid transparent; background: transparent; color: #fafafa; font-family: inherit; font-size: 16px; outline: none">
<div style="font-family: 'JetBrains Mono', monospace; font-size: 10px; line-height: 14px; color: #52525b">HTML <span style="color: #2a2a2a">|</span> autosave 1s</div>
<div style="flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; border: 1px solid #2a2a2a; background: #141414; padding: 10px">
<div role="group" aria-label="View" style="align-self: flex-end; display: inline-flex; padding: 2px; border: 1px solid #2a2a2a; background: #141414; font-family: 'JetBrains Mono', monospace">
<button type="button" aria-pressed="true" style="padding: 4px 10px; border: 0; background: #0a0a0a; color: #fafafa; font-family: inherit; font-size: 12px; line-height: 16px; font-weight: 500">Preview</button>
<button type="button" aria-pressed="false" style="padding: 4px 10px; border: 0; background: transparent; color: #71717a; font-family: inherit; font-size: 12px; line-height: 16px; font-weight: 500">Source</button>
</div>
<div aria-label="HTML preview" role="document" style="flex: 1; min-height: 0; overflow: hidden; background: #ffffff; color: #1a1a1a; padding: 16px; font-family: system-ui, sans-serif; font-size: 15px; line-height: 1.6">
<h1 style="margin: 0 0 16px; font-size: 22px">ログインからの戻り先</h1>
<div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
<div style="padding: 10px 14px; border: 1px solid #c8c8c8">設定ページ</div><span aria-hidden="true">→</span>
<div style="padding: 10px 14px; border: 1px solid #c8c8c8">ログイン画面</div><span aria-hidden="true">→</span>
<div style="padding: 10px 14px; border: 1px solid #c8c8c8">OAuth コールバック</div><span aria-hidden="true">→</span>
<div style="padding: 10px 14px; border: 2px solid #d14343">トップページ (現状)</div>
</div>
<p style="margin: 16px 0 0">コールバックで returnTo を読めば設定ページへ戻せる。</p>
</div>
</div>
</div>
</div>
</main>
<dc-import name="TabBar" view="tasks" hint-size="100%,53px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
