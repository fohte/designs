<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>New schedule modal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
input::placeholder{color:#71717a}
</style>
</helmet>
<div style="width: 1440px; height: 900px; position: relative; overflow: hidden; background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif">
<dc-import name="DayDesktop" view="week" connected="true" popover="none" hint-size="1440px,900px"></dc-import>
<div style="position: absolute; inset: 0; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px)"></div>
<div style="position: absolute; inset: 0; box-sizing: border-box; padding: 32px; display: flex; align-items: center; justify-content: center">
<div role="dialog" aria-labelledby="schedule-title" style="width: 100%; max-width: 600px; max-height: 100%; display: flex; flex-direction: column; overflow: hidden; background: #141414; box-shadow: 0 0 0 1px rgba(250, 250, 250, 0.1), 0 25px 50px -12px rgba(0, 0, 0, 0.25)">

<div style="flex: none; height: 56px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; border-bottom: 1px solid #2a2a2a">
<h2 id="schedule-title" style="margin: 0; font-size: 16px; line-height: 24px; font-weight: 600">New Schedule</h2>
<button type="button" aria-label="Close" style="width: 28px; height: 28px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #fafafa"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
</div>

<div style="flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; padding: 24px">
<input type="text" aria-label="Schedule title" placeholder="Schedule title" value="ランニング" style="height: 32px; box-sizing: border-box; padding: 0; border: 0; border-bottom: 1px solid #71717a; background: transparent; color: #fafafa; font-family: inherit; font-size: 14px; outline: none">

<label style="display: flex; flex-direction: column; gap: 4px">
<span style="display: flex; align-items: center; gap: 4px; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px; letter-spacing: 0.1em; color: #52525b"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v4"></path><path d="M16 2v4"></path><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M3 10h18"></path><path d="M8 14h.01"></path><path d="M12 14h.01"></path><path d="M16 14h.01"></path><path d="M8 18h.01"></path><path d="M12 18h.01"></path><path d="M16 18h.01"></path></svg>Start date</span>
<span style="height: 28px; box-sizing: border-box; display: flex; align-items: center; padding: 0 8px; border: 1px solid #2a2a2a; font-size: 12px"><input type="text" aria-label="Start date" value="2026-09-01" style="width: 144px; padding: 0; border: 0; background: transparent; color: #fafafa; font-family: inherit; font-size: 14px; outline: none"></span>
</label>

<div style="display: flex; align-items: flex-end; gap: 16px">
<label style="display: flex; flex-direction: column; gap: 4px">
<span style="display: flex; align-items: center; gap: 4px; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px; letter-spacing: 0.1em; color: #52525b"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>Start</span>
<span style="height: 28px; box-sizing: border-box; display: flex; align-items: center; padding: 0 8px; border: 1px solid #2a2a2a; font-size: 12px"><input type="text" aria-label="Start time" value="19:00" style="width: 96px; padding: 0; border: 0; background: transparent; color: #fafafa; font-family: inherit; font-size: 14px; outline: none"></span>
</label>
<label style="display: flex; flex-direction: column; gap: 4px">
<span style="display: flex; align-items: center; gap: 4px; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px; letter-spacing: 0.1em; color: #52525b"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>End</span>
<span style="height: 28px; box-sizing: border-box; display: flex; align-items: center; padding: 0 8px; border: 1px solid #2a2a2a; font-size: 12px"><input type="text" aria-label="End time" value="20:00" style="width: 96px; padding: 0; border: 0; background: transparent; color: #fafafa; font-family: inherit; font-size: 14px; outline: none"></span>
</label>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="display: flex; align-items: center; gap: 4px; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px; letter-spacing: 0.1em; color: #52525b"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m17 2 4 4-4 4"></path><path d="M3 11v-1a4 4 0 0 1 4-4h14"></path><path d="m7 22-4-4 4-4"></path><path d="M21 13v1a4 4 0 0 1-4 4H3"></path></svg>Repeat</span>
<span style="height: 28px; box-sizing: border-box; display: flex; align-items: center; padding: 0 8px; border: 1px solid #2a2a2a; font-size: 12px"><button type="button" aria-haspopup="listbox" aria-label="Repeat" style="height: 28px; display: inline-flex; align-items: center; gap: 6px; padding: 0; border: 0; border-bottom: 1px solid transparent; background: transparent; color: #fafafa; font-family: inherit; font-size: 14px">Weekly<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#71717a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button></span>
</div>
<div role="group" aria-label="Weekdays" style="display: flex; gap: 4px">
<button type="button" aria-label="Sunday" aria-pressed="false" style="width: 32px; height: 32px; padding: 0; border: 1px solid #2a2a2a; background: transparent; color: #a1a1aa; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 500">S</button>
<button type="button" aria-label="Monday" aria-pressed="false" style="width: 32px; height: 32px; padding: 0; border: 1px solid #2a2a2a; background: transparent; color: #a1a1aa; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 500">M</button>
<button type="button" aria-label="Tuesday" aria-pressed="true" style="width: 32px; height: 32px; padding: 0; border: 1px solid #71717a; background: #1f1f1f; color: #fafafa; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 500">T</button>
<button type="button" aria-label="Wednesday" aria-pressed="false" style="width: 32px; height: 32px; padding: 0; border: 1px solid #2a2a2a; background: transparent; color: #a1a1aa; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 500">W</button>
<button type="button" aria-label="Thursday" aria-pressed="true" style="width: 32px; height: 32px; padding: 0; border: 1px solid #71717a; background: #1f1f1f; color: #fafafa; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 500">T</button>
<button type="button" aria-label="Friday" aria-pressed="false" style="width: 32px; height: 32px; padding: 0; border: 1px solid #2a2a2a; background: transparent; color: #a1a1aa; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 500">F</button>
<button type="button" aria-label="Saturday" aria-pressed="true" style="width: 32px; height: 32px; padding: 0; border: 1px solid #71717a; background: #1f1f1f; color: #fafafa; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 500">S</button>
</div>
</div>

<div><button type="button" style="height: 28px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; border: 0; background: transparent; color: #fafafa; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>Add constraints</button></div>

<div style="display: flex; flex-wrap: wrap; align-items: flex-end; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="display: flex; align-items: center; gap: 4px; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px; letter-spacing: 0.1em; color: #52525b"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"></path><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"></path><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"></path></svg>Context</span>
<span style="height: 28px; box-sizing: border-box; display: flex; align-items: center; padding: 0 8px; border: 1px solid #2a2a2a; font-size: 12px"><button type="button" aria-haspopup="listbox" aria-label="Context" style="height: 28px; display: inline-flex; align-items: center; gap: 6px; padding: 0; border: 0; background: transparent; color: #fafafa; font-family: inherit; font-size: 14px">Personal<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#71717a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button></span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="display: flex; align-items: center; gap: 4px; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px; letter-spacing: 0.1em; color: #52525b"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"></circle><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"></circle><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"></circle><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"></circle><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"></path></svg>Color</span>
<div role="radiogroup" aria-label="Color" style="height: 28px; display: flex; align-items: center; gap: 6px">
<button type="button" role="radio" aria-checked="false" aria-label="Indigo" style="width: 20px; height: 20px; padding: 0; border: 2px solid transparent; background: #6C63FF"></button>
<button type="button" role="radio" aria-checked="false" aria-label="Coral" style="width: 20px; height: 20px; padding: 0; border: 2px solid transparent; background: #FF6B6B"></button>
<button type="button" role="radio" aria-checked="false" aria-label="Turquoise" style="width: 20px; height: 20px; padding: 0; border: 2px solid transparent; background: #4ECDC4"></button>
<button type="button" role="radio" aria-checked="false" aria-label="Lemon" style="width: 20px; height: 20px; padding: 0; border: 2px solid transparent; background: #FFE66D"></button>
<button type="button" role="radio" aria-checked="true" aria-label="Mint" style="width: 20px; height: 20px; padding: 0; border: 2px solid #fafafa; background: #95E1D3; transform: scale(1.1)"></button>
<button type="button" role="radio" aria-checked="false" aria-label="Salmon" style="width: 20px; height: 20px; padding: 0; border: 2px solid transparent; background: #F38181"></button>
<button type="button" role="radio" aria-checked="false" aria-label="Lavender" style="width: 20px; height: 20px; padding: 0; border: 2px solid transparent; background: #AA96DA"></button>
<button type="button" role="radio" aria-checked="false" aria-label="Sky blue" style="width: 20px; height: 20px; padding: 0; border: 2px solid transparent; background: #A8D8EA"></button>
</div>
</div>
</div>

<label style="display: flex; flex-direction: column; gap: 4px">
<span style="display: flex; align-items: center; gap: 4px; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px; letter-spacing: 0.1em; color: #52525b"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>Remind</span>
<span style="height: 28px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; padding: 0 8px; border: 1px solid #2a2a2a; font-size: 12px"><input type="number" aria-label="Remind before start" placeholder="—" value="15" style="width: 80px; padding: 0; border: 0; background: transparent; color: #fafafa; font-family: inherit; font-size: 14px; outline: none"><span style="color: #71717a">min before start</span></span>
</label>
</div>

<div style="flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 24px; border-top: 1px solid #2a2a2a">
<div></div>
<div style="display: flex; align-items: center; gap: 8px">
<button type="button" style="height: 32px; padding: 0 10px; border: 1px solid #2a2a2a; background: #0a0a0a; color: #fafafa; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 500">Cancel</button>
<button type="submit" style="height: 36px; padding: 0 10px; border: 1px solid #71717a; background: #1f1f1f; color: #fafafa; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 500">Create Schedule</button>
</div>
</div>

</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
