<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Quota forecast · current · desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<main style="width: 1000px; height: 340px; overflow: hidden; display: grid; grid-template-columns: 240px minmax(0, 1fr); background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 14px; line-height: 1.55">
<nav aria-label="Main navigation" style="display: flex; flex-direction: column; padding: 0 8px; background: #0f0f0f; border-right: 1px solid #2a2a2a">
<div style="height: 40px; display: flex; align-items: center; padding: 0 4px; color: #d4d4d8">通知の再送処理を見直す</div>
<div style="height: 40px; display: flex; align-items: center; padding: 0 4px; color: #d4d4d8">配信ログの保存期間を決める</div>
<div style="margin-top: auto"><dc-import name="ForecastQuota" variant="{{variant}}" hint-size="100%,150px"></dc-import></div>
</nav>
<section style="display: flex; flex-direction: column; justify-content: flex-end; gap: 20px; padding: 0 0 4px">
<div style="display: grid; gap: 8px">
<div style="margin: 0 24px; display: flex; align-items: flex-end; gap: 8px; min-height: 64px; box-sizing: border-box; padding: 10px 12px; border: 1px solid #2a2a2a; background: #0f0f0f"><textarea aria-label="Message session" placeholder="Message session" rows="2" style="flex: 1; resize: none; border: 0; padding: 0; background: transparent; color: #fafafa; font: inherit"></textarea><button type="button" aria-label="Send" style="width: 28px; height: 28px; border: 0; background: #fafafa; color: #0a0a0a">↑</button></div>
<div style="padding: 0 24px 12px"><dc-import name="ForecastUsage" variant="{{variant}}" engine="claude" hint-size="100%,18px"></dc-import></div>
</div>
<div style="display: grid; gap: 8px">
<div style="margin: 0 24px; display: flex; align-items: flex-end; gap: 8px; min-height: 64px; box-sizing: border-box; padding: 10px 12px; border: 1px solid #2a2a2a; background: #0f0f0f"><textarea aria-label="Message session" placeholder="Message session" rows="2" style="flex: 1; resize: none; border: 0; padding: 0; background: transparent; color: #fafafa; font: inherit"></textarea><button type="button" aria-label="Send" style="width: 28px; height: 28px; border: 0; background: #fafafa; color: #0a0a0a">↑</button></div>
<div style="padding: 0 24px 12px"><dc-import name="ForecastUsage" variant="{{variant}}" engine="codex" hint-size="100%,18px"></dc-import></div>
</div>
</section>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1000,"height":340}}'>
class Component extends DCLogic {
  renderVals() { return { variant: 'current' }; }
}
</script>
</body>
</html>
