<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Close confirmation copy by state, with what it withdraws</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 820px; box-sizing: border-box; display: grid; grid-template-columns: repeat(3, 380px); grid-auto-rows: min-content; justify-content: center; align-content: center; gap: 40px 56px; padding: 48px; background: #050505; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 13px; line-height: 1.55">
<sc-for list="{{kinds}}" as="k" hint-placeholder-count="5">
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 12px; color: #a1a1aa">{{k.label}}</span>
<dc-import name="ConfirmDialog" form="modal" head="{{k.head}}" body="{{k.body}}" note="{{k.note}}" items="{{ k.items }}" action="{{k.action}}" session="{{ k.session }}" hint-size="100%,200px"></dc-import>
</div>
</sc-for>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 12px; color: #a1a1aa">Done</span>
<div style="box-sizing: border-box; padding: 16px; border: 1px dashed #3f3f46; border-radius: 8px; color: #d4d4d8; font-size: 12px">No confirmation. Close ends the session right away.</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"withdraw":{"editor":"enum","options":["line","list"],"default":"line"},"$preview":{"width":1440,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    // withdraw: how the dialog says what closing withdraws. line: one sentence after the body. list: each pending to-do and proposal by title.
    const list = (this.props.withdraw ?? 'line') === 'list';
    const s = (state, dot, round, title) => ({ state, dot, round, color: dot, title });
    const n = (k, one) => k + ' ' + one + (k === 1 ? '' : 's');
    const w = (todos, proposals) => {
      const parts = [todos.length ? n(todos.length, 'to-do') : '', proposals.length ? n(proposals.length, 'proposal') : ''].filter(Boolean);
      if (!parts.length) return { note: '', items: [] };
      return list
        ? { note: '', items: todos.map((t) => ({ kind: 'To-do', title: t })).concat(proposals.map((t) => ({ kind: 'Proposal', title: t }))) }
        : { note: 'Withdraws ' + parts.join(' and ') + '.', items: [] };
    };
    return {
      kinds: [
        { label: 'Working · 1 to-do pending', session: s('Working · 18s', '#60a5fa', true, '配信メトリクスを追加する'), head: 'Stop and close this session?', body: 'It is working now. Closing stops the work in progress and ends the session.', action: 'Stop and close', ...w(['ダッシュボードで数値を確かめる'], []) },
        { label: 'Needs action · Question · 1 to-do and 1 proposal pending', session: s('Question', '#fbbf24', false, '通知の再送処理を見直す'), head: 'Close without answering?', body: 'It is waiting for your answer to a question. Closing ends the session, and the question stays unanswered.', action: 'Close session', ...w(['再送のログを本番で確かめる'], ['再送の待ち時間']) },
        { label: 'Needs action · Proposal', session: s('Proposal', '#fbbf24', false, 'アラートの送り先を決める'), head: 'Close without choosing?', body: 'It is waiting for you to choose a proposal. Closing ends the session.', action: 'Close session', ...w([], ['アラートの送り先']) },
        { label: 'Waiting · 1 to-do pending', session: s('Waiting', '#a1a1aa', true, 'README の手順を直す'), head: 'Close this session?', body: 'It is waiting for your next message. Closing ends the session.', action: 'Close session', ...w(['手順どおりに入れ直す'], []) },
        { label: 'Later · nothing pending', session: s('Later', '#a1a1aa', true, 'ログの保存期間を見直す'), head: 'Close this session?', body: 'You set it aside for later. Closing ends the session, and it leaves Later.', action: 'Close session', ...w([], []) }
      ]
    };
  }
}
</script>
</body>
</html>
