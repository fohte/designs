<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Calendar header</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; height: {{h}}; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 1px solid #2a2a2a; background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif; overflow: hidden">
<span style="flex: none; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 14px; line-height: 20px; font-weight: 700">2026-09-01</span>
<span style="flex: none; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px; color: #71717a">Tue</span>
<div role="group" style="flex: none; display: inline-flex; margin-left: 8px">
<button type="button" aria-label="Previous" style="width: 24px; height: 24px; display: grid; place-items: center; padding: 0; border: 1px solid #2a2a2a; background: #0a0a0a; color: #fafafa"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
<button type="button" style="height: 24px; padding: 0 8px; border: 1px solid #2a2a2a; border-left: 0; background: #0a0a0a; color: #fafafa; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500">today</button>
<button type="button" aria-label="Next" style="width: 24px; height: 24px; display: grid; place-items: center; padding: 0; border: 1px solid #2a2a2a; border-left: 0; background: #0a0a0a; color: #fafafa"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
</div>
<sc-if value="{{segmented}}" hint-placeholder-val="{{ true }}">
<div role="group" aria-label="Calendar view" style="flex: none; margin-left: auto; display: inline-flex; padding: 2px; border: 1px solid #2a2a2a; background: #141414">
<sc-for list="{{views}}" as="v" hint-placeholder-count="3">
<button type="button" aria-pressed="{{v.on}}" style="padding: 4px 10px; border: 0; background: {{v.bg}}; color: {{v.fg}}; font-family: inherit; font-size: 12px; line-height: 16px; font-weight: 500">{{v.label}}</button>
</sc-for>
</div>
</sc-if>
<sc-if value="{{compact}}" hint-placeholder-val="{{ false }}">
<button type="button" aria-pressed="{{weekOn}}" style="flex: none; margin-left: auto; height: 24px; padding: 0 8px; border: 1px solid {{weekBorder}}; background: {{weekBg}}; color: #fafafa; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500">week</button>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"view":{"editor":"enum","options":["day","week","month"],"default":"week"},"compact":{"editor":"boolean","default":false},"$preview":{"width":856,"height":40}}'>
class Component extends DCLogic {
  renderVals() {
    const view = this.props.view ?? 'week';
    const compact = String(this.props.compact ?? false) === 'true';
    const weekOn = view === 'week';
    return {
      compact,
      segmented: !compact,
      // The side window's header is 28px high and swaps the day/week/month control for a single week toggle.
      h: compact ? '28px' : '40px',
      weekOn,
      weekBorder: weekOn ? '#71717a' : '#2a2a2a',
      weekBg: weekOn ? '#1f1f1f' : '#0a0a0a',
      views: ['day', 'week', 'month'].map((v) => ({
        label: v,
        on: v === view,
        bg: v === view ? '#0a0a0a' : 'transparent',
        fg: v === view ? '#fafafa' : '#71717a',
      })),
    };
  }
}
</script>
</body>
</html>
