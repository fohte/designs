<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>agent watch: spec summary</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 1500px; box-sizing: border-box; padding: 72px 96px; display: flex; flex-direction: column; gap: 40px; background: #0a0a0a; color: #d4d4d8; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 15px; line-height: 1.7">
<header>
<div style="font-family: 'JetBrains Mono', monospace; font-size: 20px; font-weight: 700; color: #fafafa"><span style="margin-right: 10px; color: #ef4444">&gt;</span>agent watch</div>
<h1 style="margin: 12px 0 0; font-size: 32px; font-weight: 700; color: #fafafa">いまの画面の仕様</h1>
<p style="margin: 8px 0 0; color: #a1a1aa">Claude Code と Codex のセッションを見張り、返事を待っているものに答えるための画面です。この canvas は fohte/armyknife の agent-watch-web のいまのコードに合わせて描いています。</p>
</header>
<div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px 40px">
<sc-for list="{{sections}}" as="s" hint-placeholder-count="9">
<section style="display: flex; flex-direction: column; gap: 8px; padding-top: 16px; border-top: 1px solid #2a2a2a">
<h2 style="margin: 0; font-size: 17px; font-weight: 700; color: #fafafa">{{s.title}}</h2>
<sc-for list="{{s.items}}" as="i" hint-placeholder-count="3">
<p style="margin: 0; font-size: 14px">{{i}}</p>
</sc-for>
</section>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1500}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      sections: [
        { title: '画面の構成', items: [
          '左からナビ (240px)、Inbox (460px)、会話の 3 列です。列の間の区切りはドラッグで幅を変えられます。',
          '状況パネルを開くと Inbox がたたまれ、会話 (560px) と状況パネルの 2 列になります。',
          '760px 以下では iPhone の配置になり、Inbox と会話を 1 画面ずつ見せます。'
        ] },
        { title: 'ナビ', items: [
          'Inbox と Board の切り替え、保存した絞り込み (VIEWS)、Starred、Recent、作業の種類ごとのプロジェクトを並べます。',
          '⌘K でパレットを開き、ボタンで Inbox をたたみます。'
        ] },
        { title: 'Inbox', items: [
          'Needs action を tq の優先度順に並べ、未読は黄色の点と太字で示します。',
          'Later に回したもの、In progress (先頭 2 件)、Done を下に続けます。Done は Close all でまとめて閉じます。',
          'j / k で移動し、L で Later、E で閉じます。'
        ] },
        { title: '絞り込み', items: [
          '/ で絞り込みのダイアログを開き、project / kind / task / repo / engine で選びます。',
          '絞り込みはチップで出し、Save view で名前を付けてナビの VIEWS に残せます。'
        ] },
        { title: '会話', items: [
          'メッセージは最大 672px の列に中央寄せで並べます。返事を待つカードも会話の中に出します (composer の上には固定しません)。',
          'ヘッダーに tq タスク、repo、親セッション、PR と Merge、ターミナルで開くボタンを置きます。',
          '↵ で送り、Esc で止め、⌥↑ / ⌥↓ で自分のメッセージをたどります。'
        ] },
        { title: '返事を待つカード', items: [
          'Question、Permission、Proposal、To-do の 4 種類です。返事を待っている間は黄色の枠で囲みます。',
          'セッションが止まらずに決めたことは Decision として灰色の行で出し、あとから OK か Change… で返します。'
        ] },
        { title: '状況パネル', items: [
          'Running、Tree、Review、Decisions のタブと、セッションが開いた web UI (crit など) のタブを持ちます。',
          'Tree は親子のセッションを並べ、tq と repo は親と違うときだけ出します。'
        ] },
        { title: 'Board と ⌘K', items: [
          'Board はプロジェクトごとの列で、手が要るプロジェクトを先に並べます。',
          '⌘K はセッション、tq タスク (#)、プロジェクト (@)、コマンド (>) を探して開きます。'
        ] },
        { title: '色', items: [
          '黄色は返事待ち、青は実行中、赤は失敗、緑は ! コマンドの成功です。',
          '角は丸めず、影は画面の上に浮かぶものにだけ付けます。'
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
