<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Projects</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 900px; overflow: hidden; display: flex; background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif">
<div style="flex: none; width: 200px"><dc-import name="Nav" view="projects" hint-size="200px,900px"></dc-import></div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<main style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column">

<div style="flex: none">
<div style="height: 40px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-bottom: 1px solid #2a2a2a; background: #0a0a0a">
<h2 style="margin: 0; display: inline-flex; align-items: baseline; gap: 8px; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px"><span aria-hidden="true" style="font-weight: 700; color: #ef4444">##</span><span style="font-weight: 500; color: #fafafa">projects</span></h2>
<div role="group" aria-label="Project filter" style="margin-left: 10px; display: inline-flex; padding: 2px; border: 1px solid #2a2a2a; background: #141414">
<button type="button" aria-pressed="{{activeOn}}" style="padding: 4px 10px; border: 0; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 12px; line-height: 16px; font-weight: 500; {{activeStyle}}">active</button>
<button type="button" aria-pressed="{{allOn}}" style="padding: 4px 10px; border: 0; font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 12px; line-height: 16px; font-weight: 500; {{allStyle}}">all</button>
</div>
<a href="ProjectFormModal.dc.html" style="margin-left: auto; height: 24px; box-sizing: border-box; display: inline-flex; align-items: center; padding: 0 8px; border: 1px solid #71717a; background: #1f1f1f; color: #fafafa; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500; text-decoration: none; white-space: nowrap">+ new</a>
</div>
<div style="display: grid; grid-template-columns: 14px 1fr 96px 190px 78px; gap: 12px; padding: 6px 14px; background: #141414; border-bottom: 1px solid #2a2a2a; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px; letter-spacing: 0.1em; color: #52525b">
<span></span><span>PROJECT</span><span>STATUS</span><span>PROGRESS</span><span style="text-align: right">TARGET</span>
</div>
</div>

<sc-if value="{{isLoading}}" hint-placeholder-val="{{false}}">
<p style="margin: 0; padding: 16px; text-align: center; font-size: 14px; line-height: 20px; color: #71717a">Loading...</p>
</sc-if>

<sc-if value="{{isEmpty}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 64px 0; text-align: center">
<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #71717a; opacity: 0.5"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"></path><path d="M8 10v4"></path><path d="M12 10v2"></path><path d="M16 10v6"></path></svg>
<p style="margin: 0; font-size: 14px; line-height: 20px; color: #71717a">No projects yet</p>
<a href="ProjectFormModal.dc.html" style="height: 32px; box-sizing: border-box; display: inline-flex; align-items: center; padding: 0 10px; border: 1px solid #2a2a2a; background: #0a0a0a; color: #fafafa; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 500; text-decoration: none">Create your first project</a>
</div>
</sc-if>

<sc-if value="{{hasRows}}" hint-placeholder-val="{{true}}">
<div>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
<a href="ProjectDetail.dc.html" style="display: grid; grid-template-columns: 14px 1fr 96px 190px 78px; gap: 12px; align-items: center; padding: 12px 14px; border-bottom: 1px solid #2a2a2a; color: inherit; text-decoration: none">
<span aria-hidden="true" style="width: 7px; height: 7px; box-sizing: border-box; {{r.mark}}"></span>
<span style="min-width: 0; display: flex; flex-direction: column; gap: 4px">
<span style="font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 14px; line-height: 20px; font-weight: 500; color: #fafafa; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.title}}</span>
<sc-if value="{{r.hasDesc}}" hint-placeholder-val="{{true}}"><span style="font-size: 12px; line-height: 16px; color: #71717a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.description}}</span></sc-if>
</span>
<span><span style="display: inline-flex; align-items: center; padding: 2px 6px; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px; {{r.chip}}">{{r.status}}</span></span>
<span style="display: flex; align-items: center; gap: 10px">
<span style="flex: 1; height: 2px; background: #1f1f1f"><span style="display: block; height: 100%; width: {{r.pct}}; background: {{r.fill}}"></span></span>
<span style="width: 44px; flex: none; text-align: right; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px; color: #71717a">{{r.count}}</span>
</span>
<span style="text-align: right; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px; color: {{r.targetColor}}">{{r.target}}</span>
</a>
</sc-for>
</div>
</sc-if>

</main>
<dc-import name="StatusLine" path="/projects" hint-size="100%,24px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["rows","empty","loading"],"default":"rows"},"filter":{"editor":"enum","options":["all","active"],"default":"all"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const state = this.props.state ?? 'rows';
    const filter = this.props.filter ?? 'all';
    const on = 'background: #0a0a0a; color: #fafafa';
    const off = 'background: transparent; color: #71717a';
    const marks = {
      active: 'background: #fafafa',
      completed: 'background: #52525b',
      paused: 'border: 1px solid #71717a',
      archived: 'border: 1px solid #71717a'
    };
    const all = [
      ['庭のリフォーム', '裏庭の植栽と小道を計画して作る', 'active', 3, 8, 'Sep 30, 2026'],
      ['確定申告の準備', '', 'paused', 0, 4, ''],
      ['キッチン改装', '', 'completed', 12, 12, 'Jun 12, 2026'],
      ['旧ブログの移行', '記事を新しい静的サイトへ移す', 'archived', 5, 9, ''],
      ['英語の学び直し', '毎朝 30 分の音読を続ける', 'active', 7, 20, 'Dec 31, 2026'],
      ['写真の整理', '2020 年以降のアルバムを年ごとにまとめる', 'active', 14, 16, 'Jan 15, 2027'],
      ['引っ越し', '', 'active', 0, 0, '']
    ];
    const rows = all
      .filter((p) => filter === 'all' || p[2] === 'active')
      .map(([title, description, status, done, total, target]) => ({
        title, description, status,
        hasDesc: description !== '',
        mark: marks[status],
        chip: status === 'active' ? 'border: 1px solid #71717a; color: #fafafa' : 'border: 1px solid #2a2a2a; color: #52525b',
        fill: status === 'active' ? '#fafafa' : '#71717a',
        pct: (total === 0 ? 0 : Math.round(done / total * 100)) + '%',
        count: done + '/' + total,
        target: target || '—',
        targetColor: target ? '#a1a1aa' : '#52525b'
      }));
    return {
      rows,
      isLoading: state === 'loading',
      isEmpty: state === 'empty',
      hasRows: state === 'rows',
      activeOn: filter === 'active' ? 'true' : 'false',
      allOn: filter === 'all' ? 'true' : 'false',
      activeStyle: filter === 'active' ? on : off,
      allStyle: filter === 'all' ? on : off
    };
  }
}
</script>
</body>
</html>
