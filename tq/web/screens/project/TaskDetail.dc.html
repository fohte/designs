<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Task detail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: {{h}}; overflow: hidden; display: flex; background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif">
<div style="flex: none; width: 200px"><dc-import name="Nav" view="tasks" h="{{navH}}" hint-size="200px,{{h}}"></dc-import></div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<main style="flex: 1; min-height: 0; overflow: hidden; display: flex">
<div style="flex: 1; min-width: 0; overflow: hidden; padding: 24px 28px">
<div style="max-width: 768px; display: flex; flex-direction: column; gap: 20px; margin-top: {{shift}}">
<dc-import name="TaskDetailHead" status="{{headStatus}}" desc="{{desc}}" form="desktop" menu="{{menuTask}}" chips="{{chips}}" hint-size="100%,382px"></dc-import>
<dc-import name="TaskDetailChecklists" empty="{{empty}}" form="desktop" menu="{{menuChecklist}}" hint-size="100%,720px"></dc-import>
<dc-import name="TaskDetailPages" empty="{{empty}}" form="desktop" hint-size="100%,470px"></dc-import>
<dc-import name="TaskDetailSubtasks" empty="{{empty}}" hint-size="100%,293px"></dc-import>
<dc-import name="TaskDetailGithub" empty="{{empty}}" hint-size="100%,112px"></dc-import>
<sc-if value="{{isDuplicate}}" hint-placeholder-val="{{ false }}">
<section style="display: flex; flex-direction: column; gap: 10px">
<h3 style="margin: 0; display: inline-flex; align-items: baseline; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 14px; line-height: 20px; font-weight: 700"><span style="color: #ef4444; font-size: 12px">###</span>duplicate of</h3>
<div style="border: 1px solid #2a2a2a"><dc-import name="TaskRow" num="#97" title="ログイン後にトップへ戻される" status="todo" priority="" labels="#auth" project="会員サイト改修" context="work" due="" overdue="false" children="" expanded="false" waiting="false" depth="0" selected="false" hint-size="100%,57px"></dc-import></div>
</section>
</sc-if>
<dc-import name="TaskDetailDeps" variant="{{deps}}" hint-size="100%,540px"></dc-import>
<dc-import name="TaskDetailLinked" empty="{{empty}}" hint-size="100%,200px"></dc-import>
<dc-import name="TaskDetailSessions" empty="{{empty}}" hint-size="100%,98px"></dc-import>
<dc-import name="TaskDetailActivity" empty="{{empty}}" status="{{headStatus}}" form="desktop" hint-size="100%,556px"></dc-import>
</div>
</div>
<div style="flex: none; width: 240px; display: flex"><dc-import name="TaskDetailSidebar" status="{{headStatus}}" variant="{{sidebar}}" open="{{open}}" h="{{sideH}}" hint-size="240px,{{sideH}}"></dc-import></div>
</main>
<dc-import name="StatusLine" path="/tasks/128" hint-size="100%,24px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["full","completed","duplicate","waiting","empty"],"default":"full"},"desc":{"editor":"enum","options":["filled","empty","mention"],"default":"filled"},"menu":{"editor":"enum","options":["none","task","checklist","both"],"default":"none"},"open":{"editor":"text","default":""},"height":{"editor":"int","default":3680},"scroll":{"editor":"int","default":0},"$preview":{"width":1440,"height":3680}}'>
class Component extends DCLogic {
  renderVals() {
    const v = this.props.variant ?? 'full';
    const empty = v === 'empty';
    const menu = this.props.menu ?? 'none';
    const headStatus = v === 'completed' ? 'completed' : v === 'duplicate' ? 'duplicate' : 'todo';
    return {
      h: (this.props.height ?? 3680) + 'px',
      navH: Number(this.props.height ?? 3680),
      sideH: ((this.props.height ?? 3680) - 24) + 'px',
      shift: -(this.props.scroll ?? 0) + 'px',
      headStatus,
      isDuplicate: v === 'duplicate',
      desc: empty ? 'empty' : (this.props.desc ?? 'filled'),
      chips: empty ? 'context' : 'full',
      empty: empty ? 'true' : 'false',
      deps: empty ? 'empty' : v === 'waiting' ? 'waiting' : 'full',
      sidebar: empty ? 'empty' : 'full',
      menuTask: menu === 'task' || menu === 'both' ? 'true' : 'false',
      menuChecklist: menu === 'checklist' || menu === 'both' ? 'true' : 'false',
      open: this.props.open ?? '',
    };
  }
}
</script>
</body>
</html>
