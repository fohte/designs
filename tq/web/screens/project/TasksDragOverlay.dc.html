<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Dragging a task in the tree</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', sans-serif">
<dc-import name="TasksDesktop" firstRow="plain" drag="{{ true }}" hint-size="1440px,900px"></dc-import>
<div aria-hidden="true" style="position: absolute; left: 216px; top: 690px; z-index: 50; width: 1240px; box-sizing: border-box; border: 1px dashed #71717a; background: #141414">
<div style="display: flex; align-items: center; gap: 8px; padding: 8px 12px 8px 28px">
<span style="flex: none; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px; color: #52525b">#37</span>
<span style="min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; line-height: 20px">認証トークンの更新手順を書く</span>
</div>
<div style="padding: 4px 12px; border-top: 1px solid #2a2a2a; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 10px; line-height: 14px; color: #71717a">→ becomes child of #46</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
