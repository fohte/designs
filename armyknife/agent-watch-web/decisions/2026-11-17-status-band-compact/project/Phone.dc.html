<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Phone conversation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; border: 1px solid #2a2a2a; background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 15px; line-height: 1.55">
<header style="flex: none; display: grid; grid-template-columns: 44px 1fr auto; align-items: center; column-gap: 4px; padding: max(6px, env(safe-area-inset-top)) 8px 6px 0; border-bottom: 1px solid #2a2a2a">
<button type="button" aria-label="Back to Inbox" style="width: 44px; height: 44px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #d4d4d8"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
<h1 style="margin: 0; min-width: 0; font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">設定画面の文言をそろえる</h1>
<div style="display: flex; align-items: center; gap: 8px">
<button type="button" aria-label="Open session status panel" style="width: 44px; height: 44px; display: grid; place-items: center; padding: 0; border: 1px solid #3f3f46; background: transparent; color: #d4d4d8"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M15 3v18"></path><path d="m10 15-3-3 3-3"></path></svg></button>
<button type="button" aria-label="More actions" aria-haspopup="menu" aria-expanded="false" style="width: 44px; height: 44px; display: grid; place-items: center; padding: 0; border: 1px solid #3f3f46; background: transparent; color: #fafafa"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg></button>
</div>
<a href="#" style="grid-column: 1 / -1; min-width: 0; min-height: 24px; display: flex; align-items: center; gap: 6px; padding: 0 0 0 14px; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #a1a1aa; text-decoration: none; white-space: nowrap"><span style="min-width: 0; overflow: hidden; text-overflow: ellipsis">#512 文言を見直す</span><span aria-hidden="true" style="flex: none">·</span><span style="flex: none">example</span></a>
</header>
<div style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 14px; padding: 0 16px 16px">
<article style="align-self: flex-end; max-width: 92%; display: flex; flex-direction: column; gap: 4px">
<div style="text-align: right; font-size: 12px; color: #8b8b94">You · 14:20</div>
<div style="padding: 10px 14px; background: #1f1f1f">設定画面の文言をそろえて。古い翻訳キーも消して。</div>
</article>
<article style="color: #d4d4d8">ボタンとラベルの文言を一覧にしました。表記ゆれが 12 か所あったので、用語集に合わせて直しています。</article>
<div style="margin-top: -8px; font-size: 13px; color: #a1a1aa">Edit labels.ts · Read ×4 · Shell ×2 <span aria-hidden="true" style="color: #71717a">›</span></div>
<article style="color: #d4d4d8">{{say}}</article>
<sc-if value="{{isQ}}" hint-placeholder-val="{{ false }}">
<article style="border: 1px solid #fbbf24">
<h2 style="margin: 0; padding: 10px 14px 4px; color: #fbbf24; font-size: 12.5px; font-weight: 700">Question</h2>
<div style="padding: 0 14px 10px">既定の保存期間は 30 日でよいですか?</div>
<button type="button" style="width: 100%; min-height: 48px; display: flex; align-items: center; padding: 0 14px; border: 0; border-top: 1px solid #2a2a2a; background: transparent; color: #fafafa; font-family: inherit; font-size: 15px; text-align: left">30 日のままにする</button>
<button type="button" style="width: 100%; min-height: 48px; display: flex; align-items: center; padding: 0 14px; border: 0; border-top: 1px solid #2a2a2a; background: transparent; color: #fafafa; font-family: inherit; font-size: 15px; text-align: left">90 日にする</button>
</article>
</sc-if>
<sc-if value="{{isP}}" hint-placeholder-val="{{ false }}">
<article style="border: 1px solid #fbbf24">
<h2 style="margin: 0; padding: 10px 14px 4px; color: #fbbf24; font-size: 12.5px; font-weight: 700">Permission</h2>
<div style="padding: 0 14px 10px; font-family: 'JetBrains Mono', monospace; font-size: 13px">Bash  pnpm run migrate</div>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 14px 12px"><button type="button" style="height: 44px; border: 1px solid #fafafa; background: #fafafa; color: #0a0a0a; font-family: inherit; font-size: 14px; font-weight: 700">Allow</button><button type="button" style="height: 44px; border: 1px solid #3f3f46; background: transparent; color: #d4d4d8; font-family: inherit; font-size: 14px">Deny</button></div>
</article>
</sc-if>
</div>
<div style="flex: none"><dc-import name="Dock" option="{{option}}" state="{{state}}" phone="{{ true }}" open="{{open}}" hint-size="100%,150px"></dc-import></div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"option":{"editor":"enum","options":["now","a","b","c"],"default":"a"},"state":{"editor":"enum","options":["working","compacting","background","crit","question","permission","waiting"],"default":"waiting"},"open":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.props.state ?? 'waiting';
    const say = {
      working: '残りの画面も同じように直します。',
      compacting: '残りの画面も同じように直します。',
      background: 'ベンチマークを裏で回しています。終わったら結果をまとめます。',
      crit: '文言をそろえて PR #318 を作りました。crit で差分を見てください。',
      question: '保存期間を設定ファイルで変えられるようにしました。',
      permission: 'マイグレーションを流して確かめます。',
      waiting: 'PR 41 を作りました。CI は通っています。merge をお願いします。'
    }[st] || '';
    return { option: this.props.option ?? 'a', state: st, open: this.props.open ?? false, say, isQ: st === 'question', isP: st === 'permission' };
  }
}
</script>
</body>
</html>
