<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Session hasn't started band</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 14px; line-height: 1.5">

<sc-if value="{{isPc}}" hint-placeholder-val="{{ true }}">
<div role="status" style="box-sizing: border-box; width: min(712px, calc(100% - 48px)); margin: 12px auto 6px; display: flex; flex-direction: column; gap: 10px; padding: 10px 10px 10px 14px; border: 1px solid #a16207; background: #141414">
<div style="display: flex; align-items: center; gap: 12px">
<span aria-hidden="true" style="flex: none; width: 8px; height: 8px; background: #f59e0b"></span>
<span style="min-width: 0; flex: 1; display: flex; flex-direction: column"><span style="font-weight: 700">Session hasn't started</span><span style="color: #a1a1aa; font-size: 13px">{{since}}</span></span>
<button type="button" aria-expanded="{{expanded}}" style="flex: none; height: 32px; padding: 0 12px; border: 1px solid #fafafa; background: {{paneBg}}; color: {{paneFg}}; font-family: inherit; font-size: 12.5px; font-weight: 700">{{paneLabel}}</button>
<button type="button" aria-label="Open in terminal" title="Open in terminal" style="flex: none; width: 32px; height: 32px; display: grid; place-items: center; padding: 0; border: 1px solid #3f3f46; background: transparent; color: #d4d4d8"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 11 2-2-2-2"></path><path d="M11 13h4"></path><rect width="18" height="18" x="3" y="3" rx="2" ry="2"></rect></svg></button>
<button type="button" style="flex: none; height: 32px; padding: 0 12px; border: 1px solid #3f3f46; background: transparent; color: #fafafa; font-family: inherit; font-size: 12.5px">Retry</button>
<button type="button" style="flex: none; height: 32px; padding: 0 12px; border: 1px solid #3f3f46; background: transparent; color: #f87171; font-family: inherit; font-size: 12.5px">Close session</button>
</div>
<sc-if value="{{open}}" hint-placeholder-val="{{ false }}"><div style="min-width: 0; overflow: hidden; contain: inline-size"><dc-import name="PaneSnapshot" form="pc" repo="{{repo}}" engine="{{engine}}" body-h="{{ '260px' }}" hint-size="100%,296px"></dc-import></div></sc-if>
</div>
</sc-if>

<sc-if value="{{isPhone}}" hint-placeholder-val="{{ false }}">
<div role="status" style="display: flex; flex-direction: column; gap: 10px; padding: 12px 12px 6px; border-top: 1px solid #a16207; background: #141414">
<div style="display: flex; align-items: flex-start; gap: 8px"><span aria-hidden="true" style="flex: none; width: 8px; height: 8px; margin-top: 7px; background: #f59e0b"></span><span style="display: flex; flex-direction: column"><span style="font-weight: 700">Session hasn't started</span><span style="color: #a1a1aa; font-size: 13px">{{since}}</span></span></div>
<sc-if value="{{open}}" hint-placeholder-val="{{ false }}"><div style="min-width: 0; overflow: hidden; contain: inline-size"><dc-import name="PaneSnapshot" form="phone" repo="{{repo}}" engine="{{engine}}" body-h="{{ '230px' }}" hint-size="100%,276px"></dc-import></div></sc-if>
<div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px">
<button type="button" aria-expanded="{{expanded}}" style="min-height: 44px; border: 1px solid #fafafa; background: {{paneBg}}; color: {{paneFg}}; font-family: inherit; font-size: 13px; font-weight: 700">{{paneLabel}}</button>
<button type="button" style="min-height: 44px; border: 1px solid #3f3f46; background: transparent; color: #fafafa; font-family: inherit; font-size: 13px">Retry</button>
<button type="button" style="min-height: 44px; border: 1px solid #3f3f46; background: transparent; color: #f87171; font-family: inherit; font-size: 13px">Close session</button>
</div>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"form":{"editor":"enum","options":["pc","phone"],"default":"pc"},"pane":{"editor":"enum","options":["show","hide"],"default":"show"},"from":{"editor":"enum","options":["ended","paused"],"default":"ended"},"repo":{"editor":"text","default":"example/service"},"engine":{"editor":"enum","options":["claude","codex"],"default":"claude"},"$preview":{"width":760,"height":90}}'>
class Component extends DCLogic {
  renderVals() {
    const phone = (this.props.form ?? 'pc') === 'phone';
    // pane names the toggle's label: hide means the pane is open in the band.
    const open = (this.props.pane ?? 'show') === 'hide';
    return {
      isPc: !phone,
      isPhone: phone,
      open,
      // A paused session resumes on its own when a message is sent to it, so the line times the message, not a Resume press.
      since: (this.props.from ?? 'ended') === 'paused' ? 'Sent at 14:40 · no reply after 20 s' : 'Resumed at 14:40 · no reply after 20 s',
      paneLabel: open ?'Hide pane' : 'Show pane',
      expanded: open ? 'true' : 'false',
      // The open toggle reads as pressed, so it drops the fill.
      paneBg: open ? 'transparent' : '#fafafa',
      paneFg: open ? '#fafafa' : '#0a0a0a',
      repo: this.props.repo ?? 'example/service',
      engine: this.props.engine ?? 'claude'
    };
  }
}
</script>
</body>
</html>
