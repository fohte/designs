<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Phone: Save view sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<form role="dialog" aria-modal="true" aria-label="Save view" style="width: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px; margin: 0; padding: 18px 16px max(30px, env(safe-area-inset-bottom)); border-top: 1px solid #3f3f46; background: #1f1f1f; box-shadow: 0 -12px 36px rgb(0 0 0 / 30%); color: #d4d4d8; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 14px; line-height: 1.55">
<h2 style="margin: 0; color: #fafafa; font-size: 15px; font-weight: 700">Save view</h2>
<p style="margin: 0; font-size: 13px">Project web-app · Kind Question, Review</p>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; color: #a1a1aa">Name
<input placeholder="Name this view" maxlength="60" value="web-app のレビュー" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #3f3f46; background: #141414; color: #fafafa; font-family: inherit; font-size: 16px; outline: none"></label>
<p style="margin: 0; font-size: 12.5px; color: #8b8b94">Saved views appear under Views in the menu.</p>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px">
<button type="button" style="min-height: 44px; border: 1px solid #3f3f46; background: transparent; color: #fafafa; font-family: inherit; font-size: 12px">Cancel</button>
<button type="submit" style="min-height: 44px; border: 1px solid #fafafa; background: #fafafa; color: #0a0a0a; font-family: inherit; font-size: 12px; font-weight: 700">Save</button>
</div>
</form>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":300}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
