<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>New session with model and effort: desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; display: flex; overflow: hidden; background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 13px; line-height: 1.55">
<div style="flex: none; width: 240px"><dc-import name="Nav" view="inbox" hint-size="240px,900px"></dc-import></div>
<div style="flex: none; width: 460px; border-right: 1px solid #2a2a2a"><dc-import name="InboxList" filter="none" hint-size="460px,900px"></dc-import></div>
<div style="position: relative; flex: 1; min-width: 0">
<div style="height: 900px; display: flex; flex-direction: column">
<header style="flex: none; display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 0 16px; border-bottom: 1px solid #2a2a2a"><h1 style="margin: 0; font-size: 15px">New session</h1>
<button type="button" aria-haspopup="listbox" aria-expanded="false" style="margin-left: auto; min-width: 0; height: 32px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; border: 1px solid #3f3f46; background: transparent; color: #fafafa; font-family: 'JetBrains Mono', monospace; font-size: 12px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"></path></svg> example/service ▾</button></header>
<div style="flex: 1; display: grid; place-items: center; padding: 24px; color: #8b8b94; font-size: 13px; text-align: center">The conversation opens here when the session starts.</div>
<div style="flex: none; padding: 12px 16px 16px; border-top: 1px solid #2a2a2a">
<div style="border: 1px solid #52525b; background: #0f0f0f">
<textarea aria-label="First message" placeholder="First message (optional)" style="display: block; width: 100%; height: 72px; box-sizing: border-box; padding: 10px 12px; border: 0; outline: none; background: transparent; color: #fafafa; font-family: inherit; font-size: inherit; resize: none">配信ログの保存期間を設定ファイルに出したい</textarea>
<sc-if value="{{ isSwitch }}" hint-placeholder-val="{{ false }}">
<div role="status" style="display: flex; align-items: center; gap: 8px; margin: 0 8px 2px; padding: 6px 10px; border: 1px solid #3f3f46; background: #161616; color: #d4d4d8; font-size: 12px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4"></path><path d="M12 8h.01"></path></svg><span>Codex has no <span style="font-family: 'JetBrains Mono', monospace; font-size: 11.5px">borealis-5</span>, so the model is back to the default. Effort stays <span style="font-family: 'JetBrains Mono', monospace; font-size: 11.5px">xhigh</span>.</span><button type="button" style="margin-left: auto; height: 24px; padding: 0 8px; border: 1px solid #3f3f46; background: transparent; color: #fafafa; font-family: inherit; font-size: 12px">Undo</button></div>
</sc-if>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 8px">
<sc-if value="{{ isA }}" hint-placeholder-val="{{ true }}">
<button type="button" aria-haspopup="menu" aria-label="Engine" style="height: 30px; padding: 0 10px; border: 1px solid #3f3f46; background: transparent; color: #fafafa; font-family: inherit; font-size: 12.5px">{{ s.engine }} ▾</button>
<button type="button" aria-haspopup="menu" aria-label="Model" aria-expanded="{{ menuOpen }}" style="height: 30px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; border: 1px solid {{ s.modelBorder }}; background: transparent; color: {{ s.modelColor }}; font-family: inherit; font-size: 12.5px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="16" height="16" x="4" y="4" rx="2"></rect><rect width="6" height="6" x="9" y="9" rx="1"></rect><path d="M15 2v2"></path><path d="M15 20v2"></path><path d="M2 15h2"></path><path d="M2 9h2"></path><path d="M20 15h2"></path><path d="M20 9h2"></path><path d="M9 2v2"></path><path d="M9 20v2"></path></svg><span>{{ s.model }}</span><sc-if value="{{ s.modelDefault }}" hint-placeholder-val="{{ true }}"><span style="font-size: 11px; color: #8b8b94">default</span></sc-if> ▾</button>
<button type="button" aria-haspopup="menu" aria-label="Reasoning effort" style="height: 30px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; border: 1px solid {{ s.effortBorder }}; background: transparent; color: {{ s.effortColor }}; font-family: inherit; font-size: 12.5px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 14 4-4"></path><path d="M3.34 19a10 10 0 1 1 17.32 0"></path></svg><span>{{ s.effort }}</span><sc-if value="{{ s.effortDefault }}" hint-placeholder-val="{{ true }}"><span style="font-size: 11px; color: #8b8b94">default</span></sc-if> ▾</button>
</sc-if>
<sc-if value="{{ isB }}" hint-placeholder-val="{{ false }}">
<button type="button" aria-haspopup="menu" aria-label="Engine" style="height: 30px; padding: 0 10px; border: 1px solid #3f3f46; background: transparent; color: #fafafa; font-family: inherit; font-size: 12.5px">{{ s.engine }} ▾</button>
<button type="button" aria-haspopup="dialog" aria-label="Model and reasoning effort" aria-expanded="{{ menuOpen }}" style="height: 30px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; border: 1px solid {{ s.comboBorder }}; background: transparent; color: #fafafa; font-family: inherit; font-size: 12.5px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="16" height="16" x="4" y="4" rx="2"></rect><rect width="6" height="6" x="9" y="9" rx="1"></rect><path d="M15 2v2"></path><path d="M15 20v2"></path><path d="M2 15h2"></path><path d="M2 9h2"></path><path d="M20 15h2"></path><path d="M20 9h2"></path><path d="M9 2v2"></path><path d="M9 20v2"></path></svg><span style="color: {{ s.modelColor }}">{{ s.model }}</span><span aria-hidden="true" style="color: #71717a">·</span><span style="color: {{ s.effortColor }}">{{ s.effort }}</span><sc-if value="{{ s.allDefault }}" hint-placeholder-val="{{ true }}"><span style="font-size: 11px; color: #8b8b94">default</span></sc-if> ▾</button>
</sc-if>
<sc-if value="{{ isC }}" hint-placeholder-val="{{ false }}">
<button type="button" aria-haspopup="dialog" aria-label="Engine, model and reasoning effort" aria-expanded="{{ menuOpen }}" style="height: 30px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; border: 1px solid {{ s.comboBorder }}; background: transparent; color: #fafafa; font-family: inherit; font-size: 12.5px"><span>{{ s.engine }}</span><span aria-hidden="true" style="color: #71717a">·</span><span style="color: {{ s.modelColor }}">{{ s.model }}</span><span aria-hidden="true" style="color: #71717a">·</span><span style="color: {{ s.effortColor }}">{{ s.effort }}</span><sc-if value="{{ s.allDefault }}" hint-placeholder-val="{{ true }}"><span style="font-size: 11px; color: #8b8b94">default</span></sc-if> ▾</button>
</sc-if>
<button type="button" aria-haspopup="menu" style="height: 30px; display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; border: 1px solid #3f3f46; background: transparent; color: #fafafa; font-family: inherit; font-size: 12.5px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="6" x2="6" y1="3" y2="15"></line><circle cx="18" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><path d="M18 9a9 9 0 0 1-9 9"></path></svg> New worktree ▾</button>
<button type="button" style="margin-left: auto; height: 32px; padding: 0 14px; border: 0; background: #fafafa; color: #0a0a0a; font-family: inherit; font-size: 13px; font-weight: 700">Start ↵</button>
</div></div></div></div>

<sc-if value="{{ aMenu }}" hint-placeholder-val="{{ false }}">
<div role="menu" aria-label="Model" style="position: absolute; left: 131px; bottom: 60px; z-index: 10; width: 300px; box-sizing: border-box; padding: 4px 0; background: #161616; border: 1px solid #3f3f46; box-shadow: 0 12px 36px rgb(0 0 0 / 40%)">
<div style="height: 28px; display: flex; align-items: center; padding: 0 12px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; color: #8b8b94">CLAUDE CODE MODELS</div>
<button type="button" role="menuitemradio" aria-checked="true" style="width: 100%; min-height: 44px; display: grid; grid-template-columns: 16px 1fr auto; align-items: center; gap: 8px; padding: 4px 12px; border: 0; background: transparent; color: #fafafa; font-family: inherit; font-size: 13px; text-align: left"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg><span>Default<span style="display: block; font-size: 11px; color: #8b8b94">from profile daily</span></span><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #a1a1aa">atlas-5</span></button>
<div aria-hidden="true" style="height: 1px; margin: 4px 0; background: #2a2a2a"></div>
<button type="button" role="menuitemradio" aria-checked="false" style="width: 100%; min-height: 36px; display: grid; grid-template-columns: 16px 1fr auto; align-items: center; gap: 8px; padding: 4px 12px; border: 0; background: transparent; color: #fafafa; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; text-align: left"><span></span><span>atlas-5</span><span style="font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 11.5px; color: #8b8b94">low–max</span></button>
<button type="button" role="menuitemradio" aria-checked="false" style="width: 100%; min-height: 36px; display: grid; grid-template-columns: 16px 1fr auto; align-items: center; gap: 8px; padding: 4px 12px; border: 0; background: #2a2a2e; color: #fafafa; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; text-align: left"><span></span><span>borealis-5</span><span style="font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 11.5px; color: #a1a1aa">low–max</span></button>
<button type="button" role="menuitemradio" aria-checked="false" style="width: 100%; min-height: 36px; display: grid; grid-template-columns: 16px 1fr auto; align-items: center; gap: 8px; padding: 4px 12px; border: 0; background: transparent; color: #fafafa; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; text-align: left"><span></span><span>comet-5</span><span style="font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 11.5px; color: #8b8b94">low–high</span></button>
</div>
</sc-if>

<sc-if value="{{ bMenu }}" hint-placeholder-val="{{ false }}">
<div role="dialog" aria-label="Model and reasoning effort" style="position: absolute; left: 131px; bottom: 60px; z-index: 10; width: 340px; box-sizing: border-box; padding: 4px 0 12px; background: #161616; border: 1px solid #3f3f46; box-shadow: 0 12px 36px rgb(0 0 0 / 40%)">
<div style="height: 28px; display: flex; align-items: center; padding: 0 12px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; color: #8b8b94">MODEL · CLAUDE CODE</div>
<div role="radiogroup" aria-label="Model">
<button type="button" role="radio" aria-checked="true" style="width: 100%; min-height: 36px; display: grid; grid-template-columns: 16px 1fr auto; align-items: center; gap: 8px; padding: 4px 12px; border: 0; background: transparent; color: #fafafa; font-family: inherit; font-size: 13px; text-align: left"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg><span>Default <span style="font-size: 11px; color: #8b8b94">profile daily</span></span><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #a1a1aa">atlas-5</span></button>
<button type="button" role="radio" aria-checked="false" style="width: 100%; min-height: 36px; display: grid; grid-template-columns: 16px 1fr auto; align-items: center; gap: 8px; padding: 4px 12px; border: 0; background: transparent; color: #fafafa; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; text-align: left"><span></span><span>atlas-5</span><span></span></button>
<button type="button" role="radio" aria-checked="false" style="width: 100%; min-height: 36px; display: grid; grid-template-columns: 16px 1fr auto; align-items: center; gap: 8px; padding: 4px 12px; border: 0; background: #2a2a2e; color: #fafafa; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; text-align: left"><span></span><span>borealis-5</span><span></span></button>
<button type="button" role="radio" aria-checked="false" style="width: 100%; min-height: 36px; display: grid; grid-template-columns: 16px 1fr auto; align-items: center; gap: 8px; padding: 4px 12px; border: 0; background: transparent; color: #fafafa; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; text-align: left"><span></span><span>comet-5</span><span style="font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 11.5px; color: #8b8b94">up to high</span></button>
</div>
<div style="height: 28px; display: flex; align-items: center; margin-top: 6px; padding: 0 12px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; color: #8b8b94">EFFORT</div>
<div role="radiogroup" aria-label="Reasoning effort" style="display: flex; margin: 0 12px; border: 1px solid #3f3f46">
<sc-for list="{{ efforts }}" as="e" hint-placeholder-count="6"><button type="button" role="radio" aria-checked="{{ e.on }}" style="flex: 1 1 auto; height: 30px; padding: 0 6px; border: 0; border-right: 1px solid #3f3f46; background: {{ e.bg }}; color: {{ e.fg }}; font-family: inherit; font-size: 12px; white-space: nowrap">{{ e.label }}</button></sc-for>
</div>
</div>
</sc-if>

<sc-if value="{{ cMenu }}" hint-placeholder-val="{{ false }}">
<div role="dialog" aria-label="Engine, model and reasoning effort" style="position: absolute; left: 25px; bottom: 60px; z-index: 10; width: 360px; box-sizing: border-box; padding: 4px 0 12px; background: #161616; border: 1px solid #3f3f46; box-shadow: 0 12px 36px rgb(0 0 0 / 40%)">
<div role="radiogroup" aria-label="Engine and model">
<div style="height: 28px; display: flex; align-items: center; padding: 0 12px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; color: #8b8b94">CLAUDE CODE</div>
<button type="button" role="radio" aria-checked="true" style="width: 100%; min-height: 36px; display: grid; grid-template-columns: 16px 1fr auto; align-items: center; gap: 8px; padding: 4px 12px; border: 0; background: transparent; color: #fafafa; font-family: inherit; font-size: 13px; text-align: left"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg><span>Default</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #a1a1aa">atlas-5 · high</span></button>
<button type="button" role="radio" aria-checked="false" style="width: 100%; min-height: 36px; display: grid; grid-template-columns: 16px 1fr auto; align-items: center; gap: 8px; padding: 4px 12px; border: 0; background: #2a2a2e; color: #fafafa; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; text-align: left"><span></span><span>borealis-5</span><span></span></button>
<button type="button" role="radio" aria-checked="false" style="width: 100%; min-height: 36px; display: grid; grid-template-columns: 16px 1fr auto; align-items: center; gap: 8px; padding: 4px 12px; border: 0; background: transparent; color: #fafafa; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; text-align: left"><span></span><span>comet-5</span><span style="font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 11.5px; color: #8b8b94">up to high</span></button>
<div style="height: 28px; display: flex; align-items: center; margin-top: 4px; padding: 0 12px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; color: #8b8b94">CODEX</div>
<button type="button" role="radio" aria-checked="false" style="width: 100%; min-height: 36px; display: grid; grid-template-columns: 16px 1fr auto; align-items: center; gap: 8px; padding: 4px 12px; border: 0; background: transparent; color: #fafafa; font-family: inherit; font-size: 13px; text-align: left"><span></span><span>Default</span><span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #a1a1aa">cobalt-2 · medium</span></button>
<button type="button" role="radio" aria-checked="false" style="width: 100%; min-height: 36px; display: grid; grid-template-columns: 16px 1fr auto; align-items: center; gap: 8px; padding: 4px 12px; border: 0; background: transparent; color: #fafafa; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; text-align: left"><span></span><span>cobalt-2-mini</span><span style="font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 11.5px; color: #8b8b94">up to high</span></button>
</div>
<div style="height: 1px; margin: 6px 0; background: #2a2a2a"></div>
<div style="height: 28px; display: flex; align-items: center; padding: 0 12px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; color: #8b8b94">EFFORT</div>
<div role="radiogroup" aria-label="Reasoning effort" style="display: flex; margin: 0 12px; border: 1px solid #3f3f46">
<sc-for list="{{ efforts }}" as="e" hint-placeholder-count="6"><button type="button" role="radio" aria-checked="{{ e.on }}" style="flex: 1 1 auto; height: 30px; padding: 0 6px; border: 0; border-right: 1px solid #3f3f46; background: {{ e.bg }}; color: {{ e.fg }}; font-family: inherit; font-size: 12px; white-space: nowrap">{{ e.label }}</button></sc-for>
</div>
</div>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"option":{"editor":"enum","options":["a","b","c"],"default":"a"},"state":{"editor":"enum","options":["default","menu","chosen","switch"],"default":"default"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const option = this.props.option ?? 'a';
    const state = this.props.state ?? 'default';
    const base = { engine: 'Claude Code', model: 'atlas-5', modelDefault: true, effort: 'high', effortDefault: true };
    const states = {
      default: base,
      menu: base,
      chosen: { engine: 'Claude Code', model: 'borealis-5', modelDefault: false, effort: 'xhigh', effortDefault: false },
      switch: { engine: 'Codex', model: 'cobalt-2', modelDefault: true, effort: 'xhigh', effortDefault: false },
    };
    const menuOpen = state === 'menu';
    const s = { ...(states[state] ?? base) };
    s.allDefault = s.modelDefault && s.effortDefault;
    s.modelColor = s.modelDefault ? '#a1a1aa' : '#fafafa';
    s.effortColor = s.effortDefault ? '#a1a1aa' : '#fafafa';
    s.modelBorder = menuOpen ? '#fafafa' : (s.modelDefault ? '#3f3f46' : '#71717a');
    s.effortBorder = s.effortDefault ? '#3f3f46' : '#71717a';
    s.comboBorder = menuOpen ? '#fafafa' : (s.allDefault ? '#3f3f46' : '#71717a');
    const efforts = ['Default · high', 'low', 'medium', 'high', 'xhigh', 'max'].map((label, i) => ({
      label,
      on: i === 0,
      bg: i === 0 ? '#fafafa' : 'transparent',
      fg: i === 0 ? '#0a0a0a' : '#d4d4d8',
    }));
    return {
      s,
      menuOpen,
      efforts,
      isA: option === 'a',
      isB: option === 'b',
      isC: option === 'c',
      aMenu: option === 'a' && menuOpen,
      bMenu: option === 'b' && menuOpen,
      cMenu: option === 'c' && menuOpen,
      isSwitch: state === 'switch',
    };
  }
}
</script>
</body>
</html>
