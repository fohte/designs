<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Conversation header as decided in header-context</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<header style="width: 100%; box-sizing: border-box; display: flex; align-items: flex-start; gap: 8px; padding: {{pad}}; background: #0a0a0a; border-bottom: 1px solid #2a2a2a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; line-height: 1.5">
<sc-if value="{{phone}}" hint-placeholder-val="{{ false }}"><button type="button" aria-label="Back to Inbox" style="flex: none; width: 44px; height: 44px; margin-left: -12px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #d4d4d8"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button></sc-if>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; align-items: center; gap: 6px; min-width: 0; overflow: hidden; white-space: nowrap; font-size: {{meta}}; color: #8b8b94">
<span title="example/notification-service ⑂ fix-resend-limit" style="flex: 0 1 auto; min-width: 12ch; display: flex; gap: 6px; overflow: hidden; font-family: 'JetBrains Mono', monospace"><span style="flex: 0 1 auto; min-width: 8ch; overflow: hidden; text-overflow: ellipsis">example/notification-service</span><span style="flex: none">⑂</span><span style="flex: 1 1 0; max-width: max-content; min-width: 0; overflow: hidden; text-overflow: ellipsis">fix-resend-limit</span></span>
<span style="flex: none">·</span>
<a href="#" title="P1 #2048 通知の信頼性を上げる" style="flex: 1 1 0; max-width: max-content; min-width: 3em; display: flex; gap: 5px; overflow: hidden; color: inherit; text-decoration: none"><span style="flex: none; font-family: 'JetBrains Mono', monospace; color: #a1a1aa">#2048</span><span style="min-width: 0; overflow: hidden; text-overflow: ellipsis">通知の信頼性を上げる</span></a>
</div>
<h1 style="margin: 0; font-size: {{titleSize}}; font-weight: 700; {{titleClamp}}">通知の再送処理を見直す</h1>
</div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"form":{"editor":"enum","options":["pc","phone"],"default":"pc"},"$preview":{"width":600,"height":76}}'>
class Component extends DCLogic {
  renderVals() {
    const phone = (this.props.form ?? 'pc') === 'phone';
    return {
      phone,
      pad: phone ? '6px 16px 10px' : '14px 24px',
      meta: phone ? '12.5px' : '12px',
      titleSize: phone ? '17px' : '16px',
      titleClamp: 'overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical'
    };
  }
}
</script>
</body>
</html>
