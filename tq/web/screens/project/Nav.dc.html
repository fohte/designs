<script type="text/x-dc" data-dc-script data-props='{"view":{"editor":"enum","options":["today","calendar","inbox","tasks","projects","settings","none"],"default":"tasks"},"form":{"editor":"enum","options":["desktop","browse"],"default":"desktop"},"activeTag":{"editor":"boolean","default":false},"h":{"editor":"int","default":900},"$preview":{"width":200,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const view = this.props.view ?? 'tasks';
    const browse = (this.props.form ?? 'desktop') === 'browse';
    const keys = ['today', 'calendar', 'inbox', 'tasks', 'projects', 'settings'];
    const row = {}, bar = {}, cur = {};
    for (const k of keys) {
      const on = view === k;
      row[k] = on ? 'background: #141414; color: #fafafa' : 'background: transparent; color: #71717a';
      bar[k] = on ? 'background: #ef4444' : 'background: transparent';
      cur[k] = on ? 'page' : 'false';
    }
    const activeTag = this.props.activeTag ?? false;
    return {
      row, bar, cur,
      desktop: !browse,
      browse,
      // The desktop sidebar fills the window and lets TAGS take the leftover height; /browse is a scrolling page.
      rootStyle: browse ? 'width: 100%; position: relative' : `width: 200px; height: ${this.props.h ?? 900}px; position: relative; border-right: 1px solid #2a2a2a`,
      tagsStyle: browse ? 'flex: none' : 'flex: 1; min-height: 0',
      settingsWrap: browse ? 'margin-top: 0' : 'margin-top: auto',
      tagActive: activeTag ? 'background: #141414; color: #fafafa' : 'color: #a1a1aa',
      tagActiveHash: activeTag ? 'color: #ef4444' : 'color: #52525b'
    };
  }
}
</script>
