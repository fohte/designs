<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>B · PC · セッションを選ぶと、その tq task が入る</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 900px; overflow: hidden; background: #0a0a0a">
<dc-import name="ScenePc" overlay="{{ overlay }}" picker="{{ picker }}" hint-size="1440px,900px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      "overlay": "picker",
      "picker": {
        "mode": "tabs",
        "step": "session"
      }
    };
  }
}
</script>
</body>
</html>
