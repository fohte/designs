<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Phone conversation header with vibe mode</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<header style="width: 100%; box-sizing: border-box; display: grid; grid-template-columns: 44px 1fr auto; align-items: center; column-gap: 4px; padding: 6px 8px 6px 0; border-bottom: 1px solid #2a2a2a; background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 15px; line-height: 1.55">
<button type="button" aria-label="Back to Inbox" style="width: 44px; height: 44px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #d4d4d8"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
<div style="display: flex; align-items: center; gap: 5px; min-width: 0"><h1 style="margin: 0; min-width: 0; font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">通知の再送処理を見直す</h1></div>
<div style="display: flex; align-items: center; gap: 8px">
<button type="button" aria-label="Open session status panel" style="width: 44px; height: 44px; display: grid; place-items: center; padding: 0; border: 1px solid #3f3f46; background: transparent; color: #d4d4d8"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M15 3v18"></path><path d="m10 15-3-3 3-3"></path></svg></button>
<button type="button" aria-label="More actions" aria-haspopup="menu" aria-expanded="{{menuStr}}" style="width: 44px; height: 44px; display: grid; place-items: center; padding: 0; border: 1px solid {{menuBorder}}; background: {{menuBg}}; color: #fafafa"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg></button>
</div>
<a href="#" style="grid-column: 1 / -1; min-width: 0; min-height: 24px; display: flex; align-items: center; gap: 6px; padding: 0 0 0 14px; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #a1a1aa; text-decoration: none; white-space: nowrap"><span style="min-width: 0; overflow: hidden; text-overflow: ellipsis">#2048 通知の信頼性を上げる</span><span aria-hidden="true" style="flex: none">·</span><span style="flex: none">{{repo}}</span><sc-if value="{{ctxVibe}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="flex: none">·</span><span role="img" aria-label="{{vibeLabel}}" style="flex: none; color: #d4d4d8">{{vibeWord}}</span></sc-if></a>
<sc-if value="{{strip}}" hint-placeholder-val="{{ false }}">
<button type="button" aria-haspopup="dialog" aria-expanded="{{openStr}}" style="grid-column: 1 / -1; min-width: 0; min-height: 36px; box-sizing: border-box; display: flex; align-items: center; gap: 8px; margin: 4px 0 -6px 0; padding: 0 14px; border: 0; border-top: 1px solid #1a1a1a; background: {{stripBg}}; color: {{stripColor}}; font-family: inherit; font-size: 13px; text-align: left; white-space: nowrap"><sc-if value="{{stripIcon}}" hint-placeholder-val="{{ true }}"><svg width="13" height="13" viewBox="0 0 24 24" fill="{{zapFill}}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"></path></svg></sc-if><span style="flex: none">{{stripText}}</span><span style="min-width: 0; overflow: hidden; text-overflow: ellipsis; color: #a1a1aa; font-size: 12.5px">{{stripSub}}</span><span aria-hidden="true" style="margin-left: auto; color: #71717a">›</span></button>
</sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"opt":{"editor":"enum","options":["current","a","b","c"],"default":"a"},"state":{"editor":"enum","options":["on","onParent","inherited","off","blocked"],"default":"on"},"menu":{"editor":"boolean","default":false},"open":{"editor":"boolean","default":false},"$preview":{"width":390,"height":120}}'>
class Component extends DCLogic {
  renderVals() {
    const opt = this.props.opt ?? 'a';
    const state = this.props.state ?? 'on';
    const menu = this.props.menu ?? false;
    const open = this.props.open ?? false;
    const on = state === 'on' || state === 'onParent';
    const inh = state === 'inherited';
    const blocked = state === 'blocked';
    const parent = '通知まわりの改修';
    return {
      repo: blocked ? 'legacy' : 'service',
      menuStr: menu ? 'true' : 'false',
      menuBorder: menu ? '#a1a1aa' : '#3f3f46',
      menuBg: menu ? '#262626' : 'transparent',
      ctxVibe: (opt === 'a' || opt === 'c') && (on || inh),
      vibeWord: inh ? 'vibe ↑' : 'vibe',
      vibeLabel: inh ? 'Vibe mode on, inherited from ' + parent : 'Vibe mode on',
      strip: opt === 'b',
      openStr: open ? 'true' : 'false',
      stripBg: open ? '#262626' : 'transparent',
      stripColor: (on || inh || open) ? '#fafafa' : '#a1a1aa',
      stripIcon: on || inh,
      zapFill: on ? 'currentColor' : 'none',
      stripText: on ? 'Vibe on' : inh ? 'Vibe on · inherited' : blocked ? 'Vibe unavailable' : 'Vibe off',
      stripSub: inh ? 'from ' + parent : blocked ? 'example/legacy does not allow it' : ''
    };
  }
}
</script>
</body>
</html>
