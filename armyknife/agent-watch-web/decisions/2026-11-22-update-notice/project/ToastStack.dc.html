<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Toast stack</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div role="status" aria-live="polite" style="width: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif">
<sc-for list="{{items}}" as="t" hint-placeholder-count="2">
<dc-import name="ActionItem" a="{{ t }}" form="toast" phone="{{ phone }}" hint-size="100%,72px"></dc-import>
</sc-for>
<sc-if value="{{update}}" hint-placeholder-val="{{ false }}"><dc-import name="UpdateNotice" form="card" phone="{{ phone }}" hint-size="100%,110px"></dc-import></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"items":{"editor":null},"phone":{"editor":"boolean","default":false},"update":{"editor":"boolean","default":false},"$preview":{"width":360,"height":240}}'>
class Component extends DCLogic {
  renderVals() {
    // Newest at the bottom, nearest the edge it slides in from.
    // update: the update card keeps the bottom slot until Reload or ×; toasts stack above it without moving it.
    return {
      update: this.props.update ?? false,
      phone: this.props.phone ?? false,
      items: this.props.items ?? [
        { result: 'merging', pr: 2049, session: '配信チェックの PR を確認する' },
        { result: 'mergeFailed', pr: 2049, session: '配信チェックの PR を確認する', reason: 'Head branch was updated after you confirmed. Confirm the new head to merge.' }
      ]
    };
  }
}
</script>
</body>
</html>
