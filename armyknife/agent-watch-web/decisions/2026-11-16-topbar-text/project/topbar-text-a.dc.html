<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Top bar text · A</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<main style="position: relative; width: 100%; height: 100vh; box-sizing: border-box; display: flex; flex-direction: column; background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 15px; line-height: 1.55">
<header style="flex: none; display: grid; grid-template-columns: 44px 1fr auto; align-items: center; column-gap: 4px; padding: 6px 8px 4px 0; border-bottom: 1px solid #2a2a2a">
<button type="button" aria-label="Back to Inbox" style="width: 44px; height: 44px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #d4d4d8"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
<div style="display: flex; align-items: center; gap: 5px; min-width: 0"><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Starred" style="flex: none; color: #fbbf24"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"></path></svg><h1 style="margin: 0; min-width: 0; font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">通知の再送処理を見直して上限の回数を設定ファイルに出す</h1></div>
<div style="display: flex; align-items: center; gap: 8px">
<button type="button" aria-label="Open session status panel" style="width: 40px; height: 40px; display: grid; place-items: center; padding: 0; border: 1px solid #3f3f46; background: transparent; color: #60a5fa"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M15 3v18"></path><path d="m10 15-3-3 3-3"></path></svg></button>
<button type="button" aria-label="More actions" aria-haspopup="menu" aria-expanded="false" style="width: 40px; height: 40px; display: grid; place-items: center; padding: 0; border: 1px solid #3f3f46; background: transparent; color: #fafafa"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg></button>
</div>
<div style="grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; min-width: 0; padding-left: 14px; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #a1a1aa; white-space: nowrap"><span style="flex: none; color: #fbbf24">Paused</span><span aria-hidden="true">·</span><span style="min-width: 0; overflow: hidden; text-overflow: ellipsis">#2048 通知の信頼性を上げる</span><span aria-hidden="true">·</span><span style="flex: none">service</span><span style="flex: 1"></span><button type="button" aria-label="12 completed linked tq tasks" aria-expanded="false" style="flex: none; min-height: 32px; padding: 0 2px; border: 0; background: transparent; color: #a1a1aa; font-family: 'JetBrains Mono', monospace; font-size: 11.5px">+12 done ▾</button></div>
</header>
<div style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 14px; padding: 0 16px 16px">
<article style="align-self: flex-end; max-width: 92%; display: flex; flex-direction: column; gap: 4px">
<div style="text-align: right; font-size: 12px; color: #8b8b94">You · 10:02</div>
<div style="padding: 10px 14px; background: #1f1f1f">通知の再送処理を見直して。失敗したら何回か再試行したい。</div>
</article>
<article style="color: #d4d4d8">再送処理を <code style="padding: 0.1em 0.35em; background: #262626; font-family: 'JetBrains Mono', monospace; font-size: 0.9em">retry()</code> にまとめました。上限の回数だけ決めてください。</article>
<article style="border: 1px solid #fbbf24">
<h2 style="margin: 0; padding: 10px 14px 4px; color: #fbbf24; font-size: 12.5px; font-weight: 700">Question</h2>
<div style="padding: 0 14px 10px; font-size: 15px">再試行は 3 回で止めてよいですか?</div>
<sc-for list="{{choices}}" as="c" hint-placeholder-count="3">
<button type="button" style="width: 100%; min-height: 48px; display: flex; align-items: center; padding: 0 14px; border: 0; border-top: 1px solid #2a2a2a; background: transparent; color: #fafafa; font-family: inherit; font-size: 15px; text-align: left">{{c}}</button>
</sc-for>
</article>
</div>

<form style="flex: none; display: grid; grid-template-columns: 1fr 44px; gap: 8px; padding: 10px 12px 30px; border-top: 1px solid #2a2a2a; background: #141414">
<textarea aria-label="Message" rows="1" placeholder="Choose an option above, or message the session" style="min-height: 44px; box-sizing: border-box; padding: 10px 12px; border: 1px solid #3f3f46; background: #0a0a0a; color: #fafafa; font-family: inherit; font-size: 16px; resize: none; outline: none"></textarea>
<button type="submit" aria-label="Send message" style="width: 44px; height: 44px; display: grid; place-items: center; padding: 0; border: 0; background: #fafafa; color: #141414"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 7-7 7 7"></path><path d="M12 19V5"></path></svg></button>
</form>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { choices: ['3 回で止める', '5 回まで続ける', '上限を設定ファイルに出す'] };
  }
}
</script>
</body>
</html>
