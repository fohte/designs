<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Phone conversation of an ended session</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<main style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; border: 1px solid #2a2a2a; background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 15px; line-height: 1.55">
<header style="flex: none; display: grid; grid-template-columns: 44px 1fr; align-items: center; column-gap: 4px; padding: 6px 8px 6px 0; border-bottom: 1px solid #2a2a2a">
<button type="button" aria-label="Back to Inbox" style="width: 44px; height: 44px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #d4d4d8"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
<h1 style="margin: 0; min-width: 0; font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">設定画面の文言をそろえる</h1>
</header>
<div style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 14px; padding: 0 16px 16px">
<article style="align-self: flex-end; max-width: 92%; padding: 10px 14px; background: #1f1f1f">設定画面の文言をそろえて。</article>
<article style="color: #d4d4d8">文言をそろえて PR #318 を作りました。これで終わります。</article>
<sc-if value="{{showSent}}" hint-placeholder-val="{{ false }}">
<article style="align-self: flex-end; max-width: 92%; display: flex; flex-direction: column; align-items: flex-end; gap: 4px"><div style="padding: 10px 14px; background: #1f1f1f">ヘルプ画面の文言もそろえて。</div><div role="status" style="font-size: 12.5px; color: #a1a1aa">Resuming the session…</div></article>
</sc-if>
</div>

<sc-if value="{{isNow}}" hint-placeholder-val="{{ false }}">
<form style="flex: none; display: grid; grid-template-columns: 1fr 44px; gap: 8px; padding: 10px 12px max(30px, env(safe-area-inset-bottom)); border-top: 1px solid #2a2a2a; background: #141414">
<textarea aria-label="Message" rows="1" disabled placeholder="Message session" style="min-height: 44px; box-sizing: border-box; padding: 10px 12px; border: 1px solid #3f3f46; background: #0a0a0a; color: #fafafa; font-family: inherit; font-size: 16px; resize: none; outline: none"></textarea>
<button type="submit" disabled aria-label="Send message" style="width: 44px; height: 44px; display: grid; place-items: center; padding: 0; border: 0; background: #fafafa; color: #141414"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 7-7 7 7"></path><path d="M12 19V5"></path></svg></button>
</form>
</sc-if>

<sc-if value="{{isBar}}" hint-placeholder-val="{{ false }}">
<div role="status" style="flex: none; display: flex; flex-direction: column; gap: 10px; padding: 12px 12px max(30px, env(safe-area-inset-bottom)); border-top: 1px solid #2a2a2a; background: #141414">
<div style="display: flex; align-items: center; gap: 8px"><span aria-hidden="true" style="flex: none; width: 8px; height: 8px; background: #71717a"></span><span><span style="font-weight: 700">This session has ended</span> <span style="color: #a1a1aa; font-size: 13px">· 14:32</span></span></div>
<sc-if value="{{isA}}" hint-placeholder-val="{{ false }}"><button type="button" aria-disabled="{{resuming}}" style="min-height: 44px; border: 1px solid #fafafa; background: {{resumeBg}}; color: {{resumeFg}}; font-family: inherit; font-size: 14px; font-weight: 700">{{resumeLabel}}</button></sc-if>
<sc-if value="{{isC}}" hint-placeholder-val="{{ false }}"><button type="button" style="min-height: 44px; border: 1px solid #3f3f46; background: transparent; color: #fafafa; font-family: inherit; font-size: 14px">New session here</button></sc-if>
</div>
</sc-if>

<sc-if value="{{isB}}" hint-placeholder-val="{{ false }}">
<div style="flex: none; padding: 8px 12px max(30px, env(safe-area-inset-bottom)); border-top: 1px solid #2a2a2a; background: #141414">
<div style="display: flex; align-items: center; gap: 8px; padding: 0 2px 8px; font-size: 13px; color: #a1a1aa"><span aria-hidden="true" style="flex: none; width: 8px; height: 8px; background: #71717a"></span><span><span style="color: #d4d4d8">Ended</span> · 14:32 · Sending resumes it</span></div>
<form style="display: grid; grid-template-columns: 1fr 44px; gap: 8px">
<textarea aria-label="Message" rows="1" placeholder="{{bPlaceholder}}" style="min-height: 44px; box-sizing: border-box; padding: 10px 12px; border: 1px solid #3f3f46; background: #0a0a0a; color: #fafafa; font-family: inherit; font-size: 16px; resize: none; outline: none"></textarea>
<button type="submit" aria-label="Resume and send" style="width: 44px; height: 44px; display: grid; place-items: center; padding: 0; border: 0; background: #fafafa; color: #141414; opacity: {{bSendOpacity}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 7-7 7 7"></path><path d="M12 19V5"></path></svg></button>
</form>
</div>
</sc-if>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"option":{"editor":"enum","options":["now","a","b","c"],"default":"a"},"resuming":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const option = this.props.option ?? 'a';
    const resuming = (this.props.resuming ?? false) && (option === 'a' || option === 'b');
    return {
      isNow: option === 'now',
      isA: option === 'a',
      isB: option === 'b',
      isC: option === 'c',
      isBar: option === 'a' || option === 'c',
      resuming,
      showSent: resuming && option === 'b',
      resumeLabel: resuming ? 'Resuming…' : 'Resume session',
      resumeBg: resuming ? 'transparent' : '#fafafa',
      resumeFg: resuming ? '#a1a1aa' : '#0a0a0a',
      bPlaceholder: resuming ? 'Resuming…' : 'Message to resume',
      bSendOpacity: resuming ? '0.5' : '1'
    };
  }
}
</script>
</body>
</html>
