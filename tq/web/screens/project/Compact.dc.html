<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Compact Day view in the Electron side window</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 320px; height: 900px; overflow: hidden; display: flex; flex-direction: column; background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif">

<div style="flex: none; max-height: 40%; overflow: hidden; display: flex; flex-direction: column; border-bottom: 1px solid #2a2a2a">
<sc-if value="{{electron}}" hint-placeholder-val="true">
<div aria-hidden="true" style="flex: none; height: 40px; box-sizing: border-box; padding-left: 80px; -webkit-app-region: drag"></div>
</sc-if>
<div style="flex: none"><dc-import name="DayCalendarHeader" view="day" compact="true" hint-size="100%,28px"></dc-import></div>

<section aria-label="Now" style="flex: none; max-height: 130px; overflow-y: auto; padding: 0 12px; border-bottom: 1px solid #2a2a2a; background: #0a0a0a">
<sc-if value="{{nowTask}}" hint-placeholder-val="true">
<div style="margin: 0 -12px"><dc-import name="DayExtrasRow" num="#231" title="カレンダー表示を 3 日ビューに対応させる" status="todo" labels="#dev/tq" project="" context="personal" due="" overdue="false" lead="{{taskLead}}" lead-tone="{{taskLeadTone}}" extra="" extra-tone="" current="false" add="false" hint-size="100%,57px"></dc-import></div>
</sc-if>
<sc-if value="{{nowMeeting}}" hint-placeholder-val="false">
<div style="min-height: 40px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0">
<span style="min-width: 0; font-size: 16px; line-height: 24px; font-weight: 500">定例ミーティング</span>
<span style="flex: none; display: flex; align-items: center; gap: 8px"><span style="font-size: 12px; line-height: 16px; color: #71717a">now (48 min left)</span><button type="button" aria-label="Join 定例ミーティング" style="height: 28px; padding: 0 10px; border: 1px solid #2a2a2a; background: #0a0a0a; color: #fafafa; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500">Join</button></span>
</div>
</sc-if>
<sc-if value="{{nowNone}}" hint-placeholder-val="false">
<p style="margin: 0; padding: 4px 0; font-size: 14px; line-height: 20px; color: #71717a">No block now</p>
</sc-if>
<sc-if value="{{showNext}}" hint-placeholder-val="true">
<div style="margin: 8px -12px 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 12px; font-size: 14px; line-height: 20px; {{nextStyle}}">
<span style="min-width: 0"><span style="font-weight: 500">Next: 定例ミーティング</span><span style="{{nextInStyle}}"> {{nextIn}}</span></span>
<button type="button" aria-label="Join 定例ミーティング" style="flex: none; height: 28px; padding: 0 10px; border: 1px solid #2a2a2a; background: #0a0a0a; color: #fafafa; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500">Join</button>
</div>
</sc-if>
</section>

<div style="flex: 1; min-height: 0; overflow: hidden"><dc-import name="DayQueuePane" layout="compact" hint-size="100%,400px"></dc-import></div>
</div>

<div style="flex: 1; min-height: 0; display: flex; flex-direction: column">
<sc-if value="{{notConnected}}" hint-placeholder-val="false">
<div style="flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; border-bottom: 1px solid #2a2a2a; background: #141414; font-size: 14px; line-height: 20px"><span style="color: #71717a">Google Calendar が連携されていません</span><a href="#" style="flex: none; font-weight: 500; color: #ef4444; text-decoration: none">連携する</a></div>
</sc-if>
<div style="flex: 1; min-height: 0"><dc-import name="DayCalendarGrid" view="day" now-label="true" popover="none" gcal="{{gcal}}" hint-size="100%,420px"></dc-import></div>
</div>

<section aria-label="Work memo" style="flex: none; display: flex; flex-direction: column; padding: 4px 8px 8px; border-top: 1px solid #2a2a2a; background: #0a0a0a">
<div style="height: 24px; display: flex; align-items: center; justify-content: space-between; gap: 8px">
<h2 style="margin: 0; font-size: 12px; line-height: 16px; font-weight: 500">Work memo</h2>
<div style="display: flex; align-items: center; gap: 6px">
<span aria-live="polite" style="font-size: 10px; line-height: 14px; color: #71717a">Saved</span>
<button type="button" aria-label="Open memo window" title="Open memo window" style="display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #71717a"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h10v10"></path><path d="M7 17 17 7"></path></svg></button>
</div>
</div>
<div role="textbox" aria-multiline="true" aria-label="Work memo" style="height: 72px; box-sizing: border-box; overflow-y: auto; padding: 4px 8px; border: 1px solid #2a2a2a; background: #141414; font-size: 14px; line-height: 1.5">
<p style="margin: 0"><span style="font-weight: 600; color: #ef4444">## </span><span style="font-weight: 600">10:00 3 日ビュー</span></p>
<p style="margin: 0">列幅は 1fr ずつ。週末の扱いを確認する</p>
<p style="margin: 0">- ヘッダーの日付表記を週ビューと揃える</p>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"electron":{"editor":"boolean","default":true},"connected":{"editor":"boolean","default":true},"now":{"editor":"enum","options":["task","overrun","meeting","none"],"default":"task"},"nextWarning":{"editor":"boolean","default":false},"$preview":{"width":320,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const on = (v, d) => (v === undefined || v === null || v === '' ? d : v === true || String(v) === 'true');
    const connected = on(this.props.connected, true);
    const now = String(this.props.now || 'task');
    const warn = on(this.props.nextWarning, false);
    const overrun = now === 'overrun';
    return {
      electron: on(this.props.electron, true),
      notConnected: !connected,
      gcal: connected ? 'true' : 'false',
      nowTask: now === 'task' || overrun,
      nowMeeting: now === 'meeting' && connected,
      nowNone: now === 'none' || (now === 'meeting' && !connected),
      taskLead: overrun ? 'block ended 5 min ago' : 'now (18 min left)',
      taskLeadTone: overrun ? 'red' : 'muted',
      showNext: connected && now !== 'meeting',
      nextIn: warn ? 'in 3 min' : 'in 48 min',
      nextStyle: warn
        ? 'border-top: 1px solid rgba(239, 68, 68, 0.3); background: rgba(239, 68, 68, 0.1); color: #ef4444'
        : 'border-top: 1px solid #2a2a2a; color: #fafafa',
      nextInStyle: warn ? 'font-weight: 600' : 'color: #71717a',
    };
  }
}
</script>
</body>
</html>
