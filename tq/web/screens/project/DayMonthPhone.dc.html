<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Day view on a phone, month calendar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif">
<main style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column">
<div style="flex: none; height: 40px; box-sizing: border-box; display: flex; align-items: center; gap: 6px; padding: 0 12px; border-bottom: 1px solid #2a2a2a; background: #0a0a0a">
<h1 style="margin: 0; display: inline-flex; align-items: baseline; gap: 8px; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px"><span aria-hidden="true" style="font-weight: 700; color: #ef4444">##</span><span style="font-weight: 500; color: #fafafa">queue</span></h1>
<div role="group" aria-label="Pane" style="display: inline-flex; padding: 2px; border: 1px solid #2a2a2a; background: #141414">
<button type="button" aria-pressed="true" style="padding: 4px 10px; border: 0; background: #0a0a0a; color: #fafafa; font-family: inherit; font-size: 12px; line-height: 16px; font-weight: 500">calendar</button>
<button type="button" aria-pressed="false" style="padding: 4px 10px; border: 0; background: transparent; color: #71717a; font-family: inherit; font-size: 12px; line-height: 16px; font-weight: 500">tasks</button>
</div>
<button type="button" aria-label="New task" style="width: 24px; height: 24px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #fafafa"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></button>
<button type="button" aria-label="New schedule" style="width: 24px; height: 24px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #fafafa"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 19h6"></path><path d="M16 2v4"></path><path d="M19 16v6"></path><path d="M21 12.598V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h8.5"></path><path d="M3 10h18"></path><path d="M8 2v4"></path></svg></button>
</div>
<div style="flex: none"><dc-import name="DayCalendarHeader" view="month" compact="false" hint-size="100%,40px"></dc-import></div>
<div style="flex: 1; min-height: 0"><dc-import name="DayCalendarGrid" view="month" now-label="false" popover="none" gcal="true" hint-size="100%,711px"></dc-import></div>
</main>
<dc-import name="TabBar" view="calendar" hint-size="100%,53px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
