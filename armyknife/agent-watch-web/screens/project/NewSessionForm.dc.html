<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>NewSessionForm</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<section aria-label="New session" style="position: relative; width: {{w}}; height: {{h}}; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: {{bg}}; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 13px; line-height: 1.55">
<sc-if value="{{paneHeader}}" hint-placeholder-val="{{ true }}"><header style="{{headerStyle}}"><sc-if value="{{phone}}" hint-placeholder-val="{{ false }}"><button type="button" aria-label="Back to Inbox" style="flex: none; width: 44px; height: 44px; margin-left: -14px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #d4d4d8"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button></sc-if><h1 style="margin: 0; font-size: 15px">New session</h1></header></sc-if>
<sc-if value="{{phonePaletteHeader}}" hint-placeholder-val="{{ false }}"><header style="flex: none; min-height: 50px; display: flex; align-items: center; gap: 8px; padding: 8px 8px 6px 16px; border-bottom: 1px solid #2a2a2a"><span aria-hidden="true" style="color: #8b8b94">⌕</span><span style="flex: 1; color: #8b8b94; font-size: 15px">Jump to</span><button type="button" style="height: 44px; padding: 0 8px; border: 0; background: transparent; color: #d4d4d8; font-family: inherit; font-size: 16px">Cancel</button></header></sc-if>

<div style="{{inputRowStyle}}"><sc-if value="{{commandChip}}" hint-placeholder-val="{{ false }}"><span style="flex: none; height: 24px; display: inline-flex; align-items: center; padding: 0 8px; background: #2a2a2e; font-size: 12px">› New session</span></sc-if><sc-if value="{{dirChip}}" hint-placeholder-val="{{ true }}"><span style="flex: none; max-width: 100%; height: 24px; box-sizing: border-box; display: inline-flex; align-items: center; gap: 6px; padding: 0 8px; background: #2a2a2e; font-family: 'JetBrains Mono', monospace; font-size: 12px; white-space: nowrap"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"></path></svg>example/notification-service</span></sc-if><span role="combobox" aria-label="{{inputLabel}}" aria-expanded="true" style="flex: 1 1 160px; min-width: 0"><span style="{{textStyle}}">{{text}}</span><span aria-hidden="true" style="display: inline-block; width: 1px; height: 18px; margin-left: 1px; vertical-align: -3px; background: #fafafa"></span></span></div>

<sc-if value="{{restored}}" hint-placeholder-val="{{ false }}"><div role="status" style="{{restoredStyle}}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg><span style="flex: 1; min-width: 0">Restored your draft from 12:03</span><button type="button" style="{{clearStyle}}">Clear</button></div></sc-if>

<div role="listbox" aria-label="{{listLabel}}" style="flex: 1; min-height: 0; overflow: hidden; padding: 4px 0">
<sc-for list="{{sections}}" as="sec" hint-placeholder-count="2"><h2 style="height: 28px; display: flex; align-items: center; margin: 4px 0 0; padding: 0 16px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em; color: #8b8b94">{{sec.title}}</h2>
<sc-for list="{{sec.rows}}" as="r" hint-placeholder-count="2"><div role="option" aria-selected="{{r.on}}" style="{{r.style}}"><span style="flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap"><span style="{{r.nameStyle}}">{{r.name}}</span> <span style="{{r.subStyle}}">{{r.sub}}</span></span><span style="flex: none; display: inline-flex; align-items: center; gap: {{valGap}}"><sc-for list="{{r.vals}}" as="v" hint-placeholder-count="2"><span role="radio" aria-checked="{{v.on}}" style="{{v.style}}">{{v.label}}</span></sc-for><sc-if value="{{r.hasWhen}}" hint-placeholder-val="{{ false }}"><span style="font-size: 11.5px; color: #8b8b94">{{r.when}}</span></sc-if><sc-if value="{{r.hasKey}}" hint-placeholder-val="{{ false }}"><kbd style="flex: none; min-width: 20px; text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #a1a1aa">{{r.key}}</kbd></sc-if></span></div></sc-for></sc-for>
</div>

<sc-if value="{{line}}" hint-placeholder-val="{{ true }}"><div aria-label="Keyboard shortcuts" style="flex: none; height: 36px; display: flex; align-items: center; gap: 14px; padding: 0 16px; border-top: 1px solid #2a2a2a; overflow: hidden; font-size: 11.5px; color: #8b8b94; white-space: nowrap"><sc-for list="{{lineItems}}" as="it" hint-placeholder-count="4"><span><kbd style="font-family: 'JetBrains Mono', monospace; color: #a1a1aa">{{it.k}}</kbd> {{it.label}}</span></sc-for></div></sc-if>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"form":{"editor":"enum","options":["pc","phone"],"default":"pc"},"place":{"editor":"enum","options":["pane","palette"],"default":"pane"},"step":{"editor":"enum","options":["dir","message"],"default":"message"},"hl":{"editor":"enum","options":["claude","codex","worktree","model","effort"],"default":"claude"},"codex":{"editor":"boolean","default":false},"model":{"editor":"int","default":0},"effort":{"editor":"int","default":-1},"worktree":{"editor":"boolean","default":true},"restored":{"editor":"boolean","default":false},"query":{"editor":"text","default":"notif"},"message":{"editor":"text","default":"通知の再送処理を見直したい。失敗した配信を 3 回まで再送する"},"w":{"editor":null},"h":{"editor":null},"$preview":{"width":740,"height":520}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const phone = (p.form ?? 'pc') === 'phone';
    const palette = (p.place ?? 'pane') === 'palette';
    const choosing = (p.step ?? 'message') === 'dir';
    const hl = p.hl ?? 'claude';
    // Model and Effort belong to the engine row the highlight was last on.
    const codex = hl === 'codex' || (hl !== 'claude' && (p.codex ?? false));
    const wt = p.worktree ?? true;
    const engines = {
      claude: { name: 'Claude Code', models: ['atlas-5', 'borealis-5', 'comet-5'], efforts: ['low', 'medium', 'high', 'xhigh'], defEffort: 2 },
      codex: { name: 'Codex', models: ['vega-3', 'vega-3-mini'], efforts: ['low', 'medium', 'high'], defEffort: 1 }
    };
    const eng = engines[codex ? 'codex' : 'claude'];
    const modelIdx = Number(p.model ?? 0);
    // comet-5 supports efforts only up to high.
    const efforts = eng.models[modelIdx] === 'comet-5' ? eng.efforts.slice(0, 3) : eng.efforts;
    const effortIdx = Math.min(Number(p.effort ?? -1) < 0 ? eng.defEffort : Number(p.effort), efforts.length - 1);
    const rowH = phone ? '44px' : '40px';

    const rowStyle = (on) => 'min-height: ' + rowH + '; display: flex; align-items: center; gap: 10px; padding: 0 16px; background: ' + (on ? '#2a2a2e' : 'transparent');
    const sub = 'font-size: 12px; color: #a1a1aa';
    const valStyle = (on, rowOn) => 'font-family: \'JetBrains Mono\', monospace; font-size: 12px; ' + (phone ? 'min-height: 44px; display: inline-flex; align-items: center; padding: 0 5px; ' : '') + (on ? 'color: #fafafa; font-weight: 700' + (rowOn ? '; text-decoration: underline; text-underline-offset: 3px' : '') : 'color: #8b8b94');
    const engRow = (key) => {
      const on = hl === key;
      return { on, name: engines[key].name, nameStyle: on ? 'font-weight: 700' : '', sub: 'in example/notification-service', subStyle: sub, style: rowStyle(on), vals: [], hasWhen: false, when: '', hasKey: on && !phone, key: '↵' };
    };
    const optRow = (key, name, defNote, vals, sel) => {
      const on = hl === key;
      return { on, name, nameStyle: '', sub: defNote, subStyle: 'font-size: 11.5px; color: #8b8b94', style: rowStyle(on), vals: vals.map((v, i) => ({ label: v, on: i === sel, style: valStyle(i === sel, on) })), hasWhen: false, when: '', hasKey: on && !phone, key: '←→' };
    };
    const dirs = [
      { name: 'example/notification-service', path: '~/ghq/github.com/example/notification-service', when: '2h ago' },
      { name: 'example/notification-web', path: '~/ghq/github.com/example/notification-web', when: '3d ago' }
    ];
    const sections = choosing
      ? [{ title: 'RECENT', rows: dirs.map((d, i) => ({ on: i === 0, name: d.name, nameStyle: i === 0 ? 'font-weight: 700' : '', sub: phone ? '' : d.path, subStyle: 'font-family: \'JetBrains Mono\', monospace; font-size: 11px; color: #8b8b94', style: rowStyle(i === 0), vals: [], hasWhen: true, when: d.when, hasKey: i === 0 && !phone, key: '↵' })) }]
      : [
          { title: 'START WITH', rows: [engRow('claude'), engRow('codex')] },
          { title: eng.name.toUpperCase() + ' OPTIONS', rows: [
            optRow('worktree', 'New worktree from main', '', ['off', 'on'], wt ? 1 : 0),
            optRow('model', 'Model', phone ? '' : 'default ' + eng.models[0], eng.models, modelIdx),
            optRow('effort', 'Effort', phone ? '' : 'default ' + eng.efforts[eng.defEffort], efforts, effortIdx)
          ] }
        ];

    const onOption = ['worktree', 'model', 'effort'].includes(hl);
    const lineItems = choosing
      ? [['↑↓', 'Move'], ['↵', 'Choose'], ['Esc', 'Close']]
      : onOption
        ? [['←→', 'Change'], ['↑↓', 'Move'], ['↵', 'Start with ' + eng.name], ['Esc', 'Close']]
        : [['↵', 'Start'], ['↑↓', 'Engine and options'], ['⇧↵ / ⌥↵', 'New line'], ['⌫', 'Change directory'], ['Esc', 'Close']];

    const restored = p.restored ?? false;
    const empty = choosing && !(p.query ?? 'notif');
    return {
      phone,
      w: p.w ?? (phone ? '390px' : '740px'),
      h: p.h ?? (phone ? '844px' : '520px'),
      bg: palette && !phone ? '#161616' : '#0a0a0a',
      paneHeader: !palette,
      phonePaletteHeader: palette && phone,
      headerStyle: phone
        ? 'flex: none; display: flex; align-items: center; gap: 8px; min-height: 50px; padding: 8px 16px 6px; border-bottom: 1px solid #2a2a2a'
        : 'flex: none; display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 0 16px; border-bottom: 1px solid #2a2a2a',
      commandChip: palette,
      dirChip: !choosing,
      inputRowStyle: 'flex: none; min-height: 54px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 16px; box-sizing: border-box; border-bottom: 1px solid #2a2a2a; background: ' + (palette && !phone ? '#161616' : '#0f0f0f'),
      inputLabel: choosing ? 'Directory' : 'First message',
      text: choosing ? (p.query ?? 'notif') : (p.message ?? '通知の再送処理を見直したい。失敗した配信を 3 回まで再送する'),
      textStyle: 'white-space: normal; overflow-wrap: anywhere; font-size: ' + (phone ? '16px' : '15px') + (empty ? '; color: #71717a' : ''),
      restored,
      restoredStyle: 'flex: none; min-height: ' + (phone ? '44px' : '32px') + '; display: flex; align-items: center; gap: 8px; padding: 0 ' + (phone ? '8px' : '10px') + ' 0 16px; border-bottom: 1px solid #2a2a2a; font-size: 12px; color: #a1a1aa',
      clearStyle: 'flex: none; height: ' + (phone ? '44px' : '24px') + '; padding: 0 ' + (phone ? '10px' : '8px') + '; border: ' + (phone ? '0' : '1px solid #3f3f46') + '; background: transparent; color: #fafafa; font-family: inherit; font-size: ' + (phone ? '14px' : '12px'),
      listLabel: choosing ? 'Directories' : 'Engine and options',
      sections,
      valGap: phone ? '2px' : '10px',
      line: !phone,
      lineItems: lineItems.map(([k, label]) => ({ k, label }))
    };
  }
}
</script>
</body>
</html>
