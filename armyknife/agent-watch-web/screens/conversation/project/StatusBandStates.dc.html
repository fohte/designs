<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Status band states</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<main style="width: 1290px; height: 1500px; box-sizing: border-box; padding: 32px 40px; overflow: hidden; background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 14px; line-height: 1.55">
<h1 style="margin: 0; font-size: 18px; font-weight: 700">The band above the reply input</h1>
<p style="margin: 6px 0 0; color: #a1a1aa; font-size: 13px">Line 1 is the state, line 2 the detail. Waiting states draw a yellow top line. The usage line under the reply input stays as it is.</p>
<div style="display: grid; grid-template-columns: 760px 390px; column-gap: 60px; margin-top: 20px; font-size: 12px; color: #8b8b94">
<div>Desktop</div>
<div>Phone</div>
</div>
<div style="display: flex; flex-direction: column; gap: 24px; margin-top: 12px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
<section style="display: flex; flex-direction: column; gap: 8px; padding-top: 14px; border-top: 1px solid #2a2a2a">
<h2 style="margin: 0; display: flex; align-items: baseline; gap: 12px; font-size: 13px; font-weight: 700">{{r.title}}<span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 400; color: #8b8b94">{{r.source}}</span></h2>
<div style="display: grid; grid-template-columns: 760px 390px; column-gap: 60px; align-items: start">
<div style="width: 760px"><dc-import name="StatusBand" state="{{r.key}}" hint-size="100%,58px"></dc-import></div>
<div style="width: 390px"><dc-import name="StatusBand" state="{{r.key}}" phone="{{ true }}" hint-size="100%,110px"></dc-import></div>
</div>
</section>
</sc-for>
</div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1290,"height":1500}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      rows: [
        { key: 'working', title: 'Working', source: "activityStatus 'working' · elapsedSeconds · tool_in_progress" },
        { key: 'background', title: 'Background tasks only', source: 'waitingForBackgroundTasks · backgroundTasks[]' },
        { key: 'crit', title: 'Review in crit', source: "needs_action · kind 'Review' + webUis[name='crit'] (or critUrl)" },
        { key: 'critBg', title: 'Review in crit + background task', source: "needs_action · kind 'Review' + crit · backgroundTasks[]" },
        { key: 'question', title: 'Question', source: "kind 'Question'" },
        { key: 'permission', title: 'Permission', source: "kind 'Approve' · permission item" },
        { key: 'waiting', title: 'Waiting on something else', source: "activityStatus 'waiting' · waitingReason" },
        { key: 'idle', title: 'Idle (stopped or done): no band', source: "kind 'Stopped' · category 'done'" }
      ]
    };
  }
}
</script>
</body>
</html>
