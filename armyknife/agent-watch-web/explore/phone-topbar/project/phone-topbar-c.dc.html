<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Phone top bar · C buttons in the status band</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1620px; height: 880px; display: flex; gap: 20px; background: #0a0a0a; color: #a1a1aa; font-family: 'Helvetica Neue', Arial, 'Hiragino Sans', sans-serif; font-size: 12.5px">
<section style="width: 390px; flex: none; display: flex; flex-direction: column; gap: 16px"><h2 style="margin: 0; height: 20px; font-size: 12.5px; font-weight: 700">Review · 長いタイトル · タスク +2 · vibe on · 実行中</h2><div style="height: 844px"><dc-import name="PhoneTopbar" option="c" state="review" more-tasks="2" activity="{{ running }}" hint-size="390px,844px"></dc-import></div></section>
<section style="width: 390px; flex: none; display: flex; flex-direction: column; gap: 16px"><h2 style="margin: 0; height: 20px; font-size: 12.5px; font-weight: 700">マージ失敗 · Activity が赤</h2><div style="height: 844px"><dc-import name="PhoneTopbar" option="c" state="review" more-tasks="2" failed="{{ true }}" activity="{{ failure }}" hint-size="390px,844px"></dc-import></div></section>
<section style="width: 390px; flex: none; display: flex; flex-direction: column; gap: 16px"><h2 style="margin: 0; height: 20px; font-size: 12.5px; font-weight: 700">Question · vibe 引き継ぎ · タスク +5 · PR なし</h2><div style="height: 844px"><dc-import name="PhoneTopbar" option="c" state="question" vibe="inherited" more-tasks="5" hint-size="390px,844px"></dc-import></div></section>
<section style="width: 390px; flex: none; display: flex; flex-direction: column; gap: 16px"><h2 style="margin: 0; height: 20px; font-size: 12.5px; font-weight: 700">Working · マージ失敗のあと</h2><div style="height: 844px"><dc-import name="PhoneTopbar" option="c" state="working" more-tasks="2" failed="{{ true }}" activity="{{ failure }}" hint-size="390px,844px"></dc-import></div></section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1620,"height":880}}'>
class Component extends DCLogic {
  renderVals() {
    return { running: { count: '2', tone: 'running' }, failure: { count: '1', tone: 'failure' } };
  }
}
</script>
</body>
</html>
