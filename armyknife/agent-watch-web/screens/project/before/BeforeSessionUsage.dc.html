<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Session usage</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div role="group" aria-label="Session usage" style="position: relative; width: 100%; box-sizing: border-box; display: flex; align-items: center; gap: 8px; row-gap: 2px; flex-wrap: wrap; font-family: 'JetBrains Mono', monospace; font-size: {{size}}; line-height: 1.55; color: #8b8b94; white-space: nowrap">
<span title="{{engineTitle}}" style="color: #d4d4d8">{{engine}}</span><span style="color: #d4d4d8">{{model}}</span><span>({{effort}})</span>
<span aria-hidden="true" style="color: #3f3f46">|</span>
<span role="meter" aria-label="Context used" aria-valuenow="{{ctx}}" aria-valuemin="0" aria-valuemax="100" style="position: relative; display: inline-block; flex: none; width: 48px; height: 4px; background: #262626"><span style="position: absolute; inset: 0 auto 0 0; width: {{ctx}}%; background: #d4d4d8"></span></span><span>{{tokens}} ({{ctx}}%)</span>
<span aria-hidden="true" style="color: #3f3f46">|</span>
<sc-for list="{{wins}}" as="w" hint-placeholder-count="2">
<span title="{{w.text}}" style="margin-right: {{w.after}}"><span aria-hidden="true">{{w.window}} <span style="color: {{w.color}}">{{w.used}}%</span><sc-if value="{{w.showFc}}" hint-placeholder-val="{{ true }}"> <span style="color: {{w.fcColor}}; font-weight: {{w.weight}}">→ {{w.fc}}%</span></sc-if></span><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">{{w.text}}</span></span>
</sc-for>
<span aria-hidden="true" style="color: #3f3f46">|</span>
<span>{{version}}</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"engine":{"editor":"enum","options":["claude","codex"],"default":"claude"},"phone":{"editor":"boolean","default":false},"$preview":{"width":672,"height":40}}'>
class Component extends DCLogic {
  renderVals() {
    // pace = elapsed share of the window in %; the forecast is used / elapsed, hidden under 5% elapsed.
    const q = (window, used, pace, reset) => {
      const fc = pace < 5 ? null : Math.round(used * 100 / pace);
      const st = fc === null ? null : fc < 100 ? 'on' : fc < 150 ? 'warn' : 'danger';
      const over = { warn: ', at or above quota pace', danger: ', well above quota pace' }[st] ?? '';
      return {
        window, used, fc, after: '0px',
        color: used >= 95 ? '#f87171' : used >= 80 ? '#fbbf24' : '#d4d4d8',
        showFc: fc !== null,
        fcColor: { on: '#8b8b94', warn: '#fbbf24', danger: '#f87171' }[st] ?? '#8b8b94',
        weight: st === 'danger' ? 700 : 400,
        text: `${window}: ${used}% used, ` + (fc === null ? 'too early to forecast' : `projected ${fc}% at window end${over}`) + `, resets in ${reset}`
      };
    };
    const phone = this.props.phone ?? false;
    const s = (this.props.engine ?? 'claude') === 'codex'
      ? { engine: 'codex', engineTitle: 'Codex', model: 'gpt-5-codex', effort: 'high', ctx: 19, tokens: '51.2k', wins: [q('5h', 88, 64, '47m'), q('7d', 35, 40, '4d2h')], version: 'v0.60.0' }
      : { engine: 'claude', engineTitle: 'Claude Code', model: 'Sonnet 5.5', effort: 'medium', ctx: 42, tokens: '84.3k', wins: [q('5h', 41, 52, '2h10m'), q('7d', 76, 83, '1d14h')], version: 'v2.4.0' };
    // Usage and forecast read as one group per window, so the windows sit further apart than the gap inside a group.
    s.wins[0].after = '10px';
    return { ...s, size: phone ? '11px' : '11.5px' };
  }
}
</script>
</body>
</html>
