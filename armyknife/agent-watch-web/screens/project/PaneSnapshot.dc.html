<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Pane snapshot</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<section aria-label="Screen of the agent's tmux pane" style="width: 100%; min-width: 0; max-width: 100%; contain: inline-size; box-sizing: border-box; display: flex; flex-direction: column; border: 1px solid #3f3f46; background: #000000; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: {{uiSize}}; line-height: 1.5">
<div style="display: flex; align-items: center; gap: 8px; min-height: {{headH}}; box-sizing: border-box; padding: 0 12px; border-bottom: 1px solid #2a2a2a; background: #141414; color: #a1a1aa">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="m7 11 2-2-2-2"></path><path d="M11 13h4"></path><rect width="18" height="18" x="3" y="3" rx="2" ry="2"></rect></svg>
<span style="flex: none; color: #fafafa; font-weight: 700">Pane</span>
<span style="min-width: 0; flex: 1; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{target}}</span>
<span role="status" style="flex: none; display: inline-flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 50%; background: #60a5fa"></span>{{liveLabel}}</span>
</div>
<pre tabindex="0" aria-label="Pane text" style="margin: 0; height: {{bodyH}}; box-sizing: border-box; padding: 10px 12px; overflow: auto; white-space: pre; color: #d4d4d8; font-family: 'JetBrains Mono', monospace; font-size: {{monoSize}}; line-height: 1.45">{{text}}</pre>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"form":{"editor":"enum","options":["pc","phone"],"default":"pc"},"repo":{"editor":"text","default":"example/service"},"engine":{"editor":"enum","options":["claude","codex"],"default":"claude"},"content":{"editor":"enum","options":["trust","update","error"],"default":"trust"},"bodyH":{"editor":null},"$preview":{"width":672,"height":380}}'>
class Component extends DCLogic {
  renderVals() {
    const phone = (this.props.form ?? 'pc') === 'phone';
    const repo = this.props.repo ?? 'example/service';
    // The text is tmux capture-pane output as is: no colors, long lines scroll sideways instead of wrapping.
    const texts = {
      trust: (this.props.engine ?? 'claude') === 'codex' ? [
        '',
        ' You are in ~/src/' + repo,
        '',
        ' Do you trust the contents of this directory? Working with',
        ' untrusted contents comes with higher risk of prompt injection.',
        '',
        ' > 1. Yes, continue',
        '   2. No, quit',
        '',
        ' Press enter to continue'
      ] : [
        '',
        ' Do you trust the files in this folder?',
        '',
        ' ~/src/' + repo,
        '',
        ' Claude Code may read, write, or execute files contained in',
        ' this folder. Only continue with files from sources you trust.',
        '',
        ' > 1. Yes, proceed',
        '   2. No, exit',
        '',
        ' Enter to confirm · Esc to exit'
      ],
      update: [
        ' Welcome back',
        '',
        ' A new version is available: 3.2.0 → 3.3.0',
        '',
        ' Update now? The session resumes after the update.',
        '',
        ' > 1. Update and restart',
        '   2. Skip this version',
        '',
        '   Enter to confirm'
      ],
      error: [
        '~/src/' + repo + ' $ claude --resume 7c1e0b42',
        'Error: could not load the session: unexpected end of JSON input',
        '    at loadTranscript (cli.js:2:1840)',
        '',
        '~/src/' + repo + ' $ █'
      ]
    };
    return {
      // The server captures the pane again every 2 s while it is open.
      liveLabel: phone ? 'Live' : 'Live · every 2 s',
      target: phone ? 'agent:3.0' : 'agent:3.0 · ' + repo,
      text: texts[this.props.content ?? 'trust'].join('\n'),
      uiSize: phone ? '13px' : '12px',
      monoSize: phone ? '11px' : '12px',
      headH: phone ? '44px' : '34px',
      bodyH: this.props.bodyH ?? (phone ? '250px' : '300px')
    };
  }
}
</script>
</body>
</html>
