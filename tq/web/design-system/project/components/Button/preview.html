<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Button</title>
</head>
<body>
<div class="tq-row">
  <button class="tq-button tq-button--default" type="button">Add Task</button>
  <button class="tq-button tq-button--outline" type="button">Cancel</button>
  <button class="tq-button tq-button--secondary" type="button">Edit</button>
  <button class="tq-button tq-button--ghost" type="button">More</button>
  <button class="tq-button tq-button--destructive" type="button">Delete</button>
  <button class="tq-button tq-button--link" type="button">Open page</button>
  <button class="tq-button tq-button--plain" type="button">Remove</button>
</div>
<div class="tq-row">
  <button class="tq-button tq-button--default tq-button--xs" type="button">xs</button>
  <button class="tq-button tq-button--default tq-button--sm" type="button">sm</button>
  <button class="tq-button tq-button--default" type="button">default</button>
  <button class="tq-button tq-button--default tq-button--lg" type="button">lg</button>
  <button class="tq-button tq-button--ghost tq-button--icon-sm" type="button" aria-label="Add task"><svg class="tq-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg></button>
  <button class="tq-button tq-button--outline tq-button--icon" type="button" aria-label="Add task"><svg class="tq-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg></button>
  <button class="tq-button tq-button--default" type="button" disabled>Save</button>
</div>
</body>
</html>
