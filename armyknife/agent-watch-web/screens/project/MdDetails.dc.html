<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Markdown details block</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="min-width: 0; color: inherit; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: inherit; line-height: 1.55">
<button type="button" aria-expanded="{{openStr}}" style="max-width: 100%; display: flex; align-items: flex-start; gap: 8px; padding: {{rowPad}} 0; border: 0; background: transparent; color: inherit; font-family: inherit; font-size: inherit; line-height: inherit; text-align: left"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true" style="flex: none; margin-top: calc((1.55em - 10px) / 2); transform: rotate({{rot}})"><path d="M2 1l6 4-6 4z" fill="currentColor"></path></svg><span style="min-width: 0; overflow-wrap: anywhere">{{summary}}</span></button>
<sc-if value="{{open}}" hint-placeholder-val="{{ true }}">
<div style="margin-top: {{bodyGap}}; display: flex; flex-direction: column; gap: 0.5rem">
<sc-if value="{{isCode}}" hint-placeholder-val="{{ true }}"><dc-import name="CodeBlock" code="{{code}}" phone="{{ phone }}" hint-size="100%,150px"></dc-import></sc-if>
<sc-if value="{{isList}}" hint-placeholder-val="{{ false }}"><ul style="margin: 0; padding-left: 1.5rem"><sc-for list="{{items}}" as="i" hint-placeholder-count="2"><li><code style="padding: {{codePad}}; background: {{codeBg}}; font-family: {{codeFont}}; font-size: {{codeFs}}">{{i}}</code></li></sc-for></ul></sc-if>
<sc-if value="{{isNested}}" hint-placeholder-val="{{ false }}">
<div>送信先ごとに分けています。</div>
<sc-for list="{{inner}}" as="n" hint-placeholder-count="2">
<div>
<button type="button" aria-expanded="{{n.openStr}}" style="max-width: 100%; display: flex; align-items: flex-start; gap: 8px; padding: {{rowPad}} 0; border: 0; background: transparent; color: inherit; font-family: inherit; font-size: inherit; line-height: inherit; text-align: left"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true" style="flex: none; margin-top: calc((1.55em - 10px) / 2); transform: rotate({{n.rot}})"><path d="M2 1l6 4-6 4z" fill="currentColor"></path></svg><span style="min-width: 0; overflow-wrap: anywhere">{{n.summary}}</span></button>
<sc-if value="{{n.open}}" hint-placeholder-val="{{ false }}"><div style="margin-top: {{bodyGap}}"><dc-import name="CodeBlock" code="{{code}}" phone="{{ phone }}" hint-size="100%,150px"></dc-import></div></sc-if>
</div>
</sc-for>
</sc-if>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"open":{"editor":"boolean","default":true},"form":{"editor":"enum","options":["desktop","phone"],"default":"desktop"},"summary":{"editor":"text","default":"実行したテストのログ"},"body":{"editor":"enum","options":["log","files","steps","numbers","nested"],"default":"log"},"$preview":{"width":672,"height":200}}'>
class Component extends DCLogic {
  renderVals() {
    const open = this.props.open ?? true;
    const phone = (this.props.form ?? 'desktop') === 'phone';
    const body = this.props.body ?? 'log';
    const ITEMS = {
      files: ['src/notify/retry.ts', 'src/notify/retry.test.ts', 'config/notify.example.toml'],
      steps: ['RETRY_LIMIT=3 で起動する', '送信先を止めて通知を 1 件送る', 'ログの attempt=3 で止まるか見る'],
      numbers: ['3 回: 失敗 12 件 / 1,000 件', '5 回: 失敗 4 件 / 1,000 件']
    };
    // The summary row fills the 44px tap height on iPhone by padding, so a wrapped summary grows instead of overflowing.
    const rowPad = phone ? '11px' : '2px';
    return {
      open,
      openStr: open ? 'true' : 'false',
      rot: open ? '90deg' : '0deg',
      phone,
      rowPad,
      bodyGap: phone ? '0' : '0.25rem',
      summary: this.props.summary ?? '実行したテストのログ',
      code: 'log',
      isCode: body === 'log', isNested: body === 'nested', isList: !!ITEMS[body],
      items: ITEMS[body] ?? [],
      inner: [
        { summary: 'Webhook のテスト', open: true, openStr: 'true', rot: '90deg' },
        { summary: 'メールのテスト', open: false, openStr: 'false', rot: '0deg' }
      ],
      // Only file paths are inline code; the other lists are plain text.
      codePad: body === 'files' ? '0.1em 0.35em' : '0', codeBg: body === 'files' ? '#262626' : 'transparent',
      codeFont: body === 'files' ? "'JetBrains Mono', monospace" : 'inherit', codeFs: body === 'files' ? '0.9em' : 'inherit'
    };
  }
}
</script>
</body>
</html>
