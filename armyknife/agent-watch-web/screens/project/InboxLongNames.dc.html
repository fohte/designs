<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Inbox: long repo and branch names</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; display: flex; overflow: hidden; background: #0a0a0a; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif">
<div style="flex: none; width: 240px"><dc-import name="Nav" view="inbox" inbox-count="{{ 4 }}" long="{{ true }}" hint-size="240px,900px"></dc-import></div>
<div style="flex: none; width: 460px; border-right: 1px solid #2a2a2a"><dc-import name="InboxList" filter="none" current="{{ 1 }}" long="{{ true }}" hint-size="460px,900px"></dc-import></div>
<div style="flex: 1; min-width: 0"><dc-import name="Conversation" variant="review" hint-size="100%,900px"></dc-import></div>
<div role="tooltip" style="position: absolute; left: {{tipX}}; top: {{tipY}}; z-index: 5; padding: 4px 8px; background: #f4f4f5; color: #18181b; border: 1px solid #a1a1aa; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5); font-family: 'JetBrains Mono', monospace; font-size: 12px; white-space: nowrap">example/observability-pipeline</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    // The pointer rests on the shortened repo of the Proposal row, so its full name shows.
    return { tipX: '548px', tipY: '434px' };
  }
}
</script>
</body>
</html>
