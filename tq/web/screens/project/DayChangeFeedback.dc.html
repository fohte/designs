<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Day view, change feedback after moving a block</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1440px; height: 900px; overflow: hidden; background: #0a0a0a">
<dc-import name="DayDesktop" view="week" connected="true" popover="{{popover}}" hint-size="1440px,900px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"saveFailed":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { popover: this.props.saveFailed ? 'feedback-error' : 'feedback' };
  }
}
</script>
</body>
</html>
