<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Generated tasks</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<section aria-labelledby="generated-tasks-heading" style="width: 100%; display: flex; flex-direction: column; gap: 10px; background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
<h3 id="generated-tasks-heading" style="margin: 0; display: inline-flex; align-items: baseline; gap: 8px; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace"><span aria-hidden="true" style="font-size: 12px; line-height: 16px; font-weight: 700; color: #ef4444">###</span><span style="font-size: 14px; line-height: 20px; font-weight: 700; color: #fafafa">Generated tasks</span></h3>
<a href="RecurringAddOccurrence.dc.html" style="height: 28px; box-sizing: border-box; display: inline-flex; align-items: center; gap: 4px; padding: 0 10px; border: 1px solid #2a2a2a; background: #0a0a0a; color: #fafafa; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 500; text-decoration: none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>Add task</a>
</div>

<sc-if value="{{isLoading}}" hint-placeholder-val="{{false}}">
<p style="margin: 0; padding: 16px; text-align: center; font-size: 14px; line-height: 20px; color: #71717a">Loading...</p>
</sc-if>
<sc-if value="{{isError}}" hint-placeholder-val="{{false}}">
<p style="margin: 0; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px; color: #ef4444">Failed to load generated tasks.</p>
</sc-if>
<sc-if value="{{isEmpty}}" hint-placeholder-val="{{false}}">
<p style="margin: 0; padding: 16px; text-align: center; font-size: 14px; line-height: 20px; color: #71717a">No tasks generated yet.</p>
</sc-if>

<sc-if value="{{hasItems}}" hint-placeholder-val="{{true}}">
<div style="border: 1px solid #2a2a2a">
<sc-for list="{{tasks}}" as="t" hint-placeholder-count="5">
<a href="#" style="display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid #2a2a2a; color: #fafafa; text-decoration: none; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px">
<span style="flex: none; color: #52525b">#{{t.num}}</span>
<span style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{t.title}}</span>
<span style="flex: none; display: inline-flex; align-items: center; gap: 4px; color: #71717a"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M16 2v4"></path><path d="M3 10h18"></path><path d="M8 2v4"></path><path d="M17 14h-6"></path><path d="M13 18H7"></path><path d="M7 14h.01"></path><path d="M17 18h.01"></path></svg>{{t.start}} → <span style="color: {{t.dueColor}}">{{t.due}}</span></span>
<span style="flex: none; color: #71717a">{{t.status}}</span>
</a>
</sc-for>
<sc-if value="{{isLoadingMore}}" hint-placeholder-val="{{false}}">
<p style="margin: 0; padding: 16px; text-align: center; font-size: 14px; line-height: 20px; color: #71717a">Loading more...</p>
</sc-if>
<sc-if value="{{isMoreFailed}}" hint-placeholder-val="{{false}}">
<div role="alert" style="display: flex; align-items: center; justify-content: space-between; padding: 8px; border-top: 1px solid #2a2a2a; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px; color: #ef4444">
<span>Failed to load more generated tasks.</span>
<button type="button" style="padding: 0; border: 0; background: transparent; color: #71717a; font-family: inherit; font-size: inherit; font-weight: 500">Retry</button>
</div>
</sc-if>
</div>
</sc-if>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"state":{"editor":"enum","options":["items","loading","error","empty","loading more","load more failed"],"default":"items"},"$preview":{"width":768,"height":240}}'>
class Component extends DCLogic {
  renderVals() {
    const state = this.props.state ?? 'items';
    // Newest due date first; #124 is past due and still todo, so its due date is red.
    const tasks = [
      [131, 'Aug 19', 'todo', false],
      [127, 'Aug 16', 'todo', false],
      [124, 'Aug 12', 'todo', true],
      [120, 'Aug 9', 'completed', false],
      [117, 'Aug 5', 'completed', false]
    ].map(([num, day, status, overdue]) => ({
      num, status,
      title: '植物に水をやる',
      start: day,
      due: day,
      dueColor: overdue ? '#ef4444' : '#71717a'
    }));
    const listed = ['items', 'loading more', 'load more failed'].includes(state);
    return {
      tasks,
      isLoading: state === 'loading',
      isError: state === 'error',
      isEmpty: state === 'empty',
      hasItems: listed,
      isLoadingMore: state === 'loading more',
      isMoreFailed: state === 'load more failed'
    };
  }
}
</script>
</body>
</html>
