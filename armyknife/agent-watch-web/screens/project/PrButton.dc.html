<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>PR button with merge state mark</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<button type="button" aria-haspopup="dialog" aria-expanded="{{openStr}}" aria-label="{{aria}}" title="{{aria}}" style="position: relative; width: {{w}}; height: {{h}}; box-sizing: border-box; display: {{btnDisplay}}; place-items: center; align-items: center; gap: 5px; padding: {{btnPad}}; border: 1px solid {{border}}; background: {{bg}}; color: #fafafa">
<svg width="{{icon}}" height="{{icon}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="18" r="3"></circle><circle cx="6" cy="6" r="3"></circle><path d="M13 6h3a2 2 0 0 1 2 2v7"></path><line x1="6" x2="6" y1="9" y2="21"></line></svg>
<sc-if value="{{isDot}}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="position: absolute; top: {{dotAt}}; right: {{dotAt}}; width: {{dot}}; height: {{dot}}; background: {{dotColor}}"></span></sc-if>
<sc-if value="{{isSpin}}" hint-placeholder-val="{{ false }}"><svg width="{{mark}}" height="{{mark}}" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="3.5" stroke-linecap="round" aria-hidden="true" style="position: {{markPos}}; top: {{markAt}}; right: {{markAt}}; padding: {{markPad}}; border-radius: 50%; background: {{markBg}}"><circle cx="12" cy="12" r="9" stroke="#3f3f46"></circle><path d="M21 12a9 9 0 0 0-9-9"></path></svg></sc-if>
<sc-if value="{{isFail}}" hint-placeholder-val="{{ false }}"><svg width="{{mark}}" height="{{mark}}" viewBox="0 0 24 24" fill="#f87171" stroke="#0a0a0a" stroke-width="3" stroke-linecap="round" aria-hidden="true" style="position: {{markPos}}; top: {{markAt}}; right: {{markAt}}; padding: {{markPad}}; border-radius: 50%; background: {{markBg}}"><circle cx="12" cy="12" r="11" stroke="none"></circle><line x1="12" x2="12" y1="6.5" y2="13"></line><line x1="12" x2="12.01" y1="17.5" y2="17.5"></line></svg></sc-if>
<span aria-hidden="true" style="position: {{markPos}}; right: {{countR}}; bottom: {{countB}}; font-family: 'JetBrains Mono', monospace; font-size: {{countFs}}; line-height: 1; color: #a1a1aa">{{count}}</span>
</button>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"badge":{"editor":"enum","options":["passed","running","failing","merging","mergeFailed","none"],"default":"passed"},"phone":{"editor":"boolean","default":false},"open":{"editor":"boolean","default":false},"count":{"editor":"int","default":1},"aria":{"editor":null},"$preview":{"width":44,"height":44}}'>
class Component extends DCLogic {
  renderVals() {
    // badge: passed / running / failing = this branch's PR CI; merging / mergeFailed = a merge of one of the session's PRs; none = nothing left to merge (merged).
    const b = this.props.badge ?? 'passed';
    const phone = this.props.phone ?? false;
    const open = this.props.open ?? false;
    const fail = b === 'mergeFailed';
    // Desktop: a corner mark is too small at 30×26, so merge marks sit after the icon and widen the button.
    const inline = !phone && (b === 'merging' || fail);
    return {
      isDot: b === 'passed' || b === 'running' || b === 'failing',
      dotColor: { passed: '#4ade80', running: '#fbbf24', failing: '#f87171' }[b] ?? '#4ade80',
      isSpin: b === 'merging', isFail: fail,
      aria: this.props.aria ?? 'PR #2050, open, CI passed',
      openStr: open ? 'true' : 'false',
      border: fail ? '#f87171' : open ? '#a1a1aa' : phone ? '#3f3f46' : '#2a2a2a',
      bg: open ? '#262626' : 'transparent',
      count: this.props.count ?? 1,
      w: inline ? 'auto' : phone ? '44px' : '30px', h: phone ? '44px' : '26px', icon: phone ? '18' : '14',
      btnDisplay: inline ? 'inline-flex' : 'grid', btnPad: inline ? '0 7px' : '0',
      markPos: inline ? 'static' : 'absolute',
      dot: phone ? '7px' : '5px', dotAt: phone ? '5px' : '3px',
      mark: inline ? '13' : '15',
      markAt: inline ? 'auto' : '2px',
      markBg: inline ? 'transparent' : '#0a0a0a', markPad: inline ? '0' : '1px',
      countR: phone ? '3px' : '2px', countB: phone ? '2px' : '1px', countFs: phone ? '10px' : '9px'
    };
  }
}
</script>
</body>
</html>
