<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Delete task dialog</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="position: relative; width: 1440px; height: 900px; overflow: hidden; background: #0a0a0a; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif">
<dc-import name="TaskDetail" height="{{h}}" hint-size="1440px,900px"></dc-import>
<div style="position: absolute; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px)">
<div role="dialog" aria-modal="true" aria-labelledby="delete-task-title" style="position: relative; width: 384px; box-sizing: border-box; display: grid; gap: 16px; padding: 16px; background: #0a0a0a; box-shadow: 0 0 0 1px rgba(250,250,250,0.1); color: #fafafa; font-size: 14px; line-height: 20px">
<div style="display: grid; gap: 8px">
<h2 id="delete-task-title" style="margin: 0; font-size: 16px; line-height: 1; font-weight: 500">Delete task</h2>
<p style="margin: 0; color: #71717a">{{description}}</p>
</div>
<div style="display: flex; justify-content: flex-end; gap: 8px; margin: 0 -16px -16px; padding: 16px; border-top: 1px solid #2a2a2a; background: rgba(20,20,20,0.5)">
<button type="button" style="height: 32px; padding: 0 10px; border: 1px solid #2a2a2a; background: #0a0a0a; color: #fafafa; font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 500">Cancel</button>
<button type="button" style="height: 32px; padding: 0 10px; border: 1px solid #2a2a2a; background: transparent; color: #a1a1aa; font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 500">Delete</button>
</div>
<button type="button" aria-label="Close" style="position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; display: grid; place-items: center; padding: 0; border: 0; background: transparent; color: #fafafa"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"parent":{"editor":"boolean","default":true},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const parent = this.props.parent ?? true;
    const subtasks = parent
      ? 'Its subtasks are kept and moved under its parent.'
      : 'Its subtasks are kept and become top-level tasks.';
    return {
      h: 900,
      description: 'Are you sure you want to delete #128 "ログイン後に元のページへ戻らない"? ' + subtasks + ' This action cannot be undone.',
    };
  }
}
</script>
</body>
</html>
