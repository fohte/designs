<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Q2: one row per PR</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: {{w}}; height: {{h}}; display: flex; align-items: flex-start; gap: 24px; background: #0a0a0a; color: #a1a1aa; font-family: 'Helvetica Neue', Arial, 'Hiragino Sans', sans-serif; font-size: 12.5px">
<section style="width: 880px; flex: none; display: flex; flex-direction: column; gap: 16px"><h2 style="margin: 0; height: 20px; font-size: 12.5px; font-weight: 700">PC · 8 つとも Ready to merge</h2><div style="height: 900px; overflow: hidden"><dc-import name="Conversation" variant="question" feed="{{ full }}" badge="passed" pr-count="{{ 8 }}" hint-size="880px,900px"></dc-import></div></section>
<section style="width: 390px; flex: none; display: flex; flex-direction: column; gap: 16px"><h2 style="margin: 0; height: 20px; font-size: 12.5px; font-weight: 700">iPhone · 8 つとも Ready to merge</h2><div style="height: 844px; overflow: hidden"><dc-import name="PhoneChat" h="844px" state="review" feed="{{ full }}" badge="passed" pr-count="{{ 8 }}" hint-size="390px,844px"></dc-import></div></section>
<div style="flex: none; display: grid; grid-template-columns: repeat({{cols}}, 1126px); gap: 32px 32px; align-items: start">
<sc-for list="{{states}}" as="s" hint-placeholder-count="2">
<section style="display: flex; flex-direction: column; gap: 10px"><h2 style="margin: 0; font-size: 12.5px; font-weight: 700">{{s.name}}</h2>
<div style="display: flex; align-items: flex-start; gap: 16px">
<div style="width: 720px; flex: none; box-sizing: border-box; padding: 16px 24px; border: 1px solid #2a2a2a"><dc-import name="MergeFeed" items="{{ s.items }}" hint-size="100%,200px"></dc-import></div>
<div style="width: 390px; flex: none; box-sizing: border-box; padding: 16px; border: 1px solid #2a2a2a"><dc-import name="MergeFeed" items="{{ s.items }}" phone="{{ true }}" hint-size="100%,240px"></dc-import></div>
</div>
</section>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":3602,"height":1300}}'>
class Component extends DCLogic {
  renderVals() {
    const reason = 'Base branch was modified. Retry to merge again';
    const t = ['再送キューの上限を設定に出す', '再送の待ち時間を指数的に伸ばす', '失敗した通知をログに残す', '通知の送信先を設定で切り替える', '再送のテストを足す', '古い再送ジョブを消す', '配信メトリクスを記録する', '再送の手順書を更新する'];
    const rows = (st) => t.map((title, i) => ({ entry: { framed: true, num: 2051 + i, title, state: st[i] ?? 'ready', note: st[i] === 'failed' ? reason : '' } }));
    const say = { say: '8 つの PR に分けました。どれも CI が通り、マージできます。順番の依存はありません。' };
    const full = [
      { you: '通知まわりの直しを PR に分けて出して。', time: '09:40' },
      { say: '再送、ログ、送信先、メトリクス、手順書の 5 つに分けて進めます。' },
      { tools: 'Edit ×14 · Shell ×16' },
      say, ...rows([])
    ];
    const states = [
      { name: 'Merged / Merging… / Queued / Merge failed が混ざる', items: [say, ...rows(['merged', 'merged', 'merging', 'queued', 'failed'])] },
      { name: '8 つともマージした', items: [say, ...rows(Array(8).fill('merged'))] }
    ];
    return { full, states, cols: 2, w: '3602px', h: '1300px' };
  }
}
</script>
</body>
</html>
