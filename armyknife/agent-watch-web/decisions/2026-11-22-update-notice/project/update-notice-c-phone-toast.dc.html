<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>C: phone, with a toast</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; background: #0a0a0a">
<dc-import name="PhoneChat" state="question" draft="{{ true }}" update="card" toasts="{{ toasts }}" hint-size="390px,844px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { toasts: [{ result: 'merged', pr: 64, session: '再送キューの上限を設定に出す' }] };
  }
}
</script>
</body>
</html>
