<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Activity button</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="display: flex; width: 100%; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; line-height: 1.55">
<button type="button" aria-haspopup="dialog" aria-expanded="{{openStr}}" aria-label="Activity, {{aria}}" style="flex: 1; height: {{h}}; display: flex; align-items: center; gap: 8px; padding: {{pad}}; border: {{border}}; background: {{bg}}; color: {{labelColor}}; font-family: inherit; font-size: {{fs}}; text-align: left"><svg width="{{icon}}" height="{{icon}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"></path></svg><span style="flex: 1">Activity</span><span style="display: inline-flex; align-items: center; gap: 5px; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: {{color}}"><sc-if value="{{running}}" hint-placeholder-val="{{ false }}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg></sc-if>{{count}}</span></button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"activity":{"editor":null},"form":{"editor":"enum","options":["desktop","drawer"],"default":"desktop"},"open":{"editor":"boolean","default":false},"$preview":{"width":224,"height":44}}'>
class Component extends DCLogic {
  renderVals() {
    // activity: { count, tone: 'running' | 'failure' | 'idle' | 'empty' }. empty: no actions yet; the label is muted and count may be '' (no count) or '0'. desktop: the nav entry. drawer: the same entry in the phone navigation drawer, 44px tall to tap.
    const a = this.props.activity ?? { count: '2', tone: 'running' };
    const drawer = (this.props.form ?? 'desktop') === 'drawer';
    const open = this.props.open ?? false;
    return {
      h: drawer ? '44px' : '32px', pad: drawer ? '0 4px' : '0 8px', fs: drawer ? '14px' : '13px', icon: drawer ? '16' : '14',
      count: a.count ?? '', running: a.tone === 'running',
      color: { running: '#60a5fa', failure: '#f87171' }[a.tone] ?? '#8b8b94',
      labelColor: a.tone === 'empty' ? '#8b8b94' : '#d4d4d8',
      aria: a.tone === 'empty' ? 'no actions yet' : a.count ? a.count + ' ' + (a.tone === 'failure' ? 'failed' : 'running') : 'no new results',
      openStr: open ? 'true' : 'false',
      border: drawer ? '0' : '1px solid ' + (open ? '#a1a1aa' : '#2a2a2a'),
      bg: open ? '#262626' : 'transparent'
    };
  }
}
</script>
</body>
</html>
