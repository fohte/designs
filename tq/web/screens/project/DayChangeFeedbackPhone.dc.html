<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Day view on a phone, change feedback after moving a block</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0a0a0a; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif">
<dc-import name="DayPhoneCalendar" hint-size="390px,844px"></dc-import>
<div role="status" style="position: absolute; z-index: 20; top: 586px; {{place}}; display: flex; align-items: center; gap: 8px; padding: 6px 12px; border: 1px solid #2a2a2a; background: #141414; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1); white-space: nowrap; font-family: 'JetBrains Mono', 'IBM Plex Mono', monospace; font-size: 12px; line-height: 16px; color: #71717a"><sc-if value="{{ok}}" hint-placeholder-val="{{ true }}"><span>Moved</span><button type="button" style="padding: 0; border: 0; background: transparent; color: #71717a; font: inherit">Undo</button></sc-if><sc-if value="{{failed}}" hint-placeholder-val="{{ false }}"><span style="color: #ef4444">Couldn't save — reverted to the original time</span></sc-if></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"saveFailed":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const failed = this.props.saveFailed === true || String(this.props.saveFailed) === 'true';
    // The error line is wider than the space right of the moved block, so the popup shifts left to stay on screen.
    return { ok: !failed, failed, place: failed ? 'right: 8px' : 'left: 58px' };
  }
}
</script>
</body>
</html>
