<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Draft review, full width</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;family=Noto+Sans+JP:wght@400;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<section aria-label="Draft body, full width" style="width: 100%; height: 900px; min-width: 0; box-sizing: border-box; display: flex; flex-direction: column; background: #0a0a0a; color: #fafafa; font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', sans-serif; font-size: 13px; line-height: 1.55">

<header style="flex: none; height: 48px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; padding: 0 16px 0 8px; border-bottom: 1px solid #2a2a2a">
<button type="button" style="height: 30px; display: inline-flex; align-items: center; gap: 4px; padding: 0 10px 0 4px; border: 0; background: transparent; color: #d4d4d8; font-family: inherit; font-size: 12.5px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>Conversation</button>
<span style="min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #a1a1aa; font-size: 12.5px">配信チェックの仕上げ</span>
<span style="flex: none; color: #71717a">·</span>
<strong style="flex: none; font-size: 13px">Draft</strong>
<kbd style="margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8b8b94">Esc Back</kbd>
</header>

<div style="flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr)">
<section aria-label="Markdown" style="min-width: 0; display: flex; flex-direction: column; border-right: 1px solid #1a1a1a">
<h3 style="flex: none; margin: 0; height: 34px; display: flex; align-items: center; padding: 0 20px; color: #8b8b94; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em">MARKDOWN</h3>
<pre aria-label="Markdown body" style="flex: 1; min-height: 0; margin: 0; overflow: hidden; padding: 4px 20px 20px; background: #0a0a0a; color: #d4d4d8; font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere">{{d.raw}}</pre>
</section>
<section aria-label="Preview" style="min-width: 0; display: flex; flex-direction: column; background: #0c0c0c">
<h3 style="flex: none; margin: 0; height: 34px; display: flex; align-items: center; padding: 0 24px; color: #8b8b94; font-size: 11.5px; font-weight: 700; letter-spacing: 0.04em">PREVIEW</h3>
<div style="flex: 1; min-height: 0; overflow: hidden; padding: 4px 24px 20px; color: #d4d4d8; font-size: 14px">
<sc-for list="{{d.blocks}}" as="b" hint-placeholder-count="4">
<sc-if value="{{b.h}}" hint-placeholder-val="{{ false }}"><h4 style="margin: 0 0 6px; color: #fafafa; font-size: 15px">{{b.text}}</h4></sc-if>
<sc-if value="{{b.p}}" hint-placeholder-val="{{ true }}"><p style="margin: 0 0 12px">{{b.text}}</p></sc-if>
<sc-if value="{{b.li}}" hint-placeholder-val="{{ false }}"><p style="margin: 0 0 4px; padding-left: 14px; text-indent: -12px">· {{b.text}}</p></sc-if>
<sc-if value="{{b.quote}}" hint-placeholder-val="{{ false }}"><p style="margin: 0 0 12px; padding-left: 10px; border-left: 2px solid #3f3f46; color: #a1a1aa">{{b.text}}</p></sc-if>
</sc-for>
</div>
</section>
</div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"doc":{"editor":"int","min":0,"max":3,"default":0},"$preview":{"width":800,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    // Same drafts, in the same order, as DraftPanel.
    const D = [
      ['再現手順を足します。\n\n1. 送信先を応答の遅いサーバーにする\n2. 通知を 10 件続けて送る\n3. 4 件目から届かない', [['p', '再現手順を足します。'], ['li', '1. 送信先を応答の遅いサーバーにする'], ['li', '2. 通知を 10 件続けて送る'], ['li', '3. 4 件目から届かない']]],
      ['## Why\n\n再送の上限が 3 回で固定されていて、応答の遅い送信先では足りない。\n\n## What\n\n- 上限を `RETRY_LIMIT` で変えられるようにする\n- 既定値は 3 回のまま', [['h', 'Why'], ['p', '再送の上限が 3 回で固定されていて、応答の遅い送信先では足りない。'], ['h', 'What'], ['li', '上限を RETRY_LIMIT で変えられるようにする'], ['li', '既定値は 3 回のまま']]],
      ['### src/preflight.ts:42\n\n> この判定は null も通しますか?\n\n通しません。手前で弾いています。\n\n### src/preflight.ts:57\n\n> 失敗したときのログはどこに出ますか?\n\n送信ログに理由と一緒に出します。', [['h', 'src/preflight.ts:42'], ['quote', 'この判定は null も通しますか?'], ['p', '通しません。手前で弾いています。'], ['h', 'src/preflight.ts:57'], ['quote', '失敗したときのログはどこに出ますか?'], ['p', '送信ログに理由と一緒に出します。']]],
      ['# 再送の設計メモ\n\n- 上限は設定で変える\n- 待ち時間は倍ずつ伸ばす', [['h', '再送の設計メモ'], ['li', '上限は設定で変える'], ['li', '待ち時間は倍ずつ伸ばす']]]
    ];
    const [raw, blocks] = D[Math.min(3, Math.max(0, this.props.doc ?? 0))];
    return { d: { raw, blocks: blocks.map(([t, text]) => ({ h: t === 'h', p: t === 'p', li: t === 'li', quote: t === 'quote', text })) } };
  }
}
</script>
</body>
</html>
